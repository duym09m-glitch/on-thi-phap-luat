apterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Tư cách pháp nhân của doanh nghiệp chấm dứt khi nào?`,options:[`Khi doanh nghiệp hoàn tất thủ tục giải thể hoặc hoàn tất thủ tục phá sản và bị xóa tên trong Sổ đăng ký doanh nghiệp`,`Khi công ty bị tạm ngừng kinh doanh 3 tháng`,`Khi giám đốc bị bệnh phải nhập viện`,`Khi chuyển văn phòng làm việc sang địa điểm mới`],correctAnswer:0,explanation:`Doanh nghiệp chấm dứt tư cách pháp nhân kể từ ngày hoàn tất thủ tục giải thể, phá sản và Cơ quan đăng ký kinh doanh xóa tên doanh nghiệp trong Cơ sở dữ liệu quốc gia.`,legalReference:`Điều 208 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:456,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Nghĩa vụ của người quản lý doanh nghiệp (Giám đốc, thành viên HĐQT...) theo Luật Doanh nghiệp 2020 là:`,options:[`Thực hiện quyền và nghĩa vụ một cách trung thực, cẩn trọng, tốt nhất nhằm bảo đảm lợi ích hợp pháp tối đa của doanh nghiệp; trung thành với lợi ích của doanh nghiệp`,`Ưu tiên chuyển các hợp đồng béo bở về cho công ty riêng của gia đình mình`,`Được quyền sử dụng tài sản công ty chi tiêu cá nhân tùy thích`,`Không phải chịu bất kỳ trách nhiệm nào nếu công ty thua lỗ do mình biển thủ`],correctAnswer:0,explanation:`Điều 165 Luật Doanh nghiệp 2020 quy định trách nhiệm của người quản lý công ty: trung thực, cẩn trọng, trung thành với lợi ích công ty; không được lạm dụng chức vụ, tài sản công ty vì tư lợi cá nhân.`,legalReference:`Điều 165 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:457,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Doanh nghiệp có quyền tạm ngừng kinh doanh nhưng phải thông báo bằng văn bản cho Cơ quan đăng ký kinh doanh chậm nhất bao nhiêu ngày trước ngày tạm ngừng?`,options:[`Chậm nhất là 03 ngày làm việc trước ngày tạm ngừng kinh doanh`,`Chậm nhất là 30 ngày`,`Chậm nhất là 60 ngày`,`Không cần thông báo cứ tự ý đóng cửa`],correctAnswer:0,explanation:`Khoản 1 Điều 206 Luật Doanh nghiệp 2020: Doanh nghiệp phải thông báo bằng văn bản cho Cơ quan đăng ký kinh doanh chậm nhất là 03 ngày làm việc trước ngày tạm ngừng kinh doanh hoặc tiếp tục kinh doanh trước thời hạn đã thông báo.`,legalReference:`Điều 206 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:458,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Tỷ lệ sở hữu vốn tối đa của nhà đầu tư nước ngoài tại các doanh nghiệp hoạt động trong một số ngành nghề hạn chế tiếp cận thị trường do ai quy định?`,options:[`Theo quy định của Luật Đầu tư và các Điều ước quốc tế mà Việt Nam là thành viên`,`Do Giám đốc doanh nghiệp tự ý đưa ra con số`,`Mặc nhiên cố định là 10% cho mọi lĩnh vực`,`Do người mua hàng nước ngoài tự thỏa thuận`],correctAnswer:0,explanation:`Luật Đầu tư 2020 và các điều ước quốc tế về thương mại xác định điều kiện tiếp cận thị trường và tỷ lệ sở hữu vốn của nhà đầu tư nước ngoài trong từng ngành nghề có điều kiện.`,legalReference:`Luật Đầu tư 2020`,difficulty:`trung bình`},{id:459,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hành vi nào sau đây bị coi là hành vi Gian lận thương mại?`,options:[`Sản xuất, buôn bán hàng giả, hàng nhái, trốn lậu thuế, kinh doanh hàng cấm, gian lận đo lường đóng gói`,`Cải tiến mẫu mã bao bì thân thiện môi trường`,`Tặng quà khuyến mại cho khách hàng đúng quy định`,`Mở cửa hàng bán vào các ngày chủ nhật`],correctAnswer:0,explanation:`Gian lận thương mại là các hành vi cố ý dối trá, lừa dối trong hoạt động thương mại như buôn lậu, sản xuất buôn bán hàng giả, gian lận thuế, cân đo sai lệch để vụ lợi.`,legalReference:`Pháp luật về chống buôn lậu và gian lận thương mại`,difficulty:`dễ`},{id:460,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong hợp đồng dịch vụ logistics, thương nhân kinh doanh dịch vụ logistics có quyền cầm giữ và định đoạt hàng hóa khi nào?`,options:[`Khi khách hàng không thanh toán các khoản nợ đã đến hạn cho thương nhân kinh doanh dịch vụ logistics theo quy định tại Điều 239 Luật Thương mại 2005`,`Bất cứ lúc nào muốn chiếm đoạt tài sản`,`Khi khách hàng hỏi thông tin lộ trình di chuyển`,`Không bao giờ có quyền cầm giữ hàng hóa`],correctAnswer:0,explanation:`Điều 239 Luật Thương mại 2005: Thương nhân kinh doanh dịch vụ logistics có quyền cầm giữ số lượng hàng hoá nhất định và các chứng từ liên quan đến hàng hoá để đòi các khoản nợ đã đến hạn của khách hàng.`,legalReference:`Điều 239 Luật Thương mại 2005`,difficulty:`trung bình`},{id:461,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Nhượng quyền thương mại (Franchise) theo Điều 284 Luật Thương mại 2005 là hoạt động thương mại, theo đó bên nhượng quyền cho phép và yêu cầu bên nhận quyền:`,options:[`Tự mình tiến hành việc mua bán hàng hóa, cung ứng dịch vụ theo cách thức tổ chức kinh doanh do bên nhượng quyền quy định và được gắn với nhãn hiệu hàng hóa, tên thương mại, bí quyết kinh doanh của bên nhượng quyền`,`Chuyển giao quyền sở hữu toàn bộ công ty cho bên nhượng quyền`,`Bán cổ phần của mình cho chính phủ`,`Đóng cửa mọi chi nhánh kinh doanh truyền thống`],correctAnswer:0,explanation:`Điều 284 Luật Thương mại 2005 định nghĩa hoạt động nhượng quyền thương mại gắn liền với nhãn hiệu, hệ thống kinh doanh, khẩu hiệu kinh doanh và sự trợ giúp của bên nhượng quyền.`,legalReference:`Điều 284 Luật Thương mại 2005`,difficulty:`trung bình`},{id:462,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Điều kiện đối với Trọng tài viên thương mại theo Luật Trọng tài thương mại 2010 là:`,options:[`Có năng lực hành vi dân sự đầy đủ; có trình độ đại học và đã qua thực tế công tác theo ngành đã học từ 5 năm trở lên (hoặc chuyên gia có trình độ chuyên môn cao)`,`Bắt buộc phải là đại biểu Quốc hội`,`Bắt buộc phải là Thẩm phán Tòa án cấp cao`,`Không cần bằng cấp chuyên môn chỉ cần có uy tín trong gia đình`],correctAnswer:0,explanation:`Điều 20 Luật Trọng tài thương mại 2010 quy định tiêu chuẩn của Trọng tài viên: năng lực hành vi đầy đủ, tốt nghiệp đại học và có kinh nghiệm công tác từ 5 năm trở lên, có tư cách đạo đức tốt.`,legalReference:`Điều 20 Luật Trọng tài thương mại 2010`,difficulty:`trung bình`},{id:463,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Doanh nghiệp lâm vào tình trạng phá sản nhưng được áp dụng thủ tục Phục hồi hoạt động kinh doanh khi nào?`,options:[`Khi Nghị quyết của Hội nghị chủ nợ thông qua phương án phục hồi hoạt động kinh doanh và được Thẩm phán ra quyết định công nhận`,`Khi doanh nghiệp được ngân hàng cho vay thêm 1.000 tỷ đồng`,`Khi giám đốc tự mình cam kết trên mạng xã hội`,`Khi chủ nợ xóa sạch toàn bộ 100% nợ`],correctAnswer:0,explanation:`Điều 87 và 92 Luật Phá sản 2014 quy định thủ tục phục hồi hoạt động kinh doanh được thực hiện khi Hội nghị chủ nợ thông qua phương án phục hồi và được Tòa án ra quyết định công nhận.`,legalReference:`Điều 87 & 92 Luật Phá sản 2014`,difficulty:`trung bình`},{id:464,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Một cá nhân được quyền làm chủ sở hữu của bao nhiêu Doanh nghiệp tư nhân theo quy định của pháp luật?`,options:[`Chỉ được quyền thành lập 01 doanh nghiệp tư nhân`,`Được thành lập tối đa 05 doanh nghiệp tư nhân`,`Không giới hạn số lượng doanh nghiệp tư nhân`,`Chỉ được thành lập nếu có hai quốc tịch`],correctAnswer:0,explanation:`Khoản 3 Điều 188 Luật Doanh nghiệp 2020: "Mỗi cá nhân chỉ được quyền thành lập một doanh nghiệp tư nhân. Chủ doanh nghiệp tư nhân không được đồng thời là chủ hộ kinh doanh, thành viên hợp danh của công ty hợp danh".`,legalReference:`Khoản 3 Điều 188 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:465,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Chủ sở hữu Doanh nghiệp tư nhân có phải chịu trách nhiệm về các khoản nợ của doanh nghiệp bằng tài sản riêng của mình hay không?`,options:[`Có, phải chịu trách nhiệm vô hạn bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp`,`Không, chỉ chịu trách nhiệm trong phạm vi số vốn đăng ký ban đầu`,`Chỉ chịu trách nhiệm 50% khoản nợ`,`Nhà nước gánh chịu nợ thay cho chủ doanh nghiệp tư nhân`],correctAnswer:0,explanation:`Khoản 1 Điều 188 Luật Doanh nghiệp 2020 quy định chủ DNTN tự chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp (chế độ trách nhiệm tài sản vô hạn).`,legalReference:`Điều 188 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:466,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cổ phần của Công ty Cổ phần có thể chia thành những loại nào?`,options:[`Cổ phần phổ thông và Cổ phần ưu đãi (ưu đãi biểu quyết, ưu đãi cổ tức, ưu đãi hoàn lại, ưu đãi khác)`,`Chỉ duy nhất có cổ phần đặc biệt`,`Cổ phần cá nhân và Cổ phần gia tộc`,`Cổ phần ngân hàng và Cổ phần bảo hiểm`],correctAnswer:0,explanation:`Điều 114 Luật Doanh nghiệp 2020 quy định các loại cổ phần: Công ty cổ phần phải có cổ phần phổ thông; ngoài ra có thể có cổ phần ưu đãi (ưu đãi biểu quyết, ưu đãi cổ tức, ưu đãi hoàn lại...).`,legalReference:`Điều 114 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:467,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Công ty TNHH một thành viên có được quyền phát hành cổ phần để tăng vốn điều lệ không?`,options:[`Không được phát hành cổ phần (trừ trường hợp chuyển đổi thành công ty cổ phần)`,`Được tự do phát hành cổ phần niêm yết trên sàn chứng khoán`,`Được phát hành nếu có sự bảo lãnh của ngân hàng nhà nước`,`Được phát hành tối đa 1 triệu cổ phần`],correctAnswer:0,explanation:`Khoản 4 Điều 74 Luật Doanh nghiệp 2020: Công ty TNHH một thành viên không được phát hành cổ phần, trừ trường hợp để chuyển đổi thành công ty cổ phần.`,legalReference:`Khoản 4 Điều 74 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:468,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong hợp đồng thương mại, nếu các bên có thỏa thuận về "Phạt vi phạm" nhưng KHÔNG thỏa thuận về "Bồi thường thiệt hại" thì:`,options:[`Bên bị vi phạm chỉ có quyền yêu cầu phạt vi phạm, trừ trường hợp Luật Thương mại có quy định khác`,`Mặc nhiên được đòi bồi thường gấp đôi`,`Hợp đồng bị vô hiệu toàn bộ`,`Tòa án sẽ tự động xử phạt tù bên vi phạm`],correctAnswer:0,explanation:`Khoản 2 Điều 307 Luật Thương mại 2005: Trường hợp các bên có thoả thuận phạt vi phạm nhưng không có thoả thuận về bồi thường thiệt hại thì bên bị vi phạm chỉ có quyền yêu cầu phạt vi phạm, trừ trường hợp Luật này có quy định khác.`,legalReference:`Điều 307 Luật Thương mại 2005`,difficulty:`vận dụng`},{id:469,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Trách nhiệm hình sự là quan hệ pháp luật giữa ai với ai?`,options:[`Quan hệ pháp luật giữa Nhà nước (thông qua Tòa án, Viện kiểm sát...) với người phạm tội (hoặc pháp nhân thương mại phạm tội)`,`Quan hệ dân sự bình đẳng giữa người bị hại và thủ phạm`,`Quan hệ hợp đồng kinh tế giữa hai bên`,`Quan hệ giữa luật sư và bị cáo`],correctAnswer:0,explanation:`Trách nhiệm hình sự là trách nhiệm pháp lý nghiêm khắc nhất, thể hiện mối quan hệ quyền lực pháp lý đặc biệt giữa Nhà nước và người có hành vi phạm tội.`,legalReference:`Khái niệm Trách nhiệm hình sự`,difficulty:`dễ`},{id:470,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Vô ý làm chết người (Điều 128 Bộ luật Hình sự 2015) khác với Tội Giết người ở yếu tố cấu thành nào?`,options:[`Mặt chủ quan: Tội vô ý làm chết người thực hiện với lỗi vô ý (vô ý do cẩu thả hoặc quá tự tin); còn Tội giết người thực hiện với lỗi cố ý (trực tiếp hoặc gián tiếp)`,`Khách thể bị xâm phạm hoàn toàn khác nhau`,`Hậu quả chết người khác nhau`,`Độ tuổi chịu trách nhiệm hình sự`],correctAnswer:0,explanation:`Điểm phân biệt bản chất giữa Tội giết người (Điều 123) và Vô ý làm chết người (Điều 128) là hình thức LỖI ở Mặt chủ quan (Cố ý đối với Tội giết người và Vô ý đối với Tội vô ý làm chết người).`,legalReference:`Điều 123 & 128 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:471,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Người thực hiện hành vi nguy hiểm cho xã hội trong tình trạng mất khả năng nhận thức hoặc điều khiển hành vi do DÙNG RƯỢU, BIA HOẶC CHẤT KÍCH THÍCH MẠNH KHÁC thì:`,options:[`VẪN PHẢI CHỊU TRÁCH NHIỆM HÌNH SỰ theo quy định tại Điều 13 Bộ luật Hình sự 2015`,`Được miễn hoàn toàn trách nhiệm hình sự`,`Chỉ bị phạt cảnh cáo nhẹ`,`Được coi là mắc bệnh tâm thần loại trừ trách nhiệm hình sự`],correctAnswer:0,explanation:`Điều 13 BLHS 2015 khẳng định dứt khoát: "Người phạm tội trong tình trạng mất khả năng nhận thức hoặc khả năng điều khiển hành vi của mình do dùng rượu, bia hoặc chất kích thích mạnh khác, thì vẫn phải chịu trách nhiệm hình sự".`,legalReference:`Điều 13 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:472,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi Không tố giác tội phạm (Điều 19 Bộ luật Hình sự 2015) là hành vi:`,options:[`Người nào biết rõ tội phạm đang được chuẩn bị, đang được thực hiện hoặc đã được thực hiện mà không tố giác với cơ quan có thẩm quyền`,`Người đứng ra làm chứng tại tòa án`,`Người hỗ trợ đưa nạn nhân đi cấp cứu`,`Người viết đơn tố cáo gửi viện kiểm sát`],correctAnswer:0,explanation:`Khoản 1 Điều 19 BLHS 2015: Người nào biết rõ tội phạm đang được chuẩn bị, đang được thực hiện hoặc đã được thực hiện mà không tố giác thì phải chịu trách nhiệm hình sự về tội không tố giác tội phạm trong những trường hợp quy định tại Điều 390.`,legalReference:`Điều 19 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:473,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Trường hợp người không tố giác là ông, bà, cha, mẹ, con, cháu, anh chị em ruột, vợ hoặc chồng của người phạm tội thì KHÔNG PHẢI chịu trách nhiệm hình sự, TRỪ trường hợp:`,options:[`Không tố giác các tội xâm phạm an ninh quốc gia hoặc tội phạm đặc biệt nghiêm trọng khác quy định tại Điều 389 của BLHS`,`Mọi tội phạm trộm cắp vặt`,`Mọi trường hợp đều được miễn trừ tuyệt đối không có ngoại lệ`,`Chỉ khi người thân bị kết án tù chung thân`],correctAnswer:0,explanation:`Khoản 2 Điều 19 BLHS 2015: Người không tố giác là ông bà, cha mẹ, con cháu, anh chị em ruột, vợ chồng không phải chịu TNHS, trừ trường hợp không tố giác các tội quy định tại Chương XIII hoặc tội đặc biệt nghiêm trọng khác.`,legalReference:`Khoản 2 Điều 19 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:474,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình phạt "Tử hình" chỉ được áp dụng đối với ai?`,options:[`Người phạm tội đặc biệt nghiêm trọng thuộc một trong các nhóm tội xâm phạm an ninh quốc gia, xâm phạm tính mạng con người, các tội phạm về ma túy, tham nhũng và một số tội đặc biệt nghiêm trọng khác do BLHS quy định`,`Người có hành vi vi phạm luật giao thông đường bộ`,`Người trộm cắp tài sản trị giá 2 triệu đồng`,`Người không chấp hành nội quy lao động công ty`],correctAnswer:0,explanation:`Khoản 1 Điều 40 BLHS 2015: Tử hình là hình phạt đặc biệt chỉ áp dụng đối với người phạm tội đặc biệt nghiêm trọng thuộc một số nhóm tội liệt kê.`,legalReference:`Điều 40 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:475,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Rửa tiền theo Điều 324 Bộ luật Hình sự 2015 là hành vi:`,options:[`Tham gia trực tiếp hoặc gián tiếp vào giao dịch tài chính, ngân hàng nhằm hợp thức hóa nguồn gốc của tiền, tài sản do mình phạm tội mà có hoặc biết hay có cơ sở để biết là do người khác phạm tội mà có`,`Rửa tiền giấy bị dính mực bằng hóa chất`,`Đổi tiền lẻ lấy tiền chẵn tại ngân hàng`,`Thanh toán tiền mua hàng bằng thẻ tín dụng`],correctAnswer:0,explanation:`Điều 324 BLHS 2015: Tội rửa tiền là hành vi tham gia giao dịch tài chính, ngân hàng hoặc các giao dịch khác nhằm che giấu nguồn gốc bất hợp pháp của tiền, tài sản do phạm tội mà có.`,legalReference:`Điều 324 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:476,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi "Nhũng nhiễu" theo Luật Phòng, chống tham nhũng 2018 là hành vi:`,options:[`Hành vi cửa quyền, hách dịch, đòi hỏi, gây khó khăn, phiền hà của người có chức vụ, quyền hạn trong khi thực hiện nhiệm vụ, công vụ`,`Thái độ lịch sự hòa nhã hướng dẫn nhân dân`,`Giải quyết thủ tục hành chính sớm trước hạn`,`Từ chối nhận phong bì của công dân`],correctAnswer:0,explanation:`Khoản 3 Điều 3 Luật PCTN 2018 định nghĩa: Nhũng nhiễu là hành vi cửa quyền, hách dịch, đòi hỏi, gây khó khăn, phiền hà của người có chức vụ, quyền hạn trong khi thực hiện nhiệm vụ, công vụ.`,legalReference:`Điều 3 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:477,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Quy tắc ứng xử của người có chức vụ, quyền hạn trong cơ quan, tổ chức theo Luật PCTN 2018 NGHIÊM CẤM hành vi nào?`,options:[`Sử dụng tài chính công, tài sản công trái pháp luật; thành lập, tham gia quản lý, điều hành doanh nghiệp tư nhân, công ty TNHH... nếu thuộc trường hợp luật cấm; can thiệp trái pháp luật vào hoạt động thanh tra, kiểm tra, kiểm toán`,`Tham gia các hoạt động thiện nguyện vì cộng đồng`,`Học tập nâng cao trình độ chuyên môn sau giờ làm việc`,`Mua sách báo để đọc mở mang kiến thức`],correctAnswer:0,explanation:`Điều 20 Luật PCTN 2018 quy định các điều cấm trong quy tắc ứng xử của người có chức vụ, quyền hạn nhằm phòng ngừa tham nhũng và xung đột lợi ích.`,legalReference:`Điều 20 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:478,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Xung đột lợi ích theo Luật Phòng, chống tham nhũng 2018 là tình huống mà trong đó:`,options:[`Lợi ích của người có chức vụ, quyền hạn hoặc người thân thích của họ tác động hoặc sẽ tác động không đúng đắn đến việc thực hiện nhiệm vụ, công vụ`,`Hai người bạn cùng thích một chiếc xe đạp`,`Doanh nghiệp cạnh tranh hạ giá sản phẩm`,`Các cổ đông tranh cãi trong đại hội cổ đông`],correctAnswer:0,explanation:`Khoản 9 Điều 3 Luật PCTN 2018: Xung đột lợi ích là tình huống mà trong đó lợi ích của người có chức vụ, quyền hạn hoặc người thân thích của họ tác động hoặc sẽ tác động không đúng đắn đến việc thực hiện nhiệm vụ, công vụ.`,legalReference:`Điều 3 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:479,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Người có hành vi tham nhũng bị kết án về tội phạm tham nhũng do cố ý thì:`,options:[`Đương nhiên bị buộc thôi việc (đối với cán bộ, công chức) kể từ ngày bản án, quyết định có hiệu lực pháp luật`,`Vẫn tiếp tục giữ nguyên chức vụ lãnh đạo`,`Được nâng lương trước hạn`,`Chỉ bị điều chuyển sang phòng ban khác`],correctAnswer:0,explanation:`Khoản 2 Điều 92 Luật PCTN 2018 quy định: Cán bộ, công chức, viên chức bị kết án về tội phạm tham nhũng mà bản án đã có hiệu lực thì đương nhiên bị buộc thôi việc.`,legalReference:`Điều 92 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:480,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Đưa hối lộ (Điều 364 BLHS) và Tội Nhận hối lộ (Điều 354 BLHS) có mối quan hệ như thế nào?`,options:[`Là hai tội phạm độc lập; tội nhận hối lộ là tội phạm về chức vụ chỉ có chủ thể là người có chức vụ quyền hạn; tội đưa hối lộ chủ thể là bất kỳ cá nhân nào có năng lực TNHS`,`Bắt buộc phải xét xử chung và có cùng mức hình phạt như nhau`,`Nếu người đưa hối lộ được tha thì người nhận hối lộ cũng tự động được tha`,`Cả hai tội đều là tội phạm không có động cơ vụ lợi`],correctAnswer:0,explanation:`Tội Nhận hối lộ là tội phạm tham nhũng (chủ thể đặc biệt là người có chức vụ quyền hạn). Tội Đưa hối lộ là tội phạm xâm phạm hoạt động tư pháp/quản lý nhà nước với chủ thể thông thường.`,legalReference:`Điều 354 & 364 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:481,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Biện pháp "Tịch thu tài sản" (Điều 45 BLHS 2015) là việc:`,options:[`Tước một phần hoặc toàn bộ tài sản thuộc sở hữu của người bị kết án để nộp vào ngân sách nhà nước, áp dụng đối với người bị kết án về tội nghiêm trọng, rất nghiêm trọng hoặc đặc biệt nghiêm trọng`,`Thu giữ tạm thời xe máy vi phạm giao thông`,`Thu tiền phạt vi phạm hợp đồng xây dựng`,`Cầm cố tài sản vay tiền`],correctAnswer:0,explanation:`Điều 45 BLHS 2015: Tịch thu tài sản là việc tước một phần hoặc toàn bộ tài sản thuộc sở hữu của người bị kết án để nộp vào ngân sách nhà nước, chỉ áp dụng đối với người bị kết án về tội phạm nghiêm trọng, rất nghiêm trọng hoặc đặc biệt nghiêm trọng.`,legalReference:`Điều 45 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:482,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Thời hiệu truy cứu trách nhiệm hình sự đối với Tội phạm đặc biệt nghiêm trọng là bao nhiêu năm?`,options:[`20 năm`,`05 năm`,`10 năm`,`15 năm`],correctAnswer:0,explanation:`Điểm d Khoản 2 Điều 27 BLHS 2015: Thời hiệu truy cứu trách nhiệm hình sự là 20 năm đối với các tội phạm đặc biệt nghiêm trọng (riêng một số tội xâm phạm an ninh quốc gia, tội ác chiến tranh thì không áp dụng thời hiệu).`,legalReference:`Điều 27 & Điều 28 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:483,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Mục đích của việc đăng ký kết hôn tại cơ quan nhà nước có thẩm quyền là gì?`,options:[`Nhằm xác lập quan hệ vợ chồng hợp pháp được Nhà nước và pháp luật công nhận, bảo vệ`,`Để thông báo cho bạn bè trên mạng xã hội`,`Để đủ điều kiện vay vốn tín dụng đen`,`Để được miễn nghĩa vụ quân sự`],correctAnswer:0,explanation:`Điều 9 Luật HNGĐ 2014 quy định nam nữ kết hôn phải đăng ký kết hôn tại cơ quan có thẩm quyền; việc kết hôn không đăng ký không có giá trị pháp lý làm phát sinh quan hệ vợ chồng trước pháp luật.`,legalReference:`Điều 9 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:484,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Hành vi nào sau đây là vi phạm nguyên tắc một vợ một chồng theo Luật HNGĐ 2014?`,options:[`Người đang có vợ, có chồng mà kết hôn hoặc chung sống như vợ chồng với người khác hoặc người chưa có vợ, chưa có chồng mà kết hôn hoặc chung sống như vợ chồng với người đang có chồng, có vợ`,`Hai người độc thân tìm hiểu nhau để tiến tới hôn nhân`,`Người đã ly hôn hợp pháp kết hôn với người khác`,`Vợ chồng đi làm ăn xa nhau`],correctAnswer:0,explanation:`Điểm c Khoản 2 Điều 5 Luật HNGĐ 2014 nghiêm cấm hành vi người đang có vợ, có chồng mà kết hôn hoặc chung sống như vợ chồng với người khác.`,legalReference:`Điều 5 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:485,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Nơi cư trú của vợ chồng được xác định như thế nào?`,options:[`Do vợ chồng tự do lựa chọn thỏa thuận, không bị ràng buộc bởi phong tục, tập quán, địa giới hành chính`,`Bắt buộc người vợ phải theo về cư trú tại nhà chồng`,`Bắt buộc người chồng phải ở rể nhà vợ`,`Do cha mẹ chồng chỉ định địa điểm`],correctAnswer:0,explanation:`Điều 20 Luật HNGĐ 2014 quy định nơi cư trú của vợ chồng do vợ chồng thoả thuận, không bị ràng buộc bởi phong tục, tập quán, địa giới hành chính.`,legalReference:`Điều 20 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:486,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Tài sản chung của vợ chồng mà pháp luật quy định phải đăng ký quyền sở hữu, quyền sử dụng thì giấy chứng nhận phải ghi tên của ai?`,options:[`Phải ghi cả họ, tên vợ và họ, tên chồng, trừ trường hợp vợ chồng có thỏa thuận khác`,`Chỉ được ghi tên người chồng`,`Chỉ được ghi tên người vợ`,`Ghi tên ông bà tổ tiên`],correctAnswer:0,explanation:`Khoản 1 Điều 34 Luật HNGĐ 2014: Trong trường hợp tài sản thuộc sở hữu chung của vợ chồng mà pháp luật quy định phải đăng ký quyền sở hữu, quyền sử dụng thì giấy chứng nhận phải ghi cả họ, tên vợ và họ, tên chồng, trừ thỏa thuận khác.`,legalReference:`Điều 34 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:487,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Trong trường hợp có tranh chấp mà không có chứng cứ chứng minh tài sản đang có tranh chấp là tài sản riêng của mỗi bên thì tài sản đó được coi là:`,options:[`Tài sản chung của vợ chồng`,`Tài sản thuộc về người đang thực tế quản lý`,`Tài sản vô chủ sung công quỹ`,`Tài sản của cha mẹ hai bên`],correctAnswer:0,explanation:`Khoản 3 Điều 33 Luật HNGĐ 2014: "Trong trường hợp không có căn cứ để chứng minh tài sản mà vợ, chồng đang có tranh chấp là tài sản riêng của mỗi bên thì tài sản đó được coi là tài sản chung".`,legalReference:`Khoản 3 Điều 33 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:488,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Quyền thừa kế tài sản giữa vợ và chồng khi một bên chết được bảo đảm như thế nào kể cả khi hai bên đang xin ly hôn?`,options:[`Khi một bên chết mà bản án ly hôn của Tòa án chưa có hiệu lực pháp luật thì người còn sống vẫn được thừa kế di sản của người chết theo quy định của pháp luật`,`Mất hoàn toàn quyền thừa kế ngay khi nộp đơn ly hôn`,`Chỉ được hưởng 1% di sản`,`Tài sản tự động chia đều cho hàng xóm`],correctAnswer:0,explanation:`Khoản 2 Điều 655 BLDS 2015: Vợ, chồng đã nộp đơn ly hôn nhưng bản án chưa có hiệu lực pháp luật hoặc đang tiến hành ly hôn mà một bên chết thì người còn sống vẫn được thừa kế di sản.`,legalReference:`Điều 655 Bộ luật Dân sự 2015 & Luật HNGĐ`,difficulty:`vận dụng`},{id:489,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Khi ly hôn, bên có khó khăn về chỗ ở có quyền lưu cư trong bao lâu kể từ ngày hôn nhân chấm dứt?`,options:[`Được quyền lưu cư trong thời hạn 06 tháng kể từ ngày quan hệ hôn nhân chấm dứt (trừ trường hợp các bên có thỏa thuận khác hoặc việc lưu cư không còn phù hợp)`,`Được lưu cư suốt đời`,`Chỉ được ở tối đa 24 giờ`,`Bị đuổi ra khỏi nhà ngay lập tức`],correctAnswer:0,explanation:`Điều 63 Luật HNGĐ 2014: Nhà ở thuộc sở hữu riêng của một bên mà vợ, chồng có khó khăn về chỗ ở thì được quyền lưu cư trong thời hạn 06 tháng kể từ ngày quan hệ hôn nhân chấm dứt, trừ thỏa thuận khác.`,legalReference:`Điều 63 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:490,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Ai có quyền yêu cầu thay đổi người trực tiếp nuôi con sau khi ly hôn?`,options:[`Cha, mẹ; hoặc người thân thích, cơ quan quản lý gia đình, Hội liên hiệp phụ nữ khi người trực tiếp nuôi con không còn đủ điều kiện chăm sóc giáo dục con`,`Bất kỳ người nào có tiền muốn nhận con nuôi`,`Chủ nợ của người cha hoặc người mẹ`,`Trường học nơi con đang theo học`],correctAnswer:0,explanation:`Điều 84 Luật HNGĐ 2014 quy định việc thay đổi người trực tiếp nuôi con do cha, mẹ yêu cầu hoặc cơ quan, đoàn thể, người thân thích đề nghị khi người trực tiếp nuôi con không còn đủ điều kiện.`,legalReference:`Điều 84 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:491,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Mang thai hộ vì mục đích nhân đạo theo Luật Hôn nhân và Gia đình 2014 phải đáp ứng điều kiện nào?`,options:[`Người mang thai hộ phải là người thân thích cùng hàng của bên vợ hoặc bên chồng nhờ mang thai hộ; đã từng sinh con và chỉ được mang thai hộ một lần; có sự đồng ý bằng văn bản của chồng người mang thai hộ (nếu có)`,`Được trả tiền thuê mang thai hộ tùy ý`,`Thuê người lạ bất kỳ trên thị trường`,`Mang thai hộ không cần văn bản công chứng`],correctAnswer:0,explanation:`Điều 95 Luật HNGĐ 2014 quy định điều kiện mang thai hộ vì mục đích nhân đạo: người thân thích cùng hàng của bên vợ/chồng; đã từng sinh con; chỉ mang thai hộ một lần; tự nguyện và có xác nhận của cơ sở y tế có thẩm quyền.`,legalReference:`Điều 95 Luật Hôn nhân và Gia đình 2014`,difficulty:`vận dụng`},{id:492,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Nguyên tắc bảo vệ lao động nữ và bảo đảm bình đẳng giới theo Bộ luật Lao động 2019 quy định:`,options:[`Bảo đảm quyền bình đẳng của lao động nữ; người sử dụng lao động có trách nhiệm thực hiện bình đẳng giới và các biện pháp thúc đẩy bình đẳng giới trong tuyển dụng, bố trí công việc, đào tạo, tiền lương`,`Ưu tiên sa thải lao động nữ khi công ty tái cơ cấu`,`Trả lương lao động nữ thấp hơn lao động nam làm cùng công việc`,`Cấm phụ nữ tham gia ban chấp hành công đoàn`],correctAnswer:0,explanation:`Điều 135 BLLĐ 2019 khẳng định chính sách bảo đảm quyền bình đẳng giới, khuyến khích tạo điều kiện để lao động nữ và lao động nam bình đẳng trong lao động và việc làm.`,legalReference:`Điều 135 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:493,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Lao động nữ trong thời gian nuôi con dưới 12 tháng tuổi được nghỉ mỗi ngày bao nhiêu phút trong giờ làm việc mà vẫn hưởng đủ lương?`,options:[`Được nghỉ 60 phút mỗi ngày`,`Được nghỉ 30 phút mỗi ngày`,`Được nghỉ 15 phút`,`Không được nghỉ thêm giờ nào`],correctAnswer:0,explanation:`Khoản 4 Điều 137 BLLĐ 2019 quy định: Lao động nữ trong thời gian nuôi con dưới 12 tháng tuổi có quyền được nghỉ mỗi ngày 60 phút trong thời giờ làm việc để cho con bú, vắt, trữ sữa, nghỉ ngơi mà vẫn được hưởng đủ tiền lương.`,legalReference:`Điều 137 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:494,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động được nghỉ làm việc, hưởng nguyên lương trong các ngày lễ, tết nào sau đây theo Điều 112 Bộ luật Lao động 2019?`,options:[`Tết Dương lịch (01 ngày); Tết Âm lịch (05 ngày); Ngày Chiến thắng (01 ngày); Ngày Quốc tế lao động (01 ngày); Quốc khánh (02 ngày); Ngày Giỗ Tổ Hùng Vương (01 ngày)`,`Tết Âm lịch được nghỉ 15 ngày hưởng lương`,`Chỉ được nghỉ ngày Tết Dương lịch`,`Nghỉ vào tất cả các ngày chủ nhật trong tháng`],correctAnswer:0,explanation:`Điều 112 BLLĐ 2019 quy định người lao động được nghỉ 11 ngày lễ tết hưởng nguyên lương: Tết Dương lịch 1 ngày, Tết Âm lịch 5 ngày, Ngày 30/4 1 ngày, Ngày 1/5 1 ngày, Quốc khánh 2 ngày (2/9 và 1 ngày liền kề), Giỗ Tổ Hùng Vương 1 ngày.`,legalReference:`Điều 112 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:495,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Lao động chưa thành niên theo Bộ luật Lao động 2019 là người lao động ở độ tuổi nào?`,options:[`Người lao động chưa đủ 18 tuổi`,`Người lao động chưa đủ 15 tuổi`,`Người lao động chưa đủ 16 tuổi`,`Người lao động chưa đủ 20 tuổi`],correctAnswer:0,explanation:`Khoản 1 Điều 143 BLLĐ 2019 định nghĩa: "Người lao động chưa thành niên là người lao động chưa đủ 18 tuổi".`,legalReference:`Điều 143 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:496,chapterId:4,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời giờ làm việc của người từ đủ 15 tuổi đến chưa đủ 18 tuổi theo quy định không được quá bao nhiêu giờ trong một ngày?`,options:[`Không quá 08 giờ trong 01 ngày và 40 giờ trong 01 tuần`,`Không quá 10 giờ trong 01 ngày`,`Không quá 12 giờ trong 01 ngày`,`Không giới hạn số giờ làm việc`],correctAnswer:0,explanation:`Khoản 2 Điều 146 BLLĐ 2019 quy định thời giờ làm việc của người từ đủ 15 tuổi đến chưa đủ 18 tuổi không quá 08 giờ trong 01 ngày và 40 giờ trong 01 tuần.`,legalReference:`Điều 146 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:497,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Tiền thưởng của người lao động theo Điều 104 Bộ luật Lao động 2019 được quy định như thế nào?`,options:[`Thưởng là số tiền hoặc tài sản hoặc bằng các hình thức khác mà người sử dụng lao động thưởng cho người lao động căn cứ vào kết quả sản xuất, kinh doanh, mức độ hoàn thành công việc`,`Bắt buộc người sử dụng lao động phải thưởng bằng tiền mặt đúng 1 tháng lương thứ 13`,`Thưởng chỉ được trao bằng phiếu mua hàng siêu thị`,`Pháp luật cấm các doanh nghiệp tư nhân thưởng cho nhân viên`],correctAnswer:0,explanation:`Điều 104 BLLĐ 2019: Thưởng là số tiền hoặc tài sản hoặc bằng các hình thức khác do người sử dụng lao động quyết định căn cứ kết quả kinh doanh và mức độ hoàn thành công việc sau khi tham khảo ý kiến tổ chức đại diện người lao động.`,legalReference:`Điều 104 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:498,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Khi xử lý kỷ luật lao động, người sử dụng lao động phải chứng minh điều gì?`,options:[`Phải chứng minh được lỗi của người lao động; có sự tham gia của tổ chức đại diện người lao động tại cơ sở; người lao động phải có mặt và có quyền tự bào chữa hoặc nhờ người khác bào chữa`,`Chỉ cần ý kiến chủ quan của trưởng phòng nhân sự`,`Không cần người lao động có mặt`,`Không cần lập biên bản cuộc họp`],correctAnswer:0,explanation:`Điều 122 BLLĐ 2019 quy định nguyên tắc xử lý kỷ luật: NSDLĐ phải chứng minh được lỗi; phải có sự tham gia của tổ chức đại diện người lao động; NLĐ có mặt và có quyền tự bào chữa; việc xử lý kỷ luật phải lập thành biên bản.`,legalReference:`Điều 122 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:499,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Một hành vi vi phạm kỷ luật lao động có thể bị xử lý bằng nhiều hình thức kỷ luật lao động khác nhau không?`,options:[`Không, chỉ được áp dụng một hình thức kỷ luật lao động đối với một hành vi vi phạm kỷ luật lao động`,`Có thể cùng lúc vừa sa thải vừa kéo dài thời hạn nâng lương`,`Có thể vừa phạt tiền vừa khiển trách`,`Áp dụng đồng thời cả 4 hình thức kỷ luật`],correctAnswer:0,explanation:`Khoản 2 Điều 122 BLLĐ 2019 quy định nguyên tắc: "Chỉ được áp dụng một hình thức kỷ luật lao động đối với một hành vi vi phạm kỷ luật lao động".`,legalReference:`Điều 122 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:500,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời hiệu để yêu cầu Tòa án giải quyết tranh chấp lao động cá nhân về việc bị sa thải hoặc đơn phương chấm dứt HĐLĐ là bao lâu kể từ ngày phát hiện quyền lợi bị xâm phạm?`,options:[`01 năm kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp bị xâm phạm`,`06 tháng`,`03 tháng`,`03 năm`],correctAnswer:0,explanation:`Khoản 3 Điều 190 Bộ luật Lao động 2019 quy định: Thời hiệu yêu cầu Toà án giải quyết tranh chấp lao động cá nhân là 01 năm, kể từ ngày phát hiện ra hành vi mà bên tranh chấp cho rằng quyền và lợi ích hợp pháp của mình bị vi phạm.`,legalReference:`Khoản 3 Điều 190 Bộ luật Lao động 2019`,difficulty:`trung bình`}],re=[{id:1,code:`CH-01`,name:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,shortName:`Nhà nước & Pháp luật`,description:`Bản chất, đặc trưng, chức năng của Nhà nước và Pháp luật, nguồn gốc, hình thức, vi phạm pháp luật và trách nhiệm pháp lý.`,color:`emerald`},{id:3,code:`CH-03`,name:`Chương 3: Bộ máy Nhà nước Cộng hòa XHCN Việt Nam`,shortName:`Bộ máy Nhà nước`,description:`Nguyên tắc tổ chức, các cơ quan quyền lực (Quốc hội, HĐND), hành chính (Chính phủ, UBND), xét xử (TAND), kiểm sát (VKSND) và Chủ tịch nước.`,color:`blue`},{id:4,code:`CH-04`,name:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,shortName:`Luật Dân sự & TTDS`,description:`Chủ thể, tài sản, quyền sở hữu, hợp đồng dân sự, thừa kế theo di chúc và theo pháp luật, thủ tục tố tụng giải quyết tranh chấp dân sự.`,color:`indigo`},{id:5,code:`CH-05`,name:`Chương 5: Pháp luật Kinh doanh - Thương mại`,shortName:`Kinh doanh - Thương mại`,description:`Chủ thể kinh doanh: Doanh nghiệp tư nhân, Cty TNHH, Cty Cổ phần, Cty Hợp danh; Hộ kinh doanh; phá sản và Trọng tài thương mại.`,color:`amber`},{id:6,code:`CH-06`,name:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,shortName:`Luật Hình sự & PCTN`,description:`Tội phạm, 4 yếu tố cấu thành tội phạm, tuổi chịu TNHS, hệ thống hình phạt, các nhóm tội phạm cơ bản và các biện pháp phòng chống tham nhũng.`,color:`rose`},{id:7,code:`CH-07`,name:`Chương 7: Pháp luật Hôn nhân và Gia đình`,shortName:`Hôn nhân & Gia đình`,description:`Điều kiện kết hôn, cấm kết hôn, quan hệ nhân thân và tài sản giữa vợ chồng, thủ tục và căn cứ ly hôn, quyền nuôi con sau ly hôn.`,c
