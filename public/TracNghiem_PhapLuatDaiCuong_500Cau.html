nghị Quốc hội bầu, miễn nhiệm, bãi nhiệm Viện trưởng VKSND tối cao.`,legalReference:`Điều 70 & Điều 88 Hiến pháp 2013`,difficulty:`trung bình`},{id:235,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Quyền công tố của Viện kiểm sát nhân dân là quyền gì?`,options:[`Quyền nhân danh Nhà nước truy cứu trách nhiệm hình sự người phạm tội, thực hiện từ khi giải quyết tố giác tội phạm đến khi xét xử xong vụ án hình sự`,`Quyền đại diện giải quyết mọi tranh chấp thừa kế đất đai cho dân`,`Quyền kiểm tra ngân sách doanh nghiệp tư nhân`,`Quyền tuyên án tử hình không cần mở phiên tòa`],correctAnswer:0,explanation:`Điều 3 Luật Tổ chức VKSND: Quyền công tố là quyền của Nhà nước do VKSND thực hành để buộc tội người phạm tội tại phiên tòa, điều tra, truy tố người phạm tội ra trước Tòa án.`,legalReference:`Điều 3 Luật Tổ chức Viện kiểm sát nhân dân 2014`,difficulty:`trung bình`},{id:236,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Mặt trận Tổ quốc Việt Nam có vai trò chính trị - xã hội như thế nào trong bộ máy và đời sống nhà nước?`,options:[`Là cơ sở chính trị của chính quyền nhân dân; đại diện, bảo vệ quyền lợi hợp pháp của Nhân dân; thực hiện giám sát và phản biện xã hội`,`Là cơ quan có quyền ban hành các nghị định xử phạt vi phạm hành chính`,`Là cơ quan xét xử các vụ án hành chính`,`Là đơn vị kinh doanh thương mại độc quyền của Nhà nước`],correctAnswer:0,explanation:`Điều 9 Hiến pháp 2013: Mặt trận Tổ quốc Việt Nam là cơ sở chính trị của chính quyền nhân dân, tập hợp khối đại đoàn kết toàn dân, thực hiện giám sát, phản biện xã hội và tham gia xây dựng Đảng, Nhà nước.`,legalReference:`Điều 9 Hiến pháp 2013`,difficulty:`dễ`},{id:237,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Theo Bộ luật Dân sự 2015, Tòa án tuyên bố một người "Mất tích" khi người đó biệt tích bao lâu và có yêu cầu của người có quyền, lợi ích liên quan?`,options:[`Biệt tích 02 năm liền trở lên dù đã áp dụng đầy đủ các biện pháp thông báo tìm kiếm theo quy định`,`Biệt tích 06 tháng`,`Biệt tích 01 năm`,`Biệt tích 05 năm`],correctAnswer:0,explanation:`Khoản 1 Điều 68 BLDS 2015: Khi một người biệt tích 02 năm liền trở lên, mặc dù đã áp dụng đầy đủ các biện pháp thông báo tìm kiếm... thì theo yêu cầu của người có quyền, lợi ích liên quan, Tòa án có thể tuyên bố người đó mất tích.`,legalReference:`Điều 68 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:238,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Tòa án tuyên bố một người "Là đã chết" trong trường hợp người đó biệt tích bao nhiêu năm liền trở lên sau khi quyết định tuyên bố mất tích có hiệu lực?`,options:[`03 năm liền trở lên`,`01 năm`,`02 năm`,`05 năm`],correctAnswer:0,explanation:`Điểm a Khoản 1 Điều 71 BLDS 2015: Sau 03 năm, kể từ ngày quyết định tuyên bố mất tích của Tòa án có hiệu lực pháp luật mà vẫn không có tin tức xác thực là còn sống thì Tòa án tuyên bố người đó là đã chết.`,legalReference:`Điều 71 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:239,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Chiếm hữu có căn cứ pháp luật là việc chiếm hữu tài sản trong trường hợp nào sau đây?`,options:[`Chủ sở hữu chiếm hữu tài sản của chính mình; người được chủ sở hữu ủy quyền quản lý tài sản; người được chuyển giao quyền chiếm hữu qua giao dịch hợp pháp`,`Người nhặt được của rơi giấu kín không báo cho công an`,`Người mua phải tài sản do người khác trộm cắp mà biết rõ nguồn gốc bất hợp pháp`,`Người tự ý phá khóa nhà hoang vào ở`],correctAnswer:0,explanation:`Điều 165 BLDS 2015 liệt kê các trường hợp chiếm hữu có căn cứ pháp luật: chủ sở hữu, người được ủy quyền, người được chuyển giao qua giao dịch hợp pháp, người phát hiện tài sản vô chủ/bị đánh rơi đúng thủ tục luật định...`,legalReference:`Điều 165 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:240,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hợp đồng dân sự vô hiệu do bị lừa dối, đe dọa, cưỡng ép là hợp đồng mà trong đó:`,options:[`Một bên tham gia giao dịch do bị lừa dối (hành vi cố ý làm sai lệch thông tin) hoặc bị đe dọa, cưỡng ép làm mất đi sự tự nguyện thực sự`,`Hai bên hoàn toàn tự nguyện thỏa thuận giá bán hàng`,`Hợp đồng được công chứng tại phòng công chứng nhà nước`,`Hợp đồng tặng cho tài sản giữa cha mẹ và con cái`],correctAnswer:0,explanation:`Điều 127 BLDS 2015: Khi một bên tham gia giao dịch dân sự do bị lừa dối hoặc bị đe dọa, cưỡng ép thì có quyền yêu cầu Tòa án tuyên bố giao dịch dân sự đó là vô hiệu.`,legalReference:`Điều 127 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:241,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hậu quả pháp lý của giao dịch dân sự vô hiệu theo Điều 131 Bộ luật Dân sự 2015 là:`,options:[`Không làm phát sinh, thay đổi, chấm dứt quyền, nghĩa vụ dân sự của các bên kể từ thời điểm giao dịch được xác lập; các bên khôi phục lại tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận`,`Bên có lỗi phải đi tù 2 năm`,`Hợp đồng vẫn tiếp tục có hiệu lực một nửa`,`Tài sản của hai bên tự động sung công quỹ nhà nước trong mọi trường hợp`],correctAnswer:0,explanation:`Điều 131 BLDS 2015: Giao dịch vô hiệu không làm phát sinh quyền nghĩa vụ từ lúc xác lập; các bên hoàn trả cho nhau những gì đã nhận; bên có lỗi gây thiệt hại thì phải bồi thường.`,legalReference:`Điều 131 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:242,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Biện pháp bảo đảm "Bảo lãnh" là việc:`,options:[`Người thứ ba cam kết với bên có quyền sẽ thực hiện nghĩa vụ thay cho bên có nghĩa vụ, nếu khi đến thời hạn mà bên được bảo lãnh không thực hiện hoặc thực hiện không đúng nghĩa vụ`,`Bên có nghĩa vụ giao nợ một khoản tiền vào tài khoản phong tỏa`,`Chủ nợ giữ giấy khai sinh của con nợ`,`Ký hợp đồng chuyển nhượng quyền sử dụng đất ngay lập tức`],correctAnswer:0,explanation:`Điều 335 BLDS 2015: Bảo lãnh là việc người thứ ba (bên bảo lãnh) cam kết với bên có quyền (bên nhận bảo lãnh) sẽ thực hiện nghĩa vụ thay cho bên có nghĩa vụ (bên được bảo lãnh), nếu khi đến thời hạn mà bên được bảo lãnh không thực hiện hoặc thực hiện không đúng nghĩa vụ.`,legalReference:`Điều 335 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:243,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Người từ đủ 15 tuổi đến chưa đủ 18 tuổi có quyền lập di chúc hay không?`,options:[`Có quyền lập di chúc nếu được cha, mẹ hoặc người giám hộ đồng ý về việc lập di chúc và di chúc phải được lập thành văn bản`,`Tuyệt đối không được quyền lập di chúc trong mọi trường hợp`,`Được tự do lập di chúc miệng mà không cần ai đồng ý`,`Chỉ được lập di chúc khi đã lập gia đình`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 625 và Khoản 2 Điều 630 BLDS 2015: Người từ đủ mười lăm tuổi đến chưa đủ mười tám tuổi được lập di chúc, nếu được cha, mẹ hoặc người giám hộ đồng ý về việc lập di chúc và di chúc phải lập thành văn bản.`,legalReference:`Điều 625 & Điều 630 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:244,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trường hợp di chúc bằng văn bản không có người làm chứng thì chỉ được coi là hợp pháp khi nào?`,options:[`Người lập di chúc phải tự viết và ký tên vào bản di chúc, đáp ứng đủ các điều kiện luật định`,`Được đánh máy trên máy vi tính có chèn ảnh chân dung`,`Có người hàng xóm cất giữ hộ`,`Được đăng tải lên trang mạng xã hội cá nhân`],correctAnswer:0,explanation:`Điều 633 BLDS 2015: Người lập di chúc phải tự viết và ký vào bản di chúc. Việc lập di chúc bằng văn bản không có người làm chứng phải tuân theo quy định tại Điều 631 của Bộ luật này.`,legalReference:`Điều 633 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:245,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Ai sau đây KHÔNG THỂ là người làm chứng cho việc lập di chúc?`,options:[`Người thừa kế theo di chúc hoặc theo pháp luật của người lập di chúc; người có quyền tài sản liên quan; người chưa thành niên, người mất năng lực hành vi dân sự`,`Cán bộ hưu trí trong khu dân cư không có quan hệ thừa kế`,`Luật sư không có quyền lợi liên quan đến khối di sản`,`Bác sĩ điều trị không có quan hệ họ hàng hay thừa kế`],correctAnswer:0,explanation:`Điều 632 BLDS 2015: Mọi người đều có thể làm chứng cho việc lập di chúc, trừ: Người thừa kế theo di chúc hoặc theo pháp luật của người lập di chúc; Người có quyền, nghĩa vụ tài sản liên quan; Người chưa thành niên, người mất NLHVDS...`,legalReference:`Điều 632 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:246,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thừa kế theo pháp luật được áp dụng trong trường hợp nào sau đây?`,options:[`Không có di chúc; di chúc không hợp pháp; những người thừa kế theo di chúc chết trước hoặc chết cùng thời điểm với người lập di chúc; người được chỉ định không có quyền hưởng di sản hoặc từ chối nhận`,`Khi người để lại di sản có di chúc hợp pháp chia cho con ruột`,`Khi người lập di chúc đã gửi gắm toàn bộ tài sản tại ngân hàng thụy sĩ`,`Khi các con không muốn nhận tài sản`],correctAnswer:0,explanation:`Điều 650 BLDS 2015 quy định các trường hợp thừa kế theo pháp luật: không có di chúc; di chúc không hợp pháp; người thừa kế chết trước/cùng thời điểm; cơ quan tổ chức thừa kế không còn tồn tại...`,legalReference:`Điều 650 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:247,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Những người thuộc hàng thừa kế sau chỉ được hưởng thừa kế khi nào?`,options:[`Khi không còn ai ở hàng thừa kế trước do đã chết, không có quyền hưởng di sản, bị truất quyền thừa kế hoặc từ chối nhận di sản`,`Khi hàng thừa kế trước đồng ý nhường 10% di sản`,`Bất cứ lúc nào họ có hoàn cảnh khó khăn hơn`,`Theo quyết định của cơ quan bảo hiểm`],correctAnswer:0,explanation:`Khoản 3 Điều 651 BLDS 2015: Những người ở hàng thừa kế sau chỉ được hưởng thừa kế, nếu không còn ai ở hàng thừa kế trước do đã chết, không có quyền hưởng di sản, bị truất quyền hưởng di sản hoặc từ chối nhận di sản.`,legalReference:`Điều 651 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:248,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Tài sản vô chủ, tài sản không xác định được chủ sở hữu sau thời hạn thông báo tìm kiếm (01 năm đối với động sản, 05 năm đối với bất động sản) thì:`,options:[`Động sản thuộc về người phát hiện quản lý; bất động sản thuộc về Nhà nước`,`Tất cả thuộc về người phát hiện`,`Tất cả thuộc về Ủy ban Mặt trận Tổ quốc`,`Bị bán đấu giá chia tiền cho người nghèo trong xã`],correctAnswer:0,explanation:`Khoản 2 Điều 228 BLDS 2015: Sau 01 năm thông báo công khai mà không xác định được chủ sở hữu là ai thì động sản thuộc về người phát hiện; sau 05 năm thì bất động sản thuộc về Nhà nước.`,legalReference:`Điều 228 Bộ luật Dân sự 2015`,difficulty:`vận dụng`},{id:249,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Nghĩa vụ bồi thường thiệt hại do người chưa đủ 15 tuổi gây ra được thực hiện như thế nào?`,options:[`Cha, mẹ phải bồi thường toàn bộ thiệt hại; nếu tài sản của cha mẹ không đủ mà con chưa thành niên có tài sản riêng thì lấy tài sản đó để bồi thường phần còn thiếu`,`Đứa trẻ phải tự đi làm thuê để trả nợ`,`Nhà nước bồi thường thay hoàn toàn`,`Người bị thiệt hại phải tự gánh chịu không được đòi bồi thường`],correctAnswer:0,explanation:`Khoản 2 Điều 586 BLDS 2015: Người chưa đủ mười lăm tuổi gây thiệt hại mà còn cha, mẹ thì cha, mẹ phải bồi thường toàn bộ; nếu tài sản cha mẹ không đủ mà con có tài sản riêng thì lấy tài sản riêng của con để bồi thường phần còn thiếu.`,legalReference:`Điều 586 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:250,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trong vụ án dân sự, "Bị đơn" là ai?`,options:[`Người bị nguyên đơn khởi kiện hoặc bị cơ quan, tổ chức khác khởi kiện yêu cầu Tòa án giải quyết vụ án dân sự khi cho rằng quyền và lợi ích hợp pháp của nguyên đơn bị người đó xâm phạm`,`Người làm chứng tại phiên tòa`,`Người giúp việc cho Thẩm phán`,`Luật sư đại diện cho Viện kiểm sát`],correctAnswer:0,explanation:`Khoản 3 Điều 68 BLTTDS 2015: Bị đơn trong vụ án dân sự là người bị nguyên đơn khởi kiện hoặc bị cơ quan, tổ chức, cá nhân khác do Bộ luật này quy định khởi kiện để yêu cầu Tòa án giải quyết.`,legalReference:`Điều 68 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:251,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Tranh chấp dân sự nào sau đây KHÔNG ĐƯỢC hòa giải tại Tòa án?`,options:[`Yêu cầu hủy việc kết hôn trái pháp luật; tranh chấp xác định cha, mẹ cho con hoặc con cho cha, mẹ`,`Tranh chấp hợp đồng mua bán nhà đất`,`Tranh chấp chia di sản thừa kế`,`Tranh chấp bồi thường thiệt hại do tai nạn giao thông`],correctAnswer:0,explanation:`Điều 206 BLTTDS 2015 quy định những vụ án dân sự không được hòa giải gồm: Yêu cầu đòi bồi thường vì lý do gây thiệt hại đến tài sản của Nhà nước; Những vụ án phát sinh từ giao dịch dân sự vi phạm điều cấm của luật hoặc trái đạo đức xã hội; Vụ án hủy việc kết hôn trái pháp luật...`,legalReference:`Điều 206 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:252,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thẩm quyền giải quyết tranh chấp dân sự sơ thẩm của Tòa án nhân dân cấp huyện bao gồm:`,options:[`Hầu hết các tranh chấp về dân sự, hôn nhân gia đình, kinh doanh thương mại, lao động không có đương sự hoặc tài sản ở nước ngoài`,`Chỉ xét xử các vụ kiện dưới 5 triệu đồng`,`Xét xử các tranh chấp ngoại giao quốc tế`,`Chỉ xử lý các vụ án hình sự đặc biệt nghiêm trọng`],correctAnswer:0,explanation:`Điều 35 BLTTDS 2015 quy định thẩm quyền của TAND cấp huyện giải quyết theo thủ tục sơ thẩm các tranh chấp về dân sự, hôn nhân gia đình, kinh doanh thương mại và lao động theo quy định (không có yếu tố nước ngoài).`,legalReference:`Điều 35 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:253,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Khi các đương sự thỏa thuận được với nhau về việc giải quyết toàn bộ vụ án tại phiên hòa giải, Thẩm phán lập biên bản hòa giải thành và sau bao nhiêu ngày sẽ ra quyết định công nhận sự thỏa thuận của các đương sự nếu không ai thay đổi ý kiến?`,options:[`Sau 07 ngày kể từ ngày lập biên bản hòa giải thành`,`Sau 03 ngày`,`Sau 15 ngày`,`Sau 30 ngày`],correctAnswer:0,explanation:`Điều 212 BLTTDS 2015: Hết thời hạn 07 ngày, kể từ ngày lập biên bản hoà giải thành mà không có đương sự nào thay đổi ý kiến về sự thoả thuận đó thì Thẩm phán chủ trì phiên hoà giải... ra quyết định công nhận sự thoả thuận của các đương sự.`,legalReference:`Điều 212 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:254,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Quyết định công nhận sự thỏa thuận của các đương sự của Tòa án có đặc điểm hiệu lực nào?`,options:[`Có hiệu lực pháp luật ngay sau khi được ban hành và không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm`,`Chỉ có hiệu lực sau 30 ngày để các bên suy nghĩ lại`,`Vẫn bị kháng cáo lên Tòa án cấp trên bình thường`,`Chỉ có giá trị tham khảo không bắt buộc thi hành án`],correctAnswer:0,explanation:`Khoản 1 Điều 213 BLTTDS 2015: Quyết định công nhận sự thoả thuận của các đương sự có hiệu lực pháp luật ngay sau khi được ban hành và không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm.`,legalReference:`Điều 213 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:255,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Người đại diện theo pháp luật của doanh nghiệp là cá nhân đại diện cho doanh nghiệp:`,options:[`Thực hiện các quyền và nghĩa vụ phát sinh từ giao dịch của doanh nghiệp, đại diện cho doanh nghiệp với tư cách người yêu cầu giải quyết việc dân sự, nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan trước Trọng tài, Tòa án`,`Chỉ có trách nhiệm ký bảng chấm công nhân viên`,`Đại diện cho tổ chức công đoàn bảo vệ người lao động`,`Chỉ chịu trách nhiệm nộp thuế cá nhân`],correctAnswer:0,explanation:`Khoản 1 Điều 12 Luật Doanh nghiệp 2020: Người đại diện theo pháp luật của doanh nghiệp là cá nhân đại diện cho doanh nghiệp thực hiện các quyền và nghĩa vụ phát sinh từ giao dịch của doanh nghiệp...`,legalReference:`Điều 12 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:256,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Một doanh nghiệp (Công ty TNHH hoặc Công ty Cổ phần) có thể có bao nhiêu người đại diện theo pháp luật?`,options:[`Có thể có một hoặc nhiều người đại diện theo pháp luật tùy theo Điều lệ công ty quy định`,`Bắt buộc chỉ được có duy nhất 01 người đại diện`,`Bắt buộc phải có đúng 05 người đại diện`,`Không được phép có người đại diện là công dân Việt Nam`],correctAnswer:0,explanation:`Khoản 2 Điều 12 Luật Doanh nghiệp 2020: Công ty TNHH và công ty cổ phần có thể có một hoặc nhiều người đại diện theo pháp luật. Điều lệ công ty quy định cụ thể số lượng, chức danh quản lý và quyền, nghĩa vụ.`,legalReference:`Khoản 2 Điều 12 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:257,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Tên trùng và tên gây nhầm lẫn của doanh nghiệp được hiểu như thế nào?`,options:[`Tên trùng là tên tiếng Việt của doanh nghiệp đề nghị đăng ký được viết hoàn toàn giống với tên tiếng Việt của doanh nghiệp đã đăng ký trong phạm vi toàn quốc`,`Tên trùng chỉ bị cấm trong phạm vi cùng một phường/xã`,`Doanh nghiệp tư nhân được phép đặt tên trùng với công ty nhà nước`,`Tên gây nhầm lẫn chỉ áp dụng cho logo hình ảnh`],correctAnswer:0,explanation:`Điều 41 Luật Doanh nghiệp 2020 quy định về tên trùng và tên gây nhầm lẫn: Tên trùng là tên tiếng Việt của doanh nghiệp đề nghị đăng ký viết hoàn toàn giống tên tiếng Việt của doanh nghiệp đã đăng ký trên Cơ sở dữ liệu quốc gia.`,legalReference:`Điều 41 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:258,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Tài sản góp vốn vào doanh nghiệp có thể là những loại tài sản nào?`,options:[`Đồng Việt Nam, ngoại tệ tự do chuyển đổi, vàng, quyền sử dụng đất, quyền sở hữu trí tuệ, công nghệ, bí quyết kỹ thuật, tài sản khác định giá được bằng Đồng Việt Nam`,`Chỉ chấp nhận tiền mặt Đồng Việt Nam`,`Bằng uy tín cá nhân và bằng cấp đại học`,`Bằng sức lao động dự kiến làm trong 10 năm`],correctAnswer:0,explanation:`Điều 34 Luật Doanh nghiệp 2020: Tài sản góp vốn là Đồng Việt Nam, ngoại tệ tự do chuyển đổi, vàng, quyền sử dụng đất, quyền sở hữu trí tuệ, công nghệ, tài sản khác định giá được bằng VNĐ.`,legalReference:`Điều 34 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:259,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thành viên Hội đồng thành viên của Công ty TNHH 2 thành viên trở lên có quyền chuyển nhượng phần vốn góp của mình như thế nào?`,options:[`Phải chào bán phần vốn góp đó cho các thành viên còn lại theo tỷ lệ tương ứng trước; chỉ được chuyển nhượng cho người ngoài nếu các thành viên còn lại không mua hoặc không mua hết trong 30 ngày`,`Tự do bán ngay cho bất kỳ người ngoài nào mà không cần báo cho thành viên trong công ty`,`Chỉ được bán cho người thân trong gia đình`,`Không bao giờ được quyền chuyển nhượng vốn góp`],correctAnswer:0,explanation:`Điều 52 Luật Doanh nghiệp 2020: Phải chào bán phần vốn đó cho các thành viên còn lại theo tỷ lệ tương ứng với phần vốn góp của họ trong công ty; chỉ được chuyển nhượng cho người không phải là thành viên nếu các thành viên còn lại không mua hoặc không mua hết trong 30 ngày.`,legalReference:`Điều 52 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:260,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cổ đông sở hữu Cổ phần ưu đãi biểu quyết trong Công ty Cổ phần có đặc quyền gì?`,options:[`Có số phiếu biểu quyết nhiều hơn so với cổ phần phổ thông theo quy định của Điều lệ công ty`,`Được nhận cổ tức cố định gấp 10 lần cổ đông khác`,`Được quyền tự do rút vốn điều lệ bằng tiền mặt khỏi công ty bất cứ lúc nào`,`Có quyền chuyển nhượng cổ phần đó cho người khác không giới hạn`],correctAnswer:0,explanation:`Khoản 1 Điều 116 Luật Doanh nghiệp 2020: Cổ phần ưu đãi biểu quyết là cổ phần phổ thông có nhiều hơn phiếu biểu quyết so với cổ phần phổ thông khác; số phiếu biểu quyết của một cổ phần ưu đãi biểu quyết do Điều lệ công ty quy định.`,legalReference:`Điều 116 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:261,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cổ đông sở hữu cổ phần ưu đãi biểu quyết KHÔNG ĐƯỢC thực hiện hành vi nào sau đây?`,options:[`Không được chuyển nhượng cổ phần đó cho người khác (trừ trường hợp chuyển nhượng theo bản án có hiệu lực hoặc thừa kế)`,`Không được tham dự cuộc họp Đại hội đồng cổ đông`,`Không được nhận cổ tức`,`Không được xem sổ sách kế toán`],correctAnswer:0,explanation:`Khoản 3 Điều 116 Luật Doanh nghiệp 2020: Cổ đông sở hữu cổ phần ưu đãi biểu quyết không được chuyển nhượng cổ phần đó cho người khác, trừ trường hợp chuyển nhượng theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật hoặc thừa kế.`,legalReference:`Điều 116 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:262,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trường hợp nào sau đây dẫn đến việc Doanh nghiệp bị giải thể bắt buộc?`,options:[`Bị thu hồi Giấy chứng nhận đăng ký doanh nghiệp (trừ trường hợp luật Quản lý thuế có quy định khác)`,`Công ty bị lỗ liên tiếp trong 2 quý`,`Giám đốc điều hành xin từ chức`,`Công ty không tham gia hội chợ thương mại quốc tế`],correctAnswer:0,explanation:`Điểm d Khoản 1 Điều 207 Luật Doanh nghiệp 2020: Doanh nghiệp bị giải thể trong trường hợp bị thu hồi Giấy chứng nhận đăng ký doanh nghiệp.`,legalReference:`Điều 207 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:263,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thứ tự ưu tiên phân chia tài sản khi doanh nghiệp, hợp tác xã bị tuyên bố Phá sản được thực hiện như thế nào?`,options:[`1. Chi phí phá sản; 2. Khoản nợ lương, trợ cấp thôi việc, BHXH của người lao động; 3. Khoản nợ phát sinh sau khi mở thủ tục phá sản; 4. Nghĩa vụ tài chính đối với Nhà nước; khoản nợ không bảo đảm`,`Ưu tiên trả hết nợ ngân hàng trước rồi mới tới người lao động`,`Ưu tiên chia hết cho các cổ đông sáng lập trước`,`Nộp toàn bộ vào kho bạc Nhà nước không trả cho chủ nợ`],correctAnswer:0,explanation:`Điều 54 Luật Phá sản 2014 quy định thứ tự phân chia tài sản: 1. Chi phí phá sản; 2. Khoản nợ lương, trợ cấp, BHXH của người lao động; 3. Nợ phát sinh sau mở thủ tục phá sản; 4. Nghĩa vụ với Nhà nước và nợ không bảo đảm trả cho chủ nợ.`,legalReference:`Điều 54 Luật Phá sản 2014`,difficulty:`vận dụng`},{id:264,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hội đồng Quản trị của Công ty Cổ phần có số lượng thành viên từ bao nhiêu người?`,options:[`Từ 03 đến 11 thành viên (Điều lệ quy định cụ thể)`,`Đúng 02 thành viên`,`Không quá 50 thành viên`,`Bắt buộc trên 20 thành viên`],correctAnswer:0,explanation:`Khoản 1 Điều 154 Luật Doanh nghiệp 2020: Hội đồng quản trị có từ 03 đến 11 thành viên. Điều lệ công ty quy định cụ thể số lượng thành viên Hội đồng quản trị.`,legalReference:`Điều 154 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:265,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Nghị quyết của Hội đồng Quản trị được thông qua tại cuộc họp nếu được đa số thành viên dự họp tán thành; trường hợp số phiếu ngang nhau thì:`,options:[`Quyết định cuối cùng thuộc về phía có ý kiến của Chủ tịch Hội đồng quản trị`,`Nghị quyết tự động bị hủy bỏ vĩnh viễn`,`Phải nộp đơn xin ý kiến của Tòa án`,`Bốc thăm ngẫu nhiên để chọn phương án`],correctAnswer:0,explanation:`Khoản 12 Điều 153 Luật Doanh nghiệp 2020: Nghị quyết của HĐQT được thông qua nếu được đa số thành viên dự họp tán thành; trường hợp số phiếu ngang nhau thì quyết định cuối cùng thuộc về phía có ý kiến của Chủ tịch Hội đồng quản trị.`,legalReference:`Điều 153 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:266,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hoạt động khuyến mại theo Luật Thương mại 2005 KHÔNG ĐƯỢC thực hiện dưới hình thức nào?`,options:[`Khuyến mại bằng rượu có nồng độ cồn từ 15 độ trở lên hoặc thuốc lá`,`Đưa hàng mẫu, cung ứng dịch vụ mẫu để khách hàng dùng thử không phải trả tiền`,`Tặng hàng hoá cho khách hàng, cung ứng dịch vụ không thu tiền`,`Bán hàng với giá thấp hơn giá bán hàng trước đó`],correctAnswer:0,explanation:`Khoản 4 Điều 100 Luật Thương mại 2005 nghiêm cấm khuyến mại rượu có độ cồn từ 15 độ trở lên; thuốc lá, thuốc lá điện tử, hàng cấm kinh doanh.`,legalReference:`Điều 100 Luật Thương mại 2005`,difficulty:`trung bình`},{id:267,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong hoạt động đại diện cho thương nhân, người đại diện nhân danh ai để thực hiện các hoạt động thương mại?`,options:[`Nhân danh bên giao đại diện`,`Nhân danh chính bản thân mình`,`Nhân danh cơ quan quản lý thị trường`,`Nhân danh người tiêu dùng`],correctAnswer:0,explanation:`Điều 141 Luật Thương mại 2005: Đại diện cho thương nhân là việc một thương nhân nhận uỷ nhiệm của thương nhân khác để thực hiện các hoạt động thương mại với danh nghĩa và theo sự chỉ dẫn của thương nhân đó và được hưởng thù lao.`,legalReference:`Điều 141 Luật Thương mại 2005`,difficulty:`dễ`},{id:268,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thời hiệu khởi kiện áp dụng đối với các tranh chấp thương mại nói chung theo Luật Thương mại 2005 là bao lâu kể từ thời điểm quyền và lợi ích hợp pháp bị xâm phạm?`,options:[`02 năm`,`06 tháng`,`01 năm`,`05 năm`],correctAnswer:0,explanation:`Điều 319 Luật Thương mại 2005 quy định: "Thời hiệu khởi kiện áp dụng đối với các tranh chấp thương mại là 02 năm, kể từ thời điểm quyền và lợi ích hợp pháp bị xâm phạm, trừ trường hợp quy định tại điểm e khoản 1 Điều 237".`,legalReference:`Điều 319 Luật Thương mại 2005`,difficulty:`trung bình`},{id:269,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội phạm nghiêm trọng là tội phạm có mức cao nhất của khung hình phạt do BLHS quy định là:`,options:[`Từ trên 03 năm tù đến 07 năm tù`,`Phạt tiền hoặc phạt tù đến 03 năm`,`Từ trên 07 năm tù đến 15 năm tù`,`Tù chung thân hoặc tử hình`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 9 BLHS 2015: "Tội phạm nghiêm trọng là tội phạm có tính chất và mức độ nguy hiểm cho xã hội lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là từ trên 03 năm tù đến 07 năm tù".`,legalReference:`Điều 9 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:270,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Mặt khách quan của tội phạm biểu hiện qua các dấu hiệu nào?`,options:[`Hành vi nguy hiểm cho xã hội; Hậu quả nguy hiểm cho xã hội; Mối quan hệ nhân quả giữa hành vi và hậu quả; Thời gian, địa điểm, phương tiện, phương pháp thực hiện tội phạm`,`Lỗi, động cơ và mục đích của người phạm tội`,`Năng lực trách nhiệm hình sự và độ tuổi của thủ phạm`,`Quan hệ sở hữu và quan hệ nhân thân bị xâm hại`],correctAnswer:0,explanation:`Mặt khách quan của tội phạm là những biểu hiện bên ngoài của tội phạm: hành vi, hậu quả, quan hệ nhân quả giữa hành vi và hậu quả, cùng điều kiện ngoại cảnh (công cụ, thời gian, địa điểm...).`,legalReference:`Cấu thành tội phạm - Mặt khách quan`,difficulty:`dễ`},{id:271,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Đồng phạm theo Điều 17 Bộ luật Hình sự 2015 là trường hợp:`,options:[`Có từ 02 người trở lên cố ý cùng thực hiện một tội phạm`,`Nhiều người cùng vô ý gây tai nạn`,`Một người thực hiện nhiều tội phạm liên tiếp`,`Hai người cãi nhau trên phố`],correctAnswer:0,explanation:`Khoản 1 Điều 17 BLHS 2015: "Đồng phạm là trường hợp có 02 người trở lên cố ý cùng thực hiện một tội phạm".`,legalReference:`Điều 17 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:272,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Trong vụ án đồng phạm, người tổ chức, người thực hành, người xúi giục, người giúp sức có vai trò như thế nào?`,options:[`Người thực hành trực tiếp thực hiện tội phạm; người tổ chức chủ mưu, cầm đầu; người xúi giục kích động; người giúp sức tạo điều kiện tinh thần/vật chất`,`Chỉ có người thực hành mới bị đi tù, những người khác vô can`,`Mọi người đều đóng vai trò thực hành như nhau`,`Người giúp sức luôn bị phạt nặng hơn người cầm đầu`],correctAnswer:0,explanation:`Khoản 3 Điều 17 BLHS 2015: Người đồng phạm bao gồm người tổ chức, người thực hành, người xúi giục, người giúp sức và nêu rõ vai trò của từng loại người đồng phạm.`,legalReference:`Điều 17 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:273,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Chuẩn bị phạm tội là việc tìm kiếm, sửa soạn công cụ, phương tiện hoặc tạo ra những điều kiện khác để thực hiện tội phạm. Người chuẩn bị phạm tội đối với loại tội nào sau đây thì phải chịu trách nhiệm hình sự?`,options:[`Tội phạm rất nghiêm trọng hoặc tội phạm đặc biệt nghiêm trọng quy định tại các điều khoản cụ thể của BLHS`,`Mọi tội phạm ít nghiêm trọng`,`Chỉ khi đã bắt đầu đâm chém nạn nhân`,`Chuẩn bị phạm tội không bao giờ bị xử lý hình sự`],correctAnswer:0,explanation:`Điều 14 BLHS 2015 quy định người chuẩn bị phạm một trong các tội rất nghiêm trọng hoặc đặc biệt nghiêm trọng được liệt kê cụ thể tại Khoản 2 Điều 14 mới phải chịu TNHS.`,legalReference:`Điều 14 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:274,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Phạm tội chưa đạt theo Điều 15 Bộ luật Hình sự 2015 là trường hợp:`,options:[`Cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì những nguyên nhân ngoài ý muốn của người phạm tội`,`Người phạm tội tự ý dừng lại vì ăn năn hối cải`,`Người phạm tội vô ý làm súng cướp cò`,`Hành vi chỉ dừng lại ở suy nghĩ trong đầu`],correctAnswer:0,explanation:`Điều 15 BLHS 2015: Phạm tội chưa đạt là cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì những nguyên nhân ngoài ý muốn của người phạm tội. Người phạm tội chưa đạt vẫn phải chịu TNHS.`,legalReference:`Điều 15 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:275,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tự ý nửa chừng chấm dứt việc phạm tội (Điều 16 BLHS 2015) có hậu quả pháp lý nào?`,options:[`Được miễn trách nhiệm hình sự về tội định phạm; nếu hành vi thực tế đã cấu thành một tội khác thì phải chịu TNHS về tội đó`,`Vẫn bị xử phạt khung hình phạt cao nhất của tội định phạm`,`Bị áp dụng hình phạt tử hình`,`Mặc nhiên được bồi thường tiền danh dự`],correctAnswer:0,explanation:`Điều 16 BLHS 2015: Người tự ý nửa chừng chấm dứt việc phạm tội được miễn trách nhiệm hình sự về tội định phạm; nếu hành vi thực tế đã thực hiện cấu thành một tội phạm khác thì người đó phải chịu TNHS về tội này.`,legalReference:`Điều 16 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:276,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình phạt "Cải tạo không giam giữ" có thời hạn áp dụng là bao lâu?`,options:[`Từ 06 tháng đến 03 năm`,`Từ 01 tháng đến 06 tháng`,`Từ 03 năm đến 07 năm`,`Từ 05 năm đến 10 năm`],correctAnswer:0,explanation:`Khoản 1 Điều 36 BLHS 2015 quy định hình phạt cải tạo không giam giữ được áp dụng từ 06 tháng đến 03 năm đối với người phạm tội ít nghiêm trọng, tội phạm nghiêm trọng do BLHS quy định.`,legalReference:`Điều 36 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:277,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình phạt "Tù có thời hạn" đối với một tội phạm có mức tối thiểu và tối đa là bao nhiêu (trừ trường hợp tổng hợp hình phạt)?`,options:[`Từ 03 tháng đến 20 năm`,`Từ 01 tháng đến 15 năm`,`Từ 06 tháng đến 30 năm`,`Từ 01 năm đến 25 năm`],correctAnswer:0,explanation:`Khoản 1 Điều 38 BLHS 2015: Tù có thời hạn đối với người phạm một tội có mức tối thiểu là 03 tháng và mức tối đa là 20 năm.`,legalReference:`Điều 38 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:278,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Án treo theo quy định tại Điều 65 Bộ luật Hình sự 2015 là gì?`,options:[`Là biện pháp miễn chấp hành hình phạt tù có điều kiện, áp dụng cho người bị phạt tù không quá 03 năm có nhân thân tốt và có nhiều tình tiết giảm nhẹ`,`Là một loại hình phạt chính độc lập`,`Là hình thức giam giữ bị cáo trên cây cao`,`Là biện pháp tha tù trước thời hạn vô điều kiện`],correctAnswer:0,explanation:`Điều 65 BLHS 2015: Án treo không phải là hình phạt mà là biện pháp miễn chấp hành hình phạt tù có điều kiện, áp dụng cho người bị xử phạt tù không quá 03 năm, có nhân thân tốt, có từ 02 tình tiết giảm nhẹ trở lên.`,legalReference:`Điều 65 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:279,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi "Lạm dụng chức vụ, quyền hạn chiếm đoạt tài sản" (Điều 355 BLHS) khác với "Tham ô tài sản" ở điểm nào?`,options:[`Tham ô là chiếm đoạt tài sản mà mình được giao trực tiếp quản lý; còn Lạm dụng chức vụ quyền hạn chiếm đoạt tài sản là chiếm đoạt tài sản mà mình không trực tiếp quản lý nhưng dùng uy quyền chức vụ để ép buộc giao tài sản`,`Tham ô chỉ do giám đốc ngân hàng thực hiện`,`Lạm dụng chức vụ không có mục đích chiếm đoạt`,`Cả hai tội đều là một, không có điểm phân biệt`],correctAnswer:0,explanation:`Điểm khác biệt cốt lõi: Đối tượng của tội Tham ô là tài sản người phạm tội có trách nhiệm quản lý. Còn tội Lạm dụng chức vụ quyền hạn chiếm đoạt tài sản là tài sản không do người phạm tội quản lý.`,legalReference:`Điều 353 & 355 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:280,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Theo Luật PCTN 2018, cơ quan kiểm soát tài sản, thu nhập của người có nghĩa vụ kê khai công tác tại các cơ quan của Đảng, Nhà nước ở trung ương là:`,options:[`Thanh tra Chính phủ và Ủy ban Kiểm tra Trung ương theo phân cấp quản lý cán bộ`,`Ngân hàng thương mại cổ phần nơi mở tài khoản`,`Cục Quản lý thị trường`,`Hội đồng nhân dân cấp xã`],correctAnswer:0,explanation:`Điều 30 Luật PCTN 2018 quy định Thanh tra Chính phủ và Ủy ban Kiểm tra Trung ương là các cơ quan kiểm soát tài sản thu nhập đối với người giữ chức vụ ở trung ương theo phân cấp.`,legalReference:`Điều 30 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:281,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Đưa hối lộ (Điều 364 Bộ luật Hình sự 2015) cấu thành khi:`,options:[`Người nào trực tiếp hay qua trung gian đã đưa hoặc sẽ đưa cho người có chức vụ, quyền hạn tiền, tài sản, lợi ích vật chất từ 2.000.000 đồng trở lên để họ làm hoặc không làm một việc vì lợi ích của mình`,`Tặng quà sinh nhật cho bạn học cùng lớp`,`Nộp lệ phí đăng ký xe tại kho bạc theo biên lai`,`Ủng hộ đồng bào bị lũ lụt`],correctAnswer:0,explanation:`Điều 364 BLHS 2015: Người nào trực tiếp hay qua trung gian đã đưa hoặc sẽ đưa cho người có chức vụ, quyền hạn hoặc người khác hoặc tổ chức khác bất kỳ lợi ích nào để người có chức vụ quyền hạn làm hoặc không làm việc vì lợi ích người đưa...`,legalReference:`Điều 364 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:282,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình thức xử lý kỷ luật đối với người đứng đầu cơ quan, tổ chức để xảy ra tham nhũng trong cơ quan do mình quản lý, phụ trách là:`,options:[`Khiển trách, Cảnh cáo hoặc Cách chức (tùy theo tính chất mức độ nghiêm trọng của vụ việc tham nhũng)`,`Tự động bị tử hình ngay lập tức`,`Chỉ bị phạt tiền 100.000 đồng`,`Được luân chuyển thăng chức sang cơ quan khác`],correctAnswer:0,explanation:`Điều 73 Luật PCTN 2018 quy định người đứng đầu để xảy ra tham nhũng bị xử lý kỷ luật: khiển trách, cảnh cáo hoặc cách chức.`,legalReference:`Điều 73 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:283,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Hôn nhân là quan hệ giữa vợ và chồng sau khi:`,options:[`Đã kết hôn hợp pháp theo quy định của pháp luật`,`Tổ chức lễ cưới linh đình trước họ hàng hai bên`,`Chung sống với nhau sinh được con đầu lòng`,`Lập vi bằng sống chung tại văn phòng thừa phát lại`],correctAnswer:0,explanation:`Khoản 1 Điều 3 Luật Hôn nhân và Gia đình 2014: Hôn nhân là quan hệ giữa vợ và chồng sau khi kết hôn hợp pháp.`,legalReference:`Khoản 1 Điều 3 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:284,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Những người có họ trong phạm vi 3 đời theo Luật Hôn nhân và Gia đình 2014 là:`,options:[`Đời thứ nhất là cha mẹ; Đời thứ hai là anh, chị, em cùng cha mẹ, cùng cha khác mẹ, cùng mẹ khác cha; Đời thứ ba là anh, chị, em con chú, con bác, con cô, con cậu, con dì`,`Cha mẹ, ông bà và cụ kỵ`,`Ba người bạn thân thiết cùng lớp đại học`,`Họ hàng sống cùng trong một thôn xóm`],correctAnswer:0,explanation:`Khoản 18 Điều 3 Luật HNGĐ 2014 quy định phạm vi 3 đời: Đời thứ nhất: cha mẹ; Đời thứ hai: anh chị em ruột, cùng cha khác mẹ/cùng mẹ khác cha; Đời thứ ba: anh chị em họ (con chú, bác, cô, cậu, dì).`,legalReference:`Điều 3 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:285,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Đăng ký kết hôn có yếu tố nước ngoài (giữa công dân Việt Nam với người nước ngoài) thuộc thẩm quyền của cơ quan nào?`,options:[`Ủy ban nhân dân cấp huyện nơi cư trú của công dân Việt Nam`,`Sở Ngoại vụ tỉnh`,`Công an xuất nhập cảnh`,`Bộ Tư pháp`],correctAnswer:0,explanation:`Điều 37 Luật Hộ tịch 2014 quy định UBND cấp huyện nơi cư trú của công dân Việt Nam thực hiện đăng ký kết hôn giữa công dân Việt Nam với người nước ngoài.`,legalReference:`Điều 37 Luật Hộ tịch 2014`,difficulty:`trung bình`},{id:286,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Vợ, chồng có quyền lựa chọn áp dụng chế độ tài sản nào theo Luật Hôn nhân và Gia đình 2014?`,options:[`Chế độ tài sản theo luật định hoặc Chế độ tài sản theo thỏa thuận (phải lập thành văn bản công chứng trước khi kết hôn)`,`Chỉ được áp dụng chế độ tài sản do bố mẹ chồng quyết định`,`Bắt buộc áp dụng chế độ tài sản theo luật định không được thỏa thuận`,`Tài sản luôn luôn thuộc về người có thu nhập cao hơn`],correctAnswer:0,explanation:`Điều 28 và Điều 47 Luật HNGĐ 2014 cho phép vợ chồng lựa chọn chế độ tài sản theo luật định hoặc theo thỏa thuận. Thỏa thuận chế độ tài sản phải lập trước khi kết hôn bằng văn bản công chứng.`,legalReference:`Điều 28 & 47 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:287,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Trong trường hợp vợ chồng không có thỏa thuận về chế độ tài sản thì áp dụng chế độ nào?`,options:[`Chế độ tài sản của vợ chồng theo luật định`,`Tài sản thuộc về người đứng tên trên hóa đơn`,`Tài sản thuộc về người chồng`,`Tài sản chia đều cho cha mẹ hai bên`],correctAnswer:0,explanation:`Khoản 1 Điều 28 Luật HNGĐ 2014: Trong trường hợp vợ chồng không lựa chọn áp dụng chế độ tài sản theo thoả thuận thì áp dụng chế độ tài sản của vợ chồng theo luật định.`,legalReference:`Điều 28 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:288,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Nghĩa vụ liên đới của vợ, chồng phát sinh từ giao dịch nào sau đây?`,options:[`Giao dịch do một bên thực hiện nhằm đáp ứng nhu cầu thiết yếu của gia đình hoặc giao dịch khác phù hợp với quy định về đại diện giữa vợ chồng`,`Khoản tiền vay của người chồng để đánh bạc cá độ bóng đá`,`Giao dịch kinh doanh riêng của vợ bị lừa đảo phá sản mà chồng không hề hay biết`,`Khoản bồi thường do chồng gây tai nạn bỏ trốn`],correctAnswer:0,explanation:`Điều 27 và Điều 30 Luật HNGĐ 2014: Vợ, chồng chịu trách nhiệm liên đới đối với giao dịch do một bên thực hiện nhằm đáp ứng nhu cầu thiết yếu của gia đình.`,legalReference:`Điều 27 & Điều 30 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:289,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Tòa án giải quyết ly hôn theo yêu cầu của một bên (Ly hôn đơn phương) khi có căn cứ nào?`,options:[`Có căn cứ về việc vợ, chồng có hành vi bạo lực gia đình hoặc vi phạm nghiêm trọng quyền, nghĩa vụ làm cho hôn nhân lâm vào tình trạng trầm trọng, đời sống chung không thể kéo dài, mục đích hôn nhân không đạt được`,`Người vợ đi làm về muộn 1 ngày trong tuần`,`Người chồng thích xem bóng đá ban đêm`,`Cha mẹ người vợ không thích người chồng`],correctAnswer:0,explanation:`Khoản 1 Điều 56 Luật HNGĐ 2014: Khi vợ hoặc chồng yêu cầu ly hôn mà hòa giải tại Tòa án không thành thì Tòa án giải quyết cho ly hôn nếu có căn cứ về việc vợ, chồng có hành vi bạo lực gia đình hoặc vi phạm nghiêm trọng quyền, nghĩa vụ làm cho hôn nhân trầm trọng, đời sống chung không kéo dài...`,legalReference:`Điều 56 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:290,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Khi chia tài sản chung của vợ chồng khi ly hôn, nguyên tắc chung theo luật định là:`,options:[`Tài sản chung của vợ chồng được chia đôi nhưng có tính đến các yếu tố: hoàn cảnh, công sức đóng góp, bảo vệ lợi ích chính đáng của mỗi bên, lỗi của mỗi bên`,`Chia 100% cho người chồng vì là trụ cột`,`Chia toàn bộ cho người vợ nếu người vợ không đi làm`,`Đem bán đấu giá nộp toàn bộ vào quỹ từ thiện`],correctAnswer:0,explanation:`Khoản 2 Điều 59 Luật HNGĐ 2014: Tài sản chung của vợ chồng được chia đôi nhưng có tính đến các yếu tố: hoàn cảnh gia đình; công sức đóng góp; bảo vệ lợi ích chính đáng trong sản xuất kinh doanh; lỗi của mỗi bên vi phạm quyền, nghĩa vụ...`,legalReference:`Điều 59 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:291,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Cha, mẹ không trực tiếp nuôi con sau khi ly hôn có quyền và nghĩa vụ gì đối với con chung?`,options:[`Có quyền, nghĩa vụ thăm nom con mà không ai được cản trở; nhưng không được lạm dụng việc thăm nom để cản trở hoặc gây ảnh hưởng xấu đến việc nuôi dưỡng con`,`Bị tước hoàn toàn quyền gặp gỡ con mãi mãi`,`Chỉ được nhìn con qua ảnh trên điện thoại`,`Tự động mất quyền làm cha, làm mẹ`],correctAnswer:0,explanation:`Khoản 1 và Khoản 2 Điều 82 Luật HNGĐ 2014: Cha, mẹ không trực tiếp nuôi con có nghĩa vụ tôn trọng quyền của con được sống với người trực tiếp nuôi; có quyền, nghĩa vụ thăm nom con mà không ai được cản trở.`,legalReference:`Điều 82 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:292,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Hình thức của Hợp đồng lao động theo Điều 14 Bộ luật Lao động 2019 có thể được giao kết thông qua:`,options:[`Văn bản, thông điệp dữ liệu điện tử, hoặc bằng lời nói (đối với hợp đồng có thời hạn dưới 01 tháng)`,`Chỉ bằng văn bản có công chứng nhà nước`,`Chỉ bằng lời nói cam kết trước mặt bạn bè`,`Bằng thư tay có đóng dấu bưu điện`],correctAnswer:0,explanation:`Điều 14 BLLĐ 2019: HĐLĐ phải được giao kết bằng văn bản hoặc thông điệp dữ liệu điện tử; hai bên có thể giao kết bằng lời nói đối với hợp đồng có thời hạn dưới 01 tháng (trừ một số trường hợp luật định).`,legalReference:`Điều 14 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:293,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Khi hết hạn hợp đồng lao động xác định thời hạn mà người lao động vẫn tiếp tục làm việc thì trong thời hạn bao nhiêu ngày hai bên phải ký kết hợp đồng mới?`,options:[`Trong thời hạn 30 ngày kể từ ngày hợp đồng hết hạn (nếu không ký thì hợp đồng trở thành HĐLĐ không xác định thời hạn)`,`Trong thời hạn 07 ngày`,`Trong thời hạn 60 ngày`,`Trong thời hạn 90 ngày`],correctAnswer:0,explanation:`Khoản 2 Điều 20 BLLĐ 2019: Khi HĐLĐ xác định thời hạn hết hạn mà người lao động tiếp tục làm việc thì trong thời hạn 30 ngày phải ký kết HĐLĐ mới; nếu không ký thì hợp đồng đã giao kết trở thành hợp đồng không xác định thời hạn.`,legalReference:`Khoản 2 Điều 20 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:294,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người sử dụng lao động chỉ được ký tiếp thêm TỐI ĐA bao nhiêu lần Hợp đồng lao động xác định thời hạn với một người lao động trước khi phải chuyển sang HĐLĐ không xác định thời hạn (trừ trường hợp đặc thù)?`,options:[`Chỉ được ký thêm 01 lần nữa (tổng cộng tối đa 2 lần xác định thời hạn)`,`Được ký vô hạn số lần`,`Được ký thêm 3 lần`,`Được ký thêm 5 lần`],correctAnswer:0,explanation:`Điểm c Khoản 2 Điều 20 BLLĐ 2019: Hai bên chỉ được ký tiếp 01 lần HĐLĐ xác định thời hạn; sau đó nếu người lao động vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn.`,legalReference:`Điều 20 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:295,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động làm thêm giờ vào ngày nghỉ hằng tuần (ví dụ chủ nhật) được trả lương tính theo đơn giá tiền lương ít nhất bằng bao nhiêu %?`,options:[`Ít nhất 200%`,`Ít nhất 150%`,`Ít nhất 300%`,`Ít nhất 100%`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 98 BLLĐ 2019: Vào ngày nghỉ hằng tuần, người lao động làm thêm giờ được trả ít nhất bằng 200% tiền lương của ngày làm việc bình thường.`,legalReference:`Điều 98 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:296,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động làm việc vào ban đêm thì được trả thêm ít nhất bao nhiêu % tiền lương tính theo đơn giá tiền lương của ngày làm việc bình thường?`,options:[`Ít nhất 30%`,`Ít nhất 20%`,`Ít nhất 50%`,`Ít nhất 10%`],correctAnswer:0,explanation:`Khoản 2 Điều 98 Bộ luật Lao động 2019: Người lao động làm việc vào ban đêm thì được trả thêm ít nhất bằng 30% tiền lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc của ngày làm việc bình thường.`,legalReference:`Điều 98 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:297,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động được nghỉ việc riêng mà vẫn HƯỞNG NGUYÊN LƯƠNG và phải thông báo cho người sử dụng lao động trong trường hợp nào sau đây?`,options:[`Kết hôn: nghỉ 03 ngày; Con đẻ, con nuôi kết hôn: nghỉ 01 ngày; Cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi; cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi của vợ hoặc chồng; vợ hoặc chồng; con đẻ, con nuôi chết: nghỉ 03 ngày`,`Đi du lịch cùng bạn bè: nghỉ 05 ngày`,`Sinh nhật của bản thân: nghỉ 02 ngày`,`Chuyển nhà trọ mới: nghỉ 04 ngày`],correctAnswer:0,explanation:`Khoản 1 Điều 115 Bộ luật Lao động 2019 quy định các trường hợp nghỉ việc riêng hưởng nguyên lương: Kết hôn nghỉ 3 ngày; con kết hôn nghỉ 1 ngày; cha mẹ vợ chồng con chết nghỉ 3 ngày.`,legalReference:`Điều 115 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:298,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời giờ nghỉ ngơi trong giờ làm việc theo Điều 109 Bộ luật Lao động 2019 quy định ca làm việc từ 06 giờ trở lên thì được nghỉ giữa giờ ít nhất bao nhiêu phút?`,options:[`Ít nhất 30 phút liên tục (ban đêm ít nhất 45 phút liên tục)`,`Ít nhất 15 phút`,`Ít nhất 60 phút`,`Không bắt buộc phải cho nghỉ giữa giờ`],correctAnswer:0,explanation:`Khoản 1 Điều 109 BLLĐ 2019: Người lao động làm việc theo ca từ 06 giờ trở lên thì được nghỉ giữa giờ ít nhất 30 phút liên tục, làm việc ban đêm được nghỉ giữa giờ ít nhất 45 phút liên tục.`,legalReference:`Điều 109 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:299,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Hình thức kỷ luật sa thải áp dụng đối với người lao động có hành vi nào sau đây?`,options:[`Trộm cắp, tham ô, đánh bạc, cố ý gây thương tích, sử dụng ma túy tại nơi làm việc; tiết lộ bí mật kinh doanh, công nghệ gây thiệt hại nghiêm trọng`,`Từ chối uống bia cùng lãnh đạo sau giờ làm việc`,`Quên đeo thẻ nhân viên 1 lần`,`Lập gia đình mà không báo cho giám đốc`],correctAnswer:0,explanation:`Điều 125 BLLĐ 2019 quy định các trường hợp sa thải: trộm cắp, tham ô, đánh bạc, sử dụng ma túy tại nơi làm việc; tiết lộ bí mật kinh doanh công nghệ gây thiệt hại nghiêm trọng; tự ý bỏ việc...`,legalReference:`Điều 125 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:300,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Tranh chấp lao động tập thể về quyền do cơ quan, tổ chức nào có thẩm quyền giải quyết?`,options:[`Hòa giải viên lao động; Hội đồng trọng tài lao động; Tòa án nhân dân`,`Ủy ban nhân dân cấp xã`,`Hội đồng nhân dân cấp tỉnh`,`Hiệp hội bảo vệ người tiêu dùng`],correctAnswer:0,explanation:`Điều 191 Bộ luật Lao động 2019 quy định cơ quan, tổ chức có thẩm quyền giải quyết tranh chấp lao động tập thể về quyền bao gồm: Hòa giải viên lao động, Hội đồng trọng tài lao động, Tòa án nhân dân.`,legalReference:`Điều 191 Bộ luật Lao động 2019`,difficulty:`trung bình`}],te=[{id:301,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Thuộc tính nào của Pháp luật thể hiện việc pháp luật do Nhà nước ban hành và bảo đảm thực hiện bằng sức mạnh quyền lực nhà nước?`,options:[`Tính quyền lực nhà nước (Tính cưỡng chế)`,`Tính công bằng tự nhiên`,`Tính tùy nghi xử sự`,`Tính bí mật quân sự`],correctAnswer:0,explanation:`Tính quyền lực nhà nước (bảo đảm bằng cưỡng chế) là đặc trưng cơ bản phân biệt pháp luật với đạo đức, tập quán. Chỉ có pháp luật mới được bảo đảm thực hiện bằng sức mạnh cưỡng chế của bộ máy nhà nước.`,legalReference:`Đặc trưng cơ bản của Pháp luật`,difficulty:`dễ`},{id:302,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Nhà nước liên bang khác với Nhà nước đơn nhất ở đặc điểm nào?`,options:[`Nhà nước liên bang được hợp thành từ hai hay nhiều bang/nước thành viên, có hai hệ thống pháp luật (liên bang và tiểu bang)`,`Nhà nước liên bang chỉ có duy nhất một chính phủ`,`Nhà nước đơn nhất không có hiến pháp`,`Nhà nước liên bang không có quân đội chung`],correctAnswer:0,explanation:`Nhà nước liên bang (như Mỹ, Nga, Đức) có từ 2 bang thành viên trở lên, có chủ quyền kép: hệ thống cơ quan nhà nước và pháp luật liên bang song song với hệ thống cơ quan và luật của từng bang.`,legalReference:`Hình thức cấu trúc nhà nước`,difficulty:`trung bình`},{id:303,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Chế độ chính trị là một yếu tố của hình thức nhà nước, thể hiện điều gì?`,options:[`Tổng thể các phương pháp, thủ đoạn mà các cơ quan nhà nước sử dụng để thực hiện quyền lực nhà nước`,`Cách phân chia ranh giới hành chính các tỉnh`,`Mối quan hệ buôn bán giữa các quốc gia`,`Số lượng bộ ngành trực thuộc chính phủ`],correctAnswer:0,explanation:`Chế độ chính trị là toàn bộ các phương pháp, cách thức và phương tiện mà giai cấp thống trị sử dụng để thực thi quyền lực nhà nước (phân chia chủ yếu thành chế độ dân chủ và chế độ phản dân chủ).`,legalReference:`Chế độ chính trị trong hình thức Nhà nước`,difficulty:`trung bình`},{id:304,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Khái niệm "Chủ quyền quốc gia" của Nhà nước có ý nghĩa là:`,options:[`Quyền tối cao của Nhà nước trong phạm vi lãnh thổ của mình và quyền độc lập hoàn toàn trong quan hệ quốc tế`,`Quyền xâm lược các quốc gia láng giềng`,`Quyền in tiền vô giới hạn`,`Quyền không tham gia các công ước quốc tế`],correctAnswer:0,explanation:`Chủ quyền quốc gia là quyền tối cao của quốc gia trong phạm vi lãnh thổ và quyền độc lập, tự quyết trong quan hệ đối ngoại, không chịu sự can thiệp từ bất kỳ quốc gia nào khác.`,legalReference:`Đặc trưng của Nhà nước - Chủ quyền quốc gia`,difficulty:`dễ`},{id:305,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trong quy phạm pháp luật: "Người có hành vi vi phạm trật tự an toàn giao thông mà gây thiệt hại thì phải bồi thường...", bộ phận "thì phải bồi thường" thuộc bộ phận nào?`,options:[`Chế tài dân sự`,`Giả định`,`Quy định`,`Biện pháp khen thưởng`],correctAnswer:0,explanation:`Hậu quả bất lợi mang tính cưỡng chế buộc phải bù đắp tổn thất vật chất/tinh thần cho bên bị thiệt hại là Chế tài (cụ thể là Chế tài dân sự).`,legalReference:`Cơ cấu của Quy phạm pháp luật`,difficulty:`trung bình`},{id:306,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Văn bản áp dụng pháp luật có đặc điểm cơ bản nào sau đây?`,options:[`Áp dụng một lần cho một hoặc một số đối tượng đích danh cụ thể nhằm giải quyết một vụ việc cụ thể`,`Được áp dụng lặp đi lặp lại nhiều lần cho mọi công dân`,`Có giá trị pháp lý cao hơn Hiến pháp`,`Do mọi người dân tự do viết và công bố`],correctAnswer:0,explanation:`Văn bản áp dụng pháp luật (như Bản án, Quyết định xử phạt, Quyết định bổ nhiệm...) mang tính cá biệt, áp dụng một lần duy nhất cho chủ thể cụ thể được chỉ đích danh.`,legalReference:`Phân biệt VBQPPL và Văn bản áp dụng pháp luật`,difficulty:`trung bình`},{id:307,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trường hợp nào sau đây là hành vi Vi phạm pháp luật thể hiện dưới dạng "Không hành động"?`,options:[`Bác sĩ không cứu chữa bệnh nhân đang trong cơn nguy kịch dẫn đến tử vong`,`Kẻ trộm phá khóa lấy cắp xe máy`,`Người lái xe phóng nhanh vượt ẩu đâm vào người đi bộ`,`Hành vi làm giả con dấu cơ quan nhà nước`],correctAnswer:0,explanation:`Hành vi vi phạm không hành động là việc chủ thể có nghĩa vụ pháp lý phải làm theo luật định và có đủ điều kiện để làm nhưng đã không thực hiện nghĩa vụ đó (như tội không cứu giúp người đang ở tình trạng nguy hiểm đến tính mạng, trốn thuế...).`,legalReference:`Mặt khách quan của Vi phạm pháp luật & BLHS 2015`,difficulty:`vận dụng`},{id:308,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Năng lực hành vi của chủ thể quan hệ pháp luật phụ thuộc chủ yếu vào các yếu tố nào?`,options:[`Độ tuổi, khả năng nhận thức và trạng thái sức khỏe tâm thần của chủ thể`,`Tôn giáo và tín ngưỡng của chủ thể`,`Màu da và dân tộc của chủ thể`,`Tài sản của dòng họ chủ thể`],correctAnswer:0,explanation:`Năng lực hành vi gắn liền với sự phát triển thể chất và tinh thần của con người, phụ thuộc vào độ tuổi luật định và khả năng nhận thức, điều khiển hành vi (trạng thái tinh thần tỉnh táo).`,legalReference:`Lý luận về Năng lực chủ thể trong quan hệ pháp luật`,difficulty:`dễ`},{id:309,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Một người mắc bệnh tâm thần nặng dẫn đến mất khả năng nhận thức thực hiện hành vi đốt nhà người khác thì người đó:`,options:[`Không phải chịu trách nhiệm hình sự vì không có năng lực trách nhiệm hình sự tại thời điểm thực hiện hành vi (bị áp dụng biện pháp bắt buộc chữa bệnh)`,`Vẫn bị tử hình ngay lập tức`,`Phải chịu trách nhiệm hình sự như người bình thường`,`Bị phạt tù có thời hạn 20 năm`],correctAnswer:0,explanation:`Điều 21 BLHS 2015: Người thực hiện hành vi nguy hiểm cho xã hội trong khi đang mắc bệnh tâm thần... làm mất khả năng nhận thức hoặc điều khiển hành vi thì không phải chịu trách nhiệm hình sự. Tòa án áp dụng biện pháp tư pháp bắt buộc chữa bệnh.`,legalReference:`Điều 21 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:310,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức lỗi "Vô ý vì quá tự tin" là trường hợp người vi phạm:`,options:[`Thấy trước hành vi của mình có thể gây ra hậu quả nguy hại cho xã hội nhưng cho rằng hậu quả đó sẽ không xảy ra hoặc có thể ngăn ngừa được`,`Cố ý làm hại người khác đến cùng`,`Không thấy trước hậu quả dù hoàn cảnh bắt buộc phải thấy`,`Mong muốn cho hậu quả xảy ra nhanh hơn`],correctAnswer:0,explanation:`Khoản 1 Điều 11 BLHS 2015: Vô ý vì quá tự tin là người phạm tội tuy thấy trước hành vi của mình có thể gây ra hậu quả nguy hại cho xã hội nhưng cho rằng hậu quả đó sẽ không xảy ra hoặc có thể ngăn ngừa được.`,legalReference:`Điều 11 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:311,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trách nhiệm hành chính là loại trách nhiệm pháp lý do cơ quan nào áp dụng đối với cá nhân, tổ chức vi phạm hành chính?`,options:[`Cơ quan quản lý nhà nước, người có thẩm quyền xử phạt theo Luật Xử lý vi phạm hành chính`,`Chỉ do Thẩm phán Tòa án nhân dân tối cao`,`Do Viện kiểm sát ra bản án`,`Do Giám đốc doanh nghiệp tư nhân quyết định`],correctAnswer:0,explanation:`Trách nhiệm hành chính do các cơ quan quản lý nhà nước, cán bộ có thẩm quyền (như Chủ tịch UBND, Công an, Thanh tra, Hải quan...) áp dụng theo quy định của Luật Xử lý vi phạm hành chính.`,legalReference:`Luật Xử lý vi phạm hành chính 2012 (sđbs 2020)`,difficulty:`dễ`},{id:312,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Một hành vi vi phạm pháp luật có thể đồng thời phải gánh chịu nhiều loại trách nhiệm pháp lý khác nhau không?`,options:[`Có thể (ví dụ một người vừa phải chịu trách nhiệm hình sự về tội phạm vừa phải chịu trách nhiệm dân sự bồi thường thiệt hại cho nạn nhân)`,`Không, tuyệt đối chỉ được áp dụng duy nhất 1 loại trách nhiệm`,`Chỉ được phạt tiền không được phạt tù`,`Chỉ cán bộ nhà nước mới bị áp dụng`],correctAnswer:0,explanation:`Một hành vi vi phạm có thể làm phát sinh đồng thời nhiều loại trách nhiệm pháp lý (ví dụ: phạm tội giết người vừa chịu TN hình sự ngồi tù, vừa chịu TN dân sự bồi thường chi phí mai táng cho gia đình nạn nhân).`,legalReference:`Lý luận về Trách nhiệm pháp lý`,difficulty:`trung bình`},{id:313,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hiệu lực theo không gian của văn bản quy phạm pháp luật do cơ quan nhà nước ở trung ương ban hành có phạm vi như thế nào?`,options:[`Có hiệu lực trong phạm vi toàn bộ lãnh thổ nước Cộng hòa XHCN Việt Nam (trừ trường hợp văn bản có quy định khác)`,`Chỉ có hiệu lực trong khuôn viên thủ đô Hà Nội`,`Chỉ có hiệu lực tại các thành phố trực thuộc trung ương`,`Chỉ có giá trị với người có hộ khẩu thường trú`],correctAnswer:0,explanation:`Điều 155 Luật Ban hành VBQPPL 2015: Văn bản quy phạm pháp luật của các cơ quan nhà nước ở trung ương có hiệu lực trong phạm vi toàn quốc và được áp dụng đối với mọi cơ quan, tổ chức, cá nhân trừ trường hợp văn bản có quy định khác.`,legalReference:`Điều 155 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`dễ`},{id:314,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Khi các văn bản quy phạm pháp luật do cùng một cơ quan ban hành có quy định khác nhau về cùng một vấn đề thì áp dụng quy định nào?`,options:[`Áp dụng quy định của văn bản quy phạm pháp luật được ban hành sau`,`Áp dụng quy định của văn bản ban hành trước`,`Áp dụng quy định có mức phạt tiền thấp hơn`,`Tự ý lựa chọn văn bản nào tùy thích`],correctAnswer:0,explanation:`Khoản 3 Điều 156 Luật Ban hành VBQPPL 2015: "Trong trường hợp các văn bản quy phạm pháp luật do cùng một cơ quan ban hành có quy định khác nhau về cùng một vấn đề thì áp dụng quy định của văn bản quy phạm pháp luật ban hành sau".`,legalReference:`Khoản 3 Điều 156 Luật Ban hành VBQPPL 2015`,difficulty:`trung bình`},{id:315,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trong trường hợp các văn bản quy phạm pháp luật có quy định khác nhau về cùng một vấn đề thì áp dụng văn bản nào?`,options:[`Áp dụng văn bản có hiệu lực pháp lý cao hơn`,`Áp dụng văn bản ban hành gần nhất bất kể cấp ban hành`,`Áp dụng thông tư của bộ ngành trước luật của quốc hội`,`Áp dụng quyết định của ủy ban nhân dân huyện`],correctAnswer:0,explanation:`Khoản 2 Điều 156 Luật Ban hành VBQPPL 2015: "Trong trường hợp các văn bản quy phạm pháp luật có quy định khác nhau về cùng một vấn đề thì áp dụng văn bản có hiệu lực pháp lý cao hơn".`,legalReference:`Điều 156 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`dễ`},{id:316,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Mối quan hệ giữa Pháp luật và Đạo đức là mối quan hệ:`,options:[`Tác động qua lại chặt chẽ: pháp luật thể chế hóa nhiều chuẩn mực đạo đức tiến bộ; ngược lại đạo đức hỗ trợ nâng cao ý thức chấp hành pháp luật`,`Hoàn toàn đối lập và bài trừ lẫn nhau`,`Đạo đức luôn luôn thay thế hoàn toàn được pháp luật`,`Pháp luật không bao giờ chứa đựng yếu tố đạo đức`],correctAnswer:0,explanation:`Pháp luật và đạo đức có mối quan hệ biện chứng gắn bó: đạo đức là nền tảng tinh thần; pháp luật ghi nhận và bảo vệ các giá trị đạo đức tiến bộ.`,legalReference:`Mối quan hệ giữa Pháp luật và Đạo đức`,difficulty:`dễ`},{id:317,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Sự kiện nào sau đây là một "Sự biến pháp lý"?`,options:[`Động đất làm sập nhà xưởng khiến hợp đồng gia công không thể hoàn thành đúng hẹn`,`Hai bên ký hợp đồng chuyển nhượng quyền tác giả`,`Tòa án ra quyết định xử phạt vi phạm hành chính`,`Một người viết di chúc chia tài sản`],correctAnswer:0,explanation:`Động đất là hiện tượng thiên nhiên xảy ra không do ý chí con người nhưng pháp luật gắn việc xảy ra sự kiện này với hệ quả pháp lý (sự kiện bất khả kháng làm phát sinh việc miễn trừ trách nhiệm), đó là Sự biến pháp lý.`,legalReference:`Phân loại Sự kiện pháp lý trong Dân sự`,difficulty:`trung bình`},{id:318,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Pháp chế xã hội chủ nghĩa đòi hỏi điều gì đối với mọi cơ quan, tổ chức và cá nhân?`,options:[`Phải nghiêm chỉnh và triệt để tôn trọng, tuân thủ, chấp hành Hiến pháp và pháp luật trong mọi hoạt động`,`Chỉ cần tuân thủ luật khi có người giám sát`,`Cán bộ cấp cao được quyền đứng trên pháp luật`,`Tự do làm mọi điều kể cả luật cấm nếu có lợi cho cơ quan`],correctAnswer:0,explanation:`Điều 8 Hiến pháp 2013 quy định: Nhà nước được tổ chức và hoạt động theo Hiến pháp và pháp luật, quản lý xã hội bằng Hiến pháp và pháp luật; các cơ quan, tổ chức, cá nhân phải nghiêm chỉnh chấp hành Hiến pháp và pháp luật.`,legalReference:`Điều 8 Hiến pháp 2013 & Nguyên tắc Pháp chế XHCN`,difficulty:`dễ`},{id:319,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ủy ban Thường vụ Quốc hội do ai đứng đầu?`,options:[`Chủ tịch Quốc hội`,`Chủ tịch nước`,`Thủ tướng Chính phủ`,`Tổng Thư ký Quốc hội`],correctAnswer:0,explanation:`Điều 73 Hiến pháp 2013 quy định Chủ tịch Quốc hội lãnh đạo công tác của Ủy ban thường vụ Quốc hội.`,legalReference:`Điều 73 Hiến pháp 2013`,difficulty:`dễ`},{id:320,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Trong tình trạng khẩn cấp hoặc chiến tranh mà Quốc hội không thể họp được, cơ quan nào có quyền ban hành Pháp lệnh?`,options:[`Ủy ban Thường vụ Quốc hội`,`Chính phủ`,`Hội đồng Quốc phòng và An ninh`,`Bộ Quốc phòng`],correctAnswer:0,explanation:`Khoản 2 Điều 74 Hiến pháp 2013: Ủy ban thường vụ Quốc hội ban hành pháp lệnh về những vấn đề được Quốc hội giao.`,legalReference:`Điều 74 Hiến pháp 2013`,difficulty:`trung bình`},{id:321,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Quốc hội họp công khai; trường hợp cần thiết theo đề nghị của ai thì Quốc hội quyết định họp kín?`,options:[`Theo đề nghị của Chủ tịch nước, Ủy ban thường vụ Quốc hội, Thủ tướng Chính phủ hoặc của ít nhất một phần ba tổng số đại biểu Quốc hội`,`Theo đề nghị của bất kỳ công dân nào gửi thư về`,`Theo yêu cầu của Chánh án Tòa án nhân dân cấp huyện`,`Theo chỉ thị của đại sứ quán nước ngoài`],correctAnswer:0,explanation:`Khoản 1 Điều 83 Hiến pháp 2013: Quốc hội họp công khai. Trong trường hợp cần thiết, theo đề nghị của Chủ tịch nước, UBTVQH, Thủ tướng Chính phủ hoặc của ít nhất một phần ba tổng số đại biểu Quốc hội, Quốc hội quyết định họp kín.`,legalReference:`Điều 83 Hiến pháp 2013`,difficulty:`trung bình`},{id:322,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chủ tịch nước có quyền phong hàm, cấp sĩ quan cấp tướng trong các lực lượng vũ trang nhân dân đúng hay sai?`,options:[`Đúng, Chủ tịch nước bổ nhiệm, miễn nhiệm, cách chức Tổng tham mưu trưởng, Chủ nhiệm Tổng cục Chính trị; phong, thăng, giáng, tước quân hàm cấp tướng`,`Sai, quyền này thuộc về Bộ trưởng Bộ Quốc phòng`,`Sai, quyền này thuộc về Chủ tịch Hội đồng nhân dân cấp tỉnh`,`Chỉ áp dụng với lực lượng dân quân tự vệ xã`],correctAnswer:0,explanation:`Khoản 2 Điều 88 Hiến pháp 2013 quy định Chủ tịch nước phong, thăng, giáng, tước quân hàm cấp tướng, chuẩn đô đốc, phó đô đốc, đô đốc hải quân...`,legalReference:`Điều 88 Hiến pháp 2013`,difficulty:`trung bình`},{id:323,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Phó Thủ tướng Chính phủ giúp Thủ tướng Chính phủ làm nhiệm vụ theo phân công của ai?`,options:[`Theo sự phân công của Thủ tướng Chính phủ và chịu trách nhiệm trước Thủ tướng Chính phủ về nhiệm vụ được giao`,`Theo sự chỉ đạo trực tiếp của TAND tối cao`,`Độc lập hoàn toàn không cần báo cáo Thủ tướng`,`Theo quyết định của Hội đồng nhân dân nơi cư trú`],correctAnswer:0,explanation:`Khoản 3 Điều 98 Hiến pháp 2013: Phó Thủ tướng Chính phủ giúp Thủ tướng Chính phủ làm nhiệm vụ theo sự phân công của Thủ tướng Chính phủ và chịu trách nhiệm trước Thủ tướng Chính phủ về nhiệm vụ được phân công.`,legalReference:`Điều 98 Hiến pháp 2013`,difficulty:`dễ`},{id:324,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chính phủ hoạt động theo chế độ nào theo Hiến pháp 2013?`,options:[`Chế độ tập thể, quyết định theo đa số`,`Chế độ quân chủ tập quyền`,`Chế độ thủ trưởng hành chính độc quyền`,`Chế độ phân chia cát cứ địa phương`],correctAnswer:0,explanation:`Điều 95 Hiến pháp 2013: "Chính phủ làm việc theo chế độ tập thể, quyết định theo đa số".`,legalReference:`Điều 95 Hiến pháp 2013`,difficulty:`dễ`},{id:325,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hội đồng nhân dân có nhiệm vụ bãi nhiệm đại biểu HĐND và chấp nhận việc đại biểu HĐND xin thôi làm nhiệm vụ đại biểu theo quy định của ai?`,options:[`Theo quy định của Luật Tổ chức chính quyền địa phương`,`Theo chỉ thị của Tòa án nhân dân`,`Do Chủ tịch UBND tự ý quyết định`,`Do Viện kiểm sát phê chuẩn`],correctAnswer:0,explanation:`HĐND bãi nhiệm đại biểu HĐND và chấp nhận việc thôi làm nhiệm vụ đại biểu theo quy định của Luật Tổ chức chính quyền địa phương.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`trung bình`},{id:326,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chủ tịch Ủy ban nhân dân cấp tỉnh có quyền đình chỉ việc thi hành hoặc bãi bỏ văn bản trái pháp luật của cơ quan nào?`,options:[`Cơ quan chuyên môn thuộc UBND cấp tỉnh và văn bản trái pháp luật của UBND, Chủ tịch UBND cấp huyện`,`Văn bản của Tòa án nhân dân tỉnh`,`Văn bản của Viện kiểm sát nhân dân tỉnh`,`Nghị định của Chính phủ`],correctAnswer:0,explanation:`Luật Tổ chức CQĐP: Chủ tịch UBND cấp tỉnh có quyền bãi bỏ văn bản trái pháp luật của các cơ quan chuyên môn (Sở ngành) thuộc UBND tỉnh và UBND/Chủ tịch UBND cấp huyện.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`trung bình`},{id:327,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Theo Hiến pháp 2013, nguyên tắc "Tranh tụng trong xét xử được bảo đảm" là nguyên tắc hiến định của cơ quan nào?`,options:[`Tòa án nhân dân`,`Kho bạc nhà nước`,`Ủy ban nhân dân`,`Cơ quan Hải quan`],correctAnswer:0,explanation:`Khoản 5 Điều 103 Hiến pháp 2013 quy định: "Nguyên tắc tranh tụng trong xét xử được bảo đảm" là nguyên tắc tư pháp cốt lõi của Tòa án nhân dân.`,legalReference:`Khoản 5 Điều 103 Hiến pháp 2013`,difficulty:`dễ`},{id:328,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chế độ xét xử của Tòa án nhân dân bảo đảm mấy cấp xét xử?`,options:[`Hai cấp xét xử: Sơ thẩm và Phúc thẩm`,`Một cấp duy nhất không được kháng cáo`,`Ba cấp: Sơ thẩm, Phúc thẩm và Tối cao thẩm`,`Bốn cấp xét xử bắt buộc`],correctAnswer:0,explanation:`Khoản 6 Điều 103 Hiến pháp 2013: "Chế độ xét xử sơ thẩm, phúc thẩm được bảo đảm". Giám đốc thẩm và tái thẩm là thủ tục xét lại bản án đặc biệt, không phải là cấp xét xử thứ ba.`,legalReference:`Khoản 6 Điều 103 Hiến pháp 2013`,difficulty:`trung bình`},{id:329,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Viện trưởng Viện kiểm sát nhân dân cấp tỉnh do ai bổ nhiệm, miễn nhiệm, cách chức?`,options:[`Viện trưởng Viện kiểm sát nhân dân tối cao`,`Chủ tịch UBND tỉnh`,`Chủ tịch HĐND tỉnh`,`Thủ tướng Chính phủ`],correctAnswer:0,explanation:`Luật Tổ chức VKSND: Viện trưởng VKSND tối cao bổ nhiệm, miễn nhiệm, cách chức Viện trưởng, Phó Viện trưởng Viện kiểm sát nhân dân cấp tỉnh, cấp huyện.`,legalReference:`Luật Tổ chức Viện kiểm sát nhân dân 2014`,difficulty:`trung bình`},{id:330,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ai là người có thẩm quyền ký quyết định cho nhập quốc tịch Việt Nam, thôi quốc tịch Việt Nam, trở lại quốc tịch Việt Nam hoặc tước quốc tịch Việt Nam?`,options:[`Chủ tịch nước`,`Thủ tướng Chính phủ`,`Bộ trưởng Bộ Ngoại giao`,`Chủ tịch UBND cấp tỉnh`],correctAnswer:0,explanation:`Khoản 3 Điều 88 Hiến pháp 2013 quy định Chủ tịch nước quyết định cho nhập quốc tịch, thôi quốc tịch, trở lại quốc tịch hoặc tước quốc tịch Việt Nam.`,legalReference:`Điều 88 Hiến pháp 2013 & Luật Quốc tịch Việt Nam`,difficulty:`dễ`},{id:331,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ủy ban nhân dân cấp xã có trách nhiệm thực hiện nhiệm vụ gì trong quản lý hộ tịch ở cơ sở?`,options:[`Đăng ký khai sinh, kết hôn, khai tử, giám hộ, nhận cha mẹ con theo quy định của Luật Hộ tịch`,`Xét xử các vụ án tranh chấp đất đai vượt cấp`,`Tuyên phạt tù đối với người vi phạm giao thông`,`Ban hành nghị quyết bãi bỏ luật của Quốc hội`],correctAnswer:0,explanation:`Luật Hộ tịch 2014 quy định UBND cấp xã có thẩm quyền đăng ký các việc hộ tịch cơ bản: khai sinh, kết hôn, khai tử, giám hộ, thay đổi hộ tịch cho công dân cư trú trên địa bàn.`,legalReference:`Luật Hộ tịch 2014`,difficulty:`dễ`},{id:332,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chức năng "Giám sát tối cao" của Quốc hội khác với giám sát của các cơ quan khác ở chỗ:`,options:[`Quốc hội giám sát việc tuân theo Hiến pháp, luật, nghị quyết của Quốc hội trên phạm vi toàn quốc và xem xét báo cáo công tác của các thiết chế quyền lực cao nhất`,`Quốc hội trực tiếp đi kiểm tra hộ khẩu từng gia đình`,`Quốc hội đóng vai trò kiểm sát viên tại tòa án`,`Quốc hội xử phạt tiền trực tiếp các cơ sở kinh doanh vi phạm vệ sinh an toàn thực phẩm`],correctAnswer:0,explanation:`Giám sát tối cao là hình thức giám sát mang tính quyền lực tối cao của Quốc hội tại kỳ họp đối với hoạt động của Chủ tịch nước, UBTVQH, Chính phủ, TANDTC, VKSNDTC...`,legalReference:`Điều 69 Hiến pháp 2013 & Luật Hoạt động giám sát của Quốc hội`,difficulty:`trung bình`},{id:333,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào có quyền ban hành văn bản quy phạm pháp luật dưới hình thức "Nghị quyết liên tịch"?`,options:[`Ủy ban Thường vụ Quốc hội hoặc Chính phủ phối hợp với Đoàn Chủ tịch Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam`,`Bộ Công an phối hợp với Ủy ban nhân dân cấp huyện`,`Tòa án nhân dân huyện phối hợp với Viện kiểm sát huyện`,`Doanh nghiệp liên doanh phối hợp với Phòng Thương mại`],correctAnswer:0,explanation:`Điều 4 Luật Ban hành VBQPPL 2015 quy định Nghị quyết liên tịch giữa UBTVQH hoặc Chính phủ với Đoàn Chủ tịch Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam.`,legalReference:`Điều 4 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`trung bình`},{id:334,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Theo Hiến pháp 2013, Nhân dân thực hiện quyền lực nhà nước bằng những hình thức nào?`,options:[`Bằng dân chủ trực tiếp, bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước`,`Chỉ thông qua dân chủ đại diện`,`Chỉ bằng việc đóng thuế đầy đủ`,`Thông qua các tập đoàn kinh tế tư nhân`],correctAnswer:0,explanation:`Điều 6 Hiến pháp 2013: "Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước".`,legalReference:`Điều 6 Hiến pháp 2013`,difficulty:`dễ`},{id:335,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Đại biểu Quốc hội không thể bị bắt, giam, giữ, khởi tố nếu không có sự đồng ý của ai (trừ trường hợp phạm tội quả tang)?`,options:[`Quốc hội hoặc Ủy ban Thường vụ Quốc hội trong thời gian Quốc hội không họp`,`Thủ tướng Chính phủ`,`Chánh án TAND tối cao`,`Chủ tịch Ủy ban nhân dân tỉnh nơi đại biểu ứng cử`],correctAnswer:0,explanation:`Khoản 2 Điều 81 Hiến pháp 2013: Không được bắt, giam, giữ, khởi tố đại biểu Quốc hội nếu không có sự đồng ý của Quốc hội, trong thời gian Quốc hội không họp thì phải có sự đồng ý của Ủy ban thường vụ Quốc hội.`,legalReference:`Điều 81 Hiến pháp 2013`,difficulty:`trung bình`},{id:336,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Quyền bỏ phiếu bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân là quyền của công dân đủ từ bao nhiêu tuổi trở lên?`,options:[`Đủ 18 tuổi trở lên`,`Đủ 20 tuổi trở lên`,`Đủ 21 tuổi trở lên`,`Đủ 16 tuổi trở lên`],correctAnswer:0,explanation:`Điều 27 Hiến pháp 2013 quy định: Công dân đủ mười tám tuổi trở lên có quyền bầu cử và đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.`,legalReference:`Điều 27 Hiến pháp 2013`,difficulty:`dễ`},{id:337,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Theo BLDS 2015, người nghiện ma túy, nghiện các chất kích thích khác dẫn đến phá tán tài sản của gia đình thì có thể bị Tòa án tuyên bố:`,options:[`Bị hạn chế năng lực hành vi dân sự theo yêu cầu của người có quyền, lợi ích liên quan`,`Bị mất năng lực hành vi dân sự`,`Bị tước quyền công dân suốt đời`,`Bị tuyên bố mất tích`],correctAnswer:0,explanation:`Khoản 1 Điều 24 BLDS 2015: Người nghiện ma túy, nghiện các chất kích thích khác dẫn đến phá tán tài sản của gia đình thì theo yêu cầu của người có quyền, lợi ích liên quan, Tòa án có thể ra quyết định tuyên bố người này là người bị hạn chế năng lực hành vi dân sự.`,legalReference:`Điều 24 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:338,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Giao dịch dân sự liên quan đến tài sản của người bị hạn chế năng lực hành vi dân sự phải có sự đồng ý của ai?`,options:[`Người đại diện theo pháp luật của người đó, trừ giao dịch nhằm phục vụ nhu cầu sinh hoạt hàng ngày hoặc luật có quy định khác`,`Công an xã nơi thường trú`,`Bác sĩ điều trị cai nghiện`,`Tổ trưởng tổ dân phố`],correctAnswer:0,explanation:`Khoản 2 Điều 24 BLDS 2015: Việc xác lập, thực hiện giao dịch dân sự liên quan đến tài sản của người bị hạn chế năng lực hành vi dân sự phải có sự đồng ý của người đại diện theo pháp luật, trừ giao dịch nhằm phục vụ nhu cầu sinh hoạt hàng ngày.`,legalReference:`Điều 24 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:339,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Pháp nhân chấm dứt tồn tại trong trường hợp nào sau đây?`,options:[`Hợp nhất, sáp nhập, chia, chuyển đổi hình thức, giải thể hoặc bị tuyên bố phá sản theo quy định của pháp luật`,`Thay đổi người đại diện theo pháp luật`,`Thay đổi địa chỉ trụ sở chính sang quận khác`,`Tăng hoặc giảm vốn điều lệ`],correctAnswer:0,explanation:`Điều 96 BLDS 2015 quy định pháp nhân chấm dứt trong các trường hợp: Hợp nhất, sáp nhập, chia, chuyển đổi hình thức, giải thể, bị tuyên bố phá sản.`,legalReference:`Điều 96 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:340,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hoa lợi và Lợi tức theo Bộ luật Dân sự 2015 được định nghĩa như thế nào?`,options:[`Hoa lợi là sản vật tự nhiên mà tài sản mang lại; Lợi tức là các khoản lợi thu được từ việc khai thác tài sản`,`Hoa lợi là tiền lãi ngân hàng; Lợi tức là trái cây hái từ vườn`,`Cả hai đều là tiền bồi thường bảo hiểm`,`Là các khoản thuế phải nộp cho nhà nước`],correctAnswer:0,explanation:`Điều 109 BLDS 2015: 1. Hoa lợi là sản vật tự nhiên mà tài sản mang lại (hoa quả, bê con đẻ ra...); 2. Lợi tức là các khoản lợi thu được từ việc khai thác tài sản (tiền cho thuê nhà, tiền lãi gửi tiết kiệm...).`,legalReference:`Điều 109 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:341,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Quyền chiếm hữu của chủ thể đối với tài sản là:`,options:[`Quyền nắm giữ, chi phối tài sản một cách trực tiếp hoặc gián tiếp như chủ thể có quyền đối với tài sản`,`Quyền đem tài sản đi bán đấu giá`,`Quyền tự ý phá hủy tài sản`,`Quyền bắt người khác giao nộp tài sản vô điều kiện`],correctAnswer:0,explanation:`Điều 179 BLDS 2015: Chiếm hữu là việc chủ thể nắm giữ, chi phối tài sản một cách trực tiếp hoặc gián tiếp như chủ thể có quyền đối với tài sản.`,legalReference:`Điều 179 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:342,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hợp đồng dân sự bị vô hiệu do giả tạo (Điều 124 BLDS 2015) khi nào?`,options:[`Khi các bên xác lập giao dịch dân sự một cách giả tạo nhằm che giấu một giao dịch dân sự khác, hoặc nhằm trốn tránh nghĩa vụ với người thứ ba`,`Khi hai bên ký hợp đồng trước mặt công chứng viên`,`Khi hợp đồng được giao kết bằng văn bản có chữ ký tươi`,`Khi một bên trả bằng tiền đô la Mỹ`],correctAnswer:0,explanation:`Điều 124 BLDS 2015: Khi các bên xác lập giao dịch dân sự một cách giả tạo nhằm che giấu một giao dịch khác thì giao dịch giả tạo vô hiệu, còn giao dịch bị che giấu vẫn có hiệu lực nếu đáp ứng đủ điều kiện luật định.`,legalReference:`Điều 124 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:343,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Biện pháp "Ký quỹ" theo Điều 330 Bộ luật Dân sự 2015 là việc:`,options:[`Bên có nghĩa vụ gửi một khoản tiền hoặc kim khí quý, đá quý hoặc giấy tờ có giá vào tài khoản phong tỏa tại một tổ chức tín dụng để bảo đảm thực hiện nghĩa vụ`,`Giao xe máy cho chủ nợ giữ tại nhà riêng`,`Gửi tiền tiết kiệm không kỳ hạn rút ra bất cứ lúc nào`,`Ủy quyền cho ngân hàng thanh lý tài sản tự do`],correctAnswer:0,explanation:`Điều 330 BLDS 2015: Ký quỹ là việc bên có nghĩa vụ gửi một khoản tiền hoặc kim khí quý, đá quý, giấy tờ có giá vào tài khoản phong toả tại một tổ chức tín dụng để bảo đảm thực hiện nghĩa vụ.`,legalReference:`Điều 330 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:344,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Từ chối nhận di sản thừa kế theo Điều 620 Bộ luật Dân sự 2015 có hiệu lực khi:`,options:[`Người thừa kế thể hiện ý chí bằng văn bản gửi cho người quản lý di sản, những người thừa kế khác, người được giao nhiệm vụ phân chia di sản và phải được thực hiện trước thời điểm phân chia di sản`,`Nói miệng với bạn bè ngoài quán nước`,`Gửi tin nhắn facebook cho em họ`,`Bỏ đi nước ngoài không để lại liên lạc`],correctAnswer:0,explanation:`Điều 620 BLDS 2015: Việc từ chối nhận di sản phải được lập thành văn bản và gửi đến người quản lý di sản, những người thừa kế khác... Việc từ chối phải được thể hiện trước thời điểm phân chia di sản.`,legalReference:`Điều 620 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:345,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trường hợp nào người thừa kế KHÔNG ĐƯỢC từ chối nhận di
