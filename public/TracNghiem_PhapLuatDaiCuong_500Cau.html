sản?`,options:[`Việc từ chối nhằm trốn tránh việc thực hiện nghĩa vụ tài sản của mình đối với người khác`,`Khi di sản để lại có giá trị quá lớn`,`Khi người đó là con một trong gia đình`,`Khi di sản gồm cả nhà và đất`],correctAnswer:0,explanation:`Khoản 1 Điều 620 BLDS 2015: "Không được từ chối nhận di sản nếu việc từ chối nhằm trốn tránh việc thực hiện nghĩa vụ tài sản của mình đối với người khác".`,legalReference:`Khoản 1 Điều 620 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:346,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Ai trong số những người sau đây thuộc Hàng thừa kế thứ hai theo quy định tại Điểm b Khoản 1 Điều 651 BLDS 2015?`,options:[`Ông nội, bà nội, ông ngoại, bà ngoại, anh ruột, chị ruột, em ruột của người chết; cháu ruột của người chết mà người chết là ông nội, bà nội, ông ngoại, bà ngoại`,`Con nuôi hợp pháp của người chết`,`Cha đẻ, mẹ đẻ của người chết`,`Người yêu của người chết sống chung như vợ chồng`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 651 BLDS 2015: Hàng thừa kế thứ hai gồm: ông nội, bà nội, ông ngoại, bà ngoại, anh ruột, chị ruột, em ruột của người chết; cháu ruột của người chết mà người chết là ông bà nội, ngoại.`,legalReference:`Điều 651 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:347,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hàng thừa kế thứ ba theo Điểm c Khoản 1 Điều 651 BLDS 2015 bao gồm những người nào?`,options:[`Cụ nội, cụ ngoại của người chết; bác ruột, chú ruột, cậu ruột, cô ruột, dì ruột của người chết; cháu ruột gọi người chết là bác/chú/cậu/cô/dì; chắt ruột mà người chết là cụ nội/ngoại`,`Vợ kế của cha đẻ`,`Anh em họ hàng bắn đại bác không tới`,`Bạn đồng nghiệp thân cận`],correctAnswer:0,explanation:`Điểm c Khoản 1 Điều 651 BLDS 2015 quy định cụ thể hàng thừa kế thứ ba gồm cụ nội ngoại, bác chú cô dì cậu ruột, cháu ruột gọi người chết là bác chú cô dì cậu, chắt ruột...`,legalReference:`Điều 651 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:348,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Khi một người chết mà không có người thừa kế theo di chúc và cũng không có người thừa kế theo pháp luật (hoặc đều từ chối nhận di sản) thì di sản đó thuộc về ai sau khi thanh toán xong các nghĩa vụ tài sản?`,options:[`Thuộc về Nhà nước`,`Chia đều cho hàng xóm láng giềng xung quanh`,`Thuộc về người phát hiện xác chết đầu tiên`,`Tổ chức tôn giáo địa phương thụ hưởng`],correctAnswer:0,explanation:`Điều 622 BLDS 2015 quy định trường hợp không có người thừa kế theo di chúc, theo pháp luật hoặc có nhưng không được quyền hưởng, bị truất quyền hoặc từ chối nhận di sản thì sau khi thanh toán nghĩa vụ tài sản, phần di sản còn lại thuộc về Nhà nước.`,legalReference:`Điều 622 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:349,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trách nhiệm bồi thường thiệt hại do súc vật gây ra theo Điều 603 Bộ luật Dân sự 2015 quy định:`,options:[`Chủ sở hữu súc vật phải bồi thường thiệt hại do súc vật gây ra cho người khác; người chiếm hữu, sử dụng súc vật phải bồi thường trong thời gian chiếm hữu, sử dụng (trừ trường hợp thỏa thuận khác)`,`Không ai phải chịu trách nhiệm vì động vật không có nhận thức`,`Người bị chó cắn tự chịu viện phí`,`Ủy ban nhân dân cấp xã bồi thường`],correctAnswer:0,explanation:`Điều 603 BLDS 2015: Chủ sở hữu súc vật phải bồi thường thiệt hại do súc vật gây ra cho người khác. Người chiếm hữu, sử dụng súc vật phải bồi thường thiệt hại trong thời gian chiếm hữu, sử dụng súc vật, trừ thỏa thuận khác.`,legalReference:`Điều 603 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:350,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Bồi thường thiệt hại do cây cối gãy, đổ gây ra (Điều 604 BLDS 2015) do ai chịu trách nhiệm?`,options:[`Chủ sở hữu, người chiếm hữu, người được giao quản lý cây cối phải bồi thường thiệt hại do cây cối đổ, gãy gây ra, trừ trường hợp do sự kiện bất khả kháng hoặc hoàn toàn do lỗi của người bị thiệt hại`,`Chỉ bồi thường khi cây cối do cơ quan nhà nước trồng`,`Công ty công viên cây xanh luôn luôn miễn trách nhiệm`,`Chỉ bồi thường nếu có gió bão cấp 12 trở lên`],correctAnswer:0,explanation:`Điều 604 BLDS 2015: Chủ sở hữu, người chiếm hữu, người được giao quản lý phải bồi thường thiệt hại do cây cối gãy, đổ gây ra, trừ trường hợp bất khả kháng hoặc hoàn toàn do lỗi của nạn nhân.`,legalReference:`Điều 604 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:351,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Người tham gia tố tụng dân sự gồm những nhóm chủ thể nào theo BLTTDS 2015?`,options:[`Đương sự (Nguyên đơn, bị đơn, người có quyền lợi nghĩa vụ liên quan) và Người tham gia tố tụng khác (người bảo vệ quyền lợi, người làm chứng, người giám định, người phiên dịch, người đại diện)`,`Chỉ gồm Thẩm phán và Thư ký tòa`,`Chỉ gồm Nguyên đơn và Bị đơn`,`Chỉ có người làm chứng và công an`],correctAnswer:0,explanation:`Chương VI BLTTDS 2015 quy định: Người tham gia tố tụng dân sự gồm đương sự (Điều 68) và những người tham gia tố tụng khác như người bảo vệ quyền và lợi ích hợp pháp, người làm chứng, người giám định, người phiên dịch (Điều 75-84).`,legalReference:`Chương VI Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:352,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Đương sự có quyền yêu cầu thay đổi Thẩm phán, Hội thẩm nhân dân trong trường hợp nào sau đây?`,options:[`Họ đồng thời là đương sự, người đại diện, người thân thích của đương sự; hoặc có căn cứ rõ ràng khác cho rằng họ có thể không vô tư trong khi làm nhiệm vụ`,`Khi Thẩm phán quá nghiêm khắc`,`Khi Thẩm phán yêu cầu nộp tài liệu chứng cứ đúng luật`,`Khi Hội thẩm nhân dân là phụ nữ`],correctAnswer:0,explanation:`Điều 52 và Điều 53 BLTTDS 2015 quy định những trường hợp phải từ chối hoặc bị thay đổi Thẩm phán, Hội thẩm nhân dân: là người thân thích của đương sự; đã tham gia tố tụng với tư cách khác; hoặc có căn cứ rõ ràng cho thấy không vô tư.`,legalReference:`Điều 52 & 53 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:353,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hạn chuẩn bị xét xử vụ án dân sự thông thường là bao lâu kể từ ngày thụ lý vụ án?`,options:[`04 tháng (đối với vụ án phức tạp hoặc bất khả kháng thì có thể gia hạn nhưng không quá 02 tháng)`,`01 tháng`,`12 tháng`,`02 năm`],correctAnswer:0,explanation:`Điểm a Khoản 1 Điều 203 BLTTDS 2015: Thời hạn chuẩn bị xét xử các vụ án dân sự quy định tại Điều 26 và Điều 28 là 04 tháng kể từ ngày thụ lý vụ án; vụ án phức tạp được gia hạn không quá 02 tháng.`,legalReference:`Điều 203 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:354,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Kháng nghị theo thủ tục Giám đốc thẩm, Tái thẩm bản án dân sự đã có hiệu lực pháp luật thuộc thẩm quyền của ai?`,options:[`Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao, Chánh án TAND cấp cao, Viện trưởng VKSND cấp cao`,`Ủy ban nhân dân cấp tỉnh`,`Luật sư của nguyên đơn`,`Giám đốc Công an tỉnh`],correctAnswer:0,explanation:`Điều 331 và Điều 354 BLTTDS 2015 quy định người có quyền kháng nghị giám đốc thẩm, tái thẩm là Chánh án TANDTC, Viện trưởng VKSNDTC, Chánh án TAND cấp cao và Viện trưởng VKSND cấp cao theo thẩm quyền.`,legalReference:`Điều 331 & 354 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:355,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Công ty mẹ và công ty con trong nhóm công ty theo Luật Doanh nghiệp 2020 có mối quan hệ như thế nào?`,options:[`Công ty mẹ sở hữu trên 50% vốn điều lệ/cổ phần của công ty con, hoặc có quyền trực tiếp bổ nhiệm đa số thành viên HĐQT/Giám đốc của công ty con, hoặc có quyền sửa đổi Điều lệ công ty con`,`Hai công ty hoàn toàn không có mối quan hệ sở hữu hay kiểm soát`,`Công ty mẹ chịu trách nhiệm liên đới vô hạn đối với toàn bộ khoản nợ của công ty con`,`Công ty con không có tư cách pháp nhân riêng`],correctAnswer:0,explanation:`Điều 195 Luật Doanh nghiệp 2020 quy định các tiêu chí xác định công ty mẹ - công ty con: sở hữu trên 50% vốn điều lệ/cổ phần, có quyền bổ nhiệm đa số lãnh đạo hoặc sửa đổi Điều lệ của công ty con.`,legalReference:`Điều 195 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:356,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Ban Kiểm soát là cơ quan bắt buộc phải có trong Công ty Cổ phần khi nào?`,options:[`Công ty cổ phần có từ 11 cổ đông là cá nhân trở lên hoặc có cổ đông là tổ chức sở hữu trên 50% tổng số cổ phần của công ty (nếu công ty áp dụng mô hình có Ban kiểm soát)`,`Mọi công ty cổ phần đều không bao giờ cần Ban kiểm soát`,`Chỉ khi công ty phát hành cổ phiếu ra thị trường quốc tế`,`Chỉ khi công ty làm ăn thua lỗ`],correctAnswer:0,explanation:`Điều 137 Luật Doanh nghiệp 2020 quy định mô hình tổ chức công ty cổ phần. Trường hợp có dưới 11 cổ đông cá nhân và các cổ đông tổ chức sở hữu dưới 50% tổng số cổ phần thì không bắt buộc phải có Ban kiểm soát.`,legalReference:`Điều 137 Luật Doanh nghiệp 2020`,difficulty:`vận dụng`},{id:357,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Doanh nghiệp nhà nước theo Luật Doanh nghiệp 2020 bao gồm những doanh nghiệp nào?`,options:[`Doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ và Doanh nghiệp do Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết`,`Chỉ duy nhất doanh nghiệp Nhà nước nắm giữ 100% vốn`,`Mọi doanh nghiệp có vốn nhà nước từ 1% trở lên`,`Doanh nghiệp tư nhân nộp nhiều thuế cho Nhà nước`],correctAnswer:0,explanation:`Khoản 11 Điều 4 và Điều 88 Luật Doanh nghiệp 2020: Doanh nghiệp nhà nước bao gồm các doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ và doanh nghiệp do Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết.`,legalReference:`Điều 88 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:358,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trường hợp thành viên Công ty TNHH 2 thành viên trở lên chết thì phần vốn góp của người đó được giải quyết thế nào?`,options:[`Người thừa kế hợp pháp của thành viên đó trở thành thành viên của công ty`,`Công ty tự động tịch thu phần vốn đó chia đều cho các thành viên còn lại`,`Phần vốn đó tự động sung vào kho bạc nhà nước`,`Bắt buộc phải giải thể công ty ngay lập tức`],correctAnswer:0,explanation:`Khoản 1 Điều 53 Luật Doanh nghiệp 2020: Trường hợp thành viên chết thì người thừa kế theo di chúc hoặc theo pháp luật của thành viên đó là thành viên công ty.`,legalReference:`Điều 53 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:359,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Doanh nghiệp xã hội là doanh nghiệp hoạt động với mục tiêu chủ yếu nào?`,options:[`Hoạt động nhằm giải quyết vấn đề xã hội, môi trường vì lợi ích cộng đồng và sử dụng ít nhất 51% tổng lợi nhuận sau thuế hằng năm để tái đầu tư nhằm thực hiện mục tiêu đã đăng ký`,`Hoạt động phi lợi nhuận 100% không thu bất kỳ khoản tiền nào`,`Do Mặt trận Tổ quốc đứng tên đầu tư`,`Doanh nghiệp không phải nộp thuế môn bài`],correctAnswer:0,explanation:`Khoản 1 Điều 10 Luật Doanh nghiệp 2020 quy định Doanh nghiệp xã hội là doanh nghiệp đăng ký nhằm mục tiêu giải quyết vấn đề xã hội, môi trường và sử dụng ít nhất 51% tổng lợi nhuận sau thuế để tái đầu tư thực hiện mục tiêu.`,legalReference:`Điều 10 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:360,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Chủ doanh nghiệp tư nhân có quyền cho thuê doanh nghiệp của mình không?`,options:[`Có quyền cho thuê toàn bộ doanh nghiệp của mình nhưng phải thông báo bằng văn bản kèm hợp đồng cho Cơ quan đăng ký kinh doanh và cơ quan thuế`,`Tuyệt đối không được phép cho thuê doanh nghiệp`,`Được cho thuê nhưng người thuê phải chịu mọi khoản nợ cũ của chủ cũ`,`Chỉ được cho thuê trong thời hạn tối đa 30 ngày`],correctAnswer:0,explanation:`Điều 191 Luật Doanh nghiệp 2020: Chủ DNTN có quyền cho thuê toàn bộ doanh nghiệp của mình nhưng vẫn phải chịu trách nhiệm trước pháp luật với tư cách là chủ sở hữu DNTN.`,legalReference:`Điều 191 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:361,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hội nghị chủ nợ trong thủ tục phá sản hợp lệ khi có sự tham gia của số lượng chủ nợ đại diện cho bao nhiêu phần trăm tổng số nợ không có bảo đảm?`,options:[`Có số chủ nợ tham gia đại diện cho ít nhất 51% tổng số nợ không có bảo đảm`,`Đại diện cho 100% tổng số nợ`,`Đại diện cho 30% tổng số nợ`,`Chỉ cần 01 chủ nợ lớn nhất có mặt`],correctAnswer:0,explanation:`Khoản 1 Điều 79 Luật Phá sản 2014: Hội nghị chủ nợ hợp lệ nếu có số chủ nợ tham gia đại diện cho ít nhất 51% tổng số nợ không có bảo đảm.`,legalReference:`Điều 79 Luật Phá sản 2014`,difficulty:`vận dụng`},{id:362,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Quản tài viên trong thủ tục giải quyết phá sản doanh nghiệp là ai?`,options:[`Cá nhân hành nghề quản lý, thanh lý tài sản của doanh nghiệp, hợp tác xã mất khả năng thanh toán trong quá trình giải quyết phá sản`,`Kế toán trưởng của doanh nghiệp bị phá sản`,`Thư ký phiên tòa dân sự`,`Người đại diện của Viện kiểm sát`],correctAnswer:0,explanation:`Khoản 7 Điều 4 Luật Phá sản 2014: Quản tài viên là cá nhân hành nghề quản lý, thanh lý tài sản của doanh nghiệp, hợp tác xã mất khả năng thanh toán trong quá trình giải quyết phá sản.`,legalReference:`Điều 4 Luật Phá sản 2014`,difficulty:`dễ`},{id:363,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trọng tài quy chế khác với Trọng tài vụ việc (Ad-hoc) ở điểm nào?`,options:[`Trọng tài quy chế là hình thức giải quyết tranh chấp tại một Trung tâm trọng tài có điều lệ, quy tắc tố tụng và danh sách trọng tài viên cố định`,`Trọng tài quy chế do Tòa án chỉ định thành lập`,`Trọng tài vụ việc có trụ sở văn phòng thường trực vĩnh viễn`,`Phán quyết của trọng tài vụ việc không có giá trị thi hành`],correctAnswer:0,explanation:`Điều 3 Luật Trọng tài thương mại 2010: Trọng tài quy chế là hình thức giải quyết tranh chấp tại một trung tâm trọng tài theo điều lệ và quy tắc tố tụng của trung tâm đó; Trọng tài vụ việc do các bên tự thỏa thuận thành lập để giải quyết vụ việc cụ thể.`,legalReference:`Điều 3 Luật Trọng tài thương mại 2010`,difficulty:`trung bình`},{id:364,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Một bên có quyền yêu cầu Tòa án HỦY phán quyết trọng tài thương mại trong thời hạn bao nhiêu ngày kể từ ngày nhận được phán quyết?`,options:[`30 ngày`,`15 ngày`,`60 ngày`,`90 ngày`],correctAnswer:0,explanation:`Khoản 1 Điều 69 Luật Trọng tài thương mại 2010: Trong thời hạn 30 ngày, kể từ ngày nhận được phán quyết trọng tài, nếu một bên có đủ căn cứ chứng minh Hội đồng trọng tài vi phạm thủ tục... thì có quyền làm đơn yêu cầu Tòa án huỷ phán quyết trọng tài.`,legalReference:`Điều 69 Luật Trọng tài thương mại 2010`,difficulty:`trung bình`},{id:365,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Chế tài Bồi thường thiệt hại trong thương mại nhằm mục đích gì?`,options:[`Buộc bên vi phạm bồi thường những tổn thất do hành vi vi phạm hợp đồng gây ra cho bên bị vi phạm (gồm giá trị tổn thất thực tế, trực tiếp và khoản lợi trực tiếp bị bỏ lỡ)`,`Phạt tù bên vi phạm để răn đe`,`Tịch thu toàn bộ tài sản doanh nghiệp nộp ngân sách`,`Buộc bên vi phạm phải xin lỗi công khai trên báo chí 10 kỳ liên tiếp`],correctAnswer:0,explanation:`Điều 302 Luật Thương mại 2005: Bồi thường thiệt hại là việc bên vi phạm bồi thường những tổn thất do hành vi vi phạm hợp đồng gây ra; giá trị bồi thường gồm giá trị tổn thất thực tế, trực tiếp và khoản lợi trực tiếp mà bên bị vi phạm đáng lẽ được hưởng.`,legalReference:`Điều 302 Luật Thương mại 2005`,difficulty:`trung bình`},{id:366,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hành vi nào sau đây là hành vi Cạnh tranh không lành mạnh bị cấm theo Luật Cạnh tranh 2018?`,options:[`Xâm phạm thông tin bí mật kinh doanh; ép buộc trong kinh doanh; gièm pha doanh nghiệp khác; gây rối hoạt động kinh doanh của doanh nghiệp khác`,`Đầu tư cải tiến công nghệ giảm giá thành sản phẩm`,`Tăng lương và chế độ đãi ngộ để thu hút nhân tài`,`Mở thêm nhiều chi nhánh trên toàn quốc`],correctAnswer:0,explanation:`Điều 45 Luật Cạnh tranh 2018 quy định các hành vi cạnh tranh không lành mạnh bị cấm: xâm phạm bí mật kinh doanh, ép buộc khách hàng, gièm pha doanh nghiệp, gây rối hoạt động...`,legalReference:`Điều 45 Luật Cạnh tranh 2018`,difficulty:`dễ`},{id:367,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thương nhân theo quy định của Luật Thương mại 2005 bao gồm:`,options:[`Tổ chức kinh tế được thành lập hợp pháp, cá nhân hoạt động thương mại một cách độc lập, thường xuyên và có đăng ký kinh doanh`,`Mọi công dân từ đủ 18 tuổi bất kể có kinh doanh hay không`,`Các cơ quan quản lý hành chính nhà nước`,`Các trường đại học công lập`],correctAnswer:0,explanation:`Khoản 1 Điều 6 Luật Thương mại 2005: Thương nhân bao gồm tổ chức kinh tế được thành lập hợp pháp, cá nhân hoạt động thương mại một cách độc lập, thường xuyên và có đăng ký kinh doanh.`,legalReference:`Khoản 1 Điều 6 Luật Thương mại 2005`,difficulty:`dễ`},{id:368,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong hợp đồng mua bán hàng hóa, rủi ro về mất mát hoặc hư hỏng hàng hóa được chuyển giao từ bên bán sang bên mua khi nào?`,options:[`Kể từ thời điểm bên bán chuyển giao quyền chiếm hữu hàng hóa cho bên mua (trừ trường hợp có thỏa thuận khác)`,`Kể từ khi bên mua thanh toán tiền đặt cọc`,`Kể từ ngày ký hợp đồng`,`Khi hàng hóa vẫn còn nằm trong kho của bên bán`],correctAnswer:0,explanation:`Điều 57 Luật Thương mại 2005: Trừ trường hợp có thoả thuận khác, rủi ro về mất mát hoặc hư hỏng hàng hoá được chuyển cho bên mua kể từ thời điểm hàng hoá được chuyển giao cho bên mua hoặc người đại diện của bên mua.`,legalReference:`Điều 57 Luật Thương mại 2005`,difficulty:`trung bình`},{id:369,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Cố ý gây thương tích hoặc gây tổn hại cho sức khỏe của người khác (Điều 134 BLHS 2015) khởi điểm bị truy cứu TNHS khi tỷ lệ tổn thương cơ thể là bao nhiêu % (hoặc dưới mức đó nhưng thuộc trường hợp luật định)?`,options:[`Từ 11% đến 30% (hoặc dưới 11% nhưng dùng vũ khí nguy hiểm, có tính chất côn đồ...)`,`Từ 31% trở lên`,`Từ 50% trở lên`,`Bất kể thương tích 1%`],correctAnswer:0,explanation:`Khoản 1 Điều 134 BLHS 2015: Người nào cố ý gây thương tích hoặc gây tổn hại cho sức khỏe của người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30% hoặc dưới 11% nhưng thuộc một trong các trường hợp luật định (dùng hung khí nguy hiểm, a-xít...) thì bị phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm.`,legalReference:`Điều 134 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:370,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Cướp giật tài sản (Điều 171 Bộ luật Hình sự 2015) có hành vi đặc trưng nào?`,options:[`Nhanh chóng giằng lấy tài sản của người khác rồi nhanh chóng tẩu thoát`,`Lén lút thò tay móc ví trong túi quần nạn nhân`,`Dùng vũ lực khống chế trói nạn nhân vào cột`,`Vay tiền rồi viện cớ không trả`],correctAnswer:0,explanation:`Đặc trưng của Tội cướp giật tài sản (Điều 171 BLHS) là hành vi công khai, nhanh chóng giật lấy tài sản rồi lợi dụng sự sơ hở, bất ngờ của nạn nhân để tẩu thoát.`,legalReference:`Điều 171 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:371,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Lừa đảo chiếm đoạt tài sản (Điều 174 Bộ luật Hình sự 2015) cấu thành với dấu hiệu đặc trưng nào?`,options:[`Dùng thủ đoạn gian dối làm cho chủ tài sản tin tưởng tự nguyện giao tài sản cho mình nhằm chiếm đoạt`,`Dùng dao đe dọa ép buộc giao tài sản`,`Lén lút đột nhập vào nhà lúc nửa đêm`,`Nhặt được của rơi không chịu trả lại`],correctAnswer:0,explanation:`Dấu hiệu đặc trưng của Tội lừa đảo chiếm đoạt tài sản (Điều 174 BLHS) là thủ đoạn gian dối đưa ra thông tin sai sự thật để người bị hại tin và tự nguyện giao tài sản.`,legalReference:`Điều 174 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:372,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Lạm dụng tín nhiệm chiếm đoạt tài sản (Điều 175 BLHS 2015) khác với Tội Lừa đảo chiếm đoạt tài sản ở điểm nào?`,options:[`Lạm dụng tín nhiệm là nhận được tài sản một cách hợp pháp thông qua hợp đồng vay mượn, thuê mướn... sau đó mới nảy sinh ý định chiếm đoạt và dùng thủ đoạn gian dối hoặc bỏ trốn để chiếm đoạt`,`Lạm dụng tín nhiệm có thủ đoạn gian dối ngay từ trước khi nhận tài sản`,`Hai tội danh hoàn toàn giống nhau không phân biệt`,`Lạm dụng tín nhiệm chỉ áp dụng cho người dưới 18 tuổi`],correctAnswer:0,explanation:`Điểm khác biệt căn bản: Trong Tội lừa đảo, ý định chiếm đoạt và thủ đoạn gian dối có TRƯỚC KHI nhận tài sản. Trong Tội lạm dụng tín nhiệm, tài sản nhận được hợp pháp trước, sau đó mới nảy sinh ý định chiếm đoạt.`,legalReference:`Điều 174 & 175 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:373,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Người che giấu tội phạm (Điều 18 BLHS 2015) là người:`,options:[`Không hứa hẹn trước nhưng sau khi biết tội phạm được thực hiện đã chứa chấp, che giấu người phạm tội, dấu vết, tang vật của tội phạm`,`Cùng bàn bạc kế hoạch phạm tội từ trước`,`Người trực tiếp cầm dao đâm nạn nhân`,`Người báo tin cho cơ quan công an`],correctAnswer:0,explanation:`Khoản 1 Điều 18 BLHS 2015: Người nào không hứa hẹn trước, nhưng sau khi biết tội phạm được thực hiện đã che giấu người phạm tội, dấu vết, tang vật của tội phạm... thì phải chịu trách nhiệm hình sự về tội che giấu tội phạm.`,legalReference:`Điều 18 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:374,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Trường hợp nào sau đây là người che giấu tội phạm KHÔNG PHẢI chịu trách nhiệm hình sự (trừ trường hợp che giấu các tội xâm phạm an ninh quốc gia hoặc tội đặc biệt nghiêm trọng)?`,options:[`Người che giấu là ông, bà, cha, mẹ, con, cháu, anh chị em ruột, vợ hoặc chồng của người phạm tội`,`Người che giấu là hàng xóm thân cận`,`Người che giấu là đồng nghiệp cùng cơ quan`,`Người che giấu là luật sư không tham gia bào chữa`],correctAnswer:0,explanation:`Khoản 2 Điều 18 BLHS 2015: Người che giấu tội phạm là ông, bà, cha, mẹ, con, cháu, anh chị em ruột, vợ hoặc chồng của người phạm tội không phải chịu TNHS, trừ trường hợp che giấu tội xâm phạm ANQG hoặc tội đặc biệt nghiêm trọng khác.`,legalReference:`Khoản 2 Điều 18 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:375,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình phạt "Cấm đảm nhiệm chức vụ, cấm hành nghề hoặc làm công việc nhất định" là loại hình phạt nào và có thời hạn là bao lâu?`,options:[`Là hình phạt bổ sung, có thời hạn từ 01 năm đến 05 năm kể từ ngày chấp hành xong hình phạt tù hoặc từ ngày bản án có hiệu lực`,`Là hình phạt chính, áp dụng vô thời hạn`,`Thời hạn cố định đúng 6 tháng`,`Chỉ áp dụng cho tội phạm trộm cắp vặt`],correctAnswer:0,explanation:`Điều 41 BLHS 2015: Cấm đảm nhiệm chức vụ, cấm hành nghề hoặc làm công việc nhất định được áp dụng là hình phạt bổ sung khi xét thấy nếu để người bị kết án đảm nhiệm chức vụ, hành nghề đó thì có thể gây nguy hại. Thời hạn là từ 01 năm đến 05 năm.`,legalReference:`Điều 41 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:376,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Thời hiệu thi hành bản án hình sự đối với người bị phạt tù có thời hạn từ trên 03 năm đến 15 năm là bao nhiêu năm?`,options:[`10 năm`,`05 năm`,`15 năm`,`20 năm`],correctAnswer:0,explanation:`Điểm b Khoản 2 Điều 60 BLHS 2015: Thời hiệu thi hành bản án hình sự là 10 năm đối với các trường hợp xử phạt tù từ trên 03 năm đến 15 năm.`,legalReference:`Điều 60 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:377,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi "Môi giới hối lộ" theo Điều 365 Bộ luật Hình sự 2015 là hành vi:`,options:[`Làm trung gian giữa người đưa hối lộ và người nhận hối lộ để họ thực hiện việc đưa và nhận hối lộ`,`Người trực tiếp nhận tiền để cấp phép sai luật`,`Người trực tiếp chi tiền để chạy việc`,`Người tố giác tội phạm tham nhũng`],correctAnswer:0,explanation:`Điều 365 BLHS 2015: Người nào môi giới hối lộ mà của hối lộ có giá trị từ 2.000.000 đồng đến dưới 100.000.000 đồng hoặc dưới 2.000.000 đồng nhưng thuộc trường hợp luật định thì bị truy cứu TNHS về Tội môi giới hối lộ.`,legalReference:`Điều 365 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:378,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi "Lợi dụng chức vụ, quyền hạn trong khi thi hành công vụ" (Điều 356 BLHS 2015) là hành vi:`,options:[`Vì vụ lợi hoặc động cơ cá nhân khác mà lợi dụng chức vụ, quyền hạn làm trái công vụ gây thiệt hại về tài sản từ 10.000.000 đồng trở lên hoặc gây thiệt hại đến lợi ích của Nhà nước, tổ chức`,`Trộm cắp tài sản của đồng nghiệp`,`Cướp tài sản của người dân`,`Cố ý gây thương tích ngoài giờ làm việc`],correctAnswer:0,explanation:`Điều 356 BLHS 2015: Người nào vì vụ lợi hoặc động cơ cá nhân khác mà lợi dụng chức vụ, quyền hạn làm trái công vụ gây thiệt hại về tài sản từ 10.000.000 đồng đến dưới 200.000.000 đồng hoặc gây thiệt hại khác thì phạm tội.`,legalReference:`Điều 356 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:379,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Theo Luật PCTN 2018, người có nghĩa vụ kê khai tài sản, thu nhập mà kê khai KHÔNG TRUNG THỰC thì bị xử lý như thế nào?`,options:[`Người ứng cử đại biểu Quốc hội, HĐND thì bị xóa tên khỏi danh sách; người được dự kiến bổ nhiệm thì không được bổ nhiệm; cán bộ công chức thì bị kỷ luật từ khiển trách đến cảnh cáo, cách chức`,`Chỉ bị nhắc nhở trong cuộc họp công đoàn`,`Tự động bị phạt tù chung thân`,`Không bị xử lý gì nếu nộp phạt 500.000 đồng`],correctAnswer:0,explanation:`Điều 51 Luật PCTN 2018 quy định người ứng cử kê khai không trung thực bị xóa tên khỏi danh sách; người dự kiến bổ nhiệm thì không bổ nhiệm; cán bộ, công chức bị xử lý kỷ luật từ khiển trách đến cách chức.`,legalReference:`Điều 51 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:380,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi tham nhũng trong khu vực NGOÀI NHÀ NƯỚC theo Luật PCTN 2018 bao gồm những hành vi nào sau đây do người có chức vụ quyền hạn trong doanh nghiệp, tổ chức khu vực ngoài nhà nước thực hiện?`,options:[`Tham ô tài sản; Nhận hối lộ; Đưa hối lộ, môi giới hối lộ để giải quyết công việc vì vụ lợi`,`Chậm trả nợ lương nhân viên`,`Sản xuất hàng hóa không đạt tiêu chuẩn kỹ thuật`,`Quảng cáo sai sự thật trên truyền hình`],correctAnswer:0,explanation:`Khoản 2 Điều 2 Luật PCTN 2018 quy định các hành vi tham nhũng khu vực ngoài nhà nước: tham ô tài sản, nhận hối lộ, đưa hối lộ/môi giới hối lộ để giải quyết công việc vì vụ lợi.`,legalReference:`Điều 2 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:381,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Trách nhiệm của công dân trong phòng, chống tham nhũng theo Điều 5 Luật PCTN 2018 là:`,options:[`Tham gia phòng, chống tham nhũng; phát hiện, phản ánh, tố cáo, tố giác báo tin về hành vi tham nhũng và được bảo vệ, khen thưởng theo quy định của pháp luật`,`Không cần quan tâm vì đã có cơ quan công an lo`,`Giữ kín mọi thông tin để bảo vệ nội bộ khu dân cư`,`Tự mình bắt giữ và xét xử người tham nhũng`],correctAnswer:0,explanation:`Điều 5 Luật PCTN 2018 khẳng định công dân có quyền và trách nhiệm tham gia phòng, chống tham nhũng; phát hiện, tố cáo hành vi tham nhũng và được Nhà nước bảo vệ, khen thưởng.`,legalReference:`Điều 5 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:382,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Cơ quan nào có thẩm quyền giải quyết tố cáo hành vi tham nhũng của người đứng đầu cơ quan, tổ chức?`,options:[`Người đứng đầu cơ quan, tổ chức cấp trên trực tiếp của cơ quan, tổ chức đó`,`Hội đồng gia tộc của người đứng đầu`,`Chính người đứng đầu đó tự giải quyết`,`Ban chấp hành công đoàn cơ sở`],correctAnswer:0,explanation:`Theo Luật Tố cáo và Luật PCTN, tố cáo hành vi vi phạm nhiệm vụ, công vụ của người đứng đầu cơ quan do người đứng đầu cơ quan cấp trên trực tiếp thụ lý giải quyết.`,legalReference:`Luật Tố cáo 2018 & Luật PCTN 2018`,difficulty:`dễ`},{id:383,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Ai có quyền yêu cầu Tòa án hủy việc kết hôn trái pháp luật?`,options:[`Người bị cưỡng ép kết hôn, bị lừa dối kết hôn; vợ, chồng, cha, mẹ, con của người kết hôn trái pháp luật; Cơ quan quản lý nhà nước về gia đình, trẻ em; Hội liên hiệp phụ nữ`,`Bất kỳ người hàng xóm nào không thích cặp đôi`,`Chủ nợ của người kết hôn`,`Bạn bè học cùng thời cấp 3`],correctAnswer:0,explanation:`Điều 10 Luật Hôn nhân và Gia đình 2014 quy định các chủ thể có quyền yêu cầu hủy kết hôn trái pháp luật: người bị cưỡng ép/lừa dối; người thân thích; cơ quan quản lý gia đình, Hội liên hiệp phụ nữ...`,legalReference:`Điều 10 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:384,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Hậu quả pháp lý của việc Hủy kết hôn trái pháp luật đối với quan hệ nhân thân giữa hai bên là:`,options:[`Hai bên phải chấm dứt quan hệ như vợ chồng; quan hệ nhân thân giữa hai bên được giải quyết như đối với nam, nữ chung sống với nhau như vợ chồng mà không đăng ký kết hôn`,`Vẫn giữ nguyên tư cách vợ chồng hợp pháp`,`Người phụ nữ bắt buộc phải đổi lại họ theo cha mẹ`,`Hai bên bị cấm kết hôn với người khác trong 5 năm`],correctAnswer:0,explanation:`Điều 12 Luật HNGĐ 2014: Khi việc kết hôn trái pháp luật bị hủy thì hai bên phải chấm dứt quan hệ như vợ chồng; quyền và nghĩa vụ nhân thân giải quyết theo quy định về chung sống như vợ chồng không đăng ký.`,legalReference:`Điều 12 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:385,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Việc định đoạt tài sản chung của vợ chồng là Bất động sản, động sản phải đăng ký quyền sở hữu hoặc tài sản đang là nguồn tạo ra thu nhập chủ yếu của gia đình thì:`,options:[`Phải có sự thỏa thuận bằng văn bản của cả hai vợ chồng`,`Chỉ cần người chồng tự mình ký tên bán là đủ`,`Chỉ cần người vợ đồng ý miệng`,`Tự do bán không cần bàn bạc`],correctAnswer:0,explanation:`Khoản 2 Điều 35 Luật HNGĐ 2014: Việc định đoạt tài sản chung là bất động sản, động sản phải đăng ký quyền sở hữu, quyền sử dụng, tài sản là nguồn tạo ra thu nhập chủ yếu của gia đình phải có sự thoả thuận bằng văn bản của vợ chồng.`,legalReference:`Khoản 2 Điều 35 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:386,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Vợ, chồng có quyền thỏa thuận chia một phần hoặc toàn bộ tài sản chung trong thời kỳ hôn nhân không?`,options:[`Có quyền thỏa thuận chia một phần hoặc toàn bộ tài sản chung trong thời kỳ hôn nhân bằng văn bản công chứng/chứng thực`,`Tuyệt đối không được chia tài sản khi chưa ly hôn`,`Chỉ được chia khi có sự cho phép của Tòa án nhân dân tối cao`,`Chỉ được chia khi một bên đã qua đời`],correctAnswer:0,explanation:`Khoản 1 Điều 38 Luật HNGĐ 2014 quy định: Trong thời kỳ hôn nhân, vợ chồng có quyền thoả thuận chia một phần hoặc toàn bộ tài sản chung bằng văn bản có công chứng hoặc chứng thực.`,legalReference:`Điều 38 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:387,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Việc chia tài sản chung của vợ chồng trong thời kỳ hôn nhân bị VÔ HIỆU trong trường hợp nào?`,options:[`Ảnh hưởng nghiêm trọng đến lợi ích của gia đình, con chưa thành niên; nhằm trốn tránh thực hiện nghĩa vụ tài sản với người khác`,`Vợ chồng tự nguyện cùng ký kết`,`Văn bản được công chứng tại phòng công chứng`,`Chia đều 50/50 tài sản`],correctAnswer:0,explanation:`Điều 42 Luật HNGĐ 2014 quy định việc chia tài sản chung trong thời kỳ hôn nhân bị vô hiệu nếu: ảnh hưởng nghiêm trọng đến gia đình, con chưa thành niên; nhằm trốn tránh nghĩa vụ tài sản, bồi thường...`,legalReference:`Điều 42 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:388,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Tòa án tiến hành hòa giải khi giải quyết yêu cầu ly hôn như thế nào?`,options:[`Sau khi đã thụ lý đơn yêu cầu ly hôn, Tòa án tiến hành hòa giải theo quy định của pháp luật về tố tụng dân sự`,`Tòa án không được quyền hòa giải mà phải phán quyết ly hôn ngay`,`Hòa giải chỉ áp dụng khi hai bên có từ 3 con chung trở lên`,`Hòa giải do Chủ tịch UBND trực tiếp thực hiện tại nhà riêng`],correctAnswer:0,explanation:`Điều 54 Luật HNGĐ 2014 quy định: Sau khi đã thụ lý đơn yêu cầu ly hôn, Tòa án tiến hành hoà giải theo quy định của pháp luật về tố tụng dân sự.`,legalReference:`Điều 54 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:389,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Người trực tiếp nuôi con có quyền yêu cầu người không trực tiếp nuôi con cấp dưỡng nuôi con. Mức cấp dưỡng do ai xác định?`,options:[`Do các bên thỏa thuận căn cứ vào thu nhập, khả năng thực tế của người cấp dưỡng và nhu cầu thiết yếu của người được cấp dưỡng; nếu không thỏa thuận được thì yêu cầu Tòa án giải quyết`,`Bắt buộc cố định 2 triệu đồng/tháng cho mọi trường hợp`,`Bằng 90% tổng thu nhập của người cấp dưỡng`,`Do cơ quan thi hành án tự ý ấn định không cần hỏi ý kiến`],correctAnswer:0,explanation:`Điều 116 Luật HNGĐ 2014: Mức cấp dưỡng do người có nghĩa vụ cấp dưỡng và người được cấp dưỡng hoặc người giám hộ thoả thuận căn cứ vào thu nhập, khả năng thực tế của người có nghĩa vụ và nhu cầu thiết yếu của người được cấp dưỡng; nếu không thoả thuận được thì yêu cầu Toà án giải quyết.`,legalReference:`Điều 116 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:390,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Cha, mẹ có thể bị Tòa án quyết định hạn chế quyền đối với con chưa thành niên (từ 01 đến 05 năm) trong trường hợp nào?`,options:[`Bị kết án về một trong các tội cố ý xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự của con; có hành vi xúi giục, ép buộc con làm những việc trái pháp luật, trái đạo đức`,`Đi làm ăn xa không gửi quà sinh nhật`,`Bắt con học bài đúng giờ`,`Không mua điện thoại thông minh cho con`],correctAnswer:0,explanation:`Khoản 1 Điều 85 Luật HNGĐ 2014 quy định các trường hợp cha mẹ bị hạn chế quyền đối với con: bị kết án tội xâm phạm sức khỏe, tính mạng con; phá tán tài sản con; xúi giục ép buộc con làm việc trái luật...`,legalReference:`Điều 85 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:391,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Quan hệ cha, mẹ, con được xác định dựa trên căn cứ nào?`,options:[`Sinh đẻ tự nhiên; hoặc theo quyết định công nhận nhận cha, mẹ, con của cơ quan có thẩm quyền; hoặc quan hệ nuôi con nuôi hợp pháp`,`Chỉ cần thỏa thuận miệng giữa hai gia đình`,`Do người đứng đầu dòng họ phân chia`,`Chỉ căn cứ vào nhóm máu`],correctAnswer:0,explanation:`Quan hệ cha mẹ con hình thành dựa trên sự kiện sinh đẻ, nhận nuôi con nuôi hợp pháp theo Luật Nuôi con nuôi hoặc qua thủ tục nhận cha mẹ con theo quy định của Luật Hộ tịch và Luật HNGĐ.`,legalReference:`Chương VI Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:392,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Hành vi nào sau đây người sử dụng lao động KHÔNG ĐƯỢC LÀM khi giao kết và thực hiện hợp đồng lao động?`,options:[`Giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ của người lao động; yêu cầu người lao động phải thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác`,`Yêu cầu người lao động nộp hồ sơ lý lịch cá nhân`,`Kiểm tra sức khỏe đầu vào của người lao động`,`Phổ biến nội quy lao động của công ty`],correctAnswer:0,explanation:`Điều 17 Bộ luật Lao động 2019 nghiêm cấm: 1. Giữ bản chính giấy tờ tuỳ thân, văn bằng, chứng chỉ của người lao động; 2. Yêu cầu người lao động phải thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác cho việc thực hiện HĐLĐ.`,legalReference:`Điều 17 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:393,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động làm việc theo HĐLĐ xác định thời hạn có quyền đơn phương chấm dứt hợp đồng lao động và phải báo trước ít nhất bao nhiêu ngày (trong điều kiện bình thường)?`,options:[`Ít nhất 30 ngày (nếu hợp đồng có thời hạn từ 12 tháng đến 36 tháng)`,`Ít nhất 03 ngày`,`Ít nhất 60 ngày`,`Ít nhất 90 ngày`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 35 BLLĐ 2019: Phải báo trước ít nhất 30 ngày nếu làm việc theo hợp đồng lao động xác định thời hạn có thời hạn từ 12 tháng đến 36 tháng; ít nhất 03 ngày làm việc nếu dưới 12 tháng.`,legalReference:`Khoản 1 Điều 35 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:394,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Trường hợp nào sau đây người lao động có quyền ĐƠN PHƯƠNG CHẤM DỨT HỢP ĐỒNG LAO ĐỘNG MÀ KHÔNG CẦN BÁO TRƯỚC?`,options:[`Không được bố trí theo đúng công việc, địa điểm làm việc; không được trả đủ lương hoặc trả lương không đúng thời hạn; bị người sử dụng lao động ngược đãi, đánh đập, quấy rối tình dục tại nơi làm việc`,`Tìm được công việc mới có lương cao hơn`,`Cảm thấy thời tiết nắng nóng không muốn đi làm`,`Muốn đi du lịch cùng gia đình 1 tuần`],correctAnswer:0,explanation:`Khoản 2 Điều 35 BLLĐ 2019 quy định người lao động có quyền đơn phương chấm dứt HĐLĐ không cần báo trước trong các trường hợp: không được bố trí đúng việc/địa điểm; không trả đủ lương; bị ngược đãi, quấy rối tình dục; lao động nữ mang thai phải nghỉ theo chỉ định...`,legalReference:`Khoản 2 Điều 35 Bộ luật Lao động 2019`,difficulty:`vận dụng`},{id:395,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Trợ cấp thôi việc được trả cho người lao động đã làm việc thường xuyên từ đủ 12 tháng trở lên với mức tính như thế nào cho mỗi năm làm việc?`,options:[`Mỗi năm làm việc được trợ cấp một nửa tháng tiền lương`,`Mỗi năm làm việc được trợ cấp 01 tháng tiền lương`,`Mỗi năm làm việc được trợ cấp 02 tháng tiền lương`,`Mỗi năm làm việc được trợ cấp 10 triệu đồng cố định`],correctAnswer:0,explanation:`Khoản 1 Điều 46 BLLĐ 2019: Mỗi năm làm việc được trợ cấp một nửa tháng tiền lương (thời gian làm việc tính trợ cấp là thời gian thực tế đã làm việc trừ thời gian tham gia bảo hiểm thất nghiệp).`,legalReference:`Điều 46 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:396,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Lương tối thiểu vùng là gì theo Bộ luật Lao động 2019?`,options:[`Mức lương thấp nhất được xác lập theo vùng, dùng làm căn cứ để người lao động và người sử dụng lao động thỏa thuận và trả lương, bảo đảm mức sống tối thiểu của người lao động và gia đình họ`,`Mức lương áp dụng chung cho tất cả các tổng giám đốc tập đoàn`,`Mức lương do chủ tịch công đoàn tự ý quyết định`,`Mức tiền thưởng tết bắt buộc`],correctAnswer:0,explanation:`Điều 91 BLLĐ 2019: Mức lương tối thiểu là mức lương thấp nhất được xác lập theo vùng, ấn định theo tháng, giờ nhằm bảo vệ người lao động có mức sống tối thiểu phù hợp điều kiện kinh tế - xã hội.`,legalReference:`Điều 91 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:397,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Cứ mỗi 05 năm làm việc cho một người sử dụng lao động thì số ngày nghỉ hằng năm của người lao động được tăng thêm bao nhiêu ngày?`,options:[`Tăng thêm tương ứng 01 ngày`,`Tăng thêm tương ứng 02 ngày`,`Tăng thêm tương ứng 05 ngày`,`Không được tăng thêm ngày nào`],correctAnswer:0,explanation:`Điều 114 BLLĐ 2019: Cứ đủ 05 năm làm việc cho một người sử dụng lao động thì số ngày nghỉ hằng năm của người lao động theo quy định tại khoản 1 Điều 113 của Bộ luật này được tăng thêm tương ứng 01 ngày.`,legalReference:`Điều 114 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:398,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Trách nhiệm bồi thường thiệt hại vật chất của người lao động làm hư hỏng dụng cụ, thiết bị hoặc có hành vi khác gây thiệt hại tài sản không nghiêm trọng (do sơ suất với giá trị không quá 10 tháng lương tối thiểu vùng) thì:`,options:[`Phải bồi thường nhiều nhất là 03 tháng tiền lương và bị khấu trừ hằng tháng vào lương (mỗi tháng không quá 30% tiền lương thực trả)`,`Bắt buộc phải bồi thường gấp 10 lần giá trị tài sản`,`Bị đuổi việc ngay và tịch thu nhà riêng`,`Không phải bồi thường bất cứ khoản nào`],correctAnswer:0,explanation:`Khoản 1 Điều 129 và Điều 102 BLLĐ 2019: Người lao động làm hư hỏng dụng cụ do sơ suất gây thiệt hại không quá 10 tháng lương tối thiểu vùng thì phải bồi thường nhiều nhất là 03 tháng tiền lương và bị khấu trừ dần vào lương (mỗi lần trừ không quá 30% tiền lương tháng thực trả).`,legalReference:`Điều 102 & 129 Bộ luật Lao động 2019`,difficulty:`vận dụng`},{id:399,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Hội đồng trọng tài lao động được thành lập bởi cơ quan nào?`,options:[`Chủ tịch Ủy ban nhân dân cấp tỉnh ra quyết định thành lập`,`Bộ trưởng Bộ Lao động - Thương binh và Xã hội`,`Tòa án nhân dân tối cao`,`Liên đoàn Lao động Việt Nam`],correctAnswer:0,explanation:`Khoản 1 Điều 185 BLLĐ 2019: Chủ tịch Ủy ban nhân dân cấp tỉnh quyết định thành lập Hội đồng trọng tài lao động, bổ nhiệm Chủ tịch, Thư ký và các trọng tài viên lao động của Hội đồng trọng tài lao động.`,legalReference:`Điều 185 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:400,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Đình công là sự ngừng việc tạm thời, tự nguyện và có tổ chức của người lao động nhằm mục đích gì theo Bộ luật Lao động 2019?`,options:[`Nhằm đạt được yêu cầu trong quá trình giải quyết tranh chấp lao động tập thể và do tổ chức đại diện người lao động có quyền thương lượng tập thể là một bên tranh chấp tổ chức và lãnh đạo`,`Nhằm gây rối trật tự an toàn công cộng`,`Nhằm ép buộc chính quyền thay đổi chủ tịch tỉnh`,`Do một nhóm cá nhân tự phát thích nghỉ làm đi chơi`],correctAnswer:0,explanation:`Điều 198 BLLĐ 2019: Đình công là sự ngừng việc tạm thời, tự nguyện và có tổ chức của người lao động nhằm đạt được yêu cầu trong quá trình giải quyết tranh chấp lao động và do tổ chức đại diện người lao động tổ chức, lãnh đạo.`,legalReference:`Điều 198 Bộ luật Lao động 2019`,difficulty:`dễ`}],ne=[{id:401,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Chế độ Thuế khóa xuất hiện lần đầu tiên gắn liền với sự ra đời của tổ chức nào?`,options:[`Nhà nước`,`Thị tộc, bộ lạc`,`Các tổ chức tôn giáo cổ đại`,`Các liên minh buôn bán hàng hải`],correctAnswer:0,explanation:`Thuế là một trong 5 đặc trưng cơ bản của Nhà nước. Để duy trì bộ máy cai trị chuyên nghiệp và lực lượng vũ trang công quyền, Nhà nước đặt ra và thu các loại thuế bắt buộc đối với cư dân.`,legalReference:`Đặc trưng cơ bản của Nhà nước`,difficulty:`dễ`},{id:402,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Bản chất giai cấp của Nhà nước thể hiện ở việc:`,options:[`Nhà nước là công cụ sắc bén nhất để duy trì sự thống trị giai cấp và bảo vệ lợi ích trước hết của giai cấp cầm quyền`,`Nhà nước luôn luôn chia đều tài sản cho người nghèo`,`Nhà nước không bao giờ sử dụng vũ lực cưỡng chế`,`Mọi giai cấp trong xã hội đều có quyền lực kinh tế ngang nhau`],correctAnswer:0,explanation:`Theo học thuyết Mác-Lênin, tính giai cấp của Nhà nước thể hiện ở chỗ Nhà nước là bộ máy do giai cấp thống trị tổ chức ra để thực hiện nền chuyên chính giai cấp nhằm duy trì trật tự có lợi cho mình.`,legalReference:`Học thuyết Mác-Lênin về Tính giai cấp của Nhà nước`,difficulty:`dễ`},{id:403,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Tính xã hội của Nhà nước thể hiện ở nội dung nào sau đây?`,options:[`Nhà nước thực hiện việc quản lý, giải quyết các công việc chung vì sự phát triển, ổn định và trật tự của toàn xã hội (y tế, giáo dục, môi trường, phòng chống thiên tai...)`,`Nhà nước chỉ phục vụ riêng quyền lợi của các triệu phú`,`Nhà nước triệt tiêu toàn bộ quan hệ mua bán hàng hóa`,`Nhà nước không tham gia bảo vệ an ninh trật tự công cộng`],correctAnswer:0,explanation:`Tính xã hội của nhà nước thể hiện qua việc nhà nước nhân danh xã hội giải quyết những vấn đề nảy sinh chung từ đời sống cộng đồng nhằm duy trì sự tồn tại và phát triển bình thường của xã hội.`,legalReference:`Tính xã hội của Nhà nước`,difficulty:`dễ`},{id:404,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức chính thể Quân chủ hạn chế (Quân chủ lập hiến) có đặc điểm là:`,options:[`Quyền lực của Vua/Nữ hoàng bị hạn chế bởi Hiến pháp và chia sẻ quyền lực với Nghị viện`,`Vua nắm trọn quyền hành pháp và tư pháp vô hạn định`,`Vua được toàn dân bầu cử định kỳ 5 năm một lần`,`Không có Hiến pháp hay pháp luật thành văn`],correctAnswer:0,explanation:`Trong chính thể Quân chủ hạn chế (như Vương quốc Anh, Nhật Bản), quyền lực của nguyên thủ (Vua/Nữ hoàng) bị giới hạn bởi Hiến pháp, Quốc hội nắm quyền lập pháp và Thủ tướng điều hành chính phủ.`,legalReference:`Lý luận về Hình thức chính thể Quân chủ lập hiến`,difficulty:`trung bình`},{id:405,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Nhà nước xã hội chủ nghĩa có bản chất dân chủ sâu sắc vì:`,options:[`Tất cả quyền lực nhà nước thuộc về Nhân dân mà nền tảng là liên minh giữa giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức`,`Chỉ có một số ít người giàu có được tham gia chính quyền`,`Xóa bỏ hoàn toàn hệ thống pháp luật`,`Không cần sự lãnh đạo của bất kỳ chính đảng nào`],correctAnswer:0,explanation:`Điều 2 Hiến pháp 2013 khẳng định: Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân. Tất cả quyền lực nhà nước thuộc về Nhân dân.`,legalReference:`Điều 2 Hiến pháp 2013`,difficulty:`dễ`},{id:406,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Pháp luật có chức năng điều chỉnh các quan hệ xã hội thông qua hai cách thức chủ yếu là:`,options:[`Ghi nhận, củng cố các quan hệ xã hội phù hợp và định hướng, thúc đẩy xác lập các quan hệ xã hội mới tiến bộ`,`Trừng phạt tù giam và tịch thu nhà đất`,`Tuyên truyền tôn giáo và đạo lý dân gian`,`Kiểm soát toàn bộ tư tưởng của từng công dân`],correctAnswer:0,explanation:`Chức năng điều chỉnh của pháp luật thể hiện ở việc pháp luật ghi nhận, bảo vệ các quan hệ xã hội hiện có phù hợp với trật tự pháp luật, đồng thời định hướng, bảo đảm sự hình thành các quan hệ xã hội mới tốt đẹp.`,legalReference:`Chức năng của Pháp luật`,difficulty:`trung bình`},{id:407,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Bộ phận "Quy định" trong quy phạm pháp luật: "Nghiêm cấm hành vi đe dọa, xúc phạm danh dự, nhân phẩm của giáo viên" là quy phạm mang tính chất:`,options:[`Quy phạm cấm đoán`,`Quy phạm cho phép`,`Quy phạm định nghĩa`,`Quy phạm tùy nghi`],correctAnswer:0,explanation:`Quy phạm cấm đoán là quy phạm quy định rõ những hành vi mà chủ thể không được phép thực hiện (ở đây nghiêm cấm hành vi đe dọa, xúc phạm thầy cô giáo).`,legalReference:`Cơ cấu của Quy phạm pháp luật - Quy định`,difficulty:`dễ`},{id:408,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hành vi vi phạm pháp luật KHÁC với hành vi vi phạm đạo đức ở điểm cơ bản nào?`,options:[`Hành vi vi phạm pháp luật xâm hại quan hệ xã hội do pháp luật bảo vệ và bị Nhà nước xử lý bằng các biện pháp cưỡng chế pháp lý bất lợi`,`Hành vi vi phạm pháp luật chỉ bị gia đình nhắc nhở`,`Hành vi vi phạm đạo đức luôn bị Tòa án phạt tù`,`Hai hành vi hoàn toàn đồng nhất không có ranh giới`],correctAnswer:0,explanation:`Vi phạm pháp luật bị cưỡng chế bằng chế tài quyền lực của Nhà nước; còn vi phạm đạo đức chỉ bị phản ứng bằng dư luận xã hội, lương tâm cắn rứt hoặc sự lên án đạo đức.`,legalReference:`Phân biệt Vi phạm pháp luật và Vi phạm đạo đức`,difficulty:`dễ`},{id:409,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Khách thể của vi phạm pháp luật là gì?`,options:[`Các quan hệ xã hội được pháp luật bảo vệ nhưng bị hành vi vi phạm pháp luật xâm hại`,`Người thực hiện hành vi vi phạm`,`Dụng cụ và phương tiện gây án`,`Thiệt hại vật chất tính ra tiền`],correctAnswer:0,explanation:`Khách thể của vi phạm pháp luật là các quan hệ xã hội được pháp luật xác lập và bảo vệ nhưng bị hành vi vi phạm pháp luật xâm phạm gây thiệt hại hoặc đe dọa gây thiệt hại.`,legalReference:`Cấu thành của Vi phạm pháp luật - Khách thể`,difficulty:`dễ`},{id:410,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Mặt khách quan của vi phạm pháp luật KHÔNG BAO GỒM yếu tố nào sau đây?`,options:[`Động cơ và mục đích vi phạm của chủ thể`,`Hành vi trái pháp luật (hành động hoặc không hành động)`,`Hậu quả nguy hại cho xã hội do hành vi gây ra`,`Mối quan hệ nhân quả giữa hành vi và hậu quả thiệt hại`],correctAnswer:0,explanation:`Động cơ và mục đích vi phạm thuộc Mặt chủ quan (yếu tố tâm lý bên trong), không thuộc Mặt khách quan (biểu hiện thực tế bên ngoài).`,legalReference:`Cấu thành của Vi phạm pháp luật`,difficulty:`trung bình`},{id:411,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Cá nhân được coi là có Năng lực trách nhiệm pháp lý khi:`,options:[`Đạt độ tuổi luật định và có khả năng nhận thức, điều khiển được hành vi của mình`,`Có tài sản từ 1 tỷ đồng trở lên`,`Có bằng tốt nghiệp đại học`,`Có quốc tịch của 2 quốc gia`],correctAnswer:0,explanation:`Năng lực trách nhiệm pháp lý là khả năng của một chủ thể phải gánh chịu hậu quả pháp lý bất lợi do hành vi vi phạm của mình gây ra, đòi hỏi đạt độ tuổi luật định và trạng thái tinh thần có khả năng nhận thức, làm chủ hành vi.`,legalReference:`Chủ thể của Vi phạm pháp luật`,difficulty:`dễ`},{id:412,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức lỗi "Cố ý trực tiếp" là trường hợp người vi phạm:`,options:[`Nhận thức rõ hành vi của mình là trái pháp luật, thấy trước hậu quả và mong muốn hậu quả đó xảy ra`,`Không thấy trước hành vi của mình là nguy hiểm`,`Thấy trước hậu quả nhưng hy vọng nó không xảy ra`,`Bị người khác thôi miên ép buộc`],correctAnswer:0,explanation:`Khoản 1 Điều 10 BLHS 2015: Cố ý trực tiếp là trường hợp người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả của hành vi đó và mong muốn hậu quả xảy ra.`,legalReference:`Điều 10 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:413,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Căn cứ để truy cứu trách nhiệm pháp lý là gì?`,options:[`Hành vi có đủ 4 yếu tố cấu thành vi phạm pháp luật và còn thời hiệu truy cứu trách nhiệm pháp lý`,`Chỉ cần có đơn tố cáo nặc danh trên mạng`,`Dư luận xã hội phẫn nộ`,`Ý kiến chủ quan của thủ trưởng cơ quan`],correctAnswer:0,explanation:`Căn cứ thực tế duy nhất để truy cứu trách nhiệm pháp lý là hành vi vi phạm pháp luật có đầy đủ các yếu tố cấu thành và vẫn đang trong thời hiệu luật định.`,legalReference:`Nguyên tắc truy cứu trách nhiệm pháp lý`,difficulty:`trung bình`},{id:414,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Văn bản quy phạm pháp luật hết hiệu lực trong trường hợp nào?`,options:[`Hết thời hạn có hiệu lực đã được quy định trong văn bản; hoặc được sửa đổi, bổ sung hoặc thay thế bằng văn bản mới; hoặc bị bãi bỏ bằng một văn bản của cơ quan nhà nước có thẩm quyền`,`Khi Thủ tướng Chính phủ đi công tác nước ngoài`,`Sau 10 năm kể từ ngày ký`,`Khi có một công dân gửi đơn khiếu nại`],correctAnswer:0,explanation:`Điều 154 Luật Ban hành VBQPPL 2015: Văn bản quy phạm pháp luật hết hiệu lực toàn bộ hoặc một phần khi hết hạn ghi trong văn bản; được sửa đổi thay thế; hoặc bị bãi bỏ bằng văn bản của cơ quan có thẩm quyền.`,legalReference:`Điều 154 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`trung bình`},{id:415,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Cơ quan nào có thẩm quyền ban hành "Thông tư liên tịch"?`,options:[`Chánh án TAND tối cao với Viện trưởng VKSND tối cao; Tổng Kiểm toán nhà nước với Chánh án TAND tối cao, Viện trưởng VKSND tối cao; Bộ trưởng, Thủ trưởng cơ quan ngang bộ với Chánh án TAND tối cao, Viện trưởng VKSND tối cao`,`Hai doanh nghiệp tư nhân cùng ngành nghề`,`Chủ tịch UBND hai tỉnh lân cận`,`Hai trường đại học công lập`],correctAnswer:0,explanation:`Khoản 8 Điều 4 Luật Ban hành VBQPPL: Thông tư liên tịch giữa Chánh án TAND tối cao với Viện trưởng VKSND tối cao; giữa Tổng Kiểm toán nhà nước, Bộ trưởng với Chánh án TANDTC, Viện trưởng VKSNDTC.`,legalReference:`Điều 4 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`vận dụng`},{id:416,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hoạt động giải thích pháp luật chính thức (giải thích có tính quy phạm bắt buộc) ở Việt Nam thuộc thẩm quyền của:`,options:[`Ủy ban Thường vụ Quốc hội`,`Đoàn Luật sư Việt Nam`,`Các cơ quan báo chí truyền thông`,`Khoa Luật các trường đại học`],correctAnswer:0,explanation:`Khoản 2 Điều 74 Hiến pháp 2013: Ủy ban thường vụ Quốc hội có nhiệm vụ và quyền hạn giải thích Hiến pháp, luật, pháp lệnh. Đây là cơ quan duy nhất có thẩm quyền giải thích pháp luật chính thức.`,legalReference:`Điều 74 Hiến pháp 2013`,difficulty:`dễ`},{id:417,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hiện tượng nào sau đây là "Sự kiện pháp lý tuyệt đối" (Sự biến)?`,options:[`Sự ra đời tự nhiên của một đứa trẻ làm phát sinh quyền nhân thân và quyền thừa kế`,`Ký kết hợp đồng thuê nhà trọ`,`Đơn xin nghỉ việc của người lao động`,`Hành vi trộm cắp xe đạp`],correctAnswer:0,explanation:`Sự kiện sinh ra tự nhiên của con người là sự kiện xảy ra không do ý muốn chủ quan nhằm xác lập quyền (sự biến pháp lý tuyệt đối), nhưng pháp luật gắn sự kiện này với việc làm phát sinh năng lực pháp luật dân sự và quan hệ hộ tịch.`,legalReference:`Phân loại Sự kiện pháp lý`,difficulty:`trung bình`},{id:418,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hiến pháp năm 2013 của nước Cộng hòa xã hội chủ nghĩa Việt Nam có hiệu lực thi hành từ ngày nào?`,options:[`Ngày 01 tháng 01 năm 2014`,`Ngày 02 tháng 09 năm 2013`,`Ngày 30 tháng 04 năm 2014`,`Ngày 01 tháng 07 năm 2015`],correctAnswer:0,explanation:`Nghị quyết quy định một số điểm thi hành Hiến pháp nước CHXHCN Việt Nam năm 2013 xác định Hiến pháp 2013 có hiệu lực thi hành từ ngày 01 tháng 01 năm 2014.`,legalReference:`Nghị quyết số 64/2013/QH13 thi hành Hiến pháp 2013`,difficulty:`dễ`},{id:419,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào có quyền bãi bỏ văn bản của Chính phủ, Thủ tướng Chính phủ trái với Hiến pháp, luật, nghị quyết của Quốc hội?`,options:[`Ủy ban Thường vụ Quốc hội (đình chỉ) và Quốc hội (bãi bỏ)`,`Tòa án nhân dân cấp huyện`,`Ủy ban nhân dân thành phố Hà Nội`,`Viện Kiểm sát nhân dân cấp tỉnh`],correctAnswer:0,explanation:`Khoản 9 Điều 70 Hiến pháp 2013: Quốc hội bãi bỏ văn bản của Chủ tịch nước, UBTVQH, Chính phủ, Thủ tướng Chính phủ, TANDTC, VKSNDTC trái với Hiến pháp, luật, nghị quyết của Quốc hội.`,legalReference:`Điều 70 Hiến pháp 2013`,difficulty:`trung bình`},{id:420,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ai là người chịu trách nhiệm cá nhân trước Thủ tướng Chính phủ, Chính phủ và Quốc hội về ngành, lĩnh vực được phân công phụ trách?`,options:[`Bộ trưởng, Thủ trưởng cơ quan ngang bộ`,`Chủ tịch Ủy ban Mặt trận Tổ quốc tỉnh`,`Đại biểu Quốc hội chuyên trách địa phương`,`Chánh án Tòa án quân sự khu vực`],correctAnswer:0,explanation:`Điều 99 Hiến pháp 2013: Bộ trưởng, Thủ trưởng cơ quan ngang bộ là thành viên Chính phủ, chịu trách nhiệm cá nhân trước Thủ tướng Chính phủ, Chính phủ và Quốc hội về ngành, lĩnh vực được phân công phụ trách.`,legalReference:`Điều 99 Hiến pháp 2013`,difficulty:`dễ`},{id:421,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chủ tịch nước do ai bầu ra trong số các đại biểu Quốc hội?`,options:[`Quốc hội bầu theo đề nghị của Ủy ban Thường vụ Quốc hội`,`Chính phủ biểu quyết bầu`,`Toàn thể công dân bỏ phiếu riêng`,`Tòa án nhân dân tối cao chỉ định`],correctAnswer:0,explanation:`Điều 87 Hiến pháp 2013: Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội. Chủ tịch nước chịu trách nhiệm và báo cáo công tác trước Quốc hội.`,legalReference:`Điều 87 Hiến pháp 2013`,difficulty:`dễ`},{id:422,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Khi Chủ tịch nước không làm việc được trong một thời gian dài hoặc khi khuyết Chủ tịch nước thì ai giữ quyền Chủ tịch nước?`,options:[`Phó Chủ tịch nước giữ quyền Chủ tịch nước cho đến khi Quốc hội bầu ra Chủ tịch nước mới`,`Thủ tướng Chính phủ kiêm nhiệm`,`Chủ tịch Quốc hội kiêm nhiệm`,`Bộ trưởng Bộ Công an tạm quyền`],correctAnswer:0,explanation:`Điều 93 Hiến pháp 2013: Khi Chủ tịch nước không làm việc được trong thời gian dài thì Phó Chủ tịch nước giữ quyền Chủ tịch nước. Trong trường hợp khuyết Chủ tịch nước thì Phó Chủ tịch nước giữ quyền Chủ tịch nước cho đến khi Quốc hội bầu ra Chủ tịch nước mới.`,legalReference:`Điều 93 Hiến pháp 2013`,difficulty:`trung bình`},{id:423,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Viện trưởng Viện kiểm sát nhân dân cấp huyện do ai bổ nhiệm, miễn nhiệm, cách chức?`,options:[`Viện trưởng Viện kiểm sát nhân dân tối cao`,`Chủ tịch UBND cấp huyện`,`Chủ tịch HĐND cấp huyện`,`Trưởng Công an quận/huyện`],correctAnswer:0,explanation:`Luật Tổ chức VKSND: Thẩm quyền bổ nhiệm, miễn nhiệm, cách chức Viện trưởng, Phó Viện trưởng VKSND các cấp (tỉnh, huyện) thuộc về Viện trưởng Viện kiểm sát nhân dân tối cao.`,legalReference:`Luật Tổ chức Viện kiểm sát nhân dân 2014`,difficulty:`trung bình`},{id:424,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào có quyền giám sát việc tuân theo pháp luật trong việc giải quyết khiếu nại, tố cáo của công dân ở địa phương?`,options:[`Hội đồng nhân dân các cấp`,`Ngân hàng Chính sách xã hội`,`Công ty cổ phần cấp nước`,`Hiệp hội Doanh nghiệp nhỏ và vừa`],correctAnswer:0,explanation:`Luật Tổ chức chính quyền địa phương quy định HĐND thực hiện quyền giám sát việc tuân theo pháp luật, giải quyết khiếu nại, tố cáo của nhân dân tại địa phương.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`dễ`},{id:425,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Thẩm phán Tòa án nhân dân được bổ nhiệm theo quy định của pháp luật có thời hạn nhiệm kỳ là:`,options:[`Bổ nhiệm lần đầu là 05 năm; trường hợp được bổ nhiệm lại hoặc bổ nhiệm vào ngạch Thẩm phán khác thì thời hạn là 10 năm`,`Bổ nhiệm suốt đời không bao giờ xem xét lại`,`Bổ nhiệm đúng 1 năm thử việc`,`Bổ nhiệm theo chu kỳ 20 năm`],correctAnswer:0,explanation:`Luật Tổ chức Tòa án nhân dân quy định: Nhiệm kỳ đầu của các Thẩm phán là 05 năm; trường hợp được bổ nhiệm lại hoặc bổ nhiệm vào ngạch Thẩm phán khác thì thời hạn là 10 năm.`,legalReference:`Luật Tổ chức Tòa án nhân dân`,difficulty:`trung bình`},{id:426,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ủy ban nhân dân các cấp do ai lãnh đạo, điều hành trực tiếp?`,options:[`Chủ tịch Ủy ban nhân dân`,`Bí thư Chi đoàn thanh niên`,`Hiệu trưởng trường Chính trị tỉnh`,`Trưởng ban đại diện cha mẹ học sinh`],correctAnswer:0,explanation:`Chủ tịch UBND là người đứng đầu UBND, lãnh đạo và điều hành công việc của UBND, chịu trách nhiệm cá nhân trước UBND, HĐND cùng cấp và cơ quan nhà nước cấp trên.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`dễ`},{id:427,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Tòa án nhân dân cấp cao có nhiệm vụ xét xử các vụ án nào?`,options:[`Phúc thẩm các vụ án mà bản án, quyết định sơ thẩm của TAND cấp tỉnh chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị; và giám đốc thẩm, tái thẩm theo luật định`,`Chỉ xét xử sơ thẩm tranh chấp đất đai của nông dân`,`Xét xử các tranh chấp thương mại quốc tế giữa hai chính phủ`,`Bắt buộc xét xử lại tất cả các vụ án của TAND cấp huyện`],correctAnswer:0,explanation:`Điều 29 Luật Tổ chức TAND quy định TAND cấp cao phúc thẩm vụ việc mà bản án sơ thẩm của TAND cấp tỉnh thuộc phạm vi thẩm quyền chưa có hiệu lực bị kháng cáo, kháng nghị; giám đốc thẩm, tái thẩm bản án của TAND tỉnh, huyện.`,legalReference:`Điều 29 Luật Tổ chức Tòa án nhân dân`,difficulty:`trung bình`},{id:428,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan có thẩm quyền quyết định thành lập, giải thể, nhập, chia, điều chỉnh địa giới hành chính tỉnh, thành phố trực thuộc trung ương là:`,options:[`Quốc hội`,`Chính phủ`,`Chủ tịch nước`,`Ủy ban nhân dân các tỉnh liên quan`],correctAnswer:0,explanation:`Khoản 9 Điều 70 Hiến pháp 2013 quy định Quốc hội quyết định thành lập, bãi bỏ bộ, cơ quan ngang bộ; thành lập, giải thể, nhập, chia, điều chỉnh địa giới hành chính tỉnh, thành phố trực thuộc trung ương.`,legalReference:`Điều 70 Hiến pháp 2013`,difficulty:`trung bình`},{id:429,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan có thẩm quyền quyết định thành lập, giải thể, nhập, chia đơn vị hành chính DƯỚI CẤP TỈNH (huyện, quận, thị xã, xã, phường) là cơ quan nào?`,options:[`Ủy ban Thường vụ Quốc hội`,`Chính phủ`,`Hội đồng nhân dân cấp tỉnh`,`Bộ Nội vụ`],correctAnswer:0,explanation:`Khoản 8 Điều 74 Hiến pháp 2013 quy định Ủy ban thường vụ Quốc hội quyết định thành lập, giải thể, nhập, chia, điều chỉnh địa giới đơn vị hành chính dưới tỉnh, thành phố trực thuộc trung ương.`,legalReference:`Điều 74 Hiến pháp 2013`,difficulty:`trung bình`},{id:430,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Kiểm toán nhà nước thực hiện kiểm toán đối với cơ quan, tổ chức nào?`,options:[`Tất cả cơ quan, tổ chức quản lý, sử dụng tài chính công, tài sản công của Nhà nước`,`Chỉ kiểm toán các hộ kinh doanh cá thể nhỏ lẻ`,`Chỉ kiểm toán các công ty có 100% vốn nước ngoài`,`Kiểm toán chi tiêu cá nhân của người dân`],correctAnswer:0,explanation:`Điều 118 Hiến pháp 2013 và Luật Kiểm toán nhà nước quy định Kiểm toán nhà nước thực hiện kiểm toán việc quản lý, sử dụng tài chính, tài sản công của các cơ quan, tổ chức nhà nước.`,legalReference:`Điều 118 Hiến pháp 2013 & Luật Kiểm toán nhà nước`,difficulty:`dễ`},{id:431,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chức danh nào sau đây do Quốc hội bầu theo đề nghị của Ủy ban Thường vụ Quốc hội?`,options:[`Chủ tịch Hội đồng bầu cử quốc gia`,`Bộ trưởng Bộ Công thương`,`Thống đốc Ngân hàng Nhà nước`,`Chủ tịch Ủy ban nhân dân thành phố Hà Nội`],correctAnswer:0,explanation:`Khoản 7 Điều 70 Hiến pháp 2013 quy định Quốc hội bầu Chủ tịch Hội đồng bầu cử quốc gia theo đề nghị của Ủy ban thường vụ Quốc hội.`,legalReference:`Điều 70 Hiến pháp 2013`,difficulty:`trung bình`},{id:432,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Quyền Trình dự án luật trước Quốc hội thuộc về những chủ thể nào theo Điều 84 Hiến pháp 2013?`,options:[`Chủ tịch nước, UBTVQH, Hội đồng dân tộc, Ủy ban của Quốc hội, Chính phủ, TANDTC, VKSNDTC, Kiểm toán nhà nước, Ủy ban TW MTTQ VN và đại biểu Quốc hội`,`Chỉ có Thủ tướng Chính phủ mới được trình dự án luật`,`Mọi công dân đều được trực tiếp nộp bản dự thảo luật vào Quốc hội`,`Chỉ các giáo sư tiến sĩ luật học`],correctAnswer:0,explanation:`Điều 84 Hiến pháp 2013 liệt kê đầy đủ các chủ thể có quyền sáng kiến lập pháp (trình dự án luật, pháp lệnh) trước Quốc hội và UBTVQH, bao gồm cả Đại biểu Quốc hội.`,legalReference:`Điều 84 Hiến pháp 2013`,difficulty:`trung bình`},{id:433,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào quyết định chính sách cơ bản về tài chính, tiền tệ quốc gia, quy định, sửa đổi hoặc bãi bỏ các thứ thuế?`,options:[`Quốc hội`,`Ngân hàng Nhà nước Việt Nam`,`Bộ Tài chính`,`Thủ tướng Chính phủ`],correctAnswer:0,explanation:`Khoản 4 Điều 70 Hiến pháp 2013 quy định thẩm quyền của Quốc hội: "Quy định, sửa đổi hoặc bãi bỏ các thứ thuế; quyết định phân chia các khoản thu và nhiệm vụ chi giữa ngân sách trung ương và ngân sách địa phương...".`,legalReference:`Khoản 4 Điều 70 Hiến pháp 2013`,difficulty:`dễ`},{id:434,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hội đồng nhân dân họp thường lệ mỗi năm ít nhất mấy kỳ?`,options:[`Ít nhất hai kỳ họp thường lệ`,`Mỗi tháng một kỳ`,`Mỗi quý một kỳ`,`Năm năm họp một lần`],correctAnswer:0,explanation:`Luật Tổ chức chính quyền địa phương 2015 quy định Hội đồng nhân dân họp mỗi năm ít nhất hai kỳ thường lệ để quyết định các vấn đề kinh tế - xã hội ngân sách của địa phương.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`dễ`},{id:435,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Tổ chức nào đại diện cho quyền và lợi ích hợp pháp, chính đáng của người lao động ở cấp cơ sở?`,options:[`Công đoàn cơ sở (hoặc tổ chức của người lao động tại doanh nghiệp)`,`Hội đồng nhân dân cấp phường`,`Hội Cựu chiến binh phường`,`Đoàn Luật sư tỉnh`],correctAnswer:0,explanation:`Điều 10 Hiến pháp 2013 và Bộ luật Lao động 2019: Công đoàn là tổ chức chính trị - xã hội của giai cấp công nhân và người lao động, đại diện, chăm lo và bảo vệ quyền, lợi ích hợp pháp của người lao động.`,legalReference:`Điều 10 Hiến pháp 2013 & Luật Công đoàn`,difficulty:`dễ`},{id:436,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Nguyên tắc "Bảo đảm quyền bào chữa của người bị buộc tội, quyền bảo vệ quyền và lợi ích hợp pháp của đương sự" trong tố tụng tư pháp được ghi nhận tại điều khoản nào?`,options:[`Khoản 4 Điều 103 Hiến pháp 2013`,`Luật Thuế thu nhập cá nhân`,`Điều lệ Đảng Cộng sản Việt Nam`,`Nghị định về bảo hiểm xe máy`],correctAnswer:0,explanation:`Khoản 4 Điều 103 Hiến pháp 2013 khẳng định: "Quyền bào chữa của người bị buộc tội, quyền bảo vệ quyền và lợi ích hợp pháp của đương sự được bảo đảm".`,legalReference:`Điều 103 Hiến pháp 2013`,difficulty:`dễ`},{id:437,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Quyền nhân thân gắn liền với mỗi cá nhân theo Bộ luật Dân sự 2015 là quyền:`,options:[`Quyền dân sự gắn liền với mỗi cá nhân, không thể chuyển giao cho người khác, trừ trường hợp luật khác có liên quan quy định khác`,`Có thể tự do bán đấu giá lấy tiền`,`Có thể thế chấp tại ngân hàng để vay vốn`,`Tự động mất đi khi người đó nghỉ hưu`],correctAnswer:0,explanation:`Điều 25 BLDS 2015 quy định quyền nhân thân là quyền dân sự gắn liền với mỗi cá nhân, không thể chuyển giao cho người khác, trừ trường hợp luật khác có liên quan quy định khác (như quyền đối với họ tên, hình ảnh, danh dự, nhân phẩm...).`,legalReference:`Điều 25 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:438,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Sử dụng hình ảnh của cá nhân phải được sự đồng ý của người đó; việc sử dụng hình ảnh mà KHÔNG CẦN sự đồng ý của người có hình ảnh được phép trong trường hợp nào?`,options:[`Hình ảnh được sử dụng vì lợi ích quốc gia, dân tộc, lợi ích công cộng; hoặc hình ảnh được sử dụng từ các hoạt động công cộng (hội nghị, thi đấu thể thao...) mà không làm tổn hại đến danh dự, nhân phẩm`,`Mọi trường hợp sử dụng để đăng bán hàng trên mạng xã hội`,`Sử dụng để ghép ảnh hài hước xúc phạm uy tín người khác`,`Sử dụng để in ấn pano quảng cáo mỹ phẩm thu tiền`],correctAnswer:0,explanation:`Khoản 2 Điều 32 BLDS 2015 cho phép sử dụng hình ảnh không cần sự đồng ý trong trường hợp vì lợi ích quốc gia, dân tộc, lợi ích công cộng hoặc từ các hoạt động công cộng không xâm phạm danh dự, nhân phẩm.`,legalReference:`Điều 32 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:439,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Đại diện theo pháp luật của cá nhân bao gồm những trường hợp nào?`,options:[`Cha, mẹ đối với con chưa thành niên; Người giám hộ đối với người được giám hộ; Người do Tòa án chỉ định trong trường hợp luật định`,`Bạn thân cùng phòng trọ`,`Người bán hàng đại lý ủy quyền`,`Tài xế xe ôm công nghệ`],correctAnswer:0,explanation:`Điều 136 BLDS 2015 quy định người đại diện theo pháp luật của cá nhân gồm: cha mẹ đối với con chưa thành niên; người giám hộ; người do Tòa án chỉ định...`,legalReference:`Điều 136 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:440,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hiệu miễn trừ nghĩa vụ dân sự là gì?`,options:[`Thời hạn mà khi hết thời hạn đó thì người có nghĩa vụ dân sự được miễn việc thực hiện nghĩa vụ`,`Thời hạn để khởi kiện yêu cầu bồi thường`,`Thời gian nghỉ lễ tết theo quy định nhà nước`,`Thời hạn bảo hành sản phẩm điện tử`],correctAnswer:0,explanation:`Khoản 2 Điều 150 BLDS 2015: Thời hiệu miễn trừ nghĩa vụ dân sự là thời hạn mà khi hết thời hạn đó thì người có nghĩa vụ dân sự được miễn việc thực hiện nghĩa vụ.`,legalReference:`Điều 150 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:441,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Ranh giới giữa các bất động sản liền kề được xác định căn cứ vào:`,options:[`Thỏa thuận của các chủ sở hữu hoặc theo quyết định của cơ quan nhà nước có thẩm quyền; hoặc theo tập quán, ranh giới đã tồn tại từ 30 năm trở lên mà không có tranh chấp`,`Ai xây tường trước thì ranh giới thuộc về người đó`,`Tự ý lấn chiếm ban đêm`,`Căn cứ vào chiều cao của ngôi nhà`],correctAnswer:0,explanation:`Khoản 1 Điều 175 BLDS 2015: Ranh giới giữa các bất động sản liền kề được xác định theo thoả thuận hoặc theo quyết định của cơ quan nhà nước có thẩm quyền; ranh giới cũng có thể được xác định theo tập quán hoặc theo ranh giới đã tồn tại từ 30 năm trở lên mà không có tranh chấp.`,legalReference:`Điều 175 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:442,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hợp đồng tặng cho Bất động sản có hiệu lực từ thời điểm nào?`,options:[`Kể từ thời điểm đăng ký; nếu bất động sản không phải đăng ký quyền sở hữu thì có hiệu lực kể từ thời điểm chuyển giao tài sản`,`Kể từ ngày người tặng cho hứa miệng`,`Kể từ khi người nhận tặng cho dọn đến ở`,`Sau 10 năm kể từ ngày lập văn bản`],correctAnswer:0,explanation:`Khoản 2 Điều 459 BLDS 2015: Hợp đồng tặng cho bất động sản có hiệu lực kể từ thời điểm đăng ký; nếu bất động sản không phải đăng ký quyền sở hữu thì hợp đồng tặng cho có hiệu lực kể từ thời điểm chuyển giao tài sản.`,legalReference:`Điều 459 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:443,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Lãi suất vay do các bên thỏa thuận trong hợp đồng vay tài sản nhưng KHÔNG ĐƯỢC VƯỢT QUÁ bao nhiêu %/năm theo Bộ luật Dân sự 2015?`,options:[`Không được vượt quá 20%/năm của khoản tiền vay (trừ trường hợp luật khác liên quan có quy định khác)`,`Không được vượt quá 10%/năm`,`Không được vượt quá 50%/năm`,`Tự do cho vay với lãi suất 100%/tháng không bị hạn chế`],correctAnswer:0,explanation:`Khoản 1 Điều 468 BLDS 2015: Lãi suất vay do các bên thỏa thuận nhưng không được vượt quá 20%/năm của khoản tiền vay (nếu vượt quá 5 lần mức này và thu lợi bất chính từ 30 triệu trở lên có thể cấu thành Tội cho vay lãi nặng trong giao dịch dân sự theo Điều 201 BLHS).`,legalReference:`Điều 468 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:444,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Di chúc chung của vợ chồng theo Bộ luật Dân sự 2015 được quy định như thế nào?`,options:[`Bộ luật Dân sự 2015 KHÔNG CÒN quy định về việc lập di chúc chung của vợ chồng; mỗi cá nhân tự lập di chúc để định đoạt phần tài sản của mình`,`Bắt buộc vợ chồng phải lập di chúc chung`,`Di chúc chung của vợ chồng không bao giờ được phép sửa đổi`,`Di chúc chung tự động hủy bỏ khi có con thứ hai`],correctAnswer:0,explanation:`Bộ luật Dân sự 2015 đã bãi bỏ chế định "Di chúc chung của vợ chồng" (vốn có trong BLDS 2005) để bảo đảm quyền tự do định đoạt tài sản riêng của mỗi cá nhân.`,legalReference:`Điểm mới Bộ luật Dân sự 2015 về thừa kế`,difficulty:`vận dụng`},{id:445,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Con nuôi và cha nuôi, mẹ nuôi có được thừa kế di sản của nhau theo pháp luật không?`,options:[`Được thừa kế di sản của nhau theo pháp luật (thuộc hàng thừa kế thứ nhất) và còn được thừa kế di sản theo quy định tại Điều 652 và Điều 653 của BLDS 2015`,`Tuyệt đối không được thừa kế vì không cùng huyết thống`,`Chỉ được hưởng 10% phần tài sản`,`Chỉ con nuôi là nam giới mới được thừa kế`],correctAnswer:0,explanation:`Điều 653 BLDS 2015: Con nuôi và cha nuôi, mẹ nuôi được thừa kế di sản của nhau và còn được thừa kế di sản theo quy định tại Điều 651 và Điều 652 của Bộ luật này (bình đẳng như con đẻ, cha mẹ đẻ).`,legalReference:`Điều 653 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:446,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trường hợp con dâu, con rể đối với cha mẹ chồng, cha mẹ vợ thì:`,options:[`Không thuộc diện thừa kế theo pháp luật đối với di sản của cha mẹ chồng/vợ (trừ khi được hưởng theo di chúc hợp pháp)`,`Mặc nhiên được hưởng thừa kế ở hàng thứ nhất`,`Được chia thừa kế ngang bằng con ruột`,`Tự động đứng tên quản lý toàn bộ di sản thừa kế`],correctAnswer:0,explanation:`Điều 651 BLDS 2015 không liệt kê con dâu, con rể trong các hàng thừa kế theo pháp luật. Con dâu, con rể chỉ được hưởng di sản nếu người để lại di sản chỉ định rõ trong di chúc.`,legalReference:`Điều 651 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:447,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Chi phí hợp lý cho việc mai táng khi giải quyết bồi thường thiệt hại do tính mạng bị xâm phạm bao gồm:`,options:[`Tiền mua áo quan, các vật dụng cần thiết cho việc khâm liệm, tiền thuê xe tang và các khoản chi phí thực tế phục vụ trực tiếp cho việc chôn cất hoặc hỏa táng theo tập quán địa phương`,`Tiền xây lăng mộ xa hoa hàng tỷ đồng`,`Tiền làm cỗ bàn linh đình 100 mâm đãi khách`,`Tiền cúng lễ mê tín dị đoan`],correctAnswer:0,explanation:`Điều 591 BLDS 2015 và hướng dẫn của Hội đồng Thẩm phán TANDTC: Chi phí mai táng hợp lý là các khoản chi thực tế, cần thiết, thông thường theo phong tục tập quán địa phương, không chấp nhận các chi phí xa hoa lãng phí.`,legalReference:`Điều 591 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:448,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hiệu yêu cầu bồi thường thiệt hại ngoài hợp đồng theo Bộ luật Dân sự 2015 là bao nhiêu năm?`,options:[`03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm`,`01 năm`,`05 năm`,`10 năm`],correctAnswer:0,explanation:`Điều 588 BLDS 2015: Thời hiệu khởi kiện yêu cầu bồi thường thiệt hại là 03 năm, kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm.`,legalReference:`Điều 588 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:449,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hạn kháng nghị theo thủ tục phúc thẩm của Viện kiểm sát cùng cấp đối với bản án sơ thẩm của Tòa án là bao nhiêu ngày kể từ ngày tuyên án?`,options:[`15 ngày (Viện kiểm sát cấp trên trực tiếp là 01 tháng)`,`07 ngày`,`03 ngày`,`60 ngày`],correctAnswer:0,explanation:`Khoản 1 Điều 280 BLTTDS 2015: Thời hạn kháng nghị đối với bản án của Tòa án cấp sơ thẩm của Viện kiểm sát cùng cấp là 15 ngày, của Viện kiểm sát cấp trên trực tiếp là 01 tháng, kể từ ngày tuyên án.`,legalReference:`Điều 280 Bộ luật Tố tụng Dân sự 2015`,difficulty:`vận dụng`},{id:450,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hội đồng xét xử sơ thẩm vụ án dân sự thông thường gồm những ai?`,options:[`Một Thẩm phán và hai Hội thẩm nhân dân (trường hợp đặc biệt gồm hai Thẩm phán và ba Hội thẩm nhân dân)`,`Ba Thẩm phán chuyên nghiệp`,`Một Thẩm phán duy nhất`,`Năm Hội thẩm nhân dân không có Thẩm phán`],correctAnswer:0,explanation:`Khoản 1 Điều 63 BLTTDS 2015: Hội đồng xét xử sơ thẩm vụ án dân sự gồm một Thẩm phán và hai Hội thẩm nhân dân, trừ trường hợp luật có quy định khác.`,legalReference:`Điều 63 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:451,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Phiên tòa phúc thẩm dân sự có sự tham gia của Hội thẩm nhân dân hay không?`,options:[`Không, Hội đồng xét xử phúc thẩm vụ án dân sự gồm 03 Thẩm phán`,`Có, gồm 01 Thẩm phán và 02 Hội thẩm`,`Có, gồm 03 Hội thẩm nhân dân`,`Tùy theo sự đồng ý của nguyên đơn`],correctAnswer:0,explanation:`Khoản 1 Điều 64 BLTTDS 2015: Hội đồng xét xử phúc thẩm vụ án dân sự gồm 03 Thẩm phán, không có sự tham gia của Hội thẩm nhân dân.`,legalReference:`Điều 64 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:452,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Biện pháp khẩn cấp tạm thời trong tố tụng dân sự (như phong tỏa tài khoản, kê biên tài sản tranh chấp) nhằm mục đích:`,options:[`Tạm thời giải quyết yêu cầu cấp bách của đương sự, bảo vệ tính mạng, sức khỏe, tài sản, thu thập chứng cứ, bảo vệ chứng cứ hoặc bảo đảm cho việc giải quyết vụ án hoặc thi hành án`,`Trừng phạt bị đơn trước khi xét xử`,`Tịch thu tài sản sung công quỹ nhà nước ngay`,`Buộc bị đơn phải nhận tội`],correctAnswer:0,explanation:`Điều 111 BLTTDS 2015 quy định mục đích của việc áp dụng biện pháp khẩn cấp tạm thời là để tạm thời giải quyết yêu cầu cấp bách, bảo vệ chứng cứ, bảo toàn tình trạng tài sản tránh tẩu tán.`,legalReference:`Điều 111 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:453,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Khi nguyên đơn đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt tại phiên tòa sơ thẩm mà không có lý do chính đáng và không có đơn đề nghị xét xử vắng mặt thì:`,options:[`Bị coi là từ bỏ việc khởi kiện và Tòa án ra quyết định đình chỉ giải quyết vụ án`,`Tòa án xử cho nguyên đơn thắng kiện`,`Tòa án phát lệnh truy nã nguyên đơn`,`Bắt buộc phạt tù nguyên đơn 6 tháng`],correctAnswer:0,explanation:`Điểm c Khoản 2 Điều 217 và Điều 227 BLTTDS 2015: Nguyên đơn đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt thì bị coi là từ bỏ việc khởi kiện và Tòa án ra quyết định đình chỉ giải quyết vụ án.`,legalReference:`Điều 217 & 227 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:454,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Bản án phúc thẩm dân sự có hiệu lực thi hành khi nào?`,options:[`Có hiệu lực pháp luật kể từ ngày tuyên án`,`Sau 15 ngày kể từ ngày tuyên án`,`Sau 30 ngày kể từ ngày nhận bản sao bản án`,`Chỉ có hiệu lực khi đương sự không khiếu nại`],correctAnswer:0,explanation:`Khoản 6 Điều 313 BLTTDS 2015 quy định: Bản án phúc thẩm có hiệu lực pháp luật kể từ ngày tuyên án.`,legalReference:`Điều 313 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:455,ch
