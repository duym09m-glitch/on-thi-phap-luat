8 Hiến pháp 2013`,difficulty:`dễ`},{id:120,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hình thức văn bản quy phạm pháp luật do Chủ tịch nước ban hành là:`,options:[`Nghị định và Nghị quyết`,`Lệnh và Quyết định`,`Chỉ thị và Thông tư`,`Pháp lệnh và Nghị quyết`],correctAnswer:1,explanation:`Điều 91 Hiến pháp 2013 và Điều 4 Luật Ban hành VBQPPL: "Chủ tịch nước ban hành lệnh, quyết định để thực hiện nhiệm vụ, quyền hạn của mình".`,legalReference:`Điều 91 Hiến pháp 2013`,difficulty:`dễ`},{id:121,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào có thẩm quyền bỏ phiếu tín nhiệm đối với những người giữ các chức vụ do Quốc hội bầu hoặc phê chuẩn?`,options:[`Chính phủ`,`Quốc hội`,`Mặt trận Tổ quốc Việt Nam`,`Ban Chấp hành Trung ương`],correctAnswer:1,explanation:`Khoản 8 Điều 70 Hiến pháp 2013 quy định Quốc hội có thẩm quyền lấy phiếu tín nhiệm, bỏ phiếu tín nhiệm đối với người giữ chức vụ do Quốc hội bầu hoặc phê chuẩn.`,legalReference:`Khoản 8 Điều 70 Hiến pháp 2013`,difficulty:`trung bình`},{id:122,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Theo quy định hiện hành, Quốc hội họp mỗi năm mấy kỳ thường lệ?`,options:[`1 kỳ họp`,`2 kỳ họp`,`3 kỳ họp`,`4 kỳ họp`],correctAnswer:1,explanation:`Khoản 2 Điều 83 Hiến pháp 2013: "Quốc hội họp mỗi năm hai kỳ. Trường hợp Chủ tịch nước, Ủy ban thường vụ Quốc hội, Thủ tướng Chính phủ hoặc ít nhất một phần ba tổng số đại biểu Quốc hội yêu cầu thì Quốc hội họp bất thường".`,legalReference:`Điều 83 Hiến pháp 2013`,difficulty:`dễ`},{id:123,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ủy ban nhân dân hoạt động theo nguyên tắc nào sau đây?`,options:[`Chế độ tập thể lãnh đạo kết hợp với đề cao trách nhiệm cá nhân của Chủ tịch UBND`,`Độc quyền quyết định của Giám đốc Sở Tài chính`,`Phân quyền độc lập tuyệt đối giữa các Phó Chủ tịch`,`Tuân theo quyết định của Hội đồng trọng tài`],correctAnswer:0,explanation:`Theo Luật Tổ chức chính quyền địa phương, UBND hoạt động theo nguyên tắc tập thể UBND kết hợp với trách nhiệm của Chủ tịch UBND.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`trung bình`},{id:124,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hội đồng nhân dân có quyền bãi bỏ văn bản sai trái của cơ quan nào sau đây?`,options:[`Văn bản sai trái của Ủy ban nhân dân cùng cấp và văn bản sai trái của Hội đồng nhân dân cấp dưới trực tiếp`,`Văn bản sai trái của Tòa án nhân dân cùng cấp`,`Văn bản sai trái của Bộ Tư pháp`,`Văn bản sai trái của Thủ tướng Chính phủ`],correctAnswer:0,explanation:`Điều 115 Hiến pháp 2013 và Luật Tổ chức chính quyền địa phương: HĐND bãi bỏ văn bản sai trái của UBND cùng cấp và văn bản sai trái của HĐND cấp dưới trực tiếp.`,legalReference:`Điều 115 Hiến pháp 2013`,difficulty:`trung bình`},{id:125,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hệ thống Tòa án nhân dân ở Việt Nam hiện nay bao gồm các cấp nào?`,options:[`Tòa án nhân dân tối cao; Tòa án nhân dân cấp cao; Tòa án nhân dân cấp tỉnh; Tòa án nhân dân cấp huyện; và các Tòa án quân sự`,`Chỉ có Tòa án nhân dân tối cao và Tòa án nhân dân cấp cơ sở`,`Tòa án dân sự, Tòa án hình sự và Tòa án gia đình tách rời độc lập`,`Tòa án cấp xã, Tòa án cấp huyện và Tòa án cấp trung ương`],correctAnswer:0,explanation:`Điều 3 Luật Tổ chức Tòa án nhân dân quy định hệ thống Tòa án gồm: TAND tối cao; TAND cấp cao; TAND tỉnh, thành phố trực thuộc trung ương; TAND huyện, quận, thị xã, thành phố thuộc tỉnh; và các Tòa án quân sự.`,legalReference:`Luật Tổ chức Tòa án nhân dân & Điều 102 Hiến pháp 2013`,difficulty:`trung bình`},{id:126,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan xét xử cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam là:`,options:[`Tòa án nhân dân tối cao`,`Tòa án nhân dân cấp cao tại Hà Nội`,`Hội đồng Thẩm phán Tòa án Quân sự`,`Ủy ban Tư pháp của Quốc hội`],correctAnswer:0,explanation:`Điều 104 Hiến pháp 2013: "Tòa án nhân dân tối cao là cơ quan xét xử cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam".`,legalReference:`Điều 104 Hiến pháp 2013`,difficulty:`dễ`},{id:127,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chánh án Tòa án nhân dân tối cao chịu trách nhiệm và báo cáo công tác trước cơ quan nào?`,options:[`Chính phủ`,`Quốc hội (và báo cáo trước UBTVQH, Chủ tịch nước trong thời gian Quốc hội không họp)`,`Bộ Tư pháp`,`Viện kiểm sát nhân dân tối cao`],correctAnswer:1,explanation:`Khoản 2 Điều 105 Hiến pháp 2013: Chánh án Tòa án nhân dân tối cao chịu trách nhiệm và báo cáo công tác trước Quốc hội; trong thời gian Quốc hội không họp thì báo cáo trước Ủy ban thường vụ Quốc hội, Chủ tịch nước.`,legalReference:`Khoản 2 Điều 105 Hiến pháp 2013`,difficulty:`trung bình`},{id:128,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Nguyên tắc xét xử của Tòa án nhân dân theo Hiến pháp 2013 quy định phiên tòa xét xử như thế nào?`,options:[`Tòa án nhân dân xét xử công khai; trong trường hợp đặc biệt cần giữ bí mật nhà nước, thuần phong mỹ tục... thì Tòa án xét xử kín nhưng phải tuyên án công khai`,`Tòa án luôn luôn bắt buộc phải xét xử kín mọi vụ án`,`Chỉ xét xử công khai đối với các vụ án tranh chấp đất đai`,`Tùy theo yêu cầu của bị cáo để quyết định xét xử kín hay hở`],correctAnswer:0,explanation:`Khoản 3 Điều 103 Hiến pháp 2013: Tòa án nhân dân xét xử công khai. Trường hợp đặc biệt cần giữ bí mật nhà nước, thuần phong mỹ tục của dân tộc, bảo vệ người chưa thành niên hoặc giữ bí mật đời tư... Tòa án có thể xét xử kín.`,legalReference:`Khoản 3 Điều 103 Hiến pháp 2013`,difficulty:`trung bình`},{id:129,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ai là người có quyền công bố tình trạng chiến tranh hoặc bãi bỏ tình trạng chiến tranh căn cứ vào nghị quyết của Quốc hội hoặc của Ủy ban Thường vụ Quốc hội?`,options:[`Bộ trưởng Bộ Quốc phòng`,`Thủ tướng Chính phủ`,`Chủ tịch nước`,`Chủ tịch Quốc hội`],correctAnswer:2,explanation:`Khoản 5 Điều 88 Hiến pháp 2013: Chủ tịch nước có quyền căn cứ vào nghị quyết của Quốc hội hoặc của Ủy ban thường vụ Quốc hội, công bố, bãi bỏ quyết định tuyên bố tình trạng chiến tranh.`,legalReference:`Điều 88 Hiến pháp 2013`,difficulty:`trung bình`},{id:130,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào sau đây KHÔNG THUỘC cơ cấu tổ chức của Chính phủ?`,options:[`Bộ Công an`,`Bộ Tài chính`,`Viện kiểm sát nhân dân tối cao`,`Bộ Ngoại giao`],correctAnswer:2,explanation:`Viện kiểm sát nhân dân tối cao là cơ quan độc lập trong bộ máy nhà nước thực hiện quyền công tố và kiểm sát tư pháp, không thuộc nhánh hành pháp (Chính phủ).`,legalReference:`Cơ cấu tổ chức Bộ máy Nhà nước Việt Nam theo Hiến pháp 2013`,difficulty:`dễ`},{id:131,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Đại biểu Quốc hội có quyền chất vấn những ai trong phiên họp Quốc hội?`,options:[`Chủ tịch nước, Chủ tịch Quốc hội, Thủ tướng Chính phủ, các Bộ trưởng và các thành viên khác của Chính phủ, Chánh án TANDTC, Viện trưởng VKSNDTC, Tổng Kiểm toán nhà nước`,`Chỉ được chất vấn Bí thư Tỉnh ủy`,`Chỉ được chất vấn các đại biểu Quốc hội cùng đoàn`,`Không được quyền chất vấn ai`],correctAnswer:0,explanation:`Điều 80 Hiến pháp 2013: Đại biểu Quốc hội có quyền chất vấn Chủ tịch nước, Chủ tịch Quốc hội, Thủ tướng Chính phủ, Bộ trưởng, thành viên khác của Chính phủ, Chánh án TANDTC, Viện trưởng VKSNDTC, Tổng Kiểm toán nhà nước.`,legalReference:`Điều 80 Hiến pháp 2013`,difficulty:`trung bình`},{id:132,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ủy ban nhân dân cấp tỉnh do cơ quan nào trực tiếp bầu ra?`,options:[`Nhân dân toàn tỉnh bỏ phiếu trực tiếp bầu`,`Hội đồng nhân dân cấp tỉnh cùng cấp bầu`,`Thủ tướng Chính phủ trực tiếp chỉ định toàn bộ`,`Bộ Nội vụ bổ nhiệm`],correctAnswer:1,explanation:`Điều 114 Hiến pháp 2013: "Ủy ban nhân dân ở cấp chính quyền địa phương do Hội đồng nhân dân cùng cấp bầu là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương".`,legalReference:`Điều 114 Hiến pháp 2013`,difficulty:`dễ`},{id:133,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chức vụ Tổng Kiểm toán nhà nước do cơ quan nào bầu theo đề nghị của Ủy ban thường vụ Quốc hội?`,options:[`Chính phủ`,`Chủ tịch nước`,`Quốc hội`,`Bộ Tài chính`],correctAnswer:2,explanation:`Khoản 7 Điều 70 Hiến pháp 2013: Quốc hội bầu, miễn nhiệm, bãi nhiệm Tổng Kiểm toán nhà nước theo đề nghị của Ủy ban thường vụ Quốc hội.`,legalReference:`Điều 70 & Điều 118 Hiến pháp 2013`,difficulty:`trung bình`},{id:134,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hội đồng Dân tộc của Quốc hội có nhiệm vụ gì?`,options:[`Nghiên cứu và kiến nghị với Quốc hội về các vấn đề dân tộc; giám sát việc thi hành chính sách dân tộc`,`Trực tiếp điều hành các trường đại học vùng đồng bào dân tộc`,`Xét xử các tội phạm xảy ra ở miền núi`,`Quản lý ngân sách tài chính riêng cho vùng cao`],correctAnswer:0,explanation:`Điều 75 Hiến pháp 2013: Hội đồng dân tộc nghiên cứu và kiến nghị với Quốc hội về các vấn đề dân tộc; thực hiện quyền giám sát việc thi hành chính sách dân tộc, các chương trình, kế hoạch phát triển kinh tế - xã hội miền núi và vùng đồng bào dân tộc thiểu số.`,legalReference:`Điều 75 Hiến pháp 2013`,difficulty:`trung bình`},{id:135,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan có thẩm quyền quyết định đại xá là cơ quan nào?`,options:[`Chủ tịch nước`,`Quốc hội`,`Thủ tướng Chính phủ`,`Bộ trưởng Bộ Công an`],correctAnswer:1,explanation:`Khoản 11 Điều 70 Hiến pháp 2013: Quốc hội quyết định đại xá. (Lưu ý: Chủ tịch nước quyết định đặc xá theo Khoản 3 Điều 88).`,legalReference:`Điều 70 Hiến pháp 2013`,difficulty:`vận dụng`},{id:136,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chủ tịch nước có quyền quyết định đặc xá căn cứ vào quy định nào?`,options:[`Khoản 3 Điều 88 Hiến pháp 2013 và Luật Đặc xá`,`Luật Tổ chức Tòa án nhân dân`,`Quyết định của Viện trưởng Viện kiểm sát`,`Nghị quyết của Ủy ban Trung ương MTTQ Việt Nam`],correctAnswer:0,explanation:`Chủ tịch nước có thẩm quyền quyết định đặc xá theo quy định tại Khoản 3 Điều 88 Hiến pháp 2013 và Luật Đặc xá.`,legalReference:`Điều 88 Hiến pháp 2013 & Luật Đặc xá`,difficulty:`dễ`},{id:137,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Theo Bộ luật Dân sự 2015, người từ đủ 15 tuổi đến chưa đủ 18 tuổi được tự mình xác lập, thực hiện giao dịch dân sự nào?`,options:[`Mọi giao dịch dân sự mà không có ngoại lệ`,`Được tự mình xác lập, thực hiện giao dịch dân sự, trừ giao dịch liên quan đến bất động sản, động sản phải đăng ký và giao dịch khác theo quy định phải được người đại diện đồng ý`,`Không được tự xác lập bất kỳ giao dịch nào`,`Chỉ được mua đồ ăn sáng`],correctAnswer:1,explanation:`Khoản 4 Điều 21 BLDS 2015: Người từ đủ 15 tuổi đến chưa đủ 18 tuổi tự mình xác lập, thực hiện giao dịch dân sự, trừ giao dịch dân sự liên quan đến bất động sản, động sản phải đăng ký và giao dịch dân sự khác theo quy định của luật phải được người đại diện theo pháp luật đồng ý.`,legalReference:`Khoản 4 Điều 21 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:138,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Tòa án chỉ ra quyết định tuyên bố một người "Mất năng lực hành vi dân sự" khi có đủ các điều kiện nào?`,options:[`Người đó nghiện ma túy nặng`,`Người bị bệnh tâm thần hoặc mắc bệnh khác mà không thể nhận thức, làm chủ được hành vi của mình, trên cơ sở kết luận giám định pháp y tâm thần và theo yêu cầu của người có quyền, lợi ích liên quan`,`Người đó đi khỏi nơi cư trú biệt tích 6 tháng`,`Người đó bị phá sản không trả được nợ`],correctAnswer:1,explanation:`Khoản 1 Điều 22 BLDS 2015: Khi một người do bị bệnh tâm thần hoặc mắc bệnh khác mà không thể nhận thức, làm chủ được hành vi thì theo yêu cầu của người có quyền, lợi ích liên quan... Tòa án ra quyết định tuyên bố người này là người mất năng lực hành vi dân sự trên cơ sở kết luận giám định pháp y tâm thần.`,legalReference:`Điều 22 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:139,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Một tổ chức được công nhận là Pháp nhân khi đáp ứng đủ mấy điều kiện theo quy định tại Điều 74 Bộ luật Dân sự 2015?`,options:[`2 điều kiện`,`3 điều kiện`,`4 điều kiện (Được thành lập hợp pháp; Có cơ cấu tổ chức chặt chẽ; Có tài sản độc lập và tự chịu trách nhiệm bằng tài sản đó; Nhân danh mình tham gia các quan hệ pháp luật một cách độc lập)`,`5 điều kiện`],correctAnswer:2,explanation:`Điều 74 BLDS 2015 quy định 4 điều kiện của pháp nhân: 1. Thành lập hợp pháp; 2. Cơ cấu tổ chức; 3. Tài sản độc lập và tự chịu trách nhiệm bằng tài sản đó; 4. Nhân danh mình tham gia quan hệ pháp luật độc lập.`,legalReference:`Điều 74 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:140,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Bất động sản theo quy định của Bộ luật Dân sự 2015 KHÔNG BAO GỒM đối tượng nào sau đây?`,options:[`Đất đai`,`Nhà, công trình xây dựng gắn liền với đất đai`,`Xe ô tô 7 chỗ ngồi có đăng ký biển số`,`Tài sản khác gắn liền với đất đai, nhà, công trình xây dựng`],correctAnswer:2,explanation:`Điều 107 BLDS 2015: Bất động sản bao gồm: Đất đai; Nhà, công trình xây dựng gắn liền với đất đai; Tài sản khác gắn liền với đất đai, nhà...; Tài sản khác theo luật định. Xe ô tô dù có đăng ký biển số vẫn là Động sản.`,legalReference:`Điều 107 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:141,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Quyền định đoạt tài sản là quyền của chủ sở hữu được:`,options:[`Nắm giữ, chi phối tài sản`,`Khai thác công dụng, hưởng hoa lợi lợi tức từ tài sản`,`Chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản`,`Cho người khác mượn tạm thời trong 1 tuần`],correctAnswer:2,explanation:`Điều 192 BLDS 2015: Quyền định đoạt là quyền chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản.`,legalReference:`Điều 192 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:142,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Di chúc hợp pháp phải tuân thủ điều kiện nào sau đây?`,options:[`Người lập di chúc minh mẫn, sáng suốt trong khi lập di chúc; không bị lừa dối, đe dọa, cưỡng ép`,`Nội dung di chúc không vi phạm điều cấm của luật, không trái đạo đức xã hội`,`Hình thức của di chúc không trái quy định của luật`,`Cả A, B, C đều đúng`],correctAnswer:3,explanation:`Điều 630 BLDS 2015 quy định các điều kiện hợp pháp của di chúc: người lập minh mẫn tự nguyện; nội dung không cấm, không trái đạo đức; hình thức đúng luật.`,legalReference:`Điều 630 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:143,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Di chúc miệng chỉ được coi là hợp pháp nếu người di chúc miệng thể hiện ý chí cuối cùng của mình trước mặt ít nhất bao nhiêu người làm chứng và sau đó phải làm gì?`,options:[`Trước ít nhất 02 người làm chứng và ngay sau đó người làm chứng ghi chép lại, cùng ký tên hoặc điểm chỉ, trong 05 ngày làm việc phải được công chứng hoặc chứng thực`,`Trước 01 người hàng xóm bất kỳ ghi âm lại`,`Trước ít nhất 05 người trong dòng họ xác nhận miệng`,`Chỉ cần người thân có mặt nghe thấy`],correctAnswer:0,explanation:`Khoản 5 Điều 630 BLDS 2015: Di chúc miệng hợp pháp nếu thể hiện ý chí trước ít nhất 02 người làm chứng và ngay sau đó được ghi chép lại, cùng ký tên hoặc điểm chỉ; trong thời hạn 05 ngày làm việc phải được công chứng viên hoặc cơ quan có thẩm quyền chứng thực.`,legalReference:`Điều 629 & 630 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:144,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thừa kế thế vị theo Điều 652 Bộ luật Dân sự 2015 xảy ra trong trường hợp nào?`,options:[`Con của người để lại di sản chết trước hoặc cùng một thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống`,`Con từ chối nhận di sản nên giao lại cho cháu nội`,`Người thừa kế chia đều tài sản cho người hàng xóm nghèo`,`Cha mẹ nhận thay di sản của con ruột đang đi du học`],correctAnswer:0,explanation:`Điều 652 BLDS 2015: Trường hợp con của người để lại di sản chết trước hoặc cùng một thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống; nếu cháu cũng chết trước hoặc cùng thời điểm thì chắt được hưởng.`,legalReference:`Điều 652 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:145,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Di sản thừa kế bao gồm những gì?`,options:[`Tài sản riêng của người chết, phần tài sản của người chết trong tài sản chung với người khác`,`Chỉ gồm tiền mặt gửi tại ngân hàng`,`Toàn bộ tài sản của cả dòng họ nơi người chết sinh sống`,`Chỉ bao gồm đất đai có sổ đỏ`],correctAnswer:0,explanation:`Điều 612 BLDS 2015 quy định: "Di sản bao gồm tài sản riêng của người chết, phần tài sản của người chết trong tài sản chung với người khác".`,legalReference:`Điều 612 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:146,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hợp đồng mua bán tài sản chuyển giao quyền sở hữu tài sản từ thời điểm nào (trừ trường hợp luật có quy định khác hoặc có thỏa thuận khác)?`,options:[`Thời điểm tài sản được chuyển giao cho bên mua`,`Thời điểm bên mua trả xong 100% tiền mua hàng`,`Thời điểm bên bán xuất hóa đơn giá trị gia tăng`,`Thời điểm hai bên bắt đầu đàm phán hợp đồng`],correctAnswer:0,explanation:`Khoản 1 Điều 440 BLDS 2015: Quyền sở hữu được chuyển giao cho bên mua kể từ thời điểm tài sản được chuyển giao, trừ trường hợp luật có quy định khác hoặc các bên có thỏa thuận khác.`,legalReference:`Điều 440 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:147,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Biện pháp "Cầm cố tài sản" khác với "Thế chấp tài sản" ở điểm cơ bản nào sau đây?`,options:[`Cầm cố bắt buộc phải giao tài sản cho bên nhận cầm cố giữ; còn Thế chấp thì không giao tài sản mà bên thế chấp vẫn giữ tài sản`,`Cầm cố chỉ áp dụng cho bất động sản; thế chấp áp dụng cho động sản`,`Cầm cố không có giá trị pháp lý ràng buộc`,`Thế chấp luôn luôn phải chuyển giao tài sản sang kho của ngân hàng`],correctAnswer:0,explanation:`Điều 309 và Điều 317 BLDS 2015: Cầm cố là việc giao tài sản cho bên kia giữ; Thế chấp là dùng tài sản để bảo đảm nhưng không giao tài sản cho bên nhận thế chấp.`,legalReference:`Điều 309 & Điều 317 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:148,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Khi đặt cọc để bảo đảm giao kết hoặc thực hiện hợp đồng, nếu bên đặt cọc từ chối giao kết, thực hiện hợp đồng thì:`,options:[`Tài sản đặt cọc thuộc về bên nhận đặt cọc (trừ trường hợp có thỏa thuận khác)`,`Bên nhận đặt cọc phải trả lại gấp đôi tài sản đặt cọc`,`Hai bên chia đôi tài sản đặt cọc`,`Nhà nước tịch thu toàn bộ tài sản đặt cọc`],correctAnswer:0,explanation:`Khoản 2 Điều 328 BLDS 2015: Trường hợp bên đặt cọc từ chối giao kết, thực hiện hợp đồng thì tài sản đặt cọc thuộc về bên nhận đặt cọc; nếu bên nhận đặt cọc từ chối thì phải trả cho bên đặt cọc tài sản đặt cọc và một khoản tiền tương đương giá trị tài sản đặt cọc (trừ thỏa thuận khác).`,legalReference:`Điều 328 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:149,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Theo BLTTDS 2015, Tòa án thụ lý vụ án dân sự kể từ thời điểm nào?`,options:[`Khi người khởi kiện nộp biên lai thu tiền tạm ứng án phí cho Tòa án (hoặc khi được miễn/không phải nộp)`,`Khi nguyên đơn viết xong đơn khởi kiện tại nhà`,`Khi người khởi kiện gửi đơn qua bưu điện`,`Khi Tòa án mở phiên tòa sơ thẩm`],correctAnswer:0,explanation:`Khoản 3 Điều 195 BLTTDS 2015: Thẩm phán thụ lý vụ án khi người khởi kiện nộp cho Tòa án biên lai thu tiền tạm ứng án phí, hoặc kể từ ngày nhận đơn nếu thuộc trường hợp được miễn, không phải nộp.`,legalReference:`Điều 195 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:150,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hiệu khởi kiện yêu cầu Tòa án giải quyết tranh chấp hợp đồng dân sự là bao nhiêu năm kể từ ngày người có quyền biết hoặc phải biết quyền, lợi ích hợp pháp bị xâm phạm?`,options:[`1 năm`,`2 năm`,`3 năm`,`5 năm`],correctAnswer:2,explanation:`Điều 429 BLDS 2015 quy định: "Thời hiệu khởi kiện để yêu cầu Tòa án giải quyết tranh chấp hợp đồng là 03 năm, kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm".`,legalReference:`Điều 429 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:151,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Ai là người có nghĩa vụ chứng minh trong vụ án dân sự?`,options:[`Đương sự có yêu cầu Tòa án bảo vệ quyền và lợi ích hợp pháp của mình phải thu thập, cung cấp, giao nộp chứng cứ để chứng minh cho yêu cầu đó là có căn cứ`,`Tòa án phải tự đi thu thập chứng cứ thay hoàn toàn cho các bên`,`Viện kiểm sát bắt buộc phải đứng ra làm chứng`,`Chỉ có bị đơn mới phải chứng minh`],correctAnswer:0,explanation:`Khoản 1 Điều 91 BLTTDS 2015: Đương sự có yêu cầu Tòa án bảo vệ quyền và lợi ích hợp pháp của mình phải thu thập, cung cấp, giao nộp cho Tòa án tài liệu, chứng cứ để chứng minh cho yêu cầu đó là có căn cứ và hợp pháp.`,legalReference:`Điều 91 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:152,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Bản án sơ thẩm của Tòa án nhân dân cấp huyện nếu không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm thì có hiệu lực thi hành khi nào?`,options:[`Khi hết thời hạn kháng cáo, kháng nghị (15 ngày kể từ ngày tuyên án)`,`Có hiệu lực thi hành ngay trong ngày tuyên án`,`Sau 6 tháng kể từ ngày xét xử`,`Chỉ khi các đương sự đồng ý ký cam kết`],correctAnswer:0,explanation:`Điều 282 BLTTDS 2015: Bản án sơ thẩm hoặc những phần bản án sơ thẩm không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm thì có hiệu lực pháp luật kể từ ngày hết thời hạn kháng cáo, kháng nghị.`,legalReference:`Điều 282 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:153,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thủ tục "Giám đốc thẩm" trong tố tụng dân sự được tiến hành để:`,options:[`Xét lại bản án, quyết định đã có hiệu lực pháp luật nhưng bị kháng nghị vì phát hiện có vi phạm pháp luật nghiêm trọng trong việc giải quyết vụ án`,`Xét xử lại vụ việc lần đầu do đương sự yêu cầu`,`Hòa giải các mâu thuẫn tranh chấp đất đai mới phát sinh`,`Tuyên án tử hình đối với bị can`],correctAnswer:0,explanation:`Điều 325 BLTTDS 2015: Giám đốc thẩm là xét lại bản án, quyết định của Tòa án đã có hiệu lực pháp luật nhưng bị kháng nghị giám đốc thẩm khi có căn cứ vi phạm pháp luật nghiêm trọng.`,legalReference:`Điều 325 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:154,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thủ tục "Tái thẩm" trong tố tụng dân sự được áp dụng khi nào?`,options:[`Khi có tình tiết mới được phát hiện có thể làm thay đổi cơ bản nội dung bản án, quyết định mà Tòa án, đương sự không biết được khi Tòa án ra bản án, quyết định đó`,`Khi đương sự không hài lòng với thái độ của Thẩm phán`,`Khi đương sự đổi luật sư bào chữa`,`Khi vụ án chưa được xét xử sơ thẩm`],correctAnswer:0,explanation:`Điều 351 BLTTDS 2015: Tái thẩm là xét lại bản án, quyết định đã có hiệu lực pháp luật nhưng bị kháng nghị vì có những tình tiết mới được phát hiện có thể làm thay đổi cơ bản nội dung bản án mà trước đó Tòa án và đương sự không thể biết được.`,legalReference:`Điều 351 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:155,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Đối tượng nào sau đây KHÔNG CÓ QUYỀN thành lập và quản lý doanh nghiệp tại Việt Nam theo Luật Doanh nghiệp 2020?`,options:[`Cán bộ, công chức, viên chức theo quy định của pháp luật về cán bộ, công chức, viên chức`,`Công dân Việt Nam từ đủ 18 tuổi có năng lực hành vi dân sự đầy đủ`,`Tổ chức kinh tế tư nhân trong nước`,`Nhà đầu tư nước ngoài đáp ứng điều kiện đầu tư`],correctAnswer:0,explanation:`Khoản 2 Điều 17 Luật Doanh nghiệp 2020 quy định cán bộ, công chức, viên chức không có quyền thành lập và quản lý doanh nghiệp.`,legalReference:`Khoản 2 Điều 17 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:156,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Vốn điều lệ của công ty TNHH 2 thành viên trở lên là gì?`,options:[`Tổng giá trị tài sản do các thành viên cam kết góp và ghi trong Điều lệ công ty`,`Toàn bộ doanh thu của công ty sau 1 năm kinh doanh`,`Số tiền công ty vay từ ngân hàng thương mại`,`Khoản tiền nộp thuế thu nhập doanh nghiệp`],correctAnswer:0,explanation:`Khoản 34 Điều 4 Luật Doanh nghiệp 2020: Vốn điều lệ là tổng giá trị tài sản do các thành viên công ty, chủ sở hữu công ty đã góp hoặc cam kết góp khi thành lập công ty TNHH, công ty hợp danh; hoặc là tổng mệnh giá cổ phần đã bán hoặc được đăng ký mua khi thành lập công ty cổ phần.`,legalReference:`Điều 4 & 47 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:157,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cơ quan quyết định cao nhất của Công ty Cổ phần là cơ quan nào?`,options:[`Đại hội đồng cổ đông`,`Hội đồng quản trị`,`Ban Giám đốc điều hành`,`Ban kiểm soát`],correctAnswer:0,explanation:`Điều 138 Luật Doanh nghiệp 2020 quy định: "Đại hội đồng cổ đông gồm tất cả cổ đông có quyền biểu quyết, là cơ quan quyết định cao nhất của công ty cổ phần".`,legalReference:`Điều 138 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:158,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cơ quan quyết định cao nhất của Công ty TNHH 2 thành viên trở lên là:`,options:[`Hội đồng thành viên`,`Chủ tịch Ủy ban kiểm toán`,`Giám đốc điều hành`,`Trưởng ban đại diện công đoàn`],correctAnswer:0,explanation:`Điều 55 Luật Doanh nghiệp 2020 quy định: Hội đồng thành viên là cơ quan quyết định cao nhất của công ty TNHH hai thành viên trở lên, bao gồm tất cả các thành viên công ty.`,legalReference:`Điều 55 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:159,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thành viên góp vốn trong Công ty Hợp danh có quyền và nghĩa vụ nào sau đây?`,options:[`Chỉ chịu trách nhiệm về các khoản nợ của công ty trong phạm vi số vốn đã cam kết góp vào công ty`,`Chịu trách nhiệm vô hạn bằng toàn bộ tài sản cá nhân giống thành viên hợp danh`,`Được trực tiếp nhân danh công ty ký kết mọi hợp đồng kinh doanh`,`Làm người đại diện theo pháp luật của công ty hợp danh`],correctAnswer:0,explanation:`Điểm c Khoản 1 Điều 177 Luật Doanh nghiệp 2020: Thành viên góp vốn chỉ chịu trách nhiệm về các khoản nợ của công ty trong phạm vi số vốn đã cam kết góp vào công ty (trách nhiệm hữu hạn) và không được nhân danh công ty kinh doanh.`,legalReference:`Điều 177 & 187 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:160,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cổ phần nào sau đây của Công ty Cổ phần KHÔNG THỂ chuyển nhượng tự do cho người khác (bị hạn chế chuyển nhượng trong thời hạn nhất định)?`,options:[`Cổ phần phổ thông của cổ đông sáng lập trong thời hạn 03 năm kể từ ngày cấp GCN ĐKDN (chỉ được chuyển nhượng tự do cho cổ đông sáng lập khác)`,`Cổ phần phổ thông sau 5 năm hoạt động`,`Cổ phần ưu đãi cổ tức`,`Cổ phần chào bán công khai trên sàn chứng khoán`],correctAnswer:0,explanation:`Khoản 3 Điều 120 Luật Doanh nghiệp 2020: Trong thời hạn 03 năm kể từ ngày cấp GCN ĐKDN, cổ phần phổ thông của cổ đông sáng lập chỉ được tự do chuyển nhượng cho cổ đông sáng lập khác; nếu chuyển nhượng cho người ngoài thì phải được Đại hội đồng cổ đông chấp thuận.`,legalReference:`Điều 120 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:161,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Theo Luật Phá sản 2014, ai có quyền nộp đơn yêu cầu mở thủ tục phá sản khi doanh nghiệp mất khả năng thanh toán?`,options:[`Chủ nợ không có bảo đảm, chủ nợ có bảo đảm một phần; người lao động, công đoàn cơ sở; người đại diện theo pháp luật của doanh nghiệp`,`Chỉ duy nhất có Thẩm phán Tòa án nhân dân tối cao`,`Chỉ có Thủ tướng Chính phủ`,`Chỉ có đối thủ cạnh tranh trên thị trường`],correctAnswer:0,explanation:`Điều 5 Luật Phá sản 2014 quy định các chủ thể có quyền và nghĩa vụ nộp đơn yêu cầu mở thủ tục phá sản gồm: chủ nợ không bảo đảm hoặc có bảo đảm một phần, người lao động/công đoàn, chủ doanh nghiệp hoặc người đại diện hợp pháp...`,legalReference:`Điều 5 Luật Phá sản 2014`,difficulty:`trung bình`},{id:162,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hợp tác xã theo Luật Hợp tác xã là tổ chức kinh tế tập thể, đồng sở hữu, có tư cách pháp nhân, do ít nhất bao nhiêu thành viên tự nguyện thành lập?`,options:[`Ít nhất 05 thành viên (theo Luật HTX 2023)`,`Ít nhất 10 thành viên`,`Ít nhất 20 thành viên`,`Ít nhất 50 thành viên`],correctAnswer:0,explanation:`Theo Luật Hợp tác xã hiện hành, hợp tác xã do ít nhất 05 thành viên chính thức tự nguyện thành lập (Luật Hợp tác xã sửa đổi).`,legalReference:`Luật Hợp tác xã`,difficulty:`trung bình`},{id:163,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong hoạt động thương mại, hành vi vi phạm nào sau đây bên bị vi phạm ĐƯỢC QUYỀN áp dụng chế tài tạm ngừng thực hiện hợp đồng hoặc hủy bỏ hợp đồng?`,options:[`Xảy ra hành vi vi phạm mà các bên đã thỏa thuận là điều kiện để tạm ngừng/hủy bỏ, hoặc một bên vi phạm cơ bản nghĩa vụ hợp đồng`,`Bên kia thanh toán chậm 1 ngày do lỗi ngân hàng bảo trì`,`Nhân viên giao hàng đi nhầm đường 15 phút`,`Bên bán thay đổi mẫu bao bì đóng gói đẹp hơn`],correctAnswer:0,explanation:`Điều 308 và 312 Luật Thương mại 2005: Chế tài tạm ngừng hoặc hủy bỏ hợp đồng được áp dụng khi có thỏa thuận hoặc khi xảy ra hành vi vi phạm cơ bản nghĩa vụ hợp đồng.`,legalReference:`Điều 308 & 312 Luật Thương mại 2005`,difficulty:`trung bình`},{id:164,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Bên vi phạm hợp đồng thương mại ĐƯỢC MIỄN TRÁCH NHIỆM trong trường hợp nào sau đây?`,options:[`Xảy ra sự kiện bất khả kháng; hành vi vi phạm hoàn toàn do lỗi của bên kia; thực hiện theo quyết định của cơ quan nhà nước có thẩm quyền mà các bên không thể biết trước`,`Do giá nguyên vật liệu trên thị trường tăng nhẹ`,`Do giám đốc đi du lịch nước ngoài quên chuyển tiền`,`Do công ty con làm ăn thua lỗ`],correctAnswer:0,explanation:`Điều 294 Luật Thương mại 2005 quy định các trường hợp miễn trách nhiệm đối với hành vi vi phạm: sự kiện bất khả kháng; lỗi hoàn toàn của bên bị vi phạm; quyết định cơ quan nhà nước có thẩm quyền...`,legalReference:`Điều 294 Luật Thương mại 2005`,difficulty:`trung bình`},{id:165,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thời hiệu khiếu nại đối với tranh chấp về số lượng, chất lượng hàng hóa trong thương mại theo Điều 318 Luật Thương mại 2005 là:`,options:[`03 tháng đối với khiếu nại về số lượng; 06 tháng đối với khiếu nại về chất lượng kể từ ngày giao hàng`,`01 tuần kể từ ngày ký hợp đồng`,`02 năm kể từ ngày giao dịch`,`Không giới hạn thời gian`],correctAnswer:0,explanation:`Điều 318 Luật Thương mại 2005: 03 tháng kể từ ngày giao hàng đối với khiếu nại về số lượng hàng hoá; 06 tháng kể từ ngày giao hàng đối với khiếu nại về chất lượng hàng hoá.`,legalReference:`Điều 318 Luật Thương mại 2005`,difficulty:`trung bình`},{id:166,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cơ quan có thẩm quyền cấp Giấy chứng nhận đăng ký doanh nghiệp tại địa phương là cơ quan nào?`,options:[`Phòng Đăng ký kinh doanh thuộc Sở Kế hoạch và Đầu tư tỉnh, thành phố trực thuộc trung ương`,`Chi cục Thuế quận, huyện`,`Phòng Tư pháp huyện`,`Ban Quản lý thị trường`],correctAnswer:0,explanation:`Nghị định 01/2021/NĐ-CP quy định cơ quan đăng ký kinh doanh cấp tỉnh là Phòng Đăng ký kinh doanh thuộc Sở Kế hoạch và Đầu tư.`,legalReference:`Nghị định 01/2021/NĐ-CP về đăng ký doanh nghiệp`,difficulty:`dễ`},{id:167,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong Công ty TNHH một thành viên do cá nhân làm chủ sở hữu, cơ cấu tổ chức quản lý bao gồm:`,options:[`Chủ tịch công ty, Giám đốc hoặc Tổng giám đốc`,`Đại hội đồng cổ đông và Ban kiểm soát bắt buộc`,`Đại diện của Bộ Tài chính`,`Hội đồng gia tộc`],correctAnswer:0,explanation:`Khoản 1 Điều 79 Luật Doanh nghiệp 2020: Công ty TNHH một thành viên do cá nhân làm chủ sở hữu có Chủ tịch công ty, Giám đốc hoặc Tổng giám đốc.`,legalReference:`Điều 79 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:168,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Chế tài "Buộc thực hiện đúng hợp đồng" trong thương mại có nghĩa là gì?`,options:[`Bên bị vi phạm yêu cầu bên vi phạm thực hiện đúng hợp đồng hoặc dùng các biện pháp khác để hợp đồng được thực hiện và bên vi phạm phải chịu chi phí phát sinh`,`Buộc người đại diện bên vi phạm phải đi tù`,`Thu hồi toàn bộ tài sản cá nhân sung công quỹ`,`Cấm bên vi phạm kinh doanh vĩnh viễn`],correctAnswer:0,explanation:`Điều 297 Luật Thương mại 2005: Buộc thực hiện đúng hợp đồng là việc bên bị vi phạm yêu cầu bên vi phạm thực hiện đúng hợp đồng hoặc dùng các biện pháp khác để hợp đồng được thực hiện và bên vi phạm phải chịu các chi phí phát sinh.`,legalReference:`Điều 297 Luật Thương mại 2005`,difficulty:`dễ`},{id:169,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội phạm rất nghiêm trọng là tội phạm có mức cao nhất của khung hình phạt do BLHS quy định là:`,options:[`Đến 03 năm tù`,`Từ trên 03 năm đến 07 năm tù`,`Từ trên 07 năm đến 15 năm tù`,`Từ trên 15 năm tù đến 20 năm tù, chung thân hoặc tử hình`],correctAnswer:2,explanation:`Điểm c Khoản 1 Điều 9 Bộ luật Hình sự 2015: "Tội phạm rất nghiêm trọng là tội phạm có tính chất và mức độ nguy hiểm cho xã hội rất lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là từ trên 07 năm tù đến 15 năm tù".`,legalReference:`Điều 9 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:170,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Khách thể của tội phạm là gì?`,options:[`Quan hệ xã hội được luật hình sự bảo vệ và bị tội phạm xâm hại`,`Người thực hiện hành vi nguy hiểm cho xã hội`,`Hung khí và công cụ được sử dụng để gây án`,`Nơi diễn ra hành vi phạm tội`],correctAnswer:0,explanation:`Khách thể của tội phạm là quan hệ xã hội được luật hình sự bảo vệ và bị hành vi phạm tội xâm hại hoặc đe dọa xâm hại gây thiệt hại.`,legalReference:`Lý luận cấu thành tội phạm trong Luật Hình sự`,difficulty:`dễ`},{id:171,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Mặt chủ quan của tội phạm bao gồm những yếu tố nào?`,options:[`Lỗi, động cơ và mục đích phạm tội`,`Hành vi, hậu quả và thời gian phạm tội`,`Độ tuổi và khả năng nhận thức của chủ thể`,`Quan hệ tài sản và quan hệ nhân thân`],correctAnswer:0,explanation:`Mặt chủ quan của tội phạm là thái độ tâm lý bên trong của người phạm tội đối với hành vi nguy hiểm và hậu quả, bao gồm: Lỗi (cố ý hoặc vô ý), Động cơ và Mục đích phạm tội.`,legalReference:`Cấu thành tội phạm - Mặt chủ quan`,difficulty:`dễ`},{id:172,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Phòng vệ chính đáng theo Khoản 1 Điều 22 Bộ luật Hình sự 2015 là:`,options:[`Hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích Nhà nước mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm`,`Hành vi chủ động tấn công đối thủ trước để phòng ngừa tranh chấp`,`Hành vi đánh trả kẻ thù sau khi kẻ đó đã bỏ chạy về nhà`,`Hành vi trả thù cá nhân theo giao kèo ngầm`],correctAnswer:0,explanation:`Khoản 1 Điều 22 BLHS 2015: Phòng vệ chính đáng là hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, của cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên. Phòng vệ chính đáng không phải là tội phạm.`,legalReference:`Điều 22 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:173,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi vượt quá giới hạn phòng vệ chính đáng dẫn đến làm chết người thì:`,options:[`Phải chịu trách nhiệm hình sự về tội Giết người do vượt quá giới hạn phòng vệ chính đáng theo quy định của BLHS`,`Được miễn hoàn toàn mọi trách nhiệm hình sự`,`Chỉ bị phạt tiền hành chính 500.000 đồng`,`Được Nhà nước khen thưởng vì dũng cảm`],correctAnswer:0,explanation:`Khoản 2 Điều 22 và Điều 126 BLHS 2015: Vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết. Người có hành vi này phải chịu trách nhiệm hình sự (Điều 126: Tội giết người do vượt quá giới hạn phòng vệ chính đáng).`,legalReference:`Điều 22 & Điều 126 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:174,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tình thế cấp thiết theo Điều 23 Bộ luật Hình sự 2015 là tình thế:`,options:[`Người vì muốn tránh gây thiệt hại cho quyền, lợi ích của Nhà nước, tổ chức, cá nhân mà không còn cách nào khác là phải gây một thiệt hại nhỏ hơn thiệt hại cần ngăn ngừa`,`Người vì muốn trốn nợ nên bỏ trốn ra nước ngoài`,`Gây thiệt hại lớn hơn nhiều lần so với thiệt hại cần ngăn chặn`,`Người phạm tội đang bị cảnh sát truy đuổi gắt gao`],correctAnswer:0,explanation:`Điều 23 BLHS 2015: Tình thế cấp thiết là tình thế của người vì muốn tránh gây thiệt hại cho quyền, lợi ích chính đáng mà không còn cách nào khác là phải gây một thiệt hại nhỏ hơn thiệt hại cần ngăn ngừa. Hành vi trong tình thế cấp thiết không phải là tội phạm.`,legalReference:`Điều 23 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:175,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi lén lút chiếm đoạt tài sản của người khác cấu thành tội phạm nào sau đây?`,options:[`Tội Cướp tài sản (Điều 168 BLHS)`,`Tội Trộm cắp tài sản (Điều 173 BLHS)`,`Tội Lừa đảo chiếm đoạt tài sản (Điều 174 BLHS)`,`Tội Cưỡng đoạt tài sản (Điều 170 BLHS)`],correctAnswer:1,explanation:`Đặc trưng cơ bản của Tội trộm cắp tài sản (Điều 173 BLHS 2015) là hành vi lén lút, bí mật chiếm đoạt tài sản đang có người quản lý.`,legalReference:`Điều 173 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:176,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội cướp tài sản (Điều 168 Bộ luật Hình sự 2015) có dấu hiệu hành vi đặc trưng nào?`,options:[`Dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản`,`Lợi dụng sơ hở để lấy trộm ví tiền trên xe buýt`,`Dùng thủ đoạn gian dối để nạn nhân tự nguyện giao tài sản`,`Nhặt được của rơi nhưng không trả lại`],correctAnswer:0,explanation:`Điều 168 BLHS 2015: Tội cướp tài sản là hành vi dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản.`,legalReference:`Điều 168 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:177,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình phạt "Tù chung thân" KHÔNG ĐƯỢC áp dụng đối với đối tượng nào sau đây?`,options:[`Người dưới 18 tuổi khi phạm tội`,`Người đã từng có tiền án về tội trộm cắp`,`Pháp nhân thương mại vi phạm nghĩa vụ nộp thuế`,`Cả A và B đều đúng`],correctAnswer:0,explanation:`Điều 39 BLHS 2015 quy định: Tù chung thân là hình phạt tù không thời hạn được áp dụng đối với người phạm tội đặc biệt nghiêm trọng, nhưng không áp dụng đối với người dưới 18 tuổi phạm tội.`,legalReference:`Điều 39 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:178,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Thời hiệu truy cứu trách nhiệm hình sự đối với Tội phạm ít nghiêm trọng là bao nhiêu năm kể từ ngày tội phạm được thực hiện?`,options:[`05 năm`,`10 năm`,`15 năm`,`20 năm`],correctAnswer:0,explanation:`Điểm a Khoản 2 Điều 27 BLHS 2015: Thời hiệu truy cứu trách nhiệm hình sự là 05 năm đối với tội phạm ít nghiêm trọng; 10 năm đối với nghiêm trọng; 15 năm đối với rất nghiêm trọng; 20 năm đối với đặc biệt nghiêm trọng.`,legalReference:`Điều 27 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:179,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi "Tham ô tài sản" (Điều 353 Bộ luật Hình sự 2015) là hành vi:`,options:[`Lợi dụng chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý`,`Trộm cắp tài sản trong cơ quan nhà nước vào ban đêm`,`Nhận tiền của công dân để làm một việc thuộc thẩm quyền`,`Lừa đảo chiếm đoạt tài sản của đối tác kinh doanh`],correctAnswer:0,explanation:`Điều 353 BLHS 2015 quy định người nào lợi dụng chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý thì phạm tội Tham ô tài sản.`,legalReference:`Điều 353 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:180,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Theo Luật Phòng, chống tham nhũng 2018, người có nghĩa vụ kê khai tài sản, thu nhập phải kê khai những loại tài sản nào?`,options:[`Quyền sử dụng đất, nhà ở, công trình xây dựng; kim khí quý, đá quý, tiền, giấy tờ có giá có giá trị từ 50.000.000 đồng trở lên; tài sản, tài khoản ở nước ngoài`,`Chỉ kê khai tiền mặt trên 1 tỷ đồng`,`Chỉ kê khai đất đai tại nơi đăng ký hộ khẩu thường trú`,`Mọi vật dụng cá nhân có giá trị từ 1 triệu đồng`],correctAnswer:0,explanation:`Điều 35 Luật PCTN 2018 quy định tài sản phải kê khai gồm: quyền sử dụng đất, nhà ở; kim khí quý, đá quý, tiền, giấy tờ có giá từ 50.000.000 đồng trở lên; tài sản, tài khoản ở nước ngoài; tổng thu nhập giữa 02 lần kê khai.`,legalReference:`Điều 35 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:181,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Người có hành vi đưa hối lộ mà chủ động khai báo trước khi bị phát giác thì:`,options:[`Có thể được miễn trách nhiệm hình sự và được trả lại một phần hoặc toàn bộ tài sản đã dùng để đưa hối lộ`,`Bắt buộc phải nhận mức án tử hình ngay lập tức`,`Vẫn bị xử phạt như người nhận hối lộ`,`Bị tịch thu toàn bộ tài sản gia đình`],correctAnswer:0,explanation:`Khoản 7 Điều 364 BLHS 2015 quy định: Người đưa hối lộ tuy không bị ép buộc nhưng đã chủ động khai báo trước khi bị phát giác thì có thể được miễn trách nhiệm hình sự và được trả lại một phần hoặc toàn bộ của đã dùng để đưa hối lộ.`,legalReference:`Khoản 7 Điều 364 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:182,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội Nhận hối lộ (Điều 354 BLHS) bắt đầu bị truy cứu trách nhiệm hình sự khi của hối lộ có giá trị từ bao nhiêu tiền trở lên (hoặc dưới mức đó nhưng đã bị kỷ luật/tiền án)?`,options:[`Từ 2.000.000 đồng trở lên`,`Từ 5.000.000 đồng trở lên`,`Từ 10.000.000 đồng trở lên`,`Từ 50.000.000 đồng trở lên`],correctAnswer:0,explanation:`Khoản 1 Điều 354 BLHS 2015 quy định người nào nhận hối lộ tiền, tài sản hoặc lợi ích vật chất khác trị giá từ 2.000.000 đồng đến dưới 100.000.000 đồng hoặc dưới 2.000.000 đồng nhưng đã bị xử lý kỷ luật/tiền sự thì bị truy cứu TNHS.`,legalReference:`Điều 354 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:183,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Nguyên tắc cơ bản của chế độ hôn nhân và gia đình ở Việt Nam là:`,options:[`Hôn nhân tự nguyện, tiến bộ, một vợ một chồng, vợ chồng bình đẳng`,`Hôn nhân do cha mẹ định đoạt vì lợi ích gia tộc`,`Chấp nhận chế độ đa thê nếu có sự đồng ý của vợ cả`,`Vợ phải phục tùng ý chí của chồng trong mọi hoàn cảnh`],correctAnswer:0,explanation:`Khoản 1 Điều 2 Luật HNGĐ 2014 khẳng định nguyên tắc cốt lõi: Hôn nhân tự nguyện, tiến bộ, một vợ một chồng, vợ chồng bình đẳng.`,legalReference:`Điều 2 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:184,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Hành vi "Tảo hôn" theo Luật Hôn nhân và Gia đình 2014 là việc:`,options:[`Lấy vợ, lấy chồng khi một bên hoặc cả hai bên chưa đủ tuổi kết hôn theo quy định của pháp luật`,`Kết hôn giữa những người cùng độ tuổi`,`Kết hôn khi chưa có nhà riêng`,`Kết hôn khi cha mẹ hai bên chưa cho phép`],correctAnswer:0,explanation:`Khoản 8 Điều 3 Luật Hôn nhân và Gia đình 2014: Tảo hôn là việc lấy vợ, lấy chồng khi một bên hoặc cả hai bên chưa đủ tuổi kết hôn theo quy định tại điểm a khoản 1 Điều 8 của Luật này.`,legalReference:`Điều 3 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:185,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Pháp luật hiện hành của Việt Nam quy định như thế nào về việc kết hôn giữa những người cùng giới tính?`,options:[`Nhà nước không thừa nhận hôn nhân giữa những người cùng giới tính`,`Pháp luật nghiêm cấm tuyệt đối và xử phạt tù những người cùng giới tính sống chung`,`Cho phép đăng ký kết hôn tại UBND như các cặp đôi nam nữ bình thường`,`Công nhận là gia đình hợp pháp nếu có con nuôi`],correctAnswer:0,explanation:`Khoản 2 Điều 8 Luật Hôn nhân và Gia đình 2014 quy định: "Nhà nước không thừa nhận hôn nhân giữa những người cùng giới tính". (Không cấm sống chung nhưng không thừa nhận tư cách vợ chồng hợp pháp).`,legalReference:`Khoản 2 Điều 8 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:186,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Tài sản riêng của vợ, chồng bao gồm những tài sản nào?`,options:[`Tài sản mà mỗi người có trước khi kết hôn; tài sản được thừa kế riêng, được tặng cho riêng trong thời kỳ hôn nhân; tài sản phục vụ nhu cầu thiết yếu riêng`,`Toàn bộ tiền lương hàng tháng kiếm được trong thời kỳ hôn nhân`,`Tiền trúng thưởng xổ số trong thời kỳ hôn nhân`,`Nhà mua bằng tiền tích lũy sau ngày cưới`],correctAnswer:0,explanation:`Khoản 1 Điều 43 Luật HNGĐ 2014: Tài sản riêng của vợ, chồng gồm tài sản mà mỗi người có trước khi kết hôn; tài sản được thừa kế riêng, được tặng cho riêng trong thời kỳ hôn nhân; tài sản được chia riêng; tài sản phục vụ nhu cầu thiết yếu của vợ, chồng...`,legalReference:`Điều 43 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:187,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Trường hợp có sự sáp nhập, trộn lẫn giữa tài sản riêng với tài sản chung mà vợ, chồng có yêu cầu chia tài sản thì:`,options:[`Được thanh toán phần giá trị tài sản của mình đóng góp vào khối tài sản đó, trừ trường hợp vợ chồng có thỏa thuận khác`,`Tài sản đó mặc nhiên thuộc toàn bộ về người chồng`,`Bị Tòa án tịch thu toàn bộ tài sản tranh chấp`,`Người vợ mặc nhiên được nhận 100% tài sản đó`],correctAnswer:0,explanation:`Khoản 4 Điều 59 Luật HNGĐ 2014: Trường hợp có sự sáp nhập, trộn lẫn giữa tài sản riêng với tài sản chung mà vợ, chồng có yêu cầu chia tài sản thì được thanh toán phần giá trị tài sản của mình đóng góp vào khối tài sản đó, trừ thỏa thuận khác.`,legalReference:`Điều 59 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:188,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Ai có quyền yêu cầu giải quyết việc ly hôn theo quy định tại Điều 51 Luật Hôn nhân và Gia đình 2014?`,options:[`Vợ, chồng hoặc cả hai người; cha, mẹ, người thân thích khác có quyền yêu cầu Tòa án giải quyết khi một bên vợ/chồng bị bệnh tâm thần và là nạn nhân của bạo lực gia đình`,`Chỉ có người chồng mới có quyền nộp đơn ly hôn`,`Chỉ có cha mẹ hai bên gia đình mới được quyền nộp đơn ly hôn`,`Cơ quan công an nơi cư trú`],correctAnswer:0,explanation:`Điều 51 Luật HNGĐ 2014: Vợ, chồng hoặc cả hai người có quyền yêu cầu Tòa án giải quyết ly hôn. Cha, mẹ, người thân thích khác cũng có quyền yêu cầu nếu một bên bị tâm thần và là nạn nhân của bạo lực gia đình.`,legalReference:`Điều 51 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:189,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Khi vợ chồng ly hôn, nghĩa vụ cấp dưỡng nuôi con của người không trực tiếp nuôi con:`,options:[`Là nghĩa vụ bắt buộc của cha/mẹ không trực tiếp nuôi con cho đến khi con đã thành niên và có khả năng lao động`,`Chỉ thực hiện khi người đó có thu nhập trên 50 triệu đồng/tháng`,`Tự động chấm dứt ngay khi có bản án ly hôn`,`Do cha mẹ người đó nộp thay toàn bộ`],correctAnswer:0,explanation:`Điều 82 và Điều 110 Luật HNGĐ 2014 quy định cha hoặc mẹ không trực tiếp nuôi con có nghĩa vụ cấp dưỡng cho con đến khi con thành niên và có khả năng lao động hoặc có tài sản để tự nuôi mình.`,legalReference:`Điều 82 & 110 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:190,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Nam và nữ đủ điều kiện kết hôn nhưng sống chung với nhau như vợ chồng mà KHÔNG đăng ký kết hôn thì:`,options:[`Không làm phát sinh quyền, nghĩa vụ giữa vợ và chồng`,`Được coi là hôn nhân thực tế hợp pháp sau 3 năm chung sống`,`Tự động được cấp giấy chứng nhận kết hôn`,`Mặc nhiên làm phát sinh quyền thừa kế tài sản của nhau như vợ chồng`],correctAnswer:0,explanation:`Khoản 1 Điều 14 Luật Hôn nhân và Gia đình 2014 quy định: Nam, nữ có đủ điều kiện kết hôn theo quy định mà chung sống với nhau như vợ chồng mà không đăng ký kết hôn thì không làm phát sinh quyền, nghĩa vụ giữa vợ và chồng.`,legalReference:`Điều 14 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:191,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Hành vi bạo lực gia đình giữa vợ và chồng bị xử lý như thế nào?`,options:[`Tùy theo tính chất, mức độ vi phạm có thể bị xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự theo quy định của pháp luật`,`Chỉ bị gia đình hai bên nhắc nhở riêng`,`Không bị pháp luật can thiệp vì là việc riêng tư`,`Được coi là chuyện nội bộ vợ chồng tự thỏa thuận`],correctAnswer:0,explanation:`Luật Phòng, chống bạo lực gia đình và BLHS, Nghị định xử phạt hành chính: Hành vi bạo lực gia đình bị nghiêm cấm, người có hành vi vi phạm tùy mức độ sẽ bị xử lý vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.`,legalReference:`Luật Phòng, chống bạo lực gia đình 2022`,difficulty:`dễ`},{id:192,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động là người làm việc cho người sử dụng lao động theo thỏa thuận, được trả lương và chịu sự quản lý, điều hành, giám sát; độ tuổi lao động tối thiểu theo quy định chung là:`,options:[`Đủ 15 tuổi (trừ trường hợp luật có quy định khác)`,`Đủ 16 tuổi`,`Đủ 18 tuổi`,`Đủ 20 tuổi`],correctAnswer:0,explanation:`Khoản 1 Điều 3 Bộ luật Lao động 2019: Người lao động là người làm việc cho người sử dụng lao động theo thỏa thuận, được trả lương và chịu sự quản lý, điều hành, giám sát của người sử dụng lao động. Độ tuổi lao động tối thiểu của người lao động là đủ 15 tuổi, trừ trường hợp quy định tại Mục 1 Chương XI của Bộ luật này.`,legalReference:`Khoản 1 Điều 3 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:193,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời gian thử việc tối đa đối với người quản lý doanh nghiệp theo Luật Doanh nghiệp là bao nhiêu ngày?`,options:[`60 ngày`,`90 ngày`,`120 ngày`,`Không quá 180 ngày`],correctAnswer:3,explanation:`Khoản 1 Điều 25 Bộ luật Lao động 2019 quy định thời gian thử việc không quá 180 ngày đối với công việc của người quản lý doanh nghiệp theo quy định của Luật Doanh nghiệp.`,legalReference:`Điều 25 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:194,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Hợp đồng lao động KHÔNG ĐƯỢC áp dụng thử việc đối với trường hợp nào sau đây?`,options:[`Giao kết hợp đồng lao động có thời hạn dưới 01 tháng`,`Hợp đồng lao động có thời hạn 06 tháng`,`Hợp đồng lao động có thời hạn 12 tháng`,`Hợp đồng lao động không xác định thời hạn`],correctAnswer:0,explanation:`Khoản 3 Điều 24 Bộ luật Lao động 2019: "Không áp dụng thử việc đối với người lao động giao kết hợp đồng lao động có thời hạn dưới 01 tháng".`,legalReference:`Điều 24 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:195,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Số giờ làm thêm của người lao động theo Bộ luật Lao động 2019 không quá bao nhiêu giờ trong một năm (trong điều kiện bình thường)?`,options:[`Không quá 100 giờ`,`Không quá 200 giờ (trường hợp đặc biệt không quá 300 giờ)`,`Không quá 400 giờ`,`Không hạn chế số giờ làm thêm`],correctAnswer:1,explanation:`Điểm c Khoản 2 Điều 107 BLLĐ 2019: Bảo đảm số giờ làm thêm của người lao động không quá 200 giờ trong 01 năm; trường hợp đặc biệt do Chính phủ quy định thì không quá 300 giờ trong 01 năm.`,legalReference:`Điều 107 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:196,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời giờ làm việc vào ban đêm được tính từ mấy giờ đến mấy giờ?`,options:[`Từ 22 giờ đến 06 giờ sáng ngày hôm sau`,`Từ 20 giờ đến 05 giờ sáng ngày hôm sau`,`Từ 21 giờ đến 05 giờ sáng ngày hôm sau`,`Từ 23 giờ đến 07 giờ sáng ngày hôm sau`],correctAnswer:0,explanation:`Điều 106 Bộ luật Lao động 2019 quy định: Giờ làm việc ban đêm được tính từ 22 giờ đến 06 giờ sáng ngày hôm sau.`,legalReference:`Điều 106 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:197,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động đơn phương chấm dứt hợp đồng lao động không xác định thời hạn phải báo trước cho người sử dụng lao động ít nhất bao nhiêu ngày (trong điều kiện bình thường)?`,options:[`Ít nhất 15 ngày`,`Ít nhất 30 ngày`,`Ít nhất 45 ngày`,`Ít nhất 60 ngày`],correctAnswer:2,explanation:`Điểm a Khoản 1 Điều 35 Bộ luật Lao động 2019: Người lao động có quyền đơn phương chấm dứt HĐLĐ nhưng phải báo trước ít nhất 45 ngày nếu làm việc theo hợp đồng lao động không xác định thời hạn.`,legalReference:`Điều 35 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:198,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người sử dụng lao động được áp dụng hình thức kỷ luật "Sa thải" trong trường hợp nào sau đây?`,options:[`Người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày mà không có lý do chính đáng`,`Người lao động đi làm muộn 15 phút một lần trong tháng`,`Người lao động từ chối làm thêm giờ ngoài quy định`,`Người lao động tham gia công đoàn cơ sở`],correctAnswer:0,explanation:`Khoản 4 Điều 125 Bộ luật Lao động 2019 quy định áp dụng hình thức sa thải khi người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày tính từ ngày đầu tiên tự ý bỏ việc mà không có lý do chính đáng.`,legalReference:`Khoản 4 Điều 125 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:199,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời hiệu xử lý kỷ luật lao động tối đa theo quy định của Bộ luật Lao động 2019 là bao lâu?`,options:[`06 tháng (trường hợp liên quan trực tiếp đến tài chính, tài sản, bí mật công nghệ... tối đa là 12 tháng)`,`01 tháng kể từ ngày phát hiện vi phạm`,`02 năm kể từ ngày vi phạm`,`03 năm đối với mọi vi phạm`],correctAnswer:0,explanation:`Khoản 1 Điều 123 BLLĐ 2019: Thời hiệu xử lý kỷ luật lao động là 06 tháng kể từ ngày xảy ra hành vi vi phạm; trường hợp hành vi vi phạm liên quan trực tiếp đến tài chính, tài sản, tiết lộ bí mật công nghệ, kinh doanh thì thời hiệu là 12 tháng.`,legalReference:`Điều 123 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:200,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Khi giải quyết tranh chấp lao động cá nhân, cơ quan/tổ chức nào có thẩm quyền tiến hành hòa giải trước khi yêu cầu Hội đồng trọng tài lao động hoặc Tòa án giải quyết (trừ một số trường hợp không bắt buộc hòa giải)?`,options:[`Hòa giải viên lao động`,`Cảnh sát khu vực`,`Hội Cựu chiến binh`,`Sở Kế hoạch và Đầu tư`],correctAnswer:0,explanation:`Điều 187 và Điều 188 Bộ luật Lao động 2019 quy định tranh chấp lao động cá nhân phải được giải quyết thông qua thủ tục hòa giải của Hòa giải viên lao động trước khi yêu cầu Hội đồng trọng tài lao động hoặc Tòa án giải quyết, trừ các trường hợp ngoại lệ quy định tại Khoản 1 Điều 188.`,legalReference:`Điều 187 & 188 Bộ luật Lao động 2019`,difficulty:`trung bình`}],ee=[{id:201,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Chức năng của Nhà nước được phân loại theo phạm vi hoạt động bao gồm hai chức năng cơ bản nào?`,options:[`Chức năng đối nội và chức năng đối ngoại`,`Chức năng kinh tế và chức năng chính trị`,`Chức năng lập pháp và chức năng hành pháp`,`Chức năng trấn áp và chức năng tổ chức`],correctAnswer:0,explanation:`Căn cứ vào phạm vi hoạt động chủ yếu, chức năng của Nhà nước được chia thành Chức năng đối nội (hoạt động trong nước) và Chức năng đối ngoại (hoạt động trong quan hệ quốc tế).`,legalReference:`Lý luận chung về Chức năng của Nhà nước`,difficulty:`dễ`},{id:202,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức chính thể Cộng hòa đại nghị (Cộng hòa nghị viện) có đặc điểm nổi bật nào?`,options:[`Chính phủ do Nghị viện thành lập và chịu trách nhiệm chính trị trước Nghị viện; Tổng thống chỉ giữ vai trò nguyên thủ danh nghĩa`,`Tổng thống vừa là nguyên thủ quốc gia vừa đứng đầu Chính phủ, không chịu trách nhiệm trước Nghị viện`,`Vua nắm toàn quyền hành pháp và tư pháp`,`Không có Nghị viện hay cơ quan đại diện của nhân dân`],correctAnswer:0,explanation:`Trong chính thể Cộng hòa đại nghị (như Đức, Ý, Ấn Độ), Nghị viện nắm quyền lực tối cao, Chính phủ hình thành từ đa số trong Nghị viện và chịu trách nhiệm trước Nghị viện, Tổng thống có quyền lực hạn chế mang tính tượng trưng.`,legalReference:`Lý luận về các dạng chính thể cộng hòa`,difficulty:`trung bình`},{id:203,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức chính thể Cộng hòa tổng thống (như Hoa Kỳ) có đặc điểm nào sau đây?`,options:[`Tổng thống do cử tri bầu ra, vừa là nguyên thủ quốc gia vừa là người đứng đầu cơ quan hành pháp độc lập với Nghị viện`,`Thủ tướng đứng đầu Chính phủ và do Nghị viện bãi nhiệm bất cứ lúc nào`,`Tổng thống do Quốc hội chỉ định và phải thông qua mọi quyết định bổ nhiệm nội các`,`Nghị viện có quyền giải tán Chính phủ bằng bỏ phiếu bất tín nhiệm thông thường`],correctAnswer:0,explanation:`Chính thể Cộng hòa Tổng thống áp dụng tam quyền phân lập rõ rệt: Tổng thống do nhân dân (hoặc đại cử tri) bầu, là người đứng đầu nhánh hành pháp, không chịu trách nhiệm trước Nghị viện.`,legalReference:`Lý luận về Hình thức chính thể Cộng hòa Tổng thống`,difficulty:`trung bình`},{id:204,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Tính quy phạm phổ biến của pháp luật thể hiện ở chỗ:`,options:[`Pháp luật là khuôn mẫu, quy tắc xử sự chung, áp dụng cho nhiều lần, đối với nhiều chủ thể trên phạm vi toàn xã hội`,`Pháp luật chỉ áp dụng cho một cá nhân cụ thể trong một lần duy nhất`,`Pháp luật chỉ dành riêng cho tầng lớp trí thức và quan chức`,`Quy phạm chỉ có giá trị bắt buộc khi được sự đồng ý của từng cá nhân`],correctAnswer:0,explanation:`Tính quy phạm phổ biến (tính chuẩn mực chung) thể hiện ở việc pháp luật là khuôn mẫu chung được áp dụng lặp đi lặp lại nhiều lần đối với mọi chủ thể khi rơi vào điều kiện, hoàn cảnh mà quy phạm dự liệu.`,legalReference:`Đặc trưng của Pháp luật`,difficulty:`dễ`},{id:205,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Bộ phận "Chế tài" của quy phạm pháp luật nhằm mục đích gì?`,options:[`Răn đe, giáo dục, trừng phạt và bảo đảm cho pháp luật được tôn trọng, thực hiện nghiêm minh`,`Khen thưởng các cá nhân đạt thành tích cao`,`Giải thích từ ngữ chuyên ngành trong điều luật`,`Tạo điều kiện để người vi phạm trốn tránh trách nhiệm`],correctAnswer:0,explanation:`Chế tài là bộ phận chỉ ra các biện pháp tác động mang tính cưỡng chế của Nhà nước nhằm trừng phạt, răn đe người vi phạm và phòng ngừa chung cho toàn xã hội.`,legalReference:`Cơ cấu Quy phạm pháp luật - Chế tài`,difficulty:`dễ`},{id:206,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Quy chuẩn: "Mọi người có quyền tự do kinh doanh trong những ngành nghề mà luật không cấm" (Điều 33 Hiến pháp 2013) là quy phạm mang tính chất:`,options:[`Quy phạm cho phép (trao quyền)`,`Quy phạm cấm đoán`,`Quy phạm bắt buộc thực hiện nghĩa vụ`,`Quy phạm hình sự trừng trị`],correctAnswer:0,explanation:`Quy phạm cho phép trao cho chủ thể quyền lựa chọn hành vi (được làm gì), ở đây trao quyền tự do kinh doanh trong các ngành nghề pháp luật không cấm.`,legalReference:`Điều 33 Hiến pháp 2013 & Phân loại Quy phạm pháp luật`,difficulty:`trung bình`},{id:207,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức thực hiện pháp luật nào là hình thức chủ thể kiềm chế KHÔNG LÀM những việc mà pháp luật cấm?`,options:[`Tuân thủ pháp luật (Tuân thủ tiêu cực)`,`Thi hành pháp luật`,`Sử dụng pháp luật`,`Áp dụng pháp luật`],correctAnswer:0,explanation:`Tuân thủ pháp luật là hình thức thực hiện pháp luật thụ động, trong đó các chủ thể pháp luật kiềm chế không thực hiện những hành vi mà pháp luật nghiêm cấm (ví dụ: không buôn bán ma túy, không vượt đèn đỏ...).`,legalReference:`Bốn hình thức thực hiện pháp luật`,difficulty:`dễ`},{id:208,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức thực hiện pháp luật nào là hình thức chủ thể thực hiện quyền của mình (làm những gì pháp luật cho phép)?`,options:[`Sử dụng pháp luật`,`Tuân thủ pháp luật`,`Thi hành pháp luật`,`Áp dụng pháp luật`],correctAnswer:0,explanation:`Sử dụng pháp luật là việc các chủ thể thực hiện các quyền chủ thể của mình được pháp luật cho phép (như quyền khiếu nại, quyền đăng ký kinh doanh, quyền kết hôn...).`,legalReference:`Các hình thức thực hiện pháp luật`,difficulty:`dễ`},{id:209,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Nội dung của quan hệ pháp luật bao gồm hai yếu tố nào?`,options:[`Quyền chủ thể và nghĩa vụ pháp lý của các bên tham gia`,`Động cơ và mục đích của các bên`,`Tài sản và đồ vật thuộc quyền sở hữu`,`Địa điểm và thời gian giao kết`],correctAnswer:0,explanation:`Nội dung của quan hệ pháp luật chính là Quyền chủ thể (những xử sự mà pháp luật cho phép chủ thể được hưởng) và Nghĩa vụ pháp lý (những xử sự bắt buộc mà chủ thể phải thực hiện).`,legalReference:`Cấu thành quan hệ pháp luật`,difficulty:`dễ`},{id:210,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Lỗi trong mặt chủ quan của vi phạm pháp luật được chia thành mấy loại?`,options:[`4 loại: Cố ý trực tiếp, Cố ý gián tiếp, Vô ý vì quá tự tin, Vô ý do cẩu thả`,`2 loại: Lỗi hình sự và Lỗi dân sự`,`3 loại: Lỗi nặng, Lỗi vừa và Lỗi nhẹ`,`1 loại duy nhất: Lỗi cố ý`],correctAnswer:0,explanation:`Theo khoa học pháp lý, lỗi được chia thành 4 loại cụ thể: Cố ý trực tiếp, Cố ý gián tiếp, Vô ý vì quá tự tin, và Vô ý do cẩu thả.`,legalReference:`Lý luận về Lỗi trong vi phạm pháp luật`,difficulty:`trung bình`},{id:211,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức lỗi "Cố ý gián tiếp" là trường hợp người vi phạm:`,options:[`Nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả có thể xảy ra, tuy không mong muốn nhưng có ý thức để mặc cho hậu quả xảy ra`,`Hoàn toàn không biết hành vi của mình có hại`,`Tin chắc rằng hậu quả sẽ không thể xảy ra do mình có tài năng đặc biệt`,`Bị người khác ép buộc cầm tay ký giấy nợ`],correctAnswer:0,explanation:`Lỗi cố ý gián tiếp: chủ thể nhận thức rõ hành vi nguy hiểm, thấy trước hậu quả, không mong muốn nhưng chấp nhận hoặc có ý thức để mặc cho hậu quả xảy ra.`,legalReference:`Khoản 2 Điều 10 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:212,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Vi phạm hành chính là hành vi có lỗi do cá nhân, tổ chức thực hiện, vi phạm quy định pháp luật về quản lý nhà nước mà:`,options:[`Không phải là tội phạm và theo quy định của pháp luật phải bị xử phạt vi phạm hành chính`,`Bắt buộc phải phạt tù từ 1 năm đến 3 năm`,`Chỉ gây thiệt hại về mặt tinh thần`,`Chỉ áp dụng riêng cho cán bộ công chức trong giờ làm việc`],correctAnswer:0,explanation:`Khoản 1 Điều 2 Luật Xử lý vi phạm hành chính 2012 quy định: Vi phạm hành chính là hành vi có lỗi do cá nhân, tổ chức thực hiện, vi phạm quy định về quản lý nhà nước mà không phải là tội phạm và phải bị xử phạt vi phạm hành chính.`,legalReference:`Điều 2 Luật Xử lý vi phạm hành chính 2012`,difficulty:`dễ`},{id:213,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Vi phạm kỷ luật là hành vi có lỗi của đối tượng nào sau đây?`,options:[`Cán bộ, công chức, viên chức, người lao động vi phạm các quy tắc, nội quy, quy chế làm việc của cơ quan, tổ chức, doanh nghiệp`,`Bất kỳ người dân nào đi lại trên đường công cộng`,`Người lái xe không có bằng lái xe`,`Doanh nghiệp kinh doanh hàng giả`],correctAnswer:0,explanation:`Vi phạm kỷ luật là hành vi có lỗi xâm hại trật tự nội bộ, kỷ luật lao động, quy chế làm việc trong cơ quan, trường học, doanh nghiệp do cán bộ, công chức, người lao động thực hiện.`,legalReference:`Phân loại vi phạm pháp luật`,difficulty:`dễ`},{id:214,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Văn bản quy phạm pháp luật có hiệu lực hồi tố (hiệu lực trở về trước) trong trường hợp nào sau đây?`,options:[`Chỉ trong trường hợp thật cần thiết và quy định trách nhiệm pháp lý mới nhẹ hơn hoặc xóa bỏ trách nhiệm pháp lý cho chủ thể`,`Quy định mức xử phạt nặng hơn đối với hành vi đã diễn ra trước đó`,`Mọi văn bản đều mặc nhiên có hiệu lực hồi tố 1 năm`,`Theo quyết định miệng của cơ quan điều tra`],correctAnswer:0,explanation:`Điều 152 Luật Ban hành VBQPPL 2015: Chỉ trong trường hợp thật cần thiết để bảo đảm lợi ích chung; không được quy định hiệu lực trở về trước đối với trường hợp quy định trách nhiệm pháp lý mới nặng hơn.`,legalReference:`Điều 152 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`trung bình`},{id:215,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Mối quan hệ giữa Pháp luật và Kinh tế được thể hiện như thế nào?`,options:[`Kinh tế quyết định pháp luật; pháp luật có tính độc lập tương đối và tác động trở lại mạnh mẽ đối với sự phát triển kinh tế`,`Pháp luật hoàn toàn độc lập và không chịu bất kỳ tác động nào từ cơ sở hạ tầng kinh tế`,`Pháp luật luôn luôn kìm hãm sự tăng trưởng kinh tế`,`Kinh tế phụ thuộc hoàn toàn vào ý chí chủ quan của người soạn thảo luật`],correctAnswer:0,explanation:`Theo triết học Mác - Lênin, cơ sở kinh tế quyết định kiến trúc thượng tầng pháp luật; ngược lại pháp luật phản ánh nhu cầu khách quan của nền kinh tế và thúc đẩy hoặc kìm hãm kinh tế phát triển.`,legalReference:`Mối quan hệ giữa Pháp luật và Kinh tế`,difficulty:`trung bình`},{id:216,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hệ thống pháp luật của một quốc gia bao gồm hai mặt thống nhất là gì?`,options:[`Hệ thống cấu trúc bên trong (ngành luật, chế định, QPPL) và Hệ thống văn bản quy phạm pháp luật bên ngoài`,`Luật trong nước và Luật nước ngoài`,`Luật dân sự và Luật hình sự`,`Quy phạm đạo đức và Quy phạm tôn giáo`],correctAnswer:0,explanation:`Hệ thống pháp luật gồm hai mặt: Cấu trúc bên trong (gồm các quy phạm pháp luật, chế định pháp luật, ngành luật) và Hình thức biểu hiện bên ngoài (hệ thống các văn bản quy phạm pháp luật).`,legalReference:`Khái niệm Hệ thống pháp luật`,difficulty:`trung bình`},{id:217,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Căn cứ để phân định một ngành luật độc lập trong hệ thống pháp luật Việt Nam là gì?`,options:[`Đối tượng điều chỉnh và phương pháp điều chỉnh của ngành luật đó`,`Số lượng điều luật của bộ luật`,`Cơ quan ký ban hành bộ luật`,`Thời gian tồn tại của ngành luật trong lịch sử`],correctAnswer:0,explanation:`Đối tượng điều chỉnh (nhóm quan hệ xã hội cùng loại) và Phương pháp điều chỉnh (cách thức tác động) là hai tiêu chuẩn cơ bản để phân định các ngành luật độc lập.`,legalReference:`Cơ cấu hệ thống pháp luật`,difficulty:`dễ`},{id:218,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Pháp luật xã hội chủ nghĩa thể hiện ý chí của ai?`,options:[`Giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản`,`Giai cấp tư sản nắm tư liệu sản xuất`,`Tầng lớp quý tộc và tăng lữ`,`Chỉ riêng các đại biểu Quốc hội`],correctAnswer:0,explanation:`Pháp luật XHCN thể hiện ý chí của giai cấp công nhân và nhân dân lao động, do Đảng Cộng sản lãnh đạo, nhằm xây dựng một xã hội dân giàu, nước mạnh, dân chủ, công bằng, văn minh.`,legalReference:`Bản chất giai cấp của Pháp luật XHCN`,difficulty:`dễ`},{id:219,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào có thẩm quyền ban hành Hiến pháp và sửa đổi Hiến pháp nước CHXHCN Việt Nam?`,options:[`Chỉ duy nhất Quốc hội mới có quyền làm Hiến pháp và sửa đổi Hiến pháp`,`Chính phủ`,`Chủ tịch nước phối hợp với TANDTC`,`Ban Tuyên giáo Trung ương`],correctAnswer:0,explanation:`Khoản 1 Điều 70 và Điều 120 Hiến pháp 2013 quy định: Quốc hội làm Hiến pháp và sửa đổi Hiến pháp; việc sửa đổi Hiến pháp phải được ít nhất 2/3 tổng số đại biểu Quốc hội biểu quyết tán thành.`,legalReference:`Điều 70 & Điều 120 Hiến pháp 2013`,difficulty:`dễ`},{id:220,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Để một dự án Luật được Quốc hội thông qua, tỷ lệ đại biểu Quốc hội biểu quyết tán thành tối thiểu thông thường là bao nhiêu?`,options:[`Quá nửa (trên 50%) tổng số đại biểu Quốc hội biểu quyết tán thành`,`100% đại biểu có mặt`,`Ít nhất 2/3 tổng số đại biểu Quốc hội`,`Chỉ cần 1/3 đại biểu tham gia phiên họp`],correctAnswer:0,explanation:`Khoản 1 Điều 85 Hiến pháp 2013: Luật, nghị quyết của Quốc hội phải được quá nửa tổng số đại biểu Quốc hội biểu quyết tán thành (trừ trường hợp sửa đổi Hiến pháp, rút ngắn/kéo dài nhiệm kỳ Quốc hội... cần ít nhất 2/3).`,legalReference:`Điều 85 Hiến pháp 2013`,difficulty:`trung bình`},{id:221,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ai là người đứng đầu và lãnh đạo công tác của Ủy ban Thường vụ Quốc hội?`,options:[`Chủ tịch Quốc hội`,`Chủ tịch nước`,`Tổng Bí thư`,`Thủ tướng Chính phủ`],correctAnswer:0,explanation:`Điều 73 Hiến pháp 2013: Ủy ban thường vụ Quốc hội gồm Chủ tịch Quốc hội, các Phó Chủ tịch Quốc hội và các Ủy viên. Chủ tịch Quốc hội lãnh đạo công tác của Ủy ban thường vụ Quốc hội.`,legalReference:`Điều 73 Hiến pháp 2013`,difficulty:`dễ`},{id:222,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào có thẩm quyền giải thích Hiến pháp, luật, pháp lệnh?`,options:[`Ủy ban Thường vụ Quốc hội`,`Tòa án nhân dân tối cao`,`Bộ Tư pháp`,`Viện Hàn lâm Khoa học Xã hội`],correctAnswer:0,explanation:`Khoản 2 Điều 74 Hiến pháp 2013 quy định Ủy ban thường vụ Quốc hội có nhiệm vụ và quyền hạn: "Giải thích Hiến pháp, luật, pháp lệnh".`,legalReference:`Khoản 2 Điều 74 Hiến pháp 2013`,difficulty:`trung bình`},{id:223,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Thủ tướng Chính phủ chịu trách nhiệm trước cơ quan nào về hoạt động của Chính phủ và hệ thống hành chính nhà nước?`,options:[`Trước Quốc hội (và trước UBTVQH, Chủ tịch nước trong thời gian Quốc hội không họp)`,`Trước Tòa án nhân dân tối cao`,`Trước Hội đồng nhân dân các tỉnh`,`Trước Ban Thư ký Liên hợp quốc`],correctAnswer:0,explanation:`Khoản 2 Điều 98 Hiến pháp 2013: Thủ tướng Chính phủ chịu trách nhiệm trước Quốc hội về hoạt động của Chính phủ và những nhiệm vụ được giao; báo cáo công tác của Chính phủ trước Quốc hội, Ủy ban thường vụ Quốc hội, Chủ tịch nước.`,legalReference:`Điều 98 Hiến pháp 2013`,difficulty:`trung bình`},{id:224,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Văn bản quy phạm pháp luật do Bộ trưởng, Thủ trưởng cơ quan ngang bộ ban hành là:`,options:[`Thông tư`,`Nghị định`,`Pháp lệnh`,`Luật`],correctAnswer:0,explanation:`Điều 4 Luật Ban hành văn bản quy phạm pháp luật 2015 quy định Bộ trưởng, Thủ trưởng cơ quan ngang bộ ban hành Thông tư.`,legalReference:`Điều 4 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`dễ`},{id:225,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Trong hệ thống cơ quan nhà nước, Viện kiểm sát nhân dân có quan hệ chỉ đạo, điều hành như thế nào?`,options:[`Tập trung, thống nhất lãnh đạo trong ngành: Viện kiểm sát cấp dưới chịu sự lãnh đạo của Viện kiểm sát cấp trên và Viện kiểm sát các cấp chịu sự lãnh đạo thống nhất của Viện trưởng VKSNDTC`,`Viện kiểm sát cấp huyện chịu sự chỉ đạo của UBND cấp huyện`,`Viện kiểm sát độc lập hoàn toàn với Viện kiểm sát cấp trên`,`Chỉ đạo ngang từ Tòa án cùng cấp`],correctAnswer:0,explanation:`Khoản 2 Điều 109 Hiến pháp 2013: Viện kiểm sát nhân dân do Viện trưởng lãnh đạo. Viện trưởng Viện kiểm sát cấp dưới chịu sự lãnh đạo của Viện trưởng Viện kiểm sát cấp trên. Viện trưởng các Viện kiểm sát chịu sự lãnh đạo thống nhất của Viện trưởng VKSNDTC.`,legalReference:`Điều 109 Hiến pháp 2013 & Luật Tổ chức VKSND`,difficulty:`trung bình`},{id:226,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ai bổ nhiệm, miễn nhiệm, cách chức Thẩm phán Tòa án nhân dân tối cao?`,options:[`Quốc hội phê chuẩn theo đề nghị của Chánh án TANDTC và Chủ tịch nước ra quyết định bổ nhiệm, miễn nhiệm, cách chức`,`Thủ tướng Chính phủ trực tiếp bổ nhiệm`,`Bộ trưởng Bộ Tư pháp quyết định`,`Hội đồng nhân dân cấp tỉnh phê duyệt`],correctAnswer:0,explanation:`Khoản 7 Điều 70 và Khoản 3 Điều 88 Hiến pháp 2013: Quốc hội phê chuẩn đề nghị bổ nhiệm, miễn nhiệm, cách chức Thẩm phán TAND tối cao; Chủ tịch nước ra quyết định bổ nhiệm, miễn nhiệm, cách chức.`,legalReference:`Điều 70, Điều 88 Hiến pháp 2013`,difficulty:`vận dụng`},{id:227,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chế định Hội thẩm nhân dân tham gia xét xử tại Tòa án thể hiện nguyên tắc hiến định nào?`,options:[`Nguyên tắc Nhân dân tham gia quản lý nhà nước và hoạt động xét xử của Tòa án`,`Nguyên tắc tiết kiệm ngân sách chi tiêu tư pháp`,`Nguyên tắc phân chia theo dòng tộc địa phương`,`Nguyên tắc bí mật quân sự`],correctAnswer:0,explanation:`Khoản 1 Điều 103 Hiến pháp 2013: "Việc xét xử sơ thẩm của Tòa án nhân dân có Hội thẩm tham gia, trừ trường hợp xét xử theo thủ tục rút gọn". Đây là biểu hiện sâu sắc của quyền làm chủ của Nhân dân trong hoạt động tư pháp.`,legalReference:`Điều 103 Hiến pháp 2013`,difficulty:`dễ`},{id:228,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Khi xét xử, Hội thẩm nhân dân có quyền biểu quyết ngang quyền với Thẩm phán đúng hay sai?`,options:[`Đúng, Hội thẩm nhân dân ngang quyền với Thẩm phán khi biểu quyết giải quyết vụ án`,`Sai, ý kiến của Thẩm phán luôn có giá trị gấp đôi`,`Sai, Hội thẩm nhân dân chỉ ngồi nghe và không được phát biểu`,`Chỉ ngang quyền trong các vụ án ly hôn`],correctAnswer:0,explanation:`Khoản 1 Điều 103 Hiến pháp 2013 và Luật Tổ chức Tòa án nhân dân khẳng định khi biểu quyết quyết định bản án, Hội thẩm ngang quyền với Thẩm phán (nguyên tắc thiểu số phục tùng đa số).`,legalReference:`Điều 103 Hiến pháp 2013 & Luật Tổ chức TAND`,difficulty:`trung bình`},{id:229,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hội đồng nhân dân quyết định các vấn đề quan trọng của địa phương bằng hình thức nào?`,options:[`Ban hành Nghị quyết và biểu quyết theo đa số`,`Chủ tịch HĐND ra chỉ thị riêng`,`Lấy ý kiến biểu quyết trên mạng xã hội`,`Giao toàn quyền cho Chủ tịch UBND quyết định`],correctAnswer:0,explanation:`Điều 113 Hiến pháp 2013 và Luật Tổ chức CQĐP: HĐND quyết định các biện pháp quan trọng ở địa phương bằng việc ban hành Nghị quyết tại kỳ họp.`,legalReference:`Điều 113 Hiến pháp 2013`,difficulty:`dễ`},{id:230,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Đơn vị hành chính của nước CHXHCN Việt Nam được phân chia như thế nào theo Điều 110 Hiến pháp 2013?`,options:[`Tỉnh, thành phố trực thuộc trung ương; Huyện, quận, thị xã, thành phố thuộc tỉnh; Xã, phường, thị trấn; Đơn vị hành chính - kinh tế đặc biệt`,`Chỉ có cấp Trung ương và cấp Tỉnh`,`Khu tự trị, Tiểu bang và Đặc khu quân sự`,`Vùng kinh tế trọng điểm và các thị xã`],correctAnswer:0,explanation:`Điều 110 Hiến pháp 2013 phân chia: Tỉnh, thành phố trực thuộc trung ương; cấp huyện/quận/thị xã/thành phố thuộc tỉnh/thành phố trực thuộc thành phố trung ương; cấp xã/phường/thị trấn; và Đơn vị hành chính - kinh tế đặc biệt do Quốc hội thành lập.`,legalReference:`Điều 110 Hiến pháp 2013`,difficulty:`dễ`},{id:231,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Thủ tướng Chính phủ có thẩm quyền phê chuẩn kết quả bầu, miễn nhiệm, bãi nhiệm đối với chức danh nào?`,options:[`Chủ tịch, Phó Chủ tịch Ủy ban nhân dân cấp tỉnh`,`Chủ tịch Hội đồng nhân dân cấp huyện`,`Viện trưởng Viện kiểm sát nhân dân cấp tỉnh`,`Chánh án Tòa án nhân dân cấp tỉnh`],correctAnswer:0,explanation:`Điểm đ Khoản 2 Điều 28 Luật Tổ chức Chính phủ 2015: Thủ tướng Chính phủ có quyền phê chuẩn việc bầu, miễn nhiệm và quyết định điều động, đình chỉ công tác, cách chức Chủ tịch, Phó Chủ tịch UBND cấp tỉnh.`,legalReference:`Luật Tổ chức Chính phủ 2015 & Điều 98 Hiến pháp 2013`,difficulty:`trung bình`},{id:232,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Quyền Trưng cầu ý dân (Điều 29 Hiến pháp 2013) do cơ quan nào quyết định việc tổ chức thực hiện?`,options:[`Quốc hội`,`Chính phủ`,`Bộ Công an`,`Ban Tôn giáo Chính phủ`],correctAnswer:0,explanation:`Khoản 15 Điều 70 Hiến pháp 2013 quy định Quốc hội có quyền: "Quyết định trưng cầu ý dân".`,legalReference:`Khoản 15 Điều 70 Hiến pháp 2013 & Luật Trưng cầu ý dân`,difficulty:`trung bình`},{id:233,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào là cơ quan thường trực của Hội đồng nhân dân cấp tỉnh, cấp huyện?`,options:[`Thường trực Hội đồng nhân dân`,`Ủy ban nhân dân cùng cấp`,`Ban Thanh tra nhân dân`,`Văn phòng Đoàn Đại biểu Quốc hội`],correctAnswer:0,explanation:`Theo Luật Tổ chức chính quyền địa phương, Thường trực HĐND là cơ quan thường trực của HĐND, thực hiện các nhiệm vụ, quyền hạn theo quy định giữa hai kỳ họp HĐND.`,legalReference:`Luật Tổ chức chính quyền địa phương 2015`,difficulty:`dễ`},{id:234,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Viện trưởng Viện kiểm sát nhân dân tối cao do cơ quan nào bầu, miễn nhiệm, bãi nhiệm?`,options:[`Quốc hội bầu, miễn nhiệm, bãi nhiệm theo đề nghị của Chủ tịch nước`,`Thủ tướng Chính phủ bổ nhiệm`,`Bộ trưởng Bộ Công an bổ nhiệm`,`Ủy ban Thường vụ Quốc hội tự quyết định`],correctAnswer:0,explanation:`Khoản 7 Điều 70 và Khoản 3 Điều 88 Hiến pháp 2013: Chủ tịch nước đề
