ốc xã hội là sự phân hóa giai cấp dẫn đến mâu thuẫn giai cấp không thể điều hòa được, đó là nguyên nhân trực tiếp dẫn tới sự ra đời của Nhà nước.`,legalReference:`Giáo trình Pháp luật đại cương - Học thuyết Mác-Lênin về Nhà nước và Pháp luật`,difficulty:`dễ`},{id:2,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Dấu hiệu đặc trưng nào sau đây chỉ có ở Nhà nước mà không có ở các tổ chức chính trị - xã hội khác?`,options:[`Có tôn chỉ, mục đích hoạt động riêng biệt`,`Nhà nước thiết lập quyền lực công cộng đặc biệt và quản lý cư dân theo lãnh thổ`,`Có cơ quan lãnh đạo đại diện cho các thành viên`,`Có nguồn kinh phí tự đóng góp từ hội viên`],correctAnswer:1,explanation:`Nhà nước có 5 đặc trưng cơ bản: thiết lập quyền lực công đặc biệt; phân chia và quản lý dân cư theo lãnh thổ; có chủ quyền quốc gia; ban hành pháp luật; quy định và thu các loại thuế bắt buộc.`,legalReference:`Lý luận chung về Nhà nước và Pháp luật - 5 đặc trưng của Nhà nước`,difficulty:`trung bình`},{id:3,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Bản chất của Nhà nước bao gồm hai thuộc tính cơ bản nào?`,options:[`Tính chính trị và tính tư tưởng`,`Tính giai cấp và tính xã hội`,`Tính cưỡng chế và tính giáo dục`,`Tính dân tộc và tính quốc tế`],correctAnswer:1,explanation:`Bất kỳ nhà nước nào cũng mang hai thuộc tính bản chất cơ bản gắn bó hữu cơ với nhau: Tính giai cấp (bảo vệ lợi ích giai cấp thống trị) và Tính xã hội (giải quyết các công việc chung của toàn xã hội).`,legalReference:`Lý luận chung về Nhà nước và Pháp luật - Bản chất Nhà nước`,difficulty:`dễ`},{id:4,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức nhà nước là cách thức tổ chức và thực hiện quyền lực nhà nước, được hợp thành từ 3 yếu tố:`,options:[`Chính thể, cấu trúc nhà nước và chế độ chính trị`,`Bộ máy nhà nước, hệ thống pháp luật và quân đội`,`Quốc hội, Chính phủ và Tòa án nhân dân`,`Chủ quyền quốc gia, lãnh thổ và công dân`],correctAnswer:0,explanation:`Hình thức nhà nước gồm 3 yếu tố: Hình thức chính thể (quân chủ hay cộng hòa), Hình thức cấu trúc nhà nước (đơn nhất hay liên bang) và Chế độ chính trị (dân chủ hay phản dân chủ).`,legalReference:`Lý luận chung về Nhà nước và Pháp luật - Hình thức Nhà nước`,difficulty:`trung bình`},{id:5,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam có hình thức cấu trúc nhà nước là gì?`,options:[`Nhà nước liên bang`,`Nhà nước đơn nhất`,`Nhà nước liên minh`,`Nhà nước hợp bang`],correctAnswer:1,explanation:`Việt Nam là Nhà nước đơn nhất: có một hệ thống pháp luật thống nhất, một Hiến pháp duy nhất, một hệ thống cơ quan quyền lực từ trung ương đến địa phương và toàn bộ lãnh thổ thống nhất không phân chia thành các tiểu bang.`,legalReference:`Điều 1 Hiến pháp 2013`,difficulty:`dễ`},{id:6,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức chính thể của Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam hiện nay là:`,options:[`Chính thể Cộng hòa dân chủ nhân dân (Cộng hòa xã hội chủ nghĩa)`,`Chính thể Quân chủ lập hiến`,`Chính thể Cộng hòa tổng thống`,`Chính thể Cộng hòa đại nghị`],correctAnswer:0,explanation:`Việt Nam có hình thức chính thể là Cộng hòa dân chủ (cụ thể là Cộng hòa xã hội chủ nghĩa), quyền lực nhà nước thuộc về Nhân dân mà nền tảng là liên minh công nhân - nông dân - trí thức.`,legalReference:`Điều 2 Hiến pháp 2013`,difficulty:`dễ`},{id:7,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Thuộc tính nào sau đây thể hiện ranh giới phân biệt rõ ràng nhất giữa Quy phạm pháp luật với các Quy phạm xã hội khác (đạo đức, tôn giáo, tập quán)?`,options:[`Tính quy phạm phổ biến`,`Tính xác định chặt chẽ về mặt hình thức`,`Tính quyền lực bắt buộc chung và được bảo đảm thực hiện bằng quyền lực Nhà nước`,`Cả ba thuộc tính trên đều là đặc trưng cơ bản của pháp luật`],correctAnswer:3,explanation:`Pháp luật có 3 thuộc tính cơ bản phân biệt với các quy phạm khác: Tính quy phạm phổ biến; Tính xác định chặt chẽ về hình thức; Tính được bảo đảm thực hiện bằng quyền lực nhà nước (cưỡng chế nhà nước). Do đó đáp án Cả ba thuộc tính là chuẩn xác nhất.`,legalReference:`Giáo trình Pháp luật đại cương - Đặc trưng của Pháp luật`,difficulty:`trung bình`},{id:8,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Một quy phạm pháp luật hoàn chỉnh thường được cấu thành từ 3 bộ phận:`,options:[`Chủ thể, Khách thể, Nội dung`,`Giả định, Quy định, Chế tài`,`Mặt khách quan, Mặt chủ quan, Động cơ`,`Mở đầu, Nội dung, Kết luận`],correctAnswer:1,explanation:`Cấu trúc logic của một quy phạm pháp luật thông thường gồm 3 bộ phận: Giả định (nêu điều kiện, hoàn cảnh áp dụng), Quy định (mô hình hành vi: được làm gì, phải làm gì, không được làm gì), và Chế tài (biện pháp xử lý hậu quả nếu vi phạm).`,legalReference:`Cơ cấu của Quy phạm pháp luật`,difficulty:`dễ`},{id:9,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trong quy phạm pháp luật: "Người nào xúc phạm nghiêm trọng nhân phẩm, danh dự của người khác thì bị phạt cảnh cáo, phạt tiền từ 10.000.000 đồng đến 30.000.000 đồng...", bộ phận "thì bị phạt cảnh cáo, phạt tiền..." là:`,options:[`Giả định`,`Quy định`,`Chế tài`,`Quy chế`],correctAnswer:2,explanation:`Bộ phận nêu lên các biện pháp tác động cưỡng chế nhà nước dự kiến áp dụng đối với người có hành vi vi phạm pháp luật chính là bộ phận Chế tài.`,legalReference:`Điều 155 Bộ luật Hình sự 2015 & Cơ cấu quy phạm pháp luật`,difficulty:`trung bình`},{id:10,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức pháp luật chủ yếu và cơ bản nhất được áp dụng tại Nhà nước Cộng hòa XHCN Việt Nam là gì?`,options:[`Tập quán pháp`,`Tiền lệ pháp (Án lệ)`,`Văn bản quy phạm pháp luật`,`Học thuyết pháp lý`],correctAnswer:2,explanation:`Hình thức pháp luật cơ bản, chủ yếu nhất ở Việt Nam là Văn bản quy phạm pháp luật. Tập quán và án lệ chỉ đóng vai trò nguồn bổ trợ theo luật định.`,legalReference:`Luật Ban hành văn bản quy phạm pháp luật 2015 (sửa đổi, bổ sung 2020)`,difficulty:`dễ`},{id:11,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Văn bản nào sau đây có hiệu lực pháp lý cao nhất trong hệ thống văn bản quy phạm pháp luật của nước ta?`,options:[`Luật của Quốc hội`,`Hiến pháp`,`Nghị quyết của Ủy ban Thường vụ Quốc hội`,`Nghị định của Chính phủ`],correctAnswer:1,explanation:`Hiến pháp là luật cơ bản của Nhà nước, có hiệu lực pháp lý cao nhất. Mọi văn bản quy phạm pháp luật khác phải phù hợp với Hiến pháp.`,legalReference:`Khoản 1 Điều 119 Hiến pháp 2013`,difficulty:`dễ`},{id:12,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Cơ quan nào sau đây có thẩm quyền ban hành "Nghị định"?`,options:[`Quốc hội`,`Ủy ban Thường vụ Quốc hội`,`Chính phủ`,`Thủ tướng Chính phủ`],correctAnswer:2,explanation:`Theo Luật Ban hành VBQPPL, Chính phủ ban hành Nghị định; Thủ tướng Chính phủ ban hành Quyết định; Bộ trưởng ban hành Thông tư.`,legalReference:`Điều 4 Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`dễ`},{id:13,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Thực hiện pháp luật dưới hình thức "Thi hành pháp luật" (Tuân thủ tích cực) là gì?`,options:[`Chủ thể kiềm chế không thực hiện điều pháp luật cấm`,`Chủ thể thực hiện nghĩa vụ pháp lý bằng hành động tích cực mà pháp luật yêu cầu`,`Chủ thể thực hiện quyền của mình được pháp luật cho phép`,`Cơ quan nhà nước có thẩm quyền ra quyết định áp dụng pháp luật`],correctAnswer:1,explanation:`Thi hành pháp luật là việc chủ thể thực hiện nghĩa vụ pháp lý bằng hành vi hành động tích cực theo yêu cầu của pháp luật (ví dụ: công dân đi nghĩa vụ quân sự, đóng thuế...). Tuân thủ pháp luật là không làm điều cấm; Sử dụng pháp luật là thực hiện quyền.`,legalReference:`Các hình thức thực hiện pháp luật`,difficulty:`trung bình`},{id:14,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Dấu hiệu nào sau đây KHÔNG PHẢI là dấu hiệu bắt buộc của Vi phạm pháp luật?`,options:[`Là hành vi xác định của con người (hành động hoặc không hành động)`,`Hành vi trái pháp luật và xâm hại các quan hệ xã hội được pháp luật bảo vệ`,`Có lỗi của chủ thể thực hiện hành vi`,`Hành vi bắt buộc phải gây ra hậu quả thiệt hại vật chất trên thực tế`],correctAnswer:3,explanation:`Vi phạm pháp luật cấu thành hình thức không đòi hỏi bắt buộc phải có thiệt hại vật chất trên thực tế (ví dụ: vượt đèn đỏ dù chưa va chạm, tàng trữ ma túy trái phép vẫn là vi phạm pháp luật). 4 dấu hiệu: Là hành vi; Trái pháp luật; Có lỗi; Do chủ thể có năng lực TNPL thực hiện.`,legalReference:`Lý luận về Vi phạm pháp luật`,difficulty:`vận dụng`},{id:15,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Cấu thành của vi phạm pháp luật bao gồm 4 yếu tố nào sau đây?`,options:[`Khách thể, Mặt khách quan, Chủ thể, Mặt chủ quan`,`Giả định, Quy định, Chế tài, Biện pháp`,`Năng lực pháp luật, Năng lực hành vi, Lỗi, Động cơ`,`Hành vi, Hậu quả, Nhân chứng, Tang vật`],correctAnswer:0,explanation:`Bốn yếu tố cấu thành của mọi vi phạm pháp luật gồm: Khách thể (quan hệ XH bị xâm hại), Mặt khách quan (hành vi, hậu quả, mối quan hệ nhân quả), Chủ thể (người có năng lực TNPL), và Mặt chủ quan (lỗi, động cơ, mục đích).`,legalReference:`Cấu thành vi phạm pháp luật`,difficulty:`dễ`},{id:16,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trách nhiệm pháp lý là gì?`,options:[`Là nghĩa vụ đạo đức mà người có lỗi phải tự nguyện ăn năn hối cải`,`Là hậu quả pháp lý bất lợi mà chủ thể vi phạm pháp luật phải gánh chịu trước Nhà nước theo quy định của pháp luật`,`Là việc cá nhân bị xã hội và người thân lên án, tẩy chay`,`Là việc bồi thường tiền cho người bị hại theo thỏa thuận cá nhân`],correctAnswer:1,explanation:`Trách nhiệm pháp lý là sự bắt buộc chủ thể vi phạm pháp luật phải gánh chịu những biện pháp cưỡng chế mang tính chất bất lợi từ phía Nhà nước do hành vi vi phạm pháp luật gây ra.`,legalReference:`Khái niệm Trách nhiệm pháp lý`,difficulty:`trung bình`},{id:17,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hệ thống các loại trách nhiệm pháp lý hiện nay ở Việt Nam bao gồm:`,options:[`Trách nhiệm hình sự, trách nhiệm dân sự, trách nhiệm hành chính và trách nhiệm kỷ luật`,`Trách nhiệm kinh tế, trách nhiệm chính trị, trách nhiệm tôn giáo và trách nhiệm đạo đức`,`Trách nhiệm công cộng, trách nhiệm cá nhân và trách nhiệm tập thể`,`Trách nhiệm quốc gia và trách nhiệm quốc tế`],correctAnswer:0,explanation:`4 loại trách nhiệm pháp lý cơ bản: Trách nhiệm hình sự (nghiêm khắc nhất do Tòa án áp dụng), Trách nhiệm hành chính, Trách nhiệm dân sự, và Trách nhiệm kỷ luật.`,legalReference:`Phân loại trách nhiệm pháp lý`,difficulty:`dễ`},{id:18,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trường hợp nào sau đây chủ thể KHÔNG phải chịu trách nhiệm pháp lý do loại trừ tính chất trái pháp luật?`,options:[`Thực hiện hành vi trong tình trạng say rượu hoặc chất kích thích khác`,`Phòng vệ chính đáng hoặc tình thế cấp thiết theo quy định của luật`,`Không hiểu biết quy định của pháp luật`,`Người vi phạm là người cao tuổi`],correctAnswer:1,explanation:`Phòng vệ chính đáng, tình thế cấp thiết, sự kiện bất ngờ là các trường hợp loại trừ tính chất nguy hiểm cho xã hội/trái pháp luật nên không phải chịu trách nhiệm pháp lý. Say rượu vẫn phải chịu trách nhiệm.`,legalReference:`Điều 22, 23 Bộ luật Hình sự 2015 & Bộ luật Dân sự 2015`,difficulty:`vận dụng`},{id:19,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Theo Hiến pháp 2013, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa XHCN Việt Nam là cơ quan nào?`,options:[`Chính phủ`,`Quốc hội`,`Chủ tịch nước`,`Tòa án nhân dân tối cao`],correctAnswer:1,explanation:`Điều 69 Hiến pháp 2013: "Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam".`,legalReference:`Điều 69 Hiến pháp 2013`,difficulty:`dễ`},{id:20,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Quốc hội nước CHXHCN Việt Nam có 3 chức năng hiến định cơ bản là gì?`,options:[`Quản lý hành chính, xét xử tội phạm và bảo vệ an ninh trật tự`,`Lập hiến - lập pháp; quyết định các vấn đề quan trọng của đất nước; giám sát tối cao đối với hoạt động của Nhà nước`,`Thực hiện quyền hành pháp, chỉ đạo hệ thống Ủy ban nhân dân và kiểm toán`,`Thực hành quyền công tố, kiểm sát tư pháp và ban hành án lệ`],correctAnswer:1,explanation:`Điều 69 Hiến pháp 2013 xác định rõ: Quốc hội thực hiện quyền lập hiến, quyền lập pháp, quyết định các vấn đề quan trọng của đất nước và giám sát tối cao đối với hoạt động của Nhà nước.`,legalReference:`Điều 69 Hiến pháp 2013`,difficulty:`trung bình`},{id:21,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan thường trực hoạt động thường xuyên giữa hai kỳ họp của Quốc hội là cơ quan nào?`,options:[`Ủy ban Thường vụ Quốc hội`,`Chính phủ`,`Hội đồng Dân tộc`,`Văn phòng Chủ tịch nước`],correctAnswer:0,explanation:`Điều 73 Hiến pháp 2013: "Ủy ban thường vụ Quốc hội là cơ quan thường trực của Quốc hội".`,legalReference:`Điều 73 Hiến pháp 2013`,difficulty:`dễ`},{id:22,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Vị trí pháp lý của Chủ tịch nước theo Hiến pháp năm 2013 là:`,options:[`Người đứng đầu Quốc hội và chủ tọa các kỳ họp Quốc hội`,`Người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại`,`Người đứng đầu hệ thống cơ quan hành chính nhà nước`,`Người trực tiếp điều hành phiên tòa xét xử cao nhất`],correctAnswer:1,explanation:`Điều 86 Hiến pháp 2013 quy định: "Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại".`,legalReference:`Điều 86 Hiến pháp 2013`,difficulty:`dễ`},{id:23,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ai là người có thẩm quyền thống lĩnh các Lực lượng vũ trang nhân dân và giữ chức Chủ tịch Hội đồng quốc phòng và an ninh?`,options:[`Thủ tướng Chính phủ`,`Bộ trưởng Bộ Quốc phòng`,`Chủ tịch nước`,`Chủ tịch Quốc hội`],correctAnswer:2,explanation:`Khoản 2 Điều 88 Hiến pháp 2013 quy định Chủ tịch nước: "Thống lĩnh lực lượng vũ trang nhân dân, giữ chức Chủ tịch Hội đồng quốc phòng và an ninh".`,legalReference:`Điều 88 Hiến pháp 2013`,difficulty:`trung bình`},{id:24,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chính phủ nước CHXHCN Việt Nam có vị trí pháp lý là:`,options:[`Cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội`,`Cơ quan đại diện cho quyền lực tư pháp cao nhất`,`Cơ quan kiểm sát tối cao hoạt động tư pháp trên toàn quốc`,`Tổ chức chính trị - xã hội lãnh đạo toàn dân`],correctAnswer:0,explanation:`Điều 94 Hiến pháp 2013: "Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội".`,legalReference:`Điều 94 Hiến pháp 2013`,difficulty:`dễ`},{id:25,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Thủ tướng Chính phủ do cơ quan nào bầu, miễn nhiệm, bãi nhiệm theo đề nghị của Chủ tịch nước?`,options:[`Quốc hội (trong số các đại biểu Quốc hội)`,`Ủy ban Thường vụ Quốc hội`,`Hội đồng nhân dân cấp tỉnh`,`Toàn thể cử tri cả nước bỏ phiếu trực tiếp`],correctAnswer:0,explanation:`Khoản 7 Điều 70 Hiến pháp 2013 quy định Quốc hội bầu, miễn nhiệm, bãi nhiệm Thủ tướng Chính phủ theo đề nghị của Chủ tịch nước. Thủ tướng Chính phủ phải là đại biểu Quốc hội.`,legalReference:`Điều 70 & Điều 98 Hiến pháp 2013`,difficulty:`trung bình`},{id:26,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp là:`,options:[`Viện kiểm sát nhân dân`,`Tòa án nhân dân`,`Bộ Tư pháp`,`Cơ quan Cảnh sát điều tra`],correctAnswer:1,explanation:`Điều 102 Hiến pháp 2013 quy định: "Tòa án nhân dân là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp".`,legalReference:`Điều 102 Hiến pháp 2013`,difficulty:`dễ`},{id:27,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Trong quá trình xét xử vụ án, Thẩm phán và Hội thẩm nhân dân tuân theo nguyên tắc hiến định nào?`,options:[`Tuân theo chỉ đạo của Viện trưởng Viện kiểm sát cùng cấp`,`Độc lập và chỉ tuân theo pháp luật`,`Tuân theo quyết định của Ủy ban nhân dân địa phương`,`Tập trung dân chủ tuyệt đối dưới sự phân công của Chánh án`],correctAnswer:1,explanation:`Khoản 2 Điều 103 Hiến pháp 2013 quy định: "Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử của Thẩm phán, Hội thẩm".`,legalReference:`Điều 103 Hiến pháp 2013`,difficulty:`dễ`},{id:28,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Chức năng cơ bản của Viện kiểm sát nhân dân theo Hiến pháp 2013 là gì?`,options:[`Xét xử các vụ án hình sự, dân sự, hành chính`,`Thực hành quyền công tố và kiểm sát hoạt động tư pháp`,`Ban hành luật và nghị quyết quy phạm pháp luật`,`Thi hành bản án dân sự và hình sự`],correctAnswer:1,explanation:`Khoản 1 Điều 107 Hiến pháp 2013 quy định: "Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp".`,legalReference:`Điều 107 Hiến pháp 2013`,difficulty:`dễ`},{id:29,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng của Nhân dân địa phương là:`,options:[`Ủy ban nhân dân`,`Hội đồng nhân dân`,`Ủy ban Mặt trận Tổ quốc Việt Nam cấp tỉnh/huyện/xã`,`Tòa án nhân dân cấp tỉnh/huyện`],correctAnswer:1,explanation:`Điều 113 Hiến pháp 2013: "Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân địa phương, do Nhân dân địa phương bầu ra".`,legalReference:`Điều 113 Hiến pháp 2013`,difficulty:`dễ`},{id:30,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương là:`,options:[`Ủy ban nhân dân`,`Tòa án nhân dân`,`Hội đồng nhân dân thường trực`,`Công an cấp địa phương`],correctAnswer:0,explanation:`Điều 114 Hiến pháp 2013: "Ủy ban nhân dân ở cấp chính quyền địa phương do Hội đồng nhân dân cùng cấp bầu là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương".`,legalReference:`Điều 114 Hiến pháp 2013`,difficulty:`dễ`},{id:31,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Nguyên tắc tổ chức quyền lực nhà nước Việt Nam được quy định tại Khoản 3 Điều 2 Hiến pháp 2013 là:`,options:[`Tam quyền phân lập tuyệt đối giữa Lập pháp, Hành pháp và Tư pháp`,`Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp`,`Chỉ có quyền lập pháp là tối cao, các nhánh khác không có sự kiểm soát`,`Tập quyền tập trung tuyệt đối vào người đứng đầu Chính phủ`],correctAnswer:1,explanation:`Khoản 3 Điều 2 Hiến pháp 2013 khẳng định: "Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp".`,legalReference:`Khoản 3 Điều 2 Hiến pháp 2013`,difficulty:`trung bình`},{id:32,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Cơ quan nào sau đây do Quốc hội thành lập có chức năng kiểm toán việc quản lý, sử dụng tài chính, tài sản công?`,options:[`Thanh tra Chính phủ`,`Kiểm toán nhà nước`,`Ủy ban Quản lý vốn nhà nước tại doanh nghiệp`,`Bộ Tài chính`],correctAnswer:1,explanation:`Điều 118 Hiến pháp 2013 quy định Kiểm toán nhà nước là cơ quan do Quốc hội thành lập, hoạt động độc lập và chỉ tuân theo pháp luật, thực hiện kiểm toán việc quản lý, sử dụng tài chính, tài sản công.`,legalReference:`Điều 118 Hiến pháp 2013 & Luật Kiểm toán nhà nước`,difficulty:`trung bình`},{id:33,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Hội đồng bầu cử quốc gia do cơ quan nào thành lập để tổ chức bầu cử đại biểu Quốc hội và chỉ đạo bầu cử đại biểu HĐND các cấp?`,options:[`Chính phủ`,`Chủ tịch nước`,`Quốc hội`,`Mặt trận Tổ quốc Việt Nam`],correctAnswer:2,explanation:`Điều 117 Hiến pháp 2013 quy định Hội đồng bầu cử quốc gia là cơ quan do Quốc hội thành lập để tổ chức bầu cử đại biểu Quốc hội; chỉ đạo và hướng dẫn công tác bầu cử đại biểu Hội đồng nhân dân các cấp.`,legalReference:`Điều 117 Hiến pháp 2013`,difficulty:`trung bình`},{id:34,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Nhiệm kỳ của mỗi khóa Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam là bao nhiêu năm?`,options:[`3 năm`,`4 năm`,`5 năm`,`6 năm`],correctAnswer:2,explanation:`Điều 71 Hiến pháp 2013: "Nhiệm kỳ của mỗi khóa Quốc hội là 5 năm. Sáu mươi ngày trước khi hết nhiệm kỳ của Quốc hội, Quốc hội khóa mới phải được bầu xong".`,legalReference:`Điều 71 Hiến pháp 2013`,difficulty:`dễ`},{id:35,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Ủy ban nhân dân chịu sự giám sát của cơ quan nào và chịu trách nhiệm báo cáo công tác trước cơ quan nào?`,options:[`Chỉ chịu sự chỉ đạo của cơ quan công an cấp trên`,`Chịu sự giám sát của HĐND cùng cấp và báo cáo công tác trước HĐND cùng cấp, cơ quan hành chính nhà nước cấp trên`,`Độc lập hoàn toàn không phải báo cáo trước HĐND`,`Chỉ báo cáo trước Tòa án nhân dân cùng cấp`],correctAnswer:1,explanation:`UBND chịu trách nhiệm trước HĐND cùng cấp và cơ quan hành chính nhà nước cấp trên; chịu sự giám sát của HĐND cùng cấp.`,legalReference:`Điều 114 Hiến pháp 2013 & Luật Tổ chức chính quyền địa phương`,difficulty:`trung bình`},{id:36,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Nguyên tắc cơ bản hàng đầu trong tổ chức và hoạt động của Bộ máy Nhà nước Cộng hòa XHCN Việt Nam là:`,options:[`Nguyên tắc Đảng Cộng sản Việt Nam lãnh đạo Nhà nước và xã hội`,`Nguyên tắc tự do kinh doanh tuyệt đối`,`Nguyên tắc ưu tiên thủ trưởng cơ quan hành chính`,`Nguyên tắc tự trị địa phương`],correctAnswer:0,explanation:`Điều 4 Hiến pháp 2013 khẳng định Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội. Đây là nguyên tắc chính trị - pháp lý hàng đầu chi phối toàn bộ tổ chức và hoạt động của Bộ máy Nhà nước.`,legalReference:`Điều 4 Hiến pháp 2013`,difficulty:`dễ`},{id:37,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Theo Bộ luật Dân sự 2015, người từ đủ bao nhiêu tuổi trở lên được coi là người thành niên có năng lực hành vi dân sự đầy đủ (trừ trường hợp mất, hạn chế hoặc khó khăn trong nhận thức)?`,options:[`Đủ 16 tuổi`,`Đủ 18 tuổi`,`Đủ 20 tuổi`,`Đủ 21 tuổi`],correctAnswer:1,explanation:`Điều 20 Bộ luật Dân sự 2015 quy định: Người thành niên là người từ đủ mười tám tuổi trở lên. Người thành niên có năng lực hành vi dân sự đầy đủ, trừ trường hợp luật có quy định khác.`,legalReference:`Điều 20 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:38,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Giao dịch dân sự của người chưa đủ 6 tuổi do ai xác lập, thực hiện?`,options:[`Do chính người đó tự thực hiện`,`Do người đại diện theo pháp luật của người đó xác lập, thực hiện`,`Do bạn bè cùng trang lứa chứng kiến thực hiện`,`Tự do thực hiện nếu có giá trị dưới 500.000 đồng`],correctAnswer:1,explanation:`Khoản 2 Điều 21 Bộ luật Dân sự 2015: "Giao dịch dân sự của người chưa đủ sáu tuổi do người đại diện theo pháp luật của người đó xác lập, thực hiện".`,legalReference:`Khoản 2 Điều 21 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:39,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Theo Bộ luật Dân sự 2015, Tài sản bao gồm những đối tượng nào sau đây?`,options:[`Bất động sản và động sản`,`Vật, tiền, giấy tờ có giá và quyền tài sản`,`Tài sản hiện có và tài sản hình thành trong tương lai`,`Cả A, B, C đều đúng`],correctAnswer:3,explanation:`Điều 105 BLDS 2015 quy định: 1. Tài sản là vật, tiền, giấy tờ có giá và quyền tài sản; 2. Tài sản bao gồm bất động sản và động sản. Bất động sản và động sản có thể là tài sản hiện có và tài sản hình thành trong tương lai.`,legalReference:`Điều 105 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:40,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Quyền sở hữu bao gồm những quyền năng cụ thể nào của chủ sở hữu?`,options:[`Quyền quản lý, quyền khai thác và quyền chuyển nhượng`,`Quyền chiếm hữu, quyền sử dụng và quyền định đoạt`,`Quyền trông nom, quyền cầm cố và quyền thế chấp`,`Quyền tự định giá và quyền thu hồi tài sản`],correctAnswer:1,explanation:`Điều 158 Bộ luật Dân sự 2015 quy định: "Quyền sở hữu bao gồm quyền chiếm hữu, quyền sử dụng và quyền định đoạt tài sản của chủ sở hữu theo quy định của luật".`,legalReference:`Điều 158 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:41,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Hợp đồng dân sự là sự thỏa thuận giữa các bên về việc:`,options:[`Xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự`,`Quy định mức xử phạt hành chính đối với bên vi phạm`,`Phân chia trách nhiệm hình sự trong giao dịch tài sản`,`Chuyển giao quyền lực hành chính nhà nước`],correctAnswer:0,explanation:`Điều 385 Bộ luật Dân sự 2015: "Hợp đồng là sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự".`,legalReference:`Điều 385 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:42,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Biện pháp nào sau đây KHÔNG PHẢI là biện pháp bảo đảm thực hiện nghĩa vụ theo Bộ luật Dân sự 2015?`,options:[`Cầm cố tài sản, Thế chấp tài sản`,`Đặt cọc, Ký cược, Ký quỹ`,`Tạm giam, Tạm giữ`,`Bảo lãnh, Tín chấp`],correctAnswer:2,explanation:`Điều 292 BLDS 2015 liệt kê 9 biện pháp bảo đảm: Cầm cố, Thế chấp, Đặt cọc, Ký cược, Ký quỹ, Bảo lưu quyền sở hữu, Bảo lãnh, Tín chấp, Cầm giữ tài sản. Tạm giam, tạm giữ là biện pháp ngăn chặn trong tố tụng hình sự.`,legalReference:`Điều 292 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:43,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời điểm mở thừa kế theo quy định của pháp luật dân sự là thời điểm nào?`,options:[`Thời điểm phân chia xong tài sản di sản thừa kế`,`Thời điểm người có tài sản chết (hoặc Tòa án tuyên bố người đó đã chết có hiệu lực pháp luật)`,`Thời điểm công chứng di chúc tại văn phòng công chứng`,`Thời điểm chôn cất hoặc hỏa táng người để lại di sản`],correctAnswer:1,explanation:`Khoản 1 Điều 611 Bộ luật Dân sự 2015 quy định: "Thời điểm mở thừa kế là thời điểm người có tài sản chết. Trường hợp Tòa án tuyên bố một người là đã chết thì thời điểm mở thừa kế là ngày được xác định tại khoản 2 Điều 71 của Bộ luật này".`,legalReference:`Khoản 1 Điều 611 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:44,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Những người nào sau đây thuộc Hàng thừa kế thứ nhất theo pháp luật?`,options:[`Vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết`,`Ông nội, bà nội, ông ngoại, bà ngoại, anh ruột, chị ruột, em ruột của người chết`,`Bác ruột, chú ruột, cô ruột, cậu ruột, dì ruột của người chết`,`Cháu ruột gọi người chết là cụ nội, cụ ngoại`],correctAnswer:0,explanation:`Điểm a Khoản 1 Điều 651 BLDS 2015: Hàng thừa kế thứ nhất gồm: vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết.`,legalReference:`Điều 651 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:45,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Ông A chết lập di chúc hợp pháp để lại toàn bộ tài sản cho một quỹ từ thiện, không cho ai trong gia đình. Ai sau đây vẫn được hưởng di sản thừa kế không phụ thuộc vào nội dung di chúc?`,options:[`Con đã thành niên và có khả năng lao động bình thường của ông A`,`Anh ruột, chị ruột của ông A`,`Vợ của ông A; cha mẹ ông A; con chưa thành niên hoặc con thành niên không có khả năng lao động`,`Cháu nội ruột của ông A`],correctAnswer:2,explanation:`Điều 644 BLDS 2015 quy định những người sau đây vẫn được hưởng phần di sản bằng 2/3 suất của một người thừa kế theo pháp luật: Con chưa thành niên, cha, mẹ, vợ, chồng; Con thành niên mà không có khả năng lao động.`,legalReference:`Điều 644 Bộ luật Dân sự 2015`,difficulty:`vận dụng`},{id:46,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hiệu để người thừa kế yêu cầu chia di sản thừa kế đối với Bất động sản là bao nhiêu năm kể từ thời điểm mở thừa kế?`,options:[`5 năm`,`10 năm`,`20 năm`,`30 năm`],correctAnswer:3,explanation:`Khoản 1 Điều 623 BLDS 2015: "Thời hiệu để người thừa kế yêu cầu chia di sản là 30 năm đối với bất động sản, 10 năm đối với động sản, kể từ thời điểm mở thừa kế".`,legalReference:`Điều 623 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:47,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Ai trong các trường hợp sau đây bị truất quyền thừa kế hoặc không được quyền hưởng di sản (trừ khi người để lại di sản đã biết nhưng vẫn cho hưởng theo di chúc)?`,options:[`Người đã kết hôn với người nước ngoài`,`Người bị kết án về hành vi cố ý xâm phạm tính mạng, sức khỏe hoặc ngược đãi nghiêm trọng người để lại di sản`,`Người đi công tác xa vào thời điểm người để lại di sản qua đời`,`Người có tài sản riêng nhiều hơn di sản để lại`],correctAnswer:1,explanation:`Khoản 1 Điều 621 BLDS 2015 quy định những người không được quyền hưởng di sản: người bị kết án về hành vi cố ý xâm phạm tính mạng, sức khỏe... hoặc ngược đãi nghiêm trọng người để lại di sản, vi phạm nghiêm trọng nghĩa vụ nuôi dưỡng...`,legalReference:`Điều 621 Bộ luật Dân sự 2015`,difficulty:`trung bình`},{id:48,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Nguyên tắc cơ bản của Tố tụng Dân sự Việt Nam trong việc giải quyết vụ án là:`,options:[`Quyền quyết định và tự định đoạt của đương sự`,`Tòa án hoàn toàn tự quyết định mà không cần đơn khởi kiện`,`Bắt buộc đương sự phải nhận tội như tố tụng hình sự`,`Áp dụng án lệ của nước ngoài khi xét xử`],correctAnswer:0,explanation:`Điều 5 Bộ luật Tố tụng Dân sự 2015: Đương sự có quyền quyết định và tự định đoạt việc khởi kiện, yêu cầu Tòa án thụ lý, thay đổi, bổ sung, rút yêu cầu hoặc tự nguyện hòa giải với nhau.`,legalReference:`Điều 5 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:49,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trong vụ án dân sự, người khởi kiện yêu cầu Tòa án bảo vệ quyền và lợi ích hợp pháp của mình được gọi là:`,options:[`Bị đơn`,`Nguyên đơn`,`Người có quyền lợi, nghĩa vụ liên quan`,`Bị can`],correctAnswer:1,explanation:`Khoản 2 Điều 68 BLTTDS 2015: "Nguyên đơn trong vụ án dân sự là người khởi kiện, người được cơ quan, tổ chức, cá nhân khác do Bộ luật này quy định khởi kiện để yêu cầu Tòa án giải quyết vụ án dân sự...".`,legalReference:`Điều 68 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:50,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thủ tục hòa giải trong tố tụng dân sự có đặc điểm nào sau đây?`,options:[`Tòa án có trách nhiệm tiến hành hòa giải và tạo điều kiện thuận lợi để các đương sự thỏa thuận với nhau về việc giải quyết vụ việc (trừ các vụ án không được hòa giải)`,`Hòa giải là thủ tục bắt buộc trong mọi vụ án hình sự`,`Hòa giải chỉ có giá trị khi được Ủy ban nhân dân cấp xã xác nhận`,`Tòa án không có quyền tổ chức hòa giải`],correctAnswer:0,explanation:`Điều 10 BLTTDS 2015 quy định Tòa án có trách nhiệm tiến hành hòa giải và tạo điều kiện thuận lợi để các đương sự thỏa thuận với nhau về việc giải quyết vụ việc dân sự.`,legalReference:`Điều 10 & Chương XIII Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:51,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Bản án sơ thẩm của Tòa án nhân dân cấp huyện nếu có kháng cáo, kháng nghị hợp lệ trong thời hạn luật định thì sẽ được xét xử lại theo thủ tục nào?`,options:[`Thủ tục Giám đốc thẩm`,`Thủ tục Phúc thẩm`,`Thủ tục Tái thẩm`,`Thủ tục Thi hành án khẩn cấp`],correctAnswer:1,explanation:`Điều 17 BLTTDS 2015 bảo đảm chế độ xét xử sơ thẩm, phúc thẩm. Bản án sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị sẽ được Tòa án cấp trên trực tiếp xét xử lại theo thủ tục phúc thẩm.`,legalReference:`Điều 17 & Điều 270 Bộ luật Tố tụng Dân sự 2015`,difficulty:`dễ`},{id:52,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Trách nhiệm bồi thường thiệt hại ngoài hợp đồng phát sinh khi có đủ các điều kiện nào?`,options:[`Có hành vi trái pháp luật, có thiệt hại thực tế xảy ra, có mối quan hệ nhân quả và có lỗi của người gây thiệt hại (trừ trường hợp luật quy định khác)`,`Chỉ cần các bên có ký hợp đồng dịch vụ trước đó`,`Có quyết định phê duyệt của Cơ quan Thuế`,`Có biên bản hòa giải thành tại Công an phường`],correctAnswer:0,explanation:`Căn cứ phát sinh trách nhiệm bồi thường thiệt hại ngoài hợp đồng (Điều 584 BLDS 2015): Có thiệt hại xảy ra; Có hành vi trái pháp luật; Có mối quan hệ nhân quả giữa hành vi trái pháp luật và thiệt hại; Có lỗi (trừ trường hợp bồi thường do nguồn nguy hiểm cao độ... luật quy định không cần lỗi).`,legalReference:`Điều 584 Bộ luật Dân sự 2015`,difficulty:`vận dụng`},{id:53,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Bồi thường thiệt hại do Nguồn nguy hiểm cao độ gây ra (như xe cơ giới, đường dây tải điện...) tuân theo nguyên tắc nào?`,options:[`Chủ sở hữu, người chiếm hữu nguồn nguy hiểm cao độ phải bồi thường thiệt hại cả khi không có lỗi, trừ trường hợp bất khả kháng hoặc thiệt hại hoàn toàn do lỗi cố ý của người bị thiệt hại`,`Chỉ bồi thường khi người lái xe cố ý gây tai nạn`,`Chỉ bồi thường khi nạn nhân yêu cầu trước ngày xảy ra tai nạn`,`Nhà nước bồi thường toàn bộ thay cho chủ xe cơ giới`],correctAnswer:0,explanation:`Điều 601 BLDS 2015: Chủ sở hữu, người chiếm hữu, sử dụng nguồn nguy hiểm cao độ phải bồi thường thiệt hại ngay cả khi không có lỗi, trừ trường hợp thiệt hại xảy ra hoàn toàn do lỗi cố ý của người bị thiệt hại hoặc trong tình thế bất khả kháng, tình thế cấp thiết.`,legalReference:`Điều 601 Bộ luật Dân sự 2015`,difficulty:`vận dụng`},{id:54,chapterId:4,chapterName:`Chương 4: Luật Dân sự và Luật Tố tụng Dân sự`,question:`Thời hạn kháng cáo đối với bản án sơ thẩm của Tòa án nhân dân là bao nhiêu ngày kể từ ngày tuyên án?`,options:[`7 ngày`,`15 ngày`,`30 ngày`,`60 ngày`],correctAnswer:1,explanation:`Khoản 1 Điều 273 BLTTDS 2015 quy định: Thời hạn kháng cáo đối với bản án của Tòa án cấp sơ thẩm là 15 ngày, kể từ ngày tuyên án; đối với đương sự không có mặt tại phiên tòa thì tính từ ngày bản án được giao hoặc niêm yết.`,legalReference:`Khoản 1 Điều 273 Bộ luật Tố tụng Dân sự 2015`,difficulty:`trung bình`},{id:55,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Theo Luật Doanh nghiệp 2020, Doanh nghiệp tư nhân là loại hình doanh nghiệp do:`,options:[`Một cá nhân làm chủ và tự chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp`,`Một tổ chức làm chủ và chịu trách nhiệm hữu hạn trong phạm vi vốn điều lệ`,`Ít nhất hai cá nhân cùng góp vốn thành lập`,`Một nhóm hộ gia đình cùng đứng tên đăng ký kinh doanh`],correctAnswer:0,explanation:`Khoản 1 Điều 188 Luật Doanh nghiệp 2020: "Doanh nghiệp tư nhân là doanh nghiệp do một cá nhân làm chủ và tự chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp".`,legalReference:`Điều 188 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:56,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Đặc điểm nào sau đây là ĐÚNG đối với Doanh nghiệp tư nhân?`,options:[`Có tư cách pháp nhân kể từ ngày được cấp Giấy chứng nhận ĐKDN`,`Chủ doanh nghiệp tư nhân chịu trách nhiệm vô hạn về mọi nghĩa vụ tài sản của doanh nghiệp`,`Được quyền phát hành cổ phiếu ra công chúng`,`Chủ doanh nghiệp tư nhân được quyền đồng thời làm chủ nhiều doanh nghiệp tư nhân khác`],correctAnswer:1,explanation:`DNTN không có tư cách pháp nhân (vì tài sản của chủ và DN không tách bạch); chủ DNTN chịu trách nhiệm vô hạn; không được phát hành bất kỳ loại chứng khoán nào; mỗi cá nhân chỉ được thành lập 1 DNTN.`,legalReference:`Điều 188 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:57,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Số lượng thành viên tối đa trong Công ty trách nhiệm hữu hạn hai thành viên trở lên là bao nhiêu?`,options:[`Không hạn chế số lượng`,`Tối đa 20 thành viên`,`Tối đa 50 thành viên`,`Tối đa 100 thành viên`],correctAnswer:2,explanation:`Điểm b Khoản 1 Điều 46 Luật Doanh nghiệp 2020 quy định số lượng thành viên của Công ty TNHH 2 thành viên trở lên không vượt quá 50 thành viên.`,legalReference:`Khoản 1 Điều 46 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:58,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Loại hình doanh nghiệp nào sau đây BẮT BUỘC phải có tối thiểu 3 cổ đông sáng lập và KHÔNG GIỚI HẠN số lượng cổ đông tối đa?`,options:[`Công ty Cổ phần`,`Công ty TNHH một thành viên`,`Công ty Hợp danh`,`Doanh nghiệp tư nhân`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 111 Luật Doanh nghiệp 2020 quy định: Cổ đông của công ty cổ phần có thể là tổ chức, cá nhân; số lượng cổ đông tối thiểu là 03 và không hạn chế số lượng tối đa.`,legalReference:`Điều 111 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:59,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Công ty Cổ phần có quyền phát hành loại chứng khoán nào để huy động vốn?`,options:[`Chỉ được phát hành trái phiếu`,`Chỉ được phát hành tín phiếu kho bạc`,`Có quyền phát hành cổ phần, trái phiếu và các loại chứng khoán khác`,`Không được phát hành bất kỳ loại chứng khoán nào`],correctAnswer:2,explanation:`Khoản 3 Điều 111 Luật Doanh nghiệp 2020: "Công ty cổ phần có quyền phát hành cổ phần, trái phiếu và các loại chứng khoán khác của công ty".`,legalReference:`Khoản 3 Điều 111 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:60,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Trong Công ty Hợp danh, thành viên hợp danh phải là đối tượng nào và chịu trách nhiệm như thế nào?`,options:[`Phải là cá nhân và chịu trách nhiệm vô hạn bằng toàn bộ tài sản của mình về các nghĩa vụ của công ty`,`Có thể là tổ chức và chỉ chịu trách nhiệm hữu hạn trong phạm vi vốn góp`,`Phải là công chức nhà nước được biệt phái`,`Chỉ chịu trách nhiệm theo tỷ lệ 10% vốn góp`],correctAnswer:0,explanation:`Điểm b Khoản 1 Điều 177 Luật Doanh nghiệp 2020: Thành viên hợp danh phải là cá nhân, chịu trách nhiệm bằng toàn bộ tài sản của mình về các nghĩa vụ của công ty (trách nhiệm vô hạn và liên đới).`,legalReference:`Điều 177 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:61,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Loại hình doanh nghiệp nào sau đây KHÔNG CÓ tư cách pháp nhân theo pháp luật Việt Nam?`,options:[`Công ty TNHH một thành viên`,`Công ty Cổ phần`,`Doanh nghiệp tư nhân`,`Công ty Hợp danh`],correctAnswer:2,explanation:`DNTN không có tư cách pháp nhân do không có sự tách bạch giữa tài sản của doanh nghiệp và tài sản của chủ sở hữu tư nhân.`,legalReference:`Điều 74 BLDS 2015 & Điều 188 Luật Doanh nghiệp 2020`,difficulty:`dễ`},{id:62,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Theo Luật Phá sản 2014, doanh nghiệp bị coi là "mất khả năng thanh toán" khi nào?`,options:[`Không thực hiện nghĩa vụ thanh toán khoản nợ trong thời hạn 03 tháng kể từ ngày đến hạn thanh toán`,`Bị thua lỗ liên tiếp trong 02 năm tài chính`,`Tổng nợ phải trả vượt quá 50% tổng tài sản`,`Bị cơ quan thuế phong tỏa tài khoản ngân hàng`],correctAnswer:0,explanation:`Khoản 1 Điều 4 Luật Phá sản 2014 quy định: "Doanh nghiệp, hợp tác xã mất khả năng thanh toán là doanh nghiệp, hợp tác xã không thực hiện nghĩa vụ thanh toán khoản nợ trong thời hạn 03 tháng kể từ ngày đến hạn thanh toán".`,legalReference:`Khoản 1 Điều 4 Luật Phá sản 2014`,difficulty:`trung bình`},{id:63,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Cơ quan nào có thẩm quyền thụ lý đơn và ra quyết định mở thủ tục phá sản, tuyên bố phá sản doanh nghiệp?`,options:[`Ủy ban nhân dân cấp tỉnh`,`Tòa án nhân dân`,`Sở Kế hoạch và Đầu tư`,`Ngân hàng Nhà nước Việt Nam`],correctAnswer:1,explanation:`Điều 8 Luật Phá sản 2014 quy định thẩm quyền giải quyết phá sản thuộc về Tòa án nhân dân cấp tỉnh hoặc Tòa án nhân dân cấp huyện theo phân cấp.`,legalReference:`Điều 8 Luật Phá sản 2014`,difficulty:`dễ`},{id:64,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Phương thức giải quyết tranh chấp thương mại bằng "Trọng tài thương mại" có đặc điểm nổi bật nào?`,options:[`Phán quyết trọng tài là chung thẩm, có giá trị bắt buộc thi hành đối với các bên và không thể bị kháng cáo như án tòa`,`Phiên họp trọng tài luôn luôn bắt buộc phải mở công khai trước báo chí`,`Trọng tài viên bắt buộc phải là Thẩm phán của Tòa án nhân dân tối cao`,`Trọng tài thương mại có thẩm quyền áp dụng hình phạt tù đối với người vi phạm`],correctAnswer:0,explanation:`Điều 61 Luật Trọng tài thương mại 2010: Phán quyết trọng tài là chung thẩm và có hiệu lực thi hành kể từ ngày ban hành, các bên không có quyền kháng cáo lên cấp trên.`,legalReference:`Điều 61 Luật Trọng tài thương mại 2010`,difficulty:`trung bình`},{id:65,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Điều kiện tiên quyết để tranh chấp thương mại được giải quyết bằng Trọng tài là gì?`,options:[`Phải có thỏa thuận trọng tài trước hoặc sau khi xảy ra tranh chấp`,`Phải có sự chỉ định của Bộ Tư pháp`,`Vụ việc phải có trị giá tranh chấp trên 100 tỷ đồng`,`Một trong hai bên phải là doanh nghiệp nhà nước`],correctAnswer:0,explanation:`Điều 5 Luật Trọng tài thương mại 2010 quy định: Tranh chấp được giải quyết bằng Trọng tài nếu các bên có thỏa thuận trọng tài. Thỏa thuận trọng tài có thể được lập trước hoặc sau khi xảy ra tranh chấp.`,legalReference:`Điều 5 Luật Trọng tài thương mại 2010`,difficulty:`dễ`},{id:66,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Mức phạt vi phạm hợp đồng trong hoạt động thương mại do các bên thỏa thuận nhưng tối đa không quá bao nhiêu theo Luật Thương mại 2005?`,options:[`Tối đa 5% giá trị phần nghĩa vụ hợp đồng bị vi phạm`,`Tối đa 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm`,`Tối đa 12% tổng giá trị hợp đồng`,`Không giới hạn mức tối đa`],correctAnswer:1,explanation:`Điều 301 Luật Thương mại 2005 quy định: Mức phạt đối với vi phạm nghĩa vụ hợp đồng hoặc tổng mức phạt đối với nhiều vi phạm do các bên thoả thuận trong hợp đồng, nhưng không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm (trừ trường hợp dịch vụ giám định).`,legalReference:`Điều 301 Luật Thương mại 2005`,difficulty:`trung bình`},{id:67,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Hộ kinh doanh do đối tượng nào sau đây thành lập và chịu trách nhiệm bằng toàn bộ tài sản của mình?`,options:[`Một cá nhân hoặc các thành viên hộ gia đình`,`Nhiều tổ chức phi chính phủ cùng góp vốn`,`Doanh nghiệp có vốn đầu tư nước ngoài`,`Các cổ đông của công ty đại chúng`],correctAnswer:0,explanation:`Khoản 1 Điều 79 Nghị định 01/2021/NĐ-CP: Hộ kinh doanh do một cá nhân hoặc các thành viên hộ gia đình đăng ký thành lập và chịu trách nhiệm bằng toàn bộ tài sản của mình đối với hoạt động kinh doanh.`,legalReference:`Điều 79 Nghị định 01/2021/NĐ-CP về đăng ký doanh nghiệp`,difficulty:`dễ`},{id:68,chapterId:5,chapterName:`Chương 5: Pháp luật Kinh doanh - Thương mại`,question:`Thời hạn các thành viên/cổ đông phải thanh toán đủ phần vốn góp/số cổ phần đã đăng ký mua khi thành lập doanh nghiệp là bao nhiêu ngày kể từ ngày được cấp GCN ĐKDN?`,options:[`30 ngày`,`60 ngày`,`90 ngày`,`180 ngày`],correctAnswer:2,explanation:`Cả đối với Công ty TNHH (Điều 47, 75) và Công ty Cổ phần (Điều 113 Luật Doanh nghiệp 2020), thời hạn góp đủ vốn điều lệ là 90 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp.`,legalReference:`Điều 47, 75 & 113 Luật Doanh nghiệp 2020`,difficulty:`trung bình`},{id:69,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Theo Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017), người từ đủ bao nhiêu tuổi trở lên phải chịu trách nhiệm hình sự về MỌI tội phạm?`,options:[`Từ đủ 14 tuổi`,`Từ đủ 15 tuổi`,`Từ đủ 16 tuổi`,`Từ đủ 18 tuổi`],correctAnswer:2,explanation:`Khoản 1 Điều 12 Bộ luật Hình sự 2015 quy định: "Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác".`,legalReference:`Khoản 1 Điều 12 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:70,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm hình sự về loại tội phạm nào?`,options:[`Mọi tội phạm từ ít nghiêm trọng đến nghiêm trọng`,`Tội phạm rất nghiêm trọng hoặc đặc biệt nghiêm trọng được quy định tại một số điều luật cụ thể của BLHS`,`Chỉ chịu trách nhiệm hành chính, không bao giờ phải chịu trách nhiệm hình sự`,`Chỉ chịu trách nhiệm về các tội xâm phạm trật tự an toàn giao thông`],correctAnswer:1,explanation:`Khoản 2 Điều 12 Bộ luật Hình sự 2015 (sửa đổi 2017) quy định người từ đủ 14 tuổi đến dưới 16 tuổi chỉ phải chịu TNHS về tội phạm rất nghiêm trọng hoặc tội phạm đặc biệt nghiêm trọng quy định tại một số điều luật liệt kê cụ thể (như giết người, hiếp dâm, cướp tài sản...).`,legalReference:`Khoản 2 Điều 12 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:71,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội phạm ít nghiêm trọng là tội phạm có tính chất và mức độ nguy hiểm cho xã hội không lớn mà mức cao nhất của khung hình phạt do BLHS quy định là:`,options:[`Phạt tiền hoặc phạt cải tạo không giam giữ hoặc phạt tù đến 03 năm`,`Phạt tù từ trên 03 năm đến 07 năm`,`Phạt tù từ trên 07 năm đến 15 năm`,`Phạt tù từ trên 15 năm đến 20 năm`],correctAnswer:0,explanation:`Điểm a Khoản 1 Điều 9 Bộ luật Hình sự 2015: "Tội phạm ít nghiêm trọng là tội phạm có tính chất và mức độ nguy hiểm cho xã hội không lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là phạt tiền, phạt cải tạo không giam giữ hoặc phạt tù đến 03 năm".`,legalReference:`Điều 9 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:72,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tội phạm có mức cao nhất của khung hình phạt là tù trên 15 năm, tù chung thân hoặc tử hình được xếp vào loại tội phạm nào?`,options:[`Tội phạm ít nghiêm trọng`,`Tội phạm nghiêm trọng`,`Tội phạm rất nghiêm trọng`,`Tội phạm đặc biệt nghiêm trọng`],correctAnswer:3,explanation:`Điểm d Khoản 1 Điều 9 BLHS 2015: Tội phạm đặc biệt nghiêm trọng là tội phạm có tính chất và mức độ nguy hiểm cho xã hội đặc biệt lớn mà mức cao nhất của khung hình phạt là từ trên 15 năm tù đến 20 năm tù, tù chung thân hoặc tử hình.`,legalReference:`Điều 9 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:73,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi cố ý tước đoạt tính mạng của người khác một cách trái pháp luật cấu thành tội phạm nào?`,options:[`Tội Giết người (Điều 123 BLHS)`,`Tội Cố ý gây thương tích (Điều 134 BLHS)`,`Tội Bức tử (Điều 130 BLHS)`,`Tội Vô ý làm chết người (Điều 128 BLHS)`],correctAnswer:0,explanation:`Cố ý tước đoạt tính mạng người khác trái luật là hành vi cấu thành Tội giết người theo Điều 123 BLHS 2015.`,legalReference:`Điều 123 Bộ luật Hình sự 2015`,difficulty:`dễ`},{id:74,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hình phạt nào sau đây là Hình phạt chính trong hệ thống hình phạt đối với cá nhân phạm tội?`,options:[`Tước một số quyền công dân`,`Quản chế, Cấm cư trú`,`Cải tạo không giam giữ`,`Tịch thu tài sản`],correctAnswer:2,explanation:`Điều 32 BLHS 2015: Hình phạt chính gồm: Cảnh cáo; Phạt tiền; Cải tạo không giam giữ; Trục xuất; Tù có thời hạn; Tù chung thân; Tử hình. Các hình phạt: Tước quyền công dân, quản chế, tịch thu tài sản là hình phạt bổ sung.`,legalReference:`Điều 32 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:75,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Theo Điều 40 Bộ luật Hình sự 2015, KHÔNG áp dụng hình phạt Tử hình đối với đối tượng nào sau đây?`,options:[`Người dưới 18 tuổi khi phạm tội, phụ nữ có thai hoặc phụ nữ đang nuôi con dưới 36 tháng tuổi, người đủ 75 tuổi trở lên khi phạm tội hoặc khi xét xử`,`Người đã từng có tiền án, tiền sự`,`Người phạm tội là thương binh, bệnh binh`,`Người không biết chữ, đồng bào dân tộc thiểu số`],correctAnswer:0,explanation:`Khoản 2 Điều 40 BLHS 2015: Không áp dụng hình phạt tử hình đối với người dưới 18 tuổi khi phạm tội, phụ nữ có thai, phụ nữ đang nuôi con dưới 36 tháng tuổi hoặc người đủ 75 tuổi trở lên khi phạm tội hoặc khi xét xử.`,legalReference:`Điều 40 Bộ luật Hình sự 2015`,difficulty:`trung bình`},{id:76,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Pháp nhân thương mại chỉ phải chịu trách nhiệm hình sự khi có đủ các điều kiện nào sau đây?`,options:[`Hành vi phạm tội được thực hiện nhân danh pháp nhân thương mại; vì lợi ích của pháp nhân thương mại; có sự chỉ đạo, điều hành của pháp nhân thương mại và chưa hết thời hiệu truy cứu TNHS`,`Pháp nhân thương mại có vốn điều lệ trên 100 tỷ đồng`,`Pháp nhân thương mại có 100% vốn nước ngoài`,`Pháp nhân thương mại hoạt động trong lĩnh vực tài chính ngân hàng`],correctAnswer:0,explanation:`Điều 75 BLHS 2015 quy định 4 điều kiện chịu TNHS của pháp nhân thương mại: nhân danh pháp nhân; vì lợi ích pháp nhân; có sự chỉ đạo điều hành của pháp nhân; chưa hết thời hiệu truy cứu TNHS.`,legalReference:`Điều 75 Bộ luật Hình sự 2015`,difficulty:`vận dụng`},{id:77,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Theo Luật Phòng, chống tham nhũng 2018, Tham nhũng là hành vi của đối tượng nào sau đây?`,options:[`Người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó vì vụ lợi`,`Bất kỳ công dân nào có hành vi trộm cắp tài sản nhà nước`,`Người lao động trốn tránh đóng bảo hiểm xã hội`,`Thương nhân trốn thuế trong kinh doanh`],correctAnswer:0,explanation:`Khoản 1 Điều 3 Luật PCTN 2018 quy định: Tham nhũng là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó vì vụ lợi.`,legalReference:`Khoản 1 Điều 3 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:78,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Hành vi nào sau đây là hành vi tham nhũng trong khu vực nhà nước theo Luật PCTN 2018?`,options:[`Tham ô tài sản; Nhận hối lộ; Lạm dụng chức vụ, quyền hạn chiếm đoạt tài sản`,`Chậm thanh toán nợ ngân hàng do kinh doanh thua lỗ`,`Tranh chấp quyền thừa kế đất đai giữa các thành viên gia đình`,`Tự ý nghỉ việc không báo trước của người lao động`],correctAnswer:0,explanation:`Điều 2 Luật PCTN 2018 liệt kê các hành vi tham nhũng gồm: tham ô tài sản, nhận hối lộ, lạm dụng chức vụ quyền hạn chiếm đoạt tài sản, lợi dụng chức vụ quyền hạn trong khi thi hành công vụ...`,legalReference:`Điều 2 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:79,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Người có hành vi tham nhũng tùy theo tính chất, mức độ vi phạm sẽ bị xử lý như thế nào?`,options:[`Xử lý kỷ luật, xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự theo quy định của pháp luật`,`Chỉ bị phê bình nội bộ rút kinh nghiệm`,`Chỉ bị phạt tiền dân sự`,`Tự động được miễn mọi hình phạt nếu nộp lại một phần tài sản`],correctAnswer:0,explanation:`Điều 92 Luật PCTN 2018 quy định người có hành vi tham nhũng bị xử lý kỷ luật, xử phạt hành chính hoặc bị truy cứu trách nhiệm hình sự; nếu gây thiệt hại thì phải bồi thường.`,legalReference:`Điều 92 Luật Phòng, chống tham nhũng 2018`,difficulty:`trung bình`},{id:80,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Biện pháp nào sau đây là biện pháp phòng ngừa tham nhũng trọng tâm trong cơ quan, tổ chức, đơn vị?`,options:[`Công khai, minh bạch về tổ chức và hoạt động; kiểm soát tài sản, thu nhập của người có chức vụ, quyền hạn`,`Giữ kín mọi thông tin chi tiêu ngân sách nội bộ`,`Không cho phép công chức kê khai tài sản`,`Giải thể các ban thanh tra nhân dân`],correctAnswer:0,explanation:`Chương II Luật PCTN 2018 quy định các biện pháp phòng ngừa tham nhũng cốt lõi: công khai minh bạch hoạt động, xây dựng định mức tiêu chuẩn, quy tắc ứng xử, chuyển đổi vị trí công tác và kiểm soát tài sản, thu nhập.`,legalReference:`Chương II Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:81,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Lỗi trong mặt chủ quan của tội phạm tham ô tài sản và tội nhận hối lộ luôn luôn là hình thức lỗi nào?`,options:[`Lỗi cố ý trực tiếp`,`Lỗi vô ý vì cẩu thả`,`Lỗi vô ý vì quá tự tin`,`Không có yếu tố lỗi`],correctAnswer:0,explanation:`Các tội phạm tham nhũng như tham ô, nhận hối lộ được thực hiện với động cơ vụ lợi và luôn có hình thức lỗi cố ý trực tiếp (người phạm tội nhận thức rõ hành vi trái luật, thấy trước hậu quả và mong muốn hậu quả xảy ra).`,legalReference:`Lý luận cấu thành tội phạm & Điều 353, 354 BLHS 2015`,difficulty:`vận dụng`},{id:82,chapterId:6,chapterName:`Chương 6: Luật Hình sự và Phòng, chống tham nhũng`,question:`Tài sản tham nhũng được xử lý như thế nào theo quy định của pháp luật?`,options:[`Phải được thu hồi, tịch thu sung vào ngân sách nhà nước hoặc trả lại cho chủ sở hữu hợp pháp`,`Chia đều cho cán bộ cùng phòng ban`,`Để người tham nhũng tiếp tục sử dụng để khắc phục kinh tế`,`Được tiêu hủy hoàn toàn`],correctAnswer:0,explanation:`Điều 93 Luật PCTN 2018: Cơ quan, tổ chức có thẩm quyền phải áp dụng các biện pháp cần thiết để thu hồi, tịch thu tài sản tham nhũng nộp ngân sách nhà nước hoặc trả lại cho chủ sở hữu, người quản lý hợp pháp.`,legalReference:`Điều 93 Luật Phòng, chống tham nhũng 2018`,difficulty:`dễ`},{id:83,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Độ tuổi kết hôn hợp pháp theo Luật Hôn nhân và Gia đình năm 2014 là:`,options:[`Nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên`,`Nam bước sang tuổi 20, nữ bước sang tuổi 18`,`Nam từ đủ 18 tuổi trở lên, nữ từ đủ 16 tuổi trở lên`,`Nam và nữ đều từ đủ 18 tuổi trở lên`],correctAnswer:0,explanation:`Điểm a Khoản 1 Điều 8 Luật Hôn nhân và Gia đình 2014 quy định điều kiện kết hôn: Nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên.`,legalReference:`Điều 8 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:84,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Việc kết hôn giữa những người nào sau đây bị pháp luật Hôn nhân và Gia đình nghiêm cấm?`,options:[`Giữa những người cùng dòng máu về trực hệ; giữa những người có họ trong phạm vi ba đời`,`Giữa những người khác tôn giáo`,`Giữa những người có quốc tịch khác nhau`,`Giữa những người chênh lệch tuổi tác trên 15 tuổi`],correctAnswer:0,explanation:`Điểm d Khoản 2 Điều 5 Luật Hôn nhân và Gia đình 2014 nghiêm cấm kết hôn giữa những người cùng dòng máu về trực hệ; giữa những người có họ trong phạm vi ba đời.`,legalReference:`Điều 5 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:85,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Cơ quan có thẩm quyền đăng ký kết hôn cho công dân Việt Nam cư trú trong nước là cơ quan nào?`,options:[`Ủy ban nhân dân cấp xã nơi cư trú của một trong hai bên nam, nữ`,`Tòa án nhân dân cấp huyện nơi cư trú`,`Hội đồng nhân dân cấp xã`,`Công an xã, phường nơi tạm trú`],correctAnswer:0,explanation:`Khoản 1 Điều 17 Luật Hộ tịch 2014 quy định UBND cấp xã nơi cư trú của một trong hai bên nam, nữ thực hiện đăng ký kết hôn.`,legalReference:`Điều 17 Luật Hộ tịch 2014 & Điều 9 Luật HNGĐ 2014`,difficulty:`dễ`},{id:86,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Tài sản nào sau đây thuộc Tài sản chung của vợ chồng theo Luật Hôn nhân và Gia đình 2014?`,options:[`Tài sản do vợ, chồng tạo ra, thu nhập do lao động, hoạt động sản xuất, kinh doanh, hoa lợi, lợi tức phát sinh từ tài sản riêng trong thời kỳ hôn nhân`,`Tài sản mà mỗi người được thừa kế riêng, tặng cho riêng trong thời kỳ hôn nhân`,`Tài sản có trước khi kết hôn mà không nhập vào khối tài sản chung`,`Đồ dùng sinh hoạt cá nhân thiết yếu của riêng vợ hoặc chồng`],correctAnswer:0,explanation:`Khoản 1 Điều 33 Luật Hôn nhân và Gia đình 2014 quy định tài sản chung của vợ chồng gồm tài sản do vợ, chồng tạo ra, thu nhập do lao động, sản xuất kinh doanh, hoa lợi lợi tức phát sinh từ tài sản riêng trong thời kỳ hôn nhân...`,legalReference:`Điều 33 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:87,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Trường hợp nào sau đây người chồng KHÔNG CÓ QUYỀN yêu cầu Tòa án giải quyết ly hôn?`,options:[`Khi vợ đang có thai, sinh con hoặc đang nuôi con dưới 12 tháng tuổi`,`Khi vợ đang đi học tập, công tác ở nước ngoài`,`Khi kinh tế gia đình đang gặp khó khăn`,`Khi cha mẹ hai bên không đồng ý cho ly hôn`],correctAnswer:0,explanation:`Khoản 3 Điều 51 Luật Hôn nhân và Gia đình 2014 quy định: "Chồng không có quyền yêu cầu ly hôn trong trường hợp vợ đang có thai, sinh con hoặc đang nuôi con dưới 12 tháng tuổi".`,legalReference:`Khoản 3 Điều 51 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:88,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Khi ly hôn, con dưới bao nhiêu tháng tuổi được giao trực tiếp cho mẹ chăm sóc, nuôi dưỡng (trừ trường hợp mẹ không đủ điều kiện hoặc cha mẹ có thỏa thuận khác)?`,options:[`Dưới 12 tháng tuổi`,`Dưới 24 tháng tuổi`,`Dưới 36 tháng tuổi`,`Dưới 6 tuổi`],correctAnswer:2,explanation:`Khoản 3 Điều 81 Luật Hôn nhân và Gia đình 2014 quy định: "Con dưới 36 tháng tuổi được giao cho mẹ trực tiếp nuôi, trừ trường hợp người mẹ không đủ điều kiện để trực tiếp trông nom, chăm sóc, nuôi dưỡng, giáo dục con hoặc cha mẹ có thỏa thuận khác phù hợp với lợi ích của con".`,legalReference:`Điều 81 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:89,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Khi ly hôn, nếu con từ đủ bao nhiêu tuổi trở lên thì Tòa án phải xem xét nguyện vọng của con khi quyết định người trực tiếp nuôi con?`,options:[`Từ đủ 5 tuổi trở lên`,`Từ đủ 7 tuổi trở lên`,`Từ đủ 9 tuổi trở lên`,`Từ đủ 12 tuổi trở lên`],correctAnswer:1,explanation:`Khoản 2 Điều 81 Luật Hôn nhân và Gia đình 2014 quy định: Nếu con từ đủ 07 tuổi trở lên thì phải xem xét nguyện vọng của con.`,legalReference:`Khoản 2 Điều 81 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:90,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Thuận tình ly hôn là trường hợp:`,options:[`Cả hai vợ chồng cùng tự nguyện ly hôn và đã thỏa thuận được về việc chia tài sản, việc trông nom, nuôi dưỡng, giáo dục con`,`Chỉ một bên vợ hoặc chồng nộp đơn yêu cầu ly hôn`,`Tòa án ra quyết định tuyên bố một bên mất tích`,`Ủy ban nhân dân giải quyết ly hôn mà không cần qua Tòa án`],correctAnswer:0,explanation:`Điều 55 Luật Hôn nhân và Gia đình 2014 quy định thuận tình ly hôn khi hai bên thật sự tự nguyện ly hôn và đã thỏa thuận về việc chia tài sản, việc trông nom, nuôi dưỡng, chăm sóc con trên cơ sở bảo đảm quyền lợi chính đáng của vợ và con.`,legalReference:`Điều 55 Luật Hôn nhân và Gia đình 2014`,difficulty:`dễ`},{id:91,chapterId:7,chapterName:`Chương 7: Pháp luật Hôn nhân và Gia đình`,question:`Quan hệ hôn nhân chấm dứt kể từ thời điểm nào?`,options:[`Kể từ ngày bản án, quyết định ly hôn của Tòa án có hiệu lực pháp luật (hoặc kể từ thời điểm một bên vợ/chồng chết)`,`Kể từ ngày hai vợ chồng bắt đầu sống ly thân`,`Kể từ ngày Tòa án nhận đơn khởi kiện ly hôn`,`Kể từ ngày hai bên thỏa thuận phân chia xong tài sản`],correctAnswer:0,explanation:`Điều 57 và Điều 65 Luật Hôn nhân và Gia đình 2014: Quan hệ hôn nhân chấm dứt kể từ ngày bản án, quyết định ly hôn của Tòa án có hiệu lực pháp luật; hoặc chấm dứt kể từ thời điểm vợ hoặc chồng chết.`,legalReference:`Điều 57 & Điều 65 Luật Hôn nhân và Gia đình 2014`,difficulty:`trung bình`},{id:92,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Theo Bộ luật Lao động 2019, Hợp đồng lao động bao gồm mấy loại hình cơ bản?`,options:[`3 loại: Hợp đồng không xác định thời hạn, xác định thời hạn và hợp đồng mùa vụ`,`2 loại: Hợp đồng lao động không xác định thời hạn và Hợp đồng lao động xác định thời hạn (không quá 36 tháng)`,`1 loại duy nhất: Hợp đồng lao động có thời hạn 1 năm`,`4 loại tùy theo ngành nghề kinh doanh`],correctAnswer:1,explanation:`Khoản 1 Điều 20 Bộ luật Lao động 2019 quy định 2 loại hợp đồng: a) HĐLĐ không xác định thời hạn; b) HĐLĐ xác định thời hạn (hai bên xác định thời hạn trong khoảng không quá 36 tháng). BLLĐ 2019 đã bãi bỏ loại hợp đồng mùa vụ.`,legalReference:`Điều 20 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:93,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời gian thử việc tối đa đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên là bao nhiêu ngày?`,options:[`30 ngày`,`60 ngày`,`90 ngày`,`180 ngày`],correctAnswer:1,explanation:`Điểm b Khoản 1 Điều 25 Bộ luật Lao động 2019 quy định thời gian thử việc không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên.`,legalReference:`Điều 25 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:94,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng bao nhiêu % mức lương của công việc đó?`,options:[`70%`,`75%`,`80%`,`85%`],correctAnswer:3,explanation:`Điều 26 Bộ luật Lao động 2019 quy định: Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó.`,legalReference:`Điều 26 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:95,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Thời giờ làm việc bình thường của người lao động theo Bộ luật Lao động 2019 là:`,options:[`Không quá 8 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần`,`Không quá 10 giờ trong 01 ngày và không quá 50 giờ trong 01 tuần`,`Cố định đúng 40 giờ trong 01 tuần cho mọi doanh nghiệp`,`Không hạn chế số giờ làm việc nếu người lao động đồng ý`],correctAnswer:0,explanation:`Khoản 1 Điều 105 Bộ luật Lao động 2019 quy định thời giờ làm việc bình thường không quá 08 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần. Nhà nước khuyến khích áp dụng tuần làm việc 40 giờ.`,legalReference:`Điều 105 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:96,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động làm thêm giờ vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được trả lương tính theo đơn giá tiền lương hoặc tiền lương thực trả ít nhất bằng bao nhiêu %?`,options:[`150%`,`200%`,`300% (chưa kể tiền lương của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương)`,`400%`],correctAnswer:2,explanation:`Điểm c Khoản 1 Điều 98 Bộ luật Lao động 2019 quy định: Người lao động làm thêm giờ vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được trả ít nhất bằng 300% chưa kể tiền lương của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày.`,legalReference:`Điều 98 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:97,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Các hình thức xử lý kỷ luật lao động được áp dụng theo Điều 124 Bộ luật Lao động 2019 bao gồm:`,options:[`Khiển trách; Kéo dài thời hạn nâng lương không quá 06 tháng; Cách chức; Sa thải`,`Phạt tiền; Cắt giảm lương; Trừ ngày phép năm`,`Tạm giữ tiền thưởng; Buộc lao động công ích`,`Cảnh cáo trước chính quyền địa phương; Tịch thu tài sản`],correctAnswer:0,explanation:`Điều 124 BLLĐ 2019 quy định 4 hình thức kỷ luật lao động: 1. Khiển trách; 2. Kéo dài thời hạn nâng lương không quá 06 tháng; 3. Cách chức; 4. Sa thải. Điều 127 nghiêm cấm dùng hình thức phạt tiền, cắt lương thay xử lý kỷ luật lao động.`,legalReference:`Điều 124 & 127 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:98,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Hành vi nào sau đây bị NGHIÊM CẤM khi xử lý kỷ luật lao động?`,options:[`Xâm phạm sức khỏe, danh dự, tính mạng, uy tín, nhân phẩm của người lao động`,`Phạt tiền, cắt lương thay việc xử lý kỷ luật lao động`,`Xử lý kỷ luật lao động đối với người lao động có hành vi vi phạm không được quy định trong nội quy lao động`,`Tất cả các hành vi nêu trên đều bị nghiêm cấm`],correctAnswer:3,explanation:`Điều 127 Bộ luật Lao động 2019 nghiêm cấm cả 3 hành vi: xâm phạm thân thể nhân phẩm; phạt tiền cắt lương; xử lý kỷ luật đối với hành vi chưa được quy định trong nội quy.`,legalReference:`Điều 127 Bộ luật Lao động 2019`,difficulty:`dễ`},{id:99,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người sử dụng lao động KHÔNG ĐƯỢC xử lý kỷ luật lao động đối với người lao động trong thời gian nào sau đây?`,options:[`Người lao động nghỉ ốm đau, điều dưỡng; nghỉ việc được sự đồng ý của người sử dụng lao động`,`Đang bị tạm giữ, tạm giam; đang chờ kết quả điều tra xác minh của cơ quan có thẩm quyền`,`Lao động nữ mang thai; người lao động nghỉ thai sản, nuôi con dưới 12 tháng tuổi`,`Cả A, B, C đều đúng`],correctAnswer:3,explanation:`Khoản 4 Điều 122 Bộ luật Lao động 2019 quy định không được xử lý kỷ luật lao động trong các trường hợp: ốm đau điều dưỡng; tạm giữ tạm giam; mang thai, nghỉ thai sản, nuôi con dưới 12 tháng tuổi.`,legalReference:`Khoản 4 Điều 122 Bộ luật Lao động 2019`,difficulty:`trung bình`},{id:100,chapterId:9,chapterName:`Chương 9: Pháp luật Lao động`,question:`Người lao động làm việc đủ 12 tháng cho một người sử dụng lao động thì được nghỉ hằng năm hưởng nguyên lương theo hợp đồng lao động trong điều kiện bình thường là bao nhiêu ngày làm việc?`,options:[`10 ngày làm việc`,`12 ngày làm việc`,`14 ngày làm việc`,`16 ngày làm việc`],correctAnswer:1,explanation:`Điểm a Khoản 1 Điều 113 Bộ luật Lao động 2019 quy định người lao động làm việc đủ 12 tháng được nghỉ 12 ngày làm việc đối với người làm công việc trong điều kiện bình thường.`,legalReference:`Điều 113 Bộ luật Lao động 2019`,difficulty:`dễ`}],b=[{id:101,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trong lịch sử loài người, kiểu nhà nước nào là kiểu nhà nước ĐẦU TIÊN xuất hiện?`,options:[`Nhà nước phong kiến`,`Nhà nước chủ nô`,`Nhà nước tư sản`,`Nhà nước xã hội chủ nghĩa`],correctAnswer:1,explanation:`Lịch sử phát triển của xã hội loài người đã và đang trải qua 4 kiểu nhà nước: Nhà nước chủ nô (kiểu đầu tiên), Nhà nước phong kiến, Nhà nước tư sản và Nhà nước xã hội chủ nghĩa.`,legalReference:`Lý luận chung về các kiểu Nhà nước trong lịch sử`,difficulty:`dễ`},{id:102,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Quyền lực của Nhà nước khác với quyền lực của thị tộc, bộ lạc nguyên thủy ở điểm cơ bản nào?`,options:[`Nhà nước thiết lập quyền lực công cộng đặc biệt tách rời khỏi xã hội và có bộ máy cưỡng chế chuyên nghiệp`,`Quyền lực của Nhà nước chỉ dựa trên uy tín tinh thần của già làng`,`Quyền lực của Nhà nước không cần đến quân đội hay nhà tù`,`Quyền lực của Nhà nước chỉ áp dụng cho một dòng họ`],correctAnswer:0,explanation:`Khác với quyền lực xã hội trong công xã nguyên thủy hòa lẫn với dân cư, quyền lực nhà nước là quyền lực công cộng đặc biệt, tách rời khỏi xã hội, có bộ máy cưỡng chế chuyên nghiệp (quân đội, cảnh sát, nhà tù...).`,legalReference:`Nguồn gốc và bản chất của Nhà nước`,difficulty:`trung bình`},{id:103,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức chính thể quân chủ tuyệt đối là hình thức chính thể mà trong đó:`,options:[`Toàn bộ quyền lực nhà nước tối cao tập trung vô hạn trong tay một người đứng đầu là vua hoặc hoàng đế`,`Quyền lực nhà nước được phân chia bình đẳng giữa Nghị viện và Thủ tướng`,`Vua chỉ có vai trò danh dự, không nắm giữ bất kỳ quyền lực thực tế nào`,`Người đứng đầu nhà nước được bầu ra theo nhiệm kỳ cố định`],correctAnswer:0,explanation:`Trong chính thể quân chủ tuyệt đối (quân chủ chuyên chế), toàn bộ quyền lực nhà nước tối cao tập trung vào tay một cá nhân duy nhất là vua/quốc vương truyền ngôi theo huyết thống.`,legalReference:`Hình thức chính thể nhà nước`,difficulty:`dễ`},{id:104,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức chính thể Cộng hòa là hình thức chính thể mà trong đó:`,options:[`Quyền lực tối cao của nhà nước được trao cho một cá nhân suốt đời`,`Quyền lực tối cao của nhà nước thuộc về một cơ quan (hoặc các cơ quan) được thành lập theo phương thức bầu cử`,`Ngai vàng được thế tập truyền từ đời này sang đời khác`,`Chỉ có giai cấp quý tộc phong kiến mới được nắm giữ chức vụ`],correctAnswer:1,explanation:`Chính thể cộng hòa là hình thức mà quyền lực tối cao của nhà nước thuộc về một cơ quan do nhân dân bầu ra trong một nhiệm kỳ xác định.`,legalReference:`Lý luận về Hình thức chính thể`,difficulty:`dễ`},{id:105,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Pháp luật phát sinh, tồn tại và phát triển bắt nguồn từ nguyên nhân nào?`,options:[`Bắt nguồn từ những điều răn dạy của tôn giáo ngàn năm`,`Cùng xuất hiện đồng thời với các nguyên nhân kinh tế và xã hội dẫn đến sự ra đời của Nhà nước`,`Do sự thỏa thuận bình đẳng giữa các cá nhân tự do trong xã hội nguyên thủy`,`Do các nhà thông thái thời cổ đại tự sáng chế ra`],correctAnswer:1,explanation:`Pháp luật ra đời cùng với nhà nước, có chung nguyên nhân kinh tế (chế độ tư hữu tư liệu sản xuất hình thành) và nguyên nhân xã hội (sự phân chia xã hội thành các giai cấp có lợi ích đối kháng).`,legalReference:`Học thuyết Mác-Lênin về nguồn gốc pháp luật`,difficulty:`trung bình`},{id:106,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức pháp luật nào là hình thức nhà nước thừa nhận các thói quen xử sự đã lưu truyền trong đời sống và nâng lên thành pháp luật?`,options:[`Tiền lệ pháp (Án lệ)`,`Tập quán pháp`,`Văn bản quy phạm pháp luật`,`Điều lệ đoàn thể`],correctAnswer:1,explanation:`Tập quán pháp là hình thức nhà nước thừa nhận một số tập quán đã lưu truyền trong xã hội, phù hợp với lợi ích của giai cấp thống trị và nâng chúng lên thành quy phạm pháp luật.`,legalReference:`Các hình thức pháp luật trong lịch sử`,difficulty:`dễ`},{id:107,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Tiền lệ pháp (Án lệ) là hình thức pháp luật được tạo ra bởi:`,options:[`Các quyết định, bản án của cơ quan xét xử (Tòa án) hoặc cơ quan hành chính khi giải quyết vụ việc cụ thể được lấy làm khuôn mẫu cho các vụ việc tương tự sau này`,`Nghị quyết của các hội đồng bộ trưởng`,`Ý kiến tham vấn của các luật sư tại phiên tòa`,`Các bài báo nghiên cứu pháp lý của các giáo sư đại học`],correctAnswer:0,explanation:`Tiền lệ pháp là hình thức nhà nước thừa nhận các bản án, quyết định của cơ quan xét xử đã có hiệu lực pháp luật làm căn cứ để giải quyết các vụ việc tương tự tiếp theo.`,legalReference:`Khái niệm Án lệ - Tiền lệ pháp`,difficulty:`trung bình`},{id:108,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Bộ phận nào của quy phạm pháp luật trả lời cho câu hỏi: "Chủ thể được làm gì, không được làm gì, hoặc phải làm gì và làm như thế nào?"`,options:[`Giả định`,`Quy định`,`Chế tài`,`Hiệu lực`],correctAnswer:1,explanation:`Bộ phận Quy định của QPPL xác định các quyền và nghĩa vụ pháp lý của chủ thể: nêu rõ mô hình hành vi xử sự mà chủ thể được phép, bắt buộc phải làm hoặc bị cấm làm.`,legalReference:`Cơ cấu của Quy phạm pháp luật`,difficulty:`dễ`},{id:109,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Bộ phận "Giả định" của quy phạm pháp luật trả lời cho câu hỏi nào sau đây?`,options:[`Chủ thể bị xử lý như thế nào nếu không thực hiện đúng nghĩa vụ?`,`Chủ thể nào, trong những hoàn cảnh, điều kiện cụ thể nào thì phải chịu sự tác động của quy phạm pháp luật?`,`Hành vi nào bị nghiêm cấm trên thực tế?`,`Cơ quan nào có quyền ban hành văn bản?`],correctAnswer:1,explanation:`Giả định là bộ phận chỉ ra chủ thể (ai, tổ chức nào) và trong những hoàn cảnh, điều kiện, không gian thời gian nào thì quy phạm pháp luật được áp dụng.`,legalReference:`Cơ cấu của Quy phạm pháp luật`,difficulty:`dễ`},{id:110,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Trong các văn bản sau, văn bản nào KHÔNG PHẢI là Văn bản quy phạm pháp luật?`,options:[`Luật Doanh nghiệp 2020`,`Nghị quyết của Quốc hội`,`Quyết định kỷ luật cách chức ông Nguyễn Văn A của Giám đốc Sở Công Thương`,`Nghị định số 01/2021/NĐ-CP của Chính phủ`],correctAnswer:2,explanation:`Quyết định kỷ luật cá nhân cụ thể là Văn bản áp dụng pháp luật (áp dụng một lần cho một cá nhân cụ thể), không chứa đựng quy phạm pháp luật áp dụng chung nhiều lần cho toàn xã hội.`,legalReference:`Điều 2, Điều 4 Luật Ban hành VBQPPL 2015`,difficulty:`vận dụng`},{id:111,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Văn bản quy phạm pháp luật nào sau đây do Ủy ban Thường vụ Quốc hội ban hành?`,options:[`Luật và Nghị quyết`,`Pháp lệnh và Nghị quyết`,`Lệnh và Quyết định`,`Nghị định và Thông tư`],correctAnswer:1,explanation:`Khoản 2 Điều 4 Luật Ban hành văn bản quy phạm pháp luật: Ủy ban Thường vụ Quốc hội ban hành Pháp lệnh và Nghị quyết.`,legalReference:`Luật Ban hành văn bản quy phạm pháp luật 2015`,difficulty:`dễ`},{id:112,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Quan hệ pháp luật là quan hệ xã hội được điều chỉnh bởi:`,options:[`Các chuẩn mực đạo đức truyền thống`,`Các quy tắc tôn giáo linh thiêng`,`Các quy phạm pháp luật, trong đó các bên tham gia có các quyền và nghĩa vụ pháp lý được Nhà nước bảo đảm`,`Điều lệ và nội quy riêng của dòng họ`],correctAnswer:2,explanation:`Quan hệ pháp luật là những quan hệ xã hội được các quy phạm pháp luật điều chỉnh, trong đó các bên tham gia mang các quyền và nghĩa vụ pháp lý do nhà nước bảo đảm thực hiện.`,legalReference:`Khái niệm Quan hệ pháp luật`,difficulty:`dễ`},{id:113,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Năng lực chủ thể trong quan hệ pháp luật bao gồm hai yếu tố cấu thành nào?`,options:[`Năng lực pháp luật và năng lực hành vi`,`Năng lực nhận thức và năng lực thể chất`,`Năng lực tài chính và uy tín xã hội`,`Năng lực chuyên môn và thâm niên công tác`],correctAnswer:0,explanation:`Năng lực chủ thể gồm hai yếu tố: Năng lực pháp luật (khả năng có quyền và nghĩa vụ theo quy định luật) và Năng lực hành vi (khả năng bằng hành vi của chính mình xác lập, thực hiện quyền và nghĩa vụ).`,legalReference:`Năng lực chủ thể quan hệ pháp luật`,difficulty:`dễ`},{id:114,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Sự kiện pháp lý là:`,options:[`Những tình huống tranh cãi đạo đức trong gia đình`,`Những sự việc xảy ra trên thực tế mà pháp luật gắn sự xuất hiện của chúng với việc phát sinh, thay đổi hoặc chấm dứt quan hệ pháp luật`,`Mọi suy nghĩ và mong muốn chủ quan của con người`,`Các sự kiện lịch sử thế giới không liên quan đến quan hệ pháp lý`],correctAnswer:1,explanation:`Sự kiện pháp lý là những hoàn cảnh, điều kiện, sự việc diễn ra trong thực tế mà quy phạm pháp luật dự liệu và gắn liền với việc làm phát sinh, thay đổi hay chấm dứt quan hệ pháp luật.`,legalReference:`Khái niệm Sự kiện pháp lý`,difficulty:`trung bình`},{id:115,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Hình thức lỗi "Vô ý do cẩu thả" là trường hợp người có hành vi vi phạm:`,options:[`Thấy trước hành vi của mình là nguy hiểm cho xã hội nhưng hy vọng hành vi đó không gây ra hậu quả`,`Không thấy trước hành vi của mình có thể gây ra hậu quả nguy hiểm cho xã hội, mặc dù phải thấy trước và có thể thấy trước hậu quả đó`,`Nhận thức rõ hành vi vi phạm nhưng vẫn mong muốn hậu quả xảy ra`,`Cố ý làm trái để mang lại lợi ích cho người thân`],correctAnswer:1,explanation:`Vô ý do cẩu thả là trường hợp người thực hiện hành vi không thấy trước hành vi của mình có thể gây ra hậu quả nguy hiểm cho xã hội, mặc dù pháp luật quy định phải thấy trước và trong hoàn cảnh đó hoàn toàn có thể thấy trước.`,legalReference:`Lý luận về Lỗi trong vi phạm pháp luật & BLHS 2015`,difficulty:`vận dụng`},{id:116,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Sự kiện nào sau đây được phân loại là "Hành vi pháp lý"?`,options:[`Thiên tai, lũ lụt cuốn trôi tài sản của người dân`,`Người để lại tài sản đột ngột qua đời vì tuổi già`,`Hai cá nhân ký kết hợp đồng mua bán xe máy`,`Sấm sét đánh làm chập cháy thiết bị điện`],correctAnswer:2,explanation:`Hành vi pháp lý là sự kiện pháp lý xảy ra phụ thuộc trực tiếp vào ý chí của con người (như ký hợp đồng, lập di chúc, khởi kiện...). Còn lũ lụt, cái chết tự nhiên, sấm sét là Sự biến pháp lý (không phụ thuộc ý chí con người).`,legalReference:`Phân loại Sự kiện pháp lý (Sự biến & Hành vi)`,difficulty:`trung bình`},{id:117,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Áp dụng pháp luật là hình thức thực hiện pháp luật mang tính chất nào đặc thù?`,options:[`Mang tính quyền lực nhà nước, chỉ do các cơ quan nhà nước, người có thẩm quyền thực hiện`,`Do mọi cá nhân công dân tùy ý lựa chọn áp dụng`,`Là hình thức thụ động không làm phát sinh quyền và nghĩa vụ`,`Không bao giờ cần ban hành văn bản chính thức`],correctAnswer:0,explanation:`Áp dụng pháp luật là hoạt động mang tính quyền lực nhà nước, do cơ quan nhà nước hoặc người có thẩm quyền tiến hành theo trình tự luật định nhằm giải quyết các việc cụ thể và ra văn bản áp dụng pháp luật.`,legalReference:`Đặc điểm của Áp dụng pháp luật`,difficulty:`trung bình`},{id:118,chapterId:1,chapterName:`Chương 1: Những vấn đề chung về Nhà nước và Pháp luật`,question:`Năng lực pháp luật dân sự của cá nhân có từ thời điểm nào và chấm dứt khi nào?`,options:[`Có từ khi đủ 18 tuổi và chấm dứt khi người đó già yếu`,`Có từ khi người đó sinh ra và chấm dứt khi người đó chết`,`Có từ khi đi học và chấm dứt khi nghỉ hưu`,`Có từ khi kết hôn và chấm dứt khi ly hôn`],correctAnswer:1,explanation:`Khoản 3 Điều 16 Bộ luật Dân sự 2015: "Năng lực pháp luật dân sự của cá nhân có từ khi người đó sinh ra và chấm dứt khi người đó chết".`,legalReference:`Điều 16 Bộ luật Dân sự 2015`,difficulty:`dễ`},{id:119,chapterId:3,chapterName:`Chương 3: Bộ máy Nhà nước Cộng hoà Xã hội Chủ nghĩa Việt Nam`,question:`Theo Hiến pháp 2013, ai là người có quyền công bố Hiến pháp, luật, pháp lệnh?`,options:[`Chủ tịch Quốc hội`,`Thủ tướng Chính phủ`,`Chủ tịch nước`,`Chánh án Tòa án nhân dân tối cao`],correctAnswer:2,explanation:`Khoản 1 Điều 88 Hiến pháp 2013: Chủ tịch nước có nhiệm vụ và quyền hạn "Công bố Hiến pháp, luật, pháp lệnh; đề nghị Ủy ban thường vụ Quốc hội xem xét lại pháp lệnh...".`,legalReference:`Khoản 1 Điều 8
